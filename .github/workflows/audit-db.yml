name: Database Quality Audit

permissions: {}

on:
  # Schedule removed 2026-09-24: it audits Supabase, decommissioned 2026-09-01, and failed daily from 2026-09-21. Manual dispatch kept.
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Run in verbose mode'
        type: boolean
        required: false
        default: false
      json_output:
        description: 'Output JSON report'
        type: boolean
        required: false
        default: false

jobs:
  audit-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run database quality audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.verbose }}" = "true" ]; then
            ARGS="$ARGS --verbose"
          fi
          if [ "${{ inputs.json_output }}" = "true" ]; then
            ARGS="$ARGS --json"
          fi
          python pipeline/db_reviewer.py $ARGS

      - name: Generate JSON report (on demand)
        if: inputs.json_output
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python pipeline/db_reviewer.py --json > db-audit-report.json
          cat db-audit-report.json

      - name: Upload report artifact
        if: always() && inputs.json_output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: db-audit-report
          path: db-audit-report.json
          retention-days: 30

      - name: Comment on PR (if low score)
        if: failure() && github.event_name == 'workflow_dispatch'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Database quality audit detected issues. Check the workflow logs for details.'
            })
