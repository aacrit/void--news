name: Auto-merge Claude branches

on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write

# Queue runs per branch; never cancel a run that may be mid-merge.
concurrency:
  group: auto-merge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # P0-7 (rev 85, audit 5 H3). FIRST, and a `needs:` of the merge job. Every
  # job here runs from the PUSHED commit with contents: write, so a claude/*
  # branch could edit this file to delete a gate and still merge itself to
  # main, which is production. A branch that changes anything under .github/
  # is refused here and merged by a human. This step lives in the file it
  # protects, so it only holds together with .github/CODEOWNERS and required
  # status checks on main (repo settings, the owner's action).
  merge-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Refuse to auto-merge a change to .github
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main "$GITHUB_SHA"
          base=$(git merge-base origin/main "$GITHUB_SHA")
          changed=$(git diff --name-only "$base" "$GITHUB_SHA" -- .github/)
          if [ -n "$changed" ]; then
            echo "::error title=Merge refused::This branch changes .github/, which auto-merge never merges. A human must review and merge it by hand."
            echo "REFUSED: auto-merge will not merge '$REF_NAME' into main because it changes:"
            echo "$changed" | sed 's/^/  /'
            echo "Workflows run from the pushed commit with contents: write, so a branch"
            echo "that edits .github/ could rewrite or delete the gates that judge it."
            echo "Review the diff and merge it by hand:"
            echo "  git fetch origin && git checkout main && git merge --no-ff origin/$REF_NAME"
            exit 1
          fi
          echo "No change under .github/; this branch may auto-merge if every gate passes."

  # P2-5 (rev 85). Known-vulnerable dependencies. continue-on-error FOR NOW:
  # WS-D is bumping the npm and pip pins in parallel (audit 5 counted two
  # critical and six high npm findings), and a gate that is red on arrival
  # blocks every branch for a reason no branch can fix.
  # TODO(rev 85 WS-D): drop both continue-on-error lines once the bumps land.
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: npm audit (frontend, production dependencies, high and above)
        continue-on-error: true
        run: cd frontend && npm audit --omit=dev --audit-level=high
      - name: pip-audit (pipeline/requirements.txt)
        continue-on-error: true
        run: |
          pip install --quiet pip-audit
          pip-audit --requirement pipeline/requirements.txt --vulnerability-service osv --progress-spinner off

  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        # Retry twice for flaky network installs, but a third failure FAILS
        # the gate. The old `|| echo "Build flaky but proceeding"` made this
        # job exit 0 on a broken build, so unbuildable code auto-merged to
        # main and deployed.
        #
        # Cloudflare migration (2026-08-30): the build reads its data from the
        # committed build-data/*.json + public/data/*.json snapshots (emitted by
        # the pipeline), NOT Supabase. No Supabase env, no egress. serverFeed
        # still fail-loud throws below the configured minimum, now against the
        # static feed.json.
        env:
          NEXT_PUBLIC_BASE_PATH: ""
        run: |
          cd frontend && npm ci
          npx next build || npx next build || npx next build
          npm test

      # The built output is right here, so this is where the layout gate
      # belongs. It caught two defects that shipped and were invisible both in
      # the CSS and in the browser, because the page's own `overflow-x: hidden`
      # was clipping them: a spine overflowing by four column gaps at phone
      # widths, and a `position: sticky` rail that had never once held.
      # Chromium is cached, so a warm run costs seconds.
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Chromium
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Responsive layout gate (overflow + sticky)
        run: cd frontend && node scripts/verify-responsive.mjs
      # 2026-09-21: the product in a browser, as one system. Five routes at
      # 390 and 1440 in dark plus every scenario (search, theme, drawer,
      # Sigil, shortcuts, banner, player, Paper parity, the brand layer):
      # console and hydration errors, dangling links, one h1, title grammar,
      # the masthead's section, accessible names, dashes in chrome, focus
      # order, axe WCAG 2.1 AA. The full grid (every route family x 4 widths
      # x both modes) is `node scripts/verify-headless.mjs` without --quick.
      - name: Headless sweep (quick)
        run: cd frontend && node scripts/verify-headless.mjs --quick

      # 2026-09-06: tests/ was run by nothing. test_verify_gate.py was RED
      # (its clean fixture predated MIN_SUMMARY_CHARS=300) and nobody knew,
      # so the served-output checkers had no working self-test.
      #
      # 2026-09-23: this step used to install `nltk pyyaml` under a comment
      # saying the suites were "stdlib-only apart from nltk". That stopped
      # being true, and the consequence was invisible for as long as it was,
      # because a defect further up was failing the job before these ran at
      # all. When the feed was restored and the build finally passed, the
      # gates below started raising ModuleNotFoundError one at a time:
      # test_docs_facts on textblob, then test_apply_feeds on requests, with
      # numpy, scikit-learn and bs4 waiting behind them. NINE of these gates
      # had never once executed in CI.
      #
      # So the job installs the pipeline's declared environment. These gates
      # test pipeline code and belong in the environment that code runs in;
      # naming the five missing packages instead would leave the same trap
      # armed for the next gate that imports something new. `editorial-stage`
      # below already installs this exact file with this exact caching, so the
      # wheels are shared rather than downloaded twice.
      #
      # A gate that cannot execute is not a gate, which is the sentence the
      # controls table in CLAUDE.md opens with.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt
      # THE MODEL, not just the package. `test_lean_prior_is_not_self_fed`
      # asserts the retired blend parameter is inert by actually scoring four
      # articles, and `analyze_political_lean` reaches `_entity_sentiment_score`
      # which reaches `get_nlp()`. With spaCy installed but no model,
      # `nlp_shared` raises ModelUnavailable, correctly: it refuses to fall
      # back to an English parser for text it cannot parse, which is what
      # `test_nlp_languages` exists to enforce. `test_nlp_languages` also skips
      # its parse checks without the model, so without this step it would sit
      # in CI reporting a skip forever.
      #
      # Same cache and key as editorial-stage, validate-bias and
      # validate-clustering below, so the download happens once across all four.
      - name: Install the pipeline's environment
        run: pip install --quiet -r pipeline/requirements.txt
      - name: Cache spaCy model
        id: spacy-cache-gates
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/lib/python3.11/site-packages/en_core_web_sm
          key: spacy-en_core_web_sm-${{ hashFiles('pipeline/requirements.txt') }}
      - name: Download spaCy model
        if: steps.spacy-cache-gates.outputs.cache-hit != 'true'
        run: python -m spacy download en_core_web_sm
      - name: Gate self-test + feed-config consistency
        run: |
          python tests/test_verify_gate.py
          python tests/test_feed_config.py
          python tests/test_editorial_standard.py
          python tests/test_same_event_merge.py
          python pipeline/validation/test_desk_furniture_filter.py
          python pipeline/validation/test_academic_artifact_filter.py
          python tests/test_summary_hygiene_parity.py
          python pipeline/validation/test_disaster_severity.py
          python tests/test_radio_script.py
          python tests/test_brief_inputs.py           # the brief writer is never handed a story with no summary
          python tests/test_onair_sidecar.py         # the chapters served beside On Air are that episode's; the voice label names who read it
          python tests/test_history_audio.py
          python tests/test_weekly.py
          python tests/test_weekly_killlist.py      # the kill list in the committed issues, before W-10 can see it served
          python tests/test_weekly_script.py
          python tests/test_weekly_assembly.py
          python tests/test_history_meta.py
          python tests/test_history_script.py
          python tests/test_history_clips.py         # H-12..H-17: an archival clip is signed, sourced, verified, credited, capped and dry
          python tests/test_house_promos.py

          # The rule-1 controls. Each of these was written the day a real
          # defect shipped, and none of them could fail a merge until now:
          # a gate nobody can fail is not enforced, which is the sentence the
          # controls table in CLAUDE.md opens with.
          python tests/test_history_data.py          # figure identity, lifespans
          python tests/test_history_copy.py          # the dash ban, speaker shape
          python tests/test_history_scripts_export.py # accounts resolve one to one
          python tests/test_history_export_parity.py  # the served JSON matches the record
          python tests/test_history_thesis.py        # T-01..T-20: a thesis cites the ledger, the ledger holds the extract, the served thesis matches
          python tests/test_history_quote_ledger.py  # a Hearing quotation that diverges from a ledger extract we hold
          python tests/test_grounding.py             # the evidence outlives the run
          python tests/test_pgrest_sqlite_threads.py # one connection, many workers: statements never interleave
          python tests/test_feed_buildable.py        # the feed can fill the front page
          python tests/test_truncation_lint.py       # no cap published as a count
          python tests/test_docs_facts.py            # CLAUDE.md's own numbers

          # Brand audit gates (2026-09-21): the served product is what it says.
          python tests/test_bias_defaults_gate.py    # exported bias rows are measured, not defaults
          python tests/test_source_roster.py         # the roster does not disagree with itself about an outlet
          python tests/test_roster_config.py         # the roster's size and tiers come from the roster, in one place
          python tests/test_apply_feeds.py           # a dry run writes nothing; a record is never silently replaced
          python tests/test_bias_bins.py             # one lean ladder, two languages, rungs on their own baselines
          python tests/test_lean_prior_is_not_self_fed.py  # the lean prior is not fed by the lean it publishes
          python tests/test_lexicon_derive.py        # the derivation cannot measure itself; counts cannot hold prose
          python tests/test_phrase_counts_daily.py   # the daily phrase counts stay bounded by what the derivation can use
          python tests/test_engine_health.py         # the engine's input is measured; a collapse in it is caught
          python tests/test_pair_test.py             # the pair test's AUC gate is arithmetic, and its corpus holds no text
          python tests/test_wire_attribution.py      # a wire's own copy is recognised as the wire's
          python tests/test_robots_compliance.py     # a refusal on robots.txt is read as a refusal
          python tests/test_nlp_languages.py         # no silent fallback to an English parser for non-English text
          python tests/test_podcast_feed.py          # covers exist and carry no stale text; titles agree
          python tests/test_prompt_grounding.py      # every production prompt carries the grounding line
          python tests/test_paper.py                 # Paper prints the front page's twenty, in order, with no retired claim
          # Rev 85 (holistic fixes): the eight gates the workstreams added.
          python tests/test_games_content.py         # every Games bank: no dash, no kill-list term, no date, THE FRAME stays out
          python tests/test_brief_grounding.py       # TL;DR, Opinion and On Air cut what the sources do not carry
          python tests/test_stuck_runs.py            # a running pipeline run is never failed by its own cleanup
          python tests/test_rerank_pool.py           # 8c ranks only pool-eligible clusters; the feed does not move
          python tests/test_pipeline_runtime.py      # one metered Gemini call site, phase timings, Kokoro workers
          python tests/test_state_retention.py       # undated rows are swept; printed_stories is never touched
          python tests/test_quarantine_causes.py     # every quarantined feed names its cause
          python tests/test_audio_store.py           # MP3s that leave git come back hash-checked

          # Rev 85 (P2-8): the two gates no workflow ran, and the two that
          # keep the inventory honest.
          python tests/test_insecure_origins.py      # an http source link only for an allowlisted host
          python tests/test_lean_suite_discriminates.py  # the lean fixtures can tell the text engine from the outlet label
          python tests/test_workflow_hygiene.py      # crons off :00/:30, the merge refusal, no ref in shell, every test run by a workflow
          python tests/test_session_start_hook.py    # the session hook cannot report green over an older failure

  # End-to-end run of the editorial half of the pipeline (8c through 8f plus
  # the static export) against a synthetic state DB built from the committed
  # snapshots. No network, no LLM key, nothing generated. It exists because a
  # dead re-rank and a six-edition permalink gap both passed compile checks and
  # shipped straight into the 11:00 UTC production run.
  editorial-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt
      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt
      - name: Cache spaCy model
        id: spacy-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/lib/python3.11/site-packages/en_core_web_sm
          key: spacy-en_core_web_sm-${{ hashFiles('pipeline/requirements.txt') }}
      - name: Download spaCy model
        if: steps.spacy-cache.outputs.cache-hit != 'true'
        run: python -m spacy download en_core_web_sm
      # Imports the REAL weekly generator against a throwaway state DB and
      # calls the functions a run reaches. The first launch run of Vol. I,
      # No. 1 wrote every essay, spent every model call, passed every
      # validator and then died on a NameError one line before persistence,
      # because every other weekly gate goes through `weekly_parse` to avoid
      # importing this module. It only needs VOID_SQLITE_PATH pointed at a
      # temp file, which nobody had tried.
      - name: Weekly generator (imports the real module)
        run: python tests/test_weekly_generator.py
      # Runs HERE, not in the light job, because image_search imports requests
      # and the light job installs only nltk: there it would print SKIP forever
      # and gate nothing. IMG-02 re-checks every image already on the site, so
      # a licence this rule rejects fails the build rather than arriving as a
      # takedown.
      - name: Image licences (gate + everything published)
        run: python tests/test_image_license.py
      - name: Subject image resolution (the guard, the licence, the floor)
        run: python tests/test_subject_image.py
      - name: Run editorial-stage harness
        run: python tests/test_editorial_stage.py

  # On Air radio show: assembly with a fake engine (timeline, chapters, music
  # placement, ID3 + sidecar, loudness via ffmpeg) and a real Kokoro timing
  # bench so a slow or broken voice engine is caught here, not by the 11:00
  # UTC show. ~3 min warm (venv + model cached).
  radio-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - name: Install audio dependencies
        run: pip install --quiet "numpy~=1.26.4" pydub mutagen pyyaml "edge-tts>=6.1.0"
      # ── On Air voices: Kokoro-82M in its own venv (numpy 2) + pinned model files ──
      - name: Cache Kokoro model files
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/void-kokoro
          key: kokoro-${{ hashFiles('pipeline/briefing/kokoro.lock.json') }}
      - name: Cache TTS venv
        id: tts-venv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .venv-tts
          key: venv-tts-py3.11-${{ hashFiles('pipeline/requirements-tts.txt') }}
      - name: Build TTS venv (cache miss)
        if: steps.tts-venv.outputs.cache-hit != 'true'
        run: python -m venv .venv-tts && .venv-tts/bin/pip install -q -r pipeline/requirements-tts.txt
      - name: Fetch Kokoro model files (verified against kokoro.lock.json)
        run: python pipeline/briefing/kokoro_assets.py
      - name: Assembly harness (fake engine)
        run: |
          python tests/test_radio_assembly.py
          python tests/test_weekly_assembly.py
      # The one check that judges the ARTIFACT rather than the row. It lives
      # here because it needs ffprobe and ffmpeg, which this job already has.
      # Every other Weekly check runs before synthesis, which is how a row
      # advertising "Three voices" over a mono 24 kHz file nobody had mastered
      # shipped for weeks with every gate green.
      - name: The served Weekly episode is what its row says it is
        run: python tests/test_weekly_audio_served.py
      - name: Kokoro timing bench
        env:
          VOID_TTS_ENGINE: kokoro-only
          VOID_KOKORO_PYTHON: .venv-tts/bin/python
          VOID_TTS_RTF_BUDGET: "2.0"
        run: python pipeline/briefing/tts_bench.py --engine kokoro-only

  # Mirrors validate-bias.yml — duplicated here because branch protection is
  # not configured and the merge job below can only `needs:` jobs in this
  # workflow. Fixture-based, no secrets, ~5 min warm.
  validate-bias:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt
      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt
      - name: Cache spaCy model
        id: spacy-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/lib/python3.11/site-packages/en_core_web_sm
          key: spacy-en_core_web_sm-${{ hashFiles('pipeline/requirements.txt') }}
      - name: Download spaCy model
        if: steps.spacy-cache.outputs.cache-hit != 'true'
        run: python -m spacy download en_core_web_sm
      - name: Run bias validation suite
        run: |
          result=$(python pipeline/validation/runner.py 2>&1)
          echo "$result"
          if echo "$result" | grep -qE "CATASTROPHIC:[[:space:]]+[1-9]"; then
            echo "::error::Bias validation found CATASTROPHIC failures"
            exit 1
          fi
          if echo "$result" | grep -qE "WRONG:[[:space:]]+[1-9]"; then
            echo "::error::Bias validation found WRONG scores"
            exit 1
          fi

  # Mirrors validate-clustering.yml (same rationale as validate-bias).
  validate-clustering:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt
      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt
      - name: Cache spaCy model
        id: spacy-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/lib/python3.11/site-packages/en_core_web_sm
          key: spacy-en_core_web_sm-${{ hashFiles('pipeline/requirements.txt') }}
      - name: Download spaCy model
        if: steps.spacy-cache.outputs.cache-hit != 'true'
        run: python -m spacy download en_core_web_sm
      - name: Run clustering validation suite
        run: |
          result=$(python -m pipeline.validation.clustering.runner 2>&1)
          echo "$result"
          if echo "$result" | grep -qE "CATASTROPHIC:[[:space:]]+[1-9]"; then
            echo "::error::Clustering validation found CATASTROPHIC failures"
            exit 1
          fi
          if echo "$result" | grep -qE "WRONG:[[:space:]]+[1-9]"; then
            echo "::warning::Clustering suite has pre-existing WRONG cases (not a regression)"
          fi

  auto-merge:
    needs: [merge-scope, build-check, validate-bias, validate-clustering, editorial-stage, radio-audio]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Serialize ALL merges to main across branches.
    concurrency:
      group: auto-merge-push-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: main

      # Checked again here, against the exact commit about to be merged,
      # because `needs:` is only as good as the file that declares it.
      - name: Refuse to auto-merge a change to .github
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main "$GITHUB_SHA"
          base=$(git merge-base origin/main "$GITHUB_SHA")
          changed=$(git diff --name-only "$base" "$GITHUB_SHA" -- .github/)
          if [ -n "$changed" ]; then
            echo "::error title=Merge refused::This branch changes .github/, which auto-merge never merges. A human must review and merge it by hand."
            echo "REFUSED: auto-merge will not merge '$REF_NAME' into main because it changes:"
            echo "$changed" | sed 's/^/  /'
            echo "Workflows run from the pushed commit with contents: write, so a branch"
            echo "that edits .github/ could rewrite or delete the gates that judge it."
            echo "Review the diff and merge it by hand:"
            echo "  git fetch origin && git checkout main && git merge --no-ff origin/$REF_NAME"
            exit 1
          fi
          echo "No change under .github/; this branch may auto-merge if every gate passes."

      # The ref reaches the shell through env and quoted, never as
      # ${{ github.ref_name }} pasted into the script (audit 5 H3: a branch
      # name is chosen by whoever pushes it). It merges GITHUB_SHA, the commit
      # every gate above judged, not whatever the branch tip is by now.
      - name: Merge claude branch into main
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_SHA"
          git merge "$GITHUB_SHA" --no-ff -m "Auto-merge $REF_NAME into main"
          git push origin main

  # migrate job REMOVED (2026-08-31, Cloudflare migration): the pipeline runs on
  # SQLite, not Supabase, so there is no live schema to migrate on merge. Schema
  # lives in migration/schema_pipeline.sql and is applied idempotently at run
  # start (CREATE TABLE/INDEX IF NOT EXISTS). migrate.yml is disabled too.
