name: Feed Evaluation

# Deterministic, $0, no-LLM evaluation of the displayed top-50 feed. Runs after
# the News Pipeline completes (and on manual dispatch). Read-only against
# Supabase; never writes to the DB. Non-gating: it REPORTS, it never fails a
# build. The Claude-agent "judge" layer runs separately over eval_report.json.

permissions: {}

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["News Pipeline"]
    types: [completed]

concurrency:
  group: feed-eval
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt
      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt
      - name: Cache spaCy model
        id: spacy-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/lib/python3.11/site-packages/en_core_web_sm
          key: spacy-en_core_web_sm-${{ hashFiles('pipeline/requirements.txt') }}
      - name: Download spaCy model
        if: ${{ steps.spacy-cache.outputs.cache-hit != 'true' }}
        run: python -m spacy download en_core_web_sm
      - name: Run evaluation
        id: eval
        continue-on-error: true   # non-gating: never fail the build
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m pipeline.evals.run_eval
      - name: Write report to job summary
        if: ${{ always() }}
        run: |
          if [ -f eval_report.md ]; then
            cat eval_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No eval_report.md produced (see the Run evaluation step log)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload report artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: feed-eval-report
          path: |
            eval_report.json
            eval_report.md
          if-no-files-found: warn
