name: Daily Feed Snapshot

# Persist the displayed top-50's lean drivers past Supabase's ~1-2 day retention,
# so the lean-label analysis and the lean-variance derivation can accumulate a
# real sample instead of aging out. Runs after the pipeline has landed (16:00
# UTC, safely past the daily run) and commits a small dated JSON. Uses
# GITHUB_TOKEN, which does not trigger other workflows, so it never kicks a
# deploy.

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

concurrency:
  group: feed-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet supabase python-dotenv
      - name: Capture feed snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/snapshot_feed.py
      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/feed-snapshots/
          if git diff --cached --quiet; then
            echo "No new snapshot to commit."
          else
            git commit -m "chore: daily feed snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
