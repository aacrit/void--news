name: IG Metrics

permissions: {}

# PARKED with posting (2026-08-05): nothing auto-posts, so there is no live
# content to pull insights for. The daily cron is disabled; keep manual dispatch
# for one-off backfills if posting is ever re-enabled. Re-enable by uncommenting
# the schedule below (alongside the ig-pipeline publish mode).
on:
  # schedule:
  #   # Daily 14:00 UTC — 30 minutes after the Mon/Thu publish window, so
  #   # newly-posted content is already in the IG insights system.
  #   - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Pull IG insights
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INSTAGRAM_GRAPH_TOKEN: ${{ secrets.INSTAGRAM_GRAPH_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python -m pipeline.social.ig_metrics
