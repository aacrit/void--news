name: Media → R2

# Moves Void's binaries off git and onto Cloudflare R2, and re-runs safely.
#
# Why: `.git` is 379 MB, frontend/public/audio is 71 MB in the working tree, and
# archive.json is 20 MB rewritten EVERY pipeline run. Git binaries cannot be
# un-committed cleanly, so the cost of waiting only grows. docs/HISTORY-AUDIO.md
# already picked R2 for the 78-episode catalogue for this reason.
#
# This job is IDEMPOTENT and additive. Image keys are the sha1 of their own
# bytes, so a re-run uploads only what changed, and every consumer falls back to
# its current source when a file has not been mirrored yet. Nothing is deleted
# from git here: the cutover commit is a separate, deliberate step once the urls
# are confirmed live (see docs/MEDIA-R2.md).
#
# Requires, set once in the repository settings:
#   vars.VOID_MEDIA_BASE        https://media.voidvision.org  (the R2 custom domain)
#   secrets.R2_ACCOUNT_ID       Cloudflare account id
#   secrets.R2_BUCKET           bucket name
#   secrets.R2_ACCESS_KEY_ID    R2 API token key
#   secrets.R2_SECRET_ACCESS_KEY

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      what:
        description: 'What to mirror'
        type: choice
        options: [images, images-dry-run]
        default: images-dry-run
      limit:
        description: 'Stop after N uploads (0 = no limit)'
        required: false
        default: '0'

concurrency:
  group: media-migrate
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install boto3 pyyaml

      - name: Check the configuration before touching anything
        env:
          VOID_MEDIA_BASE: ${{ vars.VOID_MEDIA_BASE }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "pipeline")
          from utils import media
          print(media.describe())
          if "${{ inputs.what }}" != "images-dry-run" and not media.enabled():
              sys.exit("R2 is not configured; nothing would be uploaded. "
                       "Set vars.VOID_MEDIA_BASE and the R2_* secrets first.")
          PY

      - name: Mirror History images
        env:
          VOID_MEDIA_BASE: ${{ vars.VOID_MEDIA_BASE }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.what }}" = "images-dry-run" ]; then ARGS="--dry-run"; fi
          if [ "${{ inputs.limit }}" != "0" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          python -m pipeline.history.mirror_images $ARGS

      - name: Re-emit history.json against the mirrored urls
        if: ${{ inputs.what == 'images' }}
        env:
          VOID_MEDIA_BASE: ${{ vars.VOID_MEDIA_BASE }}
        run: python -m pipeline.history.export_history

      - name: Commit the mirrored record
        if: ${{ inputs.what == 'images' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The record of WHERE each image now lives, and the snapshot built from
          # it. The image bytes themselves are in the bucket, not here.
          git add data/history/commons_media.json frontend/public/data/history.json
          if git diff --cached --quiet; then
            echo "No change to commit."
            exit 0
          fi
          git commit -m "Media: mirror History images to R2 ($(date -u +%F))"
          BRANCH="${{ github.ref_name }}"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH" || { git rebase --abort 2>/dev/null || true; echo "rebase failed"; exit 1; }
            if git push origin "HEAD:$BRANCH"; then echo "pushed"; exit 0; fi
            sleep 5
          done
          echo "could not push"; exit 1
