name: Weekly Digest

# Cloudflare migration follow-up (2026-09-19). This job was left on the
# decommissioned Supabase stack: it ran the generator with SUPABASE_* env and no
# VOID_SQLITE_PATH, so it read an empty database, wrote its row nowhere the site
# could see, and committed nothing. export_static.py reads weekly_digests from
# the SQLite state DB, so /weekly served whatever the last pre-migration run had
# left behind: Issue #23, week of 2026-08-24.
#
# It now mirrors the daily pipeline: restore the SQLite state DB, generate
# against it, emit ONLY the weekly snapshot, commit it so the Pages CDN serves
# it. The state DB is deliberately NOT saved back to the cache (see below).

permissions:
  contents: write   # commit the refreshed weekly snapshot to main
  actions: read     # download the state snapshot artifact on a cold cache

on:
  schedule:
    # SUNDAY 18:00 UTC. Void Weekly is a Sunday magazine: the issue covers the
    # week the reader has just lived through, Monday to that same Sunday, which
    # is what --week-offset 0 means since `weekly_window` started counting
    # Sunday as inside its own week.
    #
    # 18:00 is chosen against the daily pipeline rather than arbitrarily. The
    # daily cron is 11:00 but GitHub's scheduler lags badly: the 2026-09-20 run
    # STARTED at 14:37 and finished at 15:51. 18:00 leaves the state DB written
    # and cached before this job restores it.
    #
    # Sharing a day with the daily pipeline costs flash budget, which is the
    # real constraint: 20 requests a DAY, shared, and the daily spends ~13. The
    # weekly's flagship work is the two cover essays plus the editorial; the
    # week recap moved to flash-lite for exactly this reason, so a Sunday lands
    # near 16-17 of 20 rather than 19.
    - cron: '0 18 * * 0'
  workflow_dispatch:
    inputs:
      week_offset:
        description: 'Weeks back from the week that closes this Sunday. 0=this week (Mon to Sun), 1=the week before, -1=the week still running'
        required: false
        default: '0'

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # No explicit ref: check out whatever triggered this run. The scheduled
      # run resolves to the default branch; a workflow_dispatch from a branch
      # checks out THAT branch, so a change to the generator can be exercised
      # before it lands. Pinning ref: main here would have run main's code under
      # this branch's workflow file, which is how a dispatch silently tests
      # nothing.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r pipeline/requirements.txt
          python -m spacy download en_core_web_sm

      # ── The Argument: three Kokoro voices in their own venv (numpy 2) ──
      # This job installed ffmpeg and nothing else, which is why the weekly was
      # the last edition still on edge-tts. Same cache keys as the daily
      # pipeline, so the model files and the venv are usually already warm.
      - name: Cache Kokoro model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/void-kokoro
          key: kokoro-${{ hashFiles('pipeline/briefing/kokoro.lock.json') }}
      - name: Cache TTS venv
        id: tts-venv
        uses: actions/cache@v4
        with:
          path: .venv-tts
          key: venv-tts-py3.11-${{ hashFiles('pipeline/requirements-tts.txt') }}
      - name: Build TTS venv (cache miss)
        if: steps.tts-venv.outputs.cache-hit != 'true'
        run: python -m venv .venv-tts && .venv-tts/bin/pip install -q -r pipeline/requirements-tts.txt
      - name: Fetch Kokoro model files (verified against kokoro.lock.json)
        run: python pipeline/briefing/kokoro_assets.py

      # ── Pipeline state DB (SQLite) — RESTORE ONLY ──
      # The weekly reads the week's clusters, bias scores and daily briefs out of
      # the same state DB the daily pipeline writes. It restores the newest
      # cached copy and never saves one back.
      #
      # On the old Monday 12:00 slot that was a hard requirement: the daily was
      # usually still running, and a save would have pushed a pre-run copy of
      # the state under a newer cache key and lost a day of work. At Sunday
      # 18:00 the daily has finished, so that race is gone. Restore-only stays
      # anyway, because the weekly adds nothing to the state that anything
      # reads back: the issue is made durable by the deploy tree
      # (build-data/weekly-issues.json), and issue_number is derived from the
      # week's date rather than from the rows already stored.
      - name: Restore pipeline state DB
        uses: actions/cache/restore@v4
        with:
          path: pipeline_state.db
          key: void-state-v1-weekly-${{ github.run_id }}
          restore-keys: |
            void-state-v1-

      - name: Bootstrap state DB (cold cache — durable snapshot)
        if: hashFiles('pipeline_state.db') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          echo "No cached state DB; restoring from the latest durable state snapshot."
          for rid in $(gh run list --workflow=pipeline.yml --status success -L 12 \
                         --json databaseId --jq '.[].databaseId'); do
            if gh run download "$rid" -n void-state-snapshot --dir _snap 2>/dev/null; then
              echo "Restored state snapshot from pipeline run $rid"; break
            fi
          done
          if [ -f _snap/pipeline_state.db.gz ]; then
            gunzip -c _snap/pipeline_state.db.gz > pipeline_state.db
            rm -rf _snap
          else
            echo "No state snapshot available; cannot generate a weekly digest."
            exit 1
          fi

      - name: Generate weekly digest
        env:
          PYTHONUNBUFFERED: "1"
          VOID_SQLITE_PATH: pipeline_state.db
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Cloudflare R2 (media). When these are absent every media path
          # falls back to committed files, so this is safe before the bucket
          # exists. See pipeline/utils/media.py and docs/MEDIA-R2.md.
          VOID_MEDIA_BASE: ${{ vars.VOID_MEDIA_BASE }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # $0 posture: Gemini Flash handles the digest (Groq retired); Claude off.
          DISABLE_ANTHROPIC: "1"
          # "The Argument" (2026-09-20): three Kokoro voices, a validated
          # rundown, a scored timeline and a chapter rail. With VOID_SQLITE_PATH
          # set, the MP3 and its sidecar are written into frontend/public/audio/
          # for the Pages CDN. "1" re-parks audio entirely;
          # VOID_WEEKLY_AUDIO_FORMAT=0 keeps audio but falls back to the legacy
          # two-voice edge-tts read; VOID_TTS_ENGINE=edge keeps the new format
          # on edge voices.
          DISABLE_AUDIO: "0"
          VOID_TTS_ENGINE: kokoro
          VOID_KOKORO_PYTHON: .venv-tts/bin/python
        run: |
          OFFSET="${{ inputs.week_offset }}"
          python -m pipeline.briefing.weekly_digest_generator \
            --week-offset "${OFFSET:-0}"

      # ONLY the weekly snapshot. The restored state DB can be a day behind main
      # (the daily pipeline commits its own export at ~13:00), so a full export
      # here would rewrite feed.json and archive.json from stale rows and the
      # commit below would publish yesterday's front page.
      - name: Export weekly snapshot
        env:
          VOID_SQLITE_PATH: pipeline_state.db
          VOID_EXPORT_ONLY: weekly
          # Cloudflare R2 (media). When these are absent every media path
          # falls back to committed files, so this is safe before the bucket
          # exists. See pipeline/utils/media.py and docs/MEDIA-R2.md.
          VOID_MEDIA_BASE: ${{ vars.VOID_MEDIA_BASE }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python pipeline/export_static.py

      - name: Commit refreshed weekly data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Scoped deliberately: this job owns the weekly snapshot, the weekly
          # back-issue archive and the weekly audio, nothing else.
          #
          # The archive files are NOT optional. This job restores the Actions
          # cache and never saves it back (see the restore step's comment), so
          # the row it writes dies with the container and the deploy tree is the
          # only durable record a past issue has. Anything export_static emits
          # outside this glob is generated in CI and thrown away.
          git add frontend/public/data/weekly.json \
                  frontend/public/data/weekly-archive.json \
                  frontend/build-data/weekly-issues.json \
                  frontend/public/audio/weekly-* || true
          if git diff --cached --quiet; then
            echo "No weekly changes to commit."
            exit 0
          fi
          git commit -m "Weekly: refresh digest snapshot ($(date -u +%F))"
          git checkout -- . 2>/dev/null || true
          # Commit back to the branch this run checked out, never unconditionally
          # to main: a dispatch from a feature branch must not push that branch's
          # unreviewed commits onto the default branch.
          BRANCH="${{ github.ref_name }}"
          echo "committing to $BRANCH"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH" || { git rebase --abort 2>/dev/null || true; echo "rebase failed"; exit 1; }
            if git push origin "HEAD:$BRANCH"; then echo "pushed on attempt $attempt"; exit 0; fi
            echo "push rejected (attempt $attempt); refetching and retrying"
            sleep 5
          done
          echo "could not push refreshed weekly data after 5 attempts"; exit 1
