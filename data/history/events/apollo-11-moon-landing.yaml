- Ended the Space Race the US had been losing since Sputnik in 1957, with a landing before the decade closed
- Cost 25.4 billion dollars and a peak workforce near 400,000 across roughly 20,000 contractor firms
- Bought the integrated circuit at scale, seeding the modern semiconductor and computing industries
- Produced the 'Earthrise' and 'Blue Marble' images that became icons of the environmental movement
- Left a debate over national priorities that Abernathy and Gil Scott-Heron voiced at the launch itself
