- viewpoint: Domestic Critique / Civil Rights and Poverty
  viewpoint_type: revisionist
  region_origin: americas
  narrative: 'For millions of Americans the Moon landing was a question, not an answer: how a nation that could spend 25.4 billion dollars to reach the Moon could not house, feed, or school its own poor.
    The critique came not from the sidelines but from the launch gate. On July 15, 1969, the day before liftoff, Ralph Abernathy, successor to Martin Luther King Jr. at the Southern Christian Leadership
    Conference, led several hundred marchers and four mule-drawn wagons to the gates of Cape Kennedy. He asked to be admitted, was met by NASA administrator Thomas Paine, and told the press his Poor People''s
    Campaign had come not to stop the launch but to protest a country''s distorted priorities. He asked NASA''s scientists to turn their genius on hunger and poverty. Then he watched the rocket rise and,
    by his own account, prayed for the astronauts.


    The sharpest statement came a year later. In 1970 the poet and musician Gil Scott-Heron recorded "Whitey on the Moon," a spoken word piece that set a Black family''s medical debt, rat bites, and rising
    rent against the spectacle overhead: "A rat done bit my sister Nell, with Whitey on the Moon. Her face and arms began to swell, and Whitey''s on the Moon." The refrain named a redistribution that ran
    uphill: taxes drawn from people who could not afford a doctor, spent to plant a flag on a dead world. Black newspapers, including the New York Amsterdam News, ran the arithmetic through the decade.


    The objection was not anti-science. It was about sequence and justice. In 1969 the United States was fighting in Vietnam, cities had burned in 1967 and again after King''s assassination in 1968, and
    the median Black family earned about 60 percent of what white families did. Whitney Young of the Urban League said the money that went to the Moon could have built housing and schools. The critics did
    not deny the achievement. They asked why the achievement had been chosen first, and by whom, and who had paid for it while going without. That question outlived the Apollo program itself, and NASA''s
    own later outreach adopted the challenge Abernathy had issued at the gate.

    '
  key_arguments:
  - Ralph Abernathy led the Poor People's Campaign to the launch gate to protest distorted priorities
  - Gil Scott-Heron's 'Whitey on the Moon' set Black poverty against the cost of the spectacle
  - The 25.4 billion dollars was spent amid Vietnam, urban unrest, and deep racial income gaps
  - The critique targeted sequence and justice, not science itself
