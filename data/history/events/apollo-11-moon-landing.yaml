- viewpoint: Soviet Space Program
  viewpoint_type: vanquished
  region_origin: europe
  narrative: 'From Moscow, the Space Race looked like a contest the Soviet Union led for a decade and then lost in the final lap, for reasons that were as much organizational as technical. The Soviets launched
    the first satellite (Sputnik, October 1957), the first animal in orbit (Laika, November 1957), the first man (Gagarin, April 1961), the first woman (Valentina Tereshkova, 1963), the first spacewalk (Alexei
    Leonov, 1965), and the first probes to reach the Moon and photograph its far side. Each first was announced only after it succeeded; failures vanished. The public heard of triumphs and never of the pad
    explosions.


    The engine of those firsts was one man, Chief Designer Sergei Korolev, whose identity was a state secret until his death. Korolev had survived the Gulag, arrested in 1938 and sent to a labor camp before
    being pulled back to build rockets. He held the rival design bureaus together by force of will. When he died on the operating table in January 1966, aged 59, the Soviet lunar effort lost the only figure
    who could reconcile its feuding chief designers. Valentin Glushko refused to build engines for Korolev''s giant N1 rocket, so the design used 30 smaller engines clustered on the first stage, choreographed
    by an analog control system that could not keep pace with American digital computing. The N1 flew four times between 1969 and 1972 and failed every time; its second launch, in July 1969, fell back onto
    the pad in one of the largest non-nuclear explosions in history, weeks before Apollo 11.


    Even in defeat the Soviets raced. Luna 15, an unmanned sample-return probe, launched on July 13, 1969, three days ahead of Apollo 11, aiming to scoop lunar soil and return it to Earth before the astronauts
    got home, which would have let Moscow claim it had retrieved Moon rocks robotically, without risking lives. It reached lunar orbit but crashed into the Sea of Crises on July 21, hours before Eagle lifted
    off. Afterward the official line held that the Soviet Union had never intended to send people to the Moon at all, that robotic exploration was safer and wiser. The N1 program was cancelled in 1974 and
    its existence denied until the Soviet collapse. In this framing, the loss was real but the ledger longer: the country that lost the Moon had opened the entire road to space.

    '
  key_arguments:
  - The USSR held nearly every space first from 1957 to 1965, from Sputnik to the first spacewalk
  - Korolev's death in 1966 removed the one designer who could unify the feuding lunar effort
  - The N1 rocket failed all four flights; clustered engines and analog control could not match US computing
  - Luna 15 raced to return lunar soil robotically first and crashed hours before Apollo 11 departed
