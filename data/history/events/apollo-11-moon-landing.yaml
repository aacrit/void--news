summary: 'At 20:17:40 UTC on July 20, 1969, a spidery aluminum craft with legs settled onto a plain of basalt on the Moon. "Houston, Tranquility Base here. The Eagle has landed." In Mission Control, a flight
  controller keyed his microphone: "You got a bunch of guys about to turn blue. We''re breathing again."


  Neil Armstrong and Buzz Aldrin had flown the Lunar Module the final descent by hand after the guidance computer threw 1202 alarms and the automatic system steered them toward a boulder field. They touched
  down with about 25 seconds of fuel remaining. Michael Collins orbited overhead in the Command Module, alone, passing behind the Moon on each revolution into a radio silence no human had experienced.


  Six and a half hours later, at 02:56 UTC on July 21, Armstrong climbed down the ladder and pressed a boot into the regolith. "That''s one small step for man, one giant leap for mankind." The transmission
  came from 239,000 miles away on a signal weaker than a refrigerator bulb, relayed through a dish outside Canberra to an audience of roughly 600 million people.


  The reaching had cost 25.4 billion dollars in then-year money, drawn from a workforce that peaked near 400,000: engineers, seamstresses who sewed the 21-layer spacesuits, technicians who hand-wound the
  guidance computer''s rope memory. It had also cost three lives. On January 27, 1967, a fire swept the pure-oxygen cabin of Apollo 1 during a ground test, killing Gus Grissom, Ed White, and Roger Chaffee
  in seconds behind a hatch that took 90 seconds to open.


  Eight years earlier the United States had not put a single person into orbit. The Soviet Union had launched the first satellite, the first man, the first woman, the first spacewalk. On May 25, 1961, three
  weeks after a chimpanzee-tested capsule carried Alan Shepard on a 15-minute hop, President Kennedy told Congress the nation should land a man on the Moon before the decade was out. He was proposing to win
  a race the country was losing.


  Two hundred miles from Tranquility Base, a Soviet robot named Luna 15 was circling the same Moon. It had launched three days before Apollo 11, sent to scoop lunar soil and rush it home first. On July 21,
  hours before the astronauts lifted off to return, Luna 15 fired its retrorocket, descended toward the Sea of Crises, and struck a mountainside. British astronomers at Jodrell Bank recorded the signal going
  silent.

  '
significance: 'The landing settled the central technological contest of the Cold War in America''s favor and reframed the Soviet Union, which had led every prior milestone, as second. It validated a management
  model, systems engineering across 20,000 contractor firms, that reshaped how governments and corporations run large projects. The integrated circuit, ordered by the thousands for the Apollo Guidance Computer,
  found its first mass buyer in the space program and seeded the semiconductor industry. The photograph of Earth from lunar distance, a blue marble in black vacuum, became the emblem of the environmental
  movement founded the same decade. And the estimated 25.4 billion dollars spent to reach the Moon, at a moment when Ralph Abernathy drove mule carts to the launch gate to protest American poverty, opened
  a debate about national priorities that has never closed: whether a society proves its greatness by what it can build or by whom it leaves behind. No human has returned to the Moon since December 1972.

  '
