- viewpoint: Global South / Third World
  viewpoint_type: revisionist
  region_origin: global
  narrative: 'From the newly independent nations of Africa, Asia, and Latin America, the Moon landing read as the crowning spectacle of a bipolar order in which the two superpowers spent the wealth of the
    planet performing their rivalry above it. In 1969 much of the world had been decolonized for less than a decade. India, Nigeria, Indonesia, and dozens of other states were building their first universities,
    fighting famine, and choosing sides in a Cold War not of their making. The 25.4 billion dollars the United States spent to reach the Moon, and the comparable sums the Soviet Union poured into the N1,
    were, in this view, a monument to misallocation on a global scale.


    The critique had defenders and dissenters within the Global South itself. Some leaders read the achievement as proof that human capacity was unbounded and that their own nations could one day reach as
    far; India and Brazil would later build space programs that argued exactly this, framing satellites as tools for weather, communication, and development rather than prestige. Others saw the race as a
    distraction the poor world could not afford to admire. A widely retold anecdote from the period captured the tension: a Zambian nun, Sister Mary Jucunda, wrote to a NASA scientist asking how he could
    justify spending billions on Mars research while children starved on Earth. The scientist''s published reply argued that basic research had always, indirectly, fed the hungry by advancing the tools of
    civilization. The exchange became a parable precisely because both sides were sincere.


    The deeper objection was about authorship and audience. The plaque on the Moon read "for all mankind," but mankind had not been consulted, funded the effort, or shared in its direction. Two powers had
    claimed the sky on humanity''s behalf. The technology that reached the Moon was the same technology, the intercontinental ballistic missile, that could deliver a warhead to any capital in the developing
    world, and the launch vehicles of both programs descended directly from weapons. For much of the Global South, Apollo was neither villain nor miracle but evidence: that the resources to end poverty existed,
    that they were spent instead on a race for prestige, and that the phrase "all mankind" would have to be earned rather than announced.

    '
  key_arguments:
  - Superpower spending on the Moon race read as global misallocation amid post-colonial poverty
  - Some Global South leaders drew inspiration; later Indian and Brazilian programs stressed development over prestige
  - The Sister Mary Jucunda exchange framed the sincere clash between research and immediate need
  - '"For all mankind" rang hollow to nations that neither funded nor directed the effort'
  sources:
