summary: 'At 1:23:40 a.m. on April 26, 1986, operators at the Chernobyl Nuclear Power Plant in Soviet Ukraine pressed the AZ-5 emergency shutdown button on Reactor No. 4. They were running a safety test,
  a rehearsal for how the reactor would keep its cooling pumps running during a blackout. The test had been delayed for hours and taken over by a night shift that had not planned it. When the control rods
  began to lower, a design flaw in the RBMK reactor briefly spiked the power instead of cutting it. Within seconds the core exceeded 100 times its rated output.


  Two explosions blew the 1,000-ton upper biological shield off the reactor and threw burning graphite and fuel across the site. The number 4 reactor hall was open to the sky. Firefighters arrived at 1:28
  a.m. with no protective clothing and no idea they were fighting a radiological fire; they scraped glowing chunks of reactor graphite off the roof with their boots. The first of them died within weeks
  of acute radiation syndrome.


  The plant sits three kilometers from Pripyat, a city of 49,360 built in 1970 to house the plant workers. On the morning of April 26, children went to school. People sunbathed and fished. Wedding parties
  went ahead. The Soviet state said nothing. Pripyat was not evacuated until the afternoon of April 27, roughly 36 hours after the explosion. When the buses finally came, 1,200 of them from Kyiv, residents
  were told to pack for three days. They never returned.


  The Soviet government intended to keep the accident secret. It succeeded for two days. On the morning of April 28, a worker arriving at the Forsmark nuclear plant near Stockholm set off the radiation alarm
  on his way IN to work. Swedish technicians traced the contamination on his shoes to no leak of their own, ran the wind backward, and pointed at Soviet territory. Only after Sweden threatened to file an
  official alert did Moscow admit, in a 20-second television announcement that evening, that "an accident has occurred."


  Between April 27 and May, some 1,800 helicopter sorties dumped over 5,000 tons of sand, clay, lead, and boron onto the exposed core. Roughly 600,000 people, most of them conscripted soldiers and civilian
  workers called "liquidators," were sent to build a concrete sarcophagus over the ruin, bury topsoil, and shoot contaminated animals. Many received doses far above safe limits in exchange for a certificate
  and a small pension. The exclusion zone drawn around the plant, 2,600 square kilometers, remains largely uninhabited in 2026.

  '
significance: 'Chernobyl released roughly 400 times more radioactive material than the Hiroshima bomb, contaminating large areas of Ukraine, Belarus, and Russia and depositing fallout across Europe. The
  human toll is contested by an order of magnitude: 31 immediate deaths in the Soviet count, up to 4,000 projected by the 2005 WHO/IAEA Chernobyl Forum among the most exposed, 16,000 to 60,000 in modeled
  European studies, and 93,000 or more in figures published by Greenpeace. More than 6,000 thyroid cancers were diagnosed in people exposed as children. Beyond the biology, the disaster cracked the Soviet
  state''s monopoly on information. Mikhail Gorbachev later wrote that Chernobyl, "even more than my launch of perestroika, was perhaps the real cause of the collapse of the Soviet Union." The event reshaped
  the global nuclear industry, hardened public opposition to nuclear power for a generation, and produced the largest civil-engineering containment project in history: the 36,000-ton New Safe Confinement
  arch, slid over the reactor in 2016 and completed in 2019 to hold the ruin for 100 years.

  '
