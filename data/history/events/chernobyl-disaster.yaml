- viewpoint: Glasnost and the Fall of the USSR
  viewpoint_type: revisionist
  region_origin: europe
  narrative: 'Mikhail Gorbachev had come to power in March 1985 promising glasnost, openness, and perestroika, restructuring. In April 1986 the Soviet system met that promise with its oldest reflex: silence.
    The gap between what Gorbachev said the state would be and how the state actually behaved in the first days after Chernobyl is, in this reading, the moment the Soviet Union''s credibility began to fail
    from within.


    The failure was total and public. The state concealed the accident from its own citizens while the fallout was already tripping alarms in Sweden. It ran the Kyiv May Day parade under a radioactive
    plume. It released false radiation figures. And it could not sustain any of this, because the physical fact of the fallout had already escaped Soviet control the moment it crossed the border. Foreign
    monitoring, foreign broadcasts, and the sheer scale of the mobilization made the cover-up impossible to maintain. Gorbachev did not address the nation until May 14, eighteen days after the explosion.
    By then the damage to the state''s authority was done.


    Gorbachev himself drew the lesson explicitly. He wrote that Chernobyl "made absolutely clear how important it was to continue the policy of glasnost," and, more startlingly, that the disaster "even more
    than my launch of perestroika, was perhaps the real cause of the collapse of the Soviet Union." The historian Serhii Plokhy, in his prize-winning history, argues that Chernobyl exposed the structural
    pathologies of the Soviet system: the secrecy, the unaccountable bureaucracy, the sacrifice of safety to production targets and prestige, the treatment of citizens as expendable. Once glasnost let people
    say so out loud, the catastrophe became a lens through which the whole system could be criticized. Soviet Foreign Ministry spokesman Gennady Gerasimov later put it bluntly: "It was glasnost that destroyed
    the Soviet Union," because "people opened their eyes."


    Chernobyl also fed the national movements that pulled the union apart. In Ukraine and Belarus, the disaster became a rallying cause: proof that Moscow would poison the republics and lie about it. The
    Ukrainian environmental and independence movements drew directly on Chernobyl grievance. When Ukraine voted for independence in December 1991, the reactor was part of the indictment. In this perspective
    Chernobyl is not only a nuclear accident. It is the moment a state built on controlling information lost the ability to control it, and never recovered.

    '
  key_arguments:
  - The disaster exposed the fatal gap between glasnost's promise and the state's reflexive secrecy
  - Physical fallout crossing borders made the cover-up impossible, breaking the information monopoly
  - Gorbachev himself named Chernobyl "perhaps the real cause of the collapse of the Soviet Union"
  - Chernobyl grievance fueled the Ukrainian and Belarusian independence movements
