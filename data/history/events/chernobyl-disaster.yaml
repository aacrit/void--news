connections:
- target_slug: soviet-union-collapse
  connection_type: influenced
  description: Gorbachev promised glasnost in 1985. In April 1986 the state hid a meltdown from its own people for 36 hours. He later called Chernobyl, not perestroika, "perhaps the real cause of the collapse of the Soviet Union"
- target_slug: hiroshima-nagasaki
  connection_type: parallel
  description: Chernobyl released roughly 400 times more radioactive material than the Hiroshima bomb. One was a weapon aimed at an enemy; the other, a power plant that irradiated the state that built it
- target_slug: fall-of-berlin-wall
  connection_type: influenced
  description: The fallout crossed the Iron Curtain before the news did, tripping alarms in Sweden. A state that could not contain radiation or information lost both; the wall fell three years later
