- The state hid a meltdown from its own citizens for 36 hours; the world found out when a Swedish plant's alarm caught the fallout on a worker's shoes
- Roughly 600,000 liquidators were sent into the zone; many received a certificate and a pension in exchange for their exposure
- The death toll spans two orders of magnitude, from 31 (Soviet) to 4,000 (WHO) to 93,000+ (Greenpeace), depending on who is counting and how
