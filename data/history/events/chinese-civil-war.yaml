perspectives:
- viewpoint: CCP / Maoist Liberation
  viewpoint_type: victor
  region_origin: east-asia
  narrative: |
    In the official history taught in the People's Republic, 1949 is Liberation. The story runs from the workers slaughtered in Shanghai in 1927 to the flag raised over Tiananmen 22 years later, and its moral is that only the Communist Party could end a century of foreign humiliation and warlord chaos that began with the Opium Wars.

    The Party's survival is told as an epic of endurance. When Chiang's five encirclement campaigns closed on the Jiangxi Soviet, the Red Army broke out and marched. The Long March of 1934-1935 covered some 6,000 miles and crossed 24 rivers and 18 mountain ranges; of the roughly 86,000 who set out, fewer than one in ten reached Yan'an. The march is remembered not as a defeat but as a seeding: the Party scattered cadres across eleven provinces and forged the leaders who would run China for the next half century. At Zunyi in January 1935, Mao displaced the Soviet-trained leadership and set the line that peasants, not the urban proletariat, would make the Chinese revolution.

    The decisive claim is that the Party won because the people chose it. In the "liberated areas" the CCP redistributed land, cut rents and interest, taught literacy, and disciplined its soldiers under the Three Rules and Eight Points of Attention that forbade looting and abuse of villagers. The Nationalist regime, in this telling, rotted from corruption, hyperinflation that reached over 1,000 percent, and dependence on American arms. The three great campaigns of 1948-1949 are presented as the verdict of history: the People's Liberation Army destroyed 1.5 million of Chiang's best troops, many of whom defected or surrendered en masse.

    Mao supplied the framing that still defines the state. On September 21, 1949 he told the Consultative Conference that "the Chinese people, comprising one quarter of humanity, have now stood up." The phrase compressed the entire narrative: a nation once carved into foreign concessions had reclaimed itself. October 1 is National Day, celebrated every year in Tiananmen Square, the founding act of a country that would defy the United States in Korea within twelve months.
  key_arguments:
  - The revolution ended a century of foreign humiliation and warlord fragmentation
  - The Party won peasant support through land reform, disciplined troops, and social programs
  - Nationalist defeat came from corruption, hyperinflation, and dependence on foreign arms
  - 1949 restored Chinese sovereignty and dignity after the Opium Wars and Japanese invasion
