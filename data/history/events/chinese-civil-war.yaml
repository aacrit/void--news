- viewpoint: Kuomintang / Republic of China (Taiwan)
  viewpoint_type: vanquished
  region_origin: east-asia
  narrative: |
    From Taipei, the war is not a liberation but a catastrophe with foreign fingerprints. The Republic of China, founded in 1912 and led after 1928 by Chiang Kai-shek's Kuomintang, sees itself as the legitimate government of China, driven from the mainland but never dissolved. Its capital moved to Taipei in December 1949; it kept China's seat at the United Nations until 1971.

    In this account Chiang's government carried the main burden of the war against Japan from 1937 to 1945, losing its best armies and an estimated 3 million soldiers while the Communists conserved strength in the rural northwest. When Japan surrendered, the Nationalists were exhausted, overextended, and financially ruined, tasked with governing a devastated country while the Soviet Union handed the Communists the arsenals of the defeated Japanese army in Manchuria. Chiang argued for the rest of his life that he lost the mainland less to Mao than to Moscow's aid and Washington's abandonment. His 1957 memoir was titled, pointedly, Soviet Russia in China.

    The record of grievance is specific. General George Marshall's mediation mission of 1946 imposed a ceasefire and an arms embargo on the Nationalists at the moment their military position was strongest, then blamed both sides when it failed. The 1949 China White Paper, in the Nationalist reading, was an American attempt to wash its hands of an ally it had stopped supplying. Runaway inflation, corruption among officials, and the desertion of demoralized conscripts are acknowledged, but framed as symptoms of a state fighting two total wars back to back with dwindling support.

    Taiwan's founding creed became the vow to return. "Counterattack the mainland" was the official goal of the Republic of China for decades, printed on textbooks and stamped on coins. That project failed, but under martial law and then democracy the island Chiang held became one of the wealthiest and freest societies in Asia, an alternative Chinese modernity that the mainland narrative prefers to ignore. The unfinished civil war is why Beijing still calls reunification an internal matter and why Taipei's status is contested to this day.
  key_arguments:
  - The Republic of China remained the legitimate government, relocated rather than defeated
  - The Nationalists bore the main cost of resisting Japan, which drained their armies
  - Soviet aid in Manchuria and the American arms embargo determined the outcome
  - Taiwan built a prosperous, eventually democratic Chinese society after 1949
