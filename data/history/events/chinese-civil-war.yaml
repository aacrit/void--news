- Brought the Chinese Communist Party to power, a single-party rule unbroken for more than 75 years
- Long March survivors became the founding elite: Mao, Zhou Enlai, Zhu De, Deng Xiaoping, Lin Biao
- Created the "two Chinas" question that remains the most dangerous flashpoint between nuclear powers
- Land reform redistributed the fields of an estimated 10 percent of the rural population to the poor, at a cost of hundreds of thousands of landlord deaths
- Triggered China's entry into the Korean War in 1950 and set the Cold War frontier across Asia
