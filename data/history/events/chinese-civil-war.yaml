category: revolution
severity: catastrophic
death_toll: 6 million or more (combat and atrocities, 1927-1949)
affected_population: About 2 million soldiers and civilians fled to Taiwan in 1949
duration: Two phases across 22 years (1927-1937 and 1946-1949), interrupted by the war against Japan 1937-1945
hero_image_url: https://upload.wikimedia.org/wikipedia/commons/1/12/Mao_proclaiming_establishment_of_PRC.jpg
hero_image_attribution: Mao Zedong proclaiming the founding of the People's Republic of China from Tiananmen, October 1, 1949, public domain via Wikimedia Commons
summary: |
  On April 12, 1927, in Shanghai, gunmen of the Green Gang and soldiers loyal to Chiang Kai-shek moved through the workers' districts before dawn. Union halls were surrounded. Between 5,000 and 10,000 Communists, labor organizers, and suspected sympathizers were shot, beheaded, or thrown into the Huangpu River within days. The First United Front between the Nationalists (Kuomintang) and the Chinese Communist Party (CCP), which had helped reunify much of China only months earlier, was finished. The two parties would fight, on and off, for the next 22 years.

  The CCP, driven from the cities, rebuilt in the countryside. Encircled in the Jiangxi hills, roughly 86,000 Red Army soldiers broke out in October 1934 and began the Long March, a fighting retreat of some 6,000 miles across a year. At the Xiang River, 40,000 died in a single crossing. At the Zunyi Conference in January 1935, Mao Zedong took control of the Party. Fewer than 10,000 reached the loess caves of Yan'an in the northwest. Those survivors became the founding generation of a state.

  The war against Japan (1937-1945) forced a Second United Front and froze the civil war. When Japan surrendered, the freeze broke. From 1946 the Nationalist armies, better armed and backed by the United States, held the cities; the CCP, backed by a land reform that handed peasants the fields of their landlords, held the villages. In 1948 and 1949 three campaigns decided the war: Liaoshen in Manchuria, Huaihai around Xuzhou where 550,000 Nationalist troops were destroyed, and Pingjin at Beijing and Tianjin. In under a year the People's Liberation Army destroyed roughly 1.5 million Nationalist soldiers.

  On September 21, 1949, opening the Chinese People's Political Consultative Conference, Mao told the delegates that the Chinese people, one quarter of humanity, had stood up. On October 1, from the Gate of Heavenly Peace above Tiananmen Square, he proclaimed the People's Republic of China. Chiang Kai-shek, his government, some 2 million soldiers and civilians, and the gold reserves of the central bank had already begun crossing the strait to Taiwan, where the Republic of China survives to this day.

  The dead were never fully counted. Estimates for the full 1927-1949 conflict run past 6 million, with 1.8 to 3.5 million attributed to atrocities against civilians. Two governments emerged, each claiming to be China. One question left open in 1949 is still open in 2026.
significance: |
  The People's Republic founded in 1949 is now the world's second-largest economy and the central rival to American power. The Communist Party that won the civil war has governed without interruption for more than 75 years, longer than the Soviet Communist Party ever lasted. The victory also fixed the shape of the Cold War in Asia: within a year the new PRC crossed the Yalu into the Korean War against the United States (1950), and its land-reform model was carried into North Korea and North Vietnam. The revolution's second act, run by the same men who won in 1949, killed tens of millions more in the Great Leap Forward famine (1959-1961) and the Cultural Revolution (1966-1976). And the war never formally ended. Chiang's retreat created the "two Chinas," a split sovereignty that in the 2020s is the single most dangerous flashpoint between nuclear-armed states. The line drawn across 110 miles of the Taiwan Strait remains the most consequential unfinished border of the twentieth century.
