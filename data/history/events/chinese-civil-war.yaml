- viewpoint: Peasant Experience / Social History of Land Reform
  viewpoint_type: vanquished
  region_origin: east-asia
  narrative: |
    William Hinton arrived in Long Bow village in Shanxi in the spring of 1948 and stayed to watch land reform take place house by house. His book Fanshen took its title from the word peasants used for what was happening to them. "Literally," he wrote, "it means to turn the body, or to turn over." For a tenant who had never owned the ground he worked, fanshen meant to stand up, throw off the landlord, and take a share of land, tools, and dignity.

    Below the campaigns and the generals, the civil war was decided in tens of thousands of villages like Long Bow. The CCP's method was the "speak bitterness" meeting: peasants were gathered to voice, out loud and in public, the accumulated humiliations of rent, debt, forced labor, and hunger. Class categories were assigned, landlord, rich peasant, middle peasant, poor peasant, and the land, animals, and grain of the top categories were divided among the rest. For families who had eaten bark in famine years, this was the moment the revolution became real and worth fighting for. It is why PLA ranks swelled with village recruits who had a stake in a Communist victory and everything to lose from a Nationalist return.

    The same meetings had another face. The "struggle sessions" that followed could turn from redistribution into violence: landlords beaten, paraded, driven to suicide, or executed by their own villagers. Quotas and cadre zeal produced killings of people whose only crime was owning a few extra acres. Hinton himself recorded the excesses and the later "correction" campaigns that tried to rein them in. Estimates of landlords and rich peasants killed in land reform during and just after the civil war run into the hundreds of thousands, some far higher.

    The peasant perspective refuses both the heroic and the purely condemnatory version. For many at the bottom of rural society, land reform delivered something no previous Chinese government had: a title, a plot, a vote in the village. For the accused and their families, it delivered terror. Both were true in the same courtyard, often on the same afternoon. This is the ground-level texture that the slogans of Liberation and the lamentations of the exiles both flatten.
  key_arguments:
  - The war was decided village by village through land redistribution, not only on battlefields
  - Land reform gave the rural poor a concrete material stake in a Communist victory
  - Speak-bitterness meetings converted private grievance into political mobilization
  - The same process produced hundreds of thousands of coerced deaths of the landlord class
