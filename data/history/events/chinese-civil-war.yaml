- viewpoint: Western Cold War / "Loss of China"
  viewpoint_type: bystander
  region_origin: north-america
  narrative: |
    In the United States, 1949 was not the founding of a nation but the "loss of China," and it detonated a political crisis at home. A country Americans had regarded as a wartime ally and a future democratic partner had, seemingly overnight, become the largest Communist state on earth. The question that consumed Washington was not why the Chinese revolution succeeded but who in America was to blame for letting it.

    The Truman administration's defense was the China White Paper of August 1949, a 1,054-page compilation released as Mao's armies neared Beijing. Its thesis, in Secretary of State Dean Acheson's words, was that "the ominous result of the civil war in China was beyond the control of the government of the United States." Washington had poured some 3 billion dollars into Chiang's government and could not, it argued, save a regime that would not save itself. Critics read the same document as an alibi for abandonment.

    The backlash created the "China Lobby" and fueled McCarthyism. Senator Joseph McCarthy and his allies charged that the State Department's "China Hands," the diplomats who had reported Nationalist corruption and Communist strength honestly from the field, had engineered the defeat. John Paton Davies, John Stewart Service, and others were investigated, smeared, and driven from the Foreign Service. The purge stripped the United States of its most knowledgeable China experts on the eve of the wars in Korea and Vietnam, a loss historians link to later American misjudgments across Asia.

    The strategic reading hardened into the domino theory: if China could fall, so could Korea, Indochina, and beyond. When Chinese troops crossed the Yalu in late 1950, the "loss of China" seemed confirmed as a Communist tide, and containment became the organizing doctrine of American policy in Asia for a generation. In this frame the Chinese revolution is less a domestic upheaval than the opening move of the Cold War in the East, and the tragedy is measured in Washington's failures rather than China's.
  key_arguments:
  - The Communist victory was a strategic defeat for the United States in the emerging Cold War
  - The China White Paper argued the outcome was beyond American power to prevent
  - The "loss" triggered McCarthyism and the purge of the State Department's China experts
  - 1949 hardened the domino theory that shaped US policy in Korea and Vietnam
