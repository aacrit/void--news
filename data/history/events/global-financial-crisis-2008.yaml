legacy_points:
- The Financial Crisis Inquiry Commission (2011) reviewed millions of documents, interviewed more than 700 witnesses, held 19 days of hearings, and concluded in a 545-page report that the crisis was "avoidable"
- The US Treasury estimated Americans lost 19.2 trillion dollars in household wealth; roughly 8.7 million jobs and 10 million homes were lost
- TARP's bank investments were repaid at a profit to taxpayers, yet not one senior Wall Street executive was criminally convicted for the crisis
- The Dodd-Frank Act (2010) and Basel III rewrote financial regulation, while central banks held interest rates near zero for a decade
- Austerity and lost trust after 2008 fueled the eurozone debt crisis, Occupy Wall Street, Brexit, and a wave of populist politics across the West
