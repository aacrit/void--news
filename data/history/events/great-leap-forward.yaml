connections:
- target_slug: holodomor
  connection_type: parallel
  description: A quarter-century before Xinyang, Stalin's state requisitioned grain from a starving countryside and kept exporting it, then denied the famine for decades. Both regimes turned a harvest into a weapon and the death toll into a state secret
- target_slug: chinese-cultural-revolution
  connection_type: influenced
  description: Mao launched the Cultural Revolution in 1966 partly to overturn Liu Shaoqi's seven-parts-man-made verdict on the famine. Both Liu and Peng Dehuai, the men who had tried to name the catastrophe, died in its custody
- target_slug: korean-war
  connection_type: influenced
  description: The Soviet debt Mao rushed to repay by exporting grain during the famine was owed largely for the arms China bought from Moscow to fight in Korea. The bill for one war was collected from the fields during another catastrophe
- target_slug: chinese-civil-war
  connection_type: influenced
  description: The peasant army that won the civil war in 1949 put Mao in the unchallenged power that let him order the Leap nine years later. The same promise of land that carried the countryside to the Communists became the commune that took the harvest away
