legacy_points:
- Ended August 20, 1988 with the border essentially back at the 1975 line, roughly 1 million dead, and no territory gained by either side
- Left Iraq more than 80 billion dollars in debt; Saddam invaded Kuwait in 1990 to cancel it, triggering the Gulf War and a lasting US military presence in the region
- Iraq used mustard gas and the nerve agents tabun and sarin against Iranian troops and Kurdish civilians; Halabja killed roughly 5,000 in one afternoon, and the world's near-silence taught Iran that treaties would not protect it
- Entrenched the Revolutionary Guard and Basij as the core institutions of the Islamic Republic and seeded Iran's missile program, self-reliance doctrine, and later nuclear hedging
- Was armed on both sides by outside powers: the USSR and France supplied Iraq's tanks, jets, and Exocets, while the United States tilted to Baghdad and simultaneously sold missiles to Tehran in the Iran-Contra affair
