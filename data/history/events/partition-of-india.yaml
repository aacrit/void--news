perspectives:
- viewpoint: British Imperial
  viewpoint_type: victor
  region_origin: europe
  narrative: 'The transfer of power from Britain to the two new dominions followed a deliberate sequence. The Attlee government, elected in 1945, dispatched the Cabinet Mission in March 1946 to negotiate
    a united India with a weak center and strong provinces. When the Muslim League and Congress failed to agree on the three-tier structure, Mountbatten, appointed February 1947, concluded that partition
    was the only option that both parties would accept.


    The timeline accelerated from June 1948 to August 1947 after Mountbatten judged that delay risked a complete breakdown of administrative authority. The Indian Civil Service, backbone of British governance
    for 90 years, was already hemorrhaging officers. By spring 1947, British district officers in Punjab openly reported they could not guarantee security beyond the monsoon. Mountbatten presented the choice
    starkly: partition now with some order, or partition later with none.


    Radcliffe''s boundary commissions operated under extreme constraints. He had five weeks, four judges (two from each side, deadlocked on every contested district), and the 1941 census figures, which the June 3
    statement made authoritative; Sir George Abell told the commission''s secretaries that any map read with those figures would suffice. He allocated three of Gurdaspur district''s four tehsils to
    India. At his press conference on June 4, 1947 Mountbatten had given Gurdaspur as 50.4 per cent Muslim and 49.6 per cent non-Muslim. Pakistani historians have contested the award ever since as
    political rather than judicial. The award''s stated grounds are the Upper Bari Doab Canal and the Mandi hydro-electric
    scheme; the one document before the award that ties Gurdaspur to Kashmir is the Viceroy''s staff''s record of his interview with the Nawab of Bhopal on August 4, 1947, and Lord Ismay denied to
    Liaquat Ali Khan on August 11 that the Viceroy had anything to do with the commissions. Radcliffe received a knighthood and 40,000 pounds for his work; he burned his papers
    and never returned to India.


    The Punjab Boundary Force, commanded by Major General Rees, was to hold twelve districts of close on 14.5 million people; the Governor, Sir Evan Jenkins, counted its effective strength at about
    7,500 rifles on August 13, 1947, about 9,000 with static troops, against the 20,000 effective fighting men he had estimated as the minimum: by his own figures of August 8, one effective rifle for every 1,600 people before the police were counted. Rees reported to the Joint Defence Council, not to either
    dominion government, a command structure that satisfied neither side. Nehru accused the force of failing to protect Hindus and Sikhs; Jinnah charged it with anti-Muslim bias. The force was dissolved
    on September 1, 1947. Mountbatten maintained that the speed of the transfer was preferable to the alternative: a civil
    war with British troops still on the ground.


    The British narrative centers on the handover as an act of statecraft under impossible conditions: the fulfillment of a promise made in the 1942 Cripps Mission and the 1946 Cabinet Mission. The Attlee
    government saw partition as the price of Indian self-determination, not a British imposition: both Congress and the League signed the June 3 Plan. Mountbatten himself later noted that he received more
    criticism for the speed of the withdrawal than for the decision to leave.

    '
  key_arguments:
  - Partition was accepted by both Indian National Congress and Muslim League
  - Accelerated timeline prevented worse bloodshed during administrative collapse
  - Radcliffe operated under constraints imposed by Indian political deadlock
  - Britain fulfilled its wartime promise of self-determination
