summary: 'On June 3, 1947, Lord Mountbatten announced that British India would be divided into two independent dominions in 73 days. The actual boundary line was drawn by Sir Cyril Radcliffe, a British
  barrister who had never visited India, in a five-week sprint. The commissions worked from the 1941 census, which the June 3 statement made authoritative; Sir George Abell told the Punjab
  commission''s secretaries that any map read with the 1941 figures would suffice. He partitioned Bengal in the east and Punjab in the west, splitting villages,
  irrigation canals, and railway lines.


  The Radcliffe Line was published on August 17, two days after independence ceremonies in both Karachi and Delhi. By then, violence had already consumed the Punjab. In Lahore, fires burned for weeks. In
  Amritsar, mobs blocked roads to refugee columns. Sikh jathas and Muslim militias attacked trains carrying refugees in both directions; some trains arrived at their destinations carrying nothing but corpses.
  Railway staff at Wagah logged them as "ghost trains."


  The counts of the migration disagree. The House of Commons was told on December 18, 1947 that 8,500,000 people had moved between East Punjab and West Punjab; the economists Bharadwaj and Mirza put
  the displaced at 14.5 million within four years. Hindus and Sikhs moved east; Muslims moved west. The columns stretched 50 miles on some roads. Women and
  children traveled on foot in 110-degree heat. Cholera, dysentery, and dehydration killed thousands who survived the communal violence. In many border villages, neighbors who had shared wells for generations
  turned on each other within hours of learning which side of the line they fell on.


  The British Indian Army, itself in the process of being split, could not maintain order. The Punjab Boundary Force under Major General Rees was to hold twelve districts of at least 12 million people.
  The Governor of the Punjab, Sir Evan Jenkins, telegraphed the Viceroy on August 8, 1947 that its commander counted 7,500 effective rifles, 9,000 with static troops and training centres; on August 13
  he wrote that he had estimated a minimum of 20,000 effective fighting men. The Force was disbanded on September 1. The date had been moved forward from June 1948 to August 1947; on June 17 Mountbatten
  wrote that he was "trying to keep up the momentum of our good start."


  The death toll is contested. India''s Fact Finding Organisation, which examined nearly 15,000 witnesses, in G. D. Khosla''s Stern Reckoning (1949) estimated the loss of non-Muslim life at 200,000 to 250,000 and believed an equal number
  of Muslims perished in India; the Shiromani Gurdwara Parbandhak Committee''s compilation (Talib, 1950) and the economists Bharadwaj and Mirza (2019) each put the dead at about a million. Khosla''s
  own report says the 1941 census was not accurate even when compiled, so no count can be made from population figures, and most deaths were never registered.

  '
significance: 'Partition created two states that are now both nuclear-armed, locked in four wars (1947, 1965, 1971, 1999), and contesting a Kashmir neither has conceded. The House of Commons was told that 8,500,000 people had
  moved between the two Punjabs by December 1947; economists count 14.5 million displaced within four years; the dead are counted from the Fact Finding Organisation''s 200,000 to 250,000 non-Muslims plus
  an equal number of Muslims up to the SGPC''s and the economists'' about a million. No count of abducted women could be read in the free record. The same logic of religious partition recurred in Palestine (1948), Cyprus (1974), and Yugoslavia (1990s). In
  1971, Pakistan itself fractured along the lines of its founding contradiction, and Bangladesh became a third nation born from the original division. The Radcliffe Line left 162 enclaves stranded on the
  wrong side of the India-Bangladesh border; they were not resolved until the Land Boundary Agreement of 2015 -- 68 years after a British barrister drew the line in five weeks.

  '
