- 'Established the India-Pakistan rivalry: four wars, nuclear standoff, unresolved Kashmir'
- Radcliffe Line divided 175,000 sq miles in five weeks, working from the 1941 census figures the June 3 plan made authoritative
- Triggered the 1971 Bangladesh Liberation War and a third nation's birth
- Produced an intergenerational oral history of displacement preserved by the 1947 Partition Archive
