- viewpoint: International Diplomacy / Resolution 242
  viewpoint_type: academic
  region_origin: global
  narrative: 'The war ended in six days; the diplomacy it started is unfinished after fifty-nine years. UN Security Council Resolution 242, adopted unanimously on November 22, 1967, is the document every
    later negotiation has cited, and its power lies in an ambiguity that was deliberate. It called for the "withdrawal of Israeli armed forces from territories occupied in the recent conflict." The English
    text omits the article "the" before "territories," so Israel reads it as withdrawal from some territories, to be settled by negotiation. The equally authentic French text says "des territoires," which
    can carry the definite sense, so the Arab states read it as withdrawal from all the land taken. Lord Caradon, the British ambassador who drafted it, later admitted the wording was left open on purpose,
    because no sharper formula could win a unanimous vote.


    The resolution welded two principles that had never before been forced together: the inadmissibility of acquiring territory by war, and the right of every state to secure and recognized boundaries.
    Out of that pairing came the phrase "land for peace," the spine of Arab-Israeli diplomacy ever since. It worked once cleanly. Egypt and Israel invoked 242 to trade the whole of Sinai for a full peace
    in 1979. It has not worked again. The Jarring mission, the UN envoy sent to broker a settlement, produced nothing. Resolution 338, after the 1973 war, did little more than order the parties back to
    242.


    The resolution''s deepest silence concerns the Palestinians. 242 mentions them only once, and only as a "refugee problem" to be justly settled, not as a people with a national claim. William Quandt''s
    history of American peace diplomacy traces how Washington, the indispensable broker, built four decades of process on a text that treated the war''s largest displaced population as a humanitarian footnote
    rather than a party. The war also locked the Middle East into the Cold War: the Soviet Union armed and rearmed Egypt and Syria, the United States became Israel''s guarantor, and the local conflict became
    a superpower proxy that outlived the superpowers'' own contest. Every summit since, from Camp David to Oslo to Annapolis, has been an attempt to cash the check that 242 wrote in 1967 and never fully
    honored.

    '
  key_arguments:
  - Resolution 242's ambiguity over 'territories' versus 'the territories' was deliberate and remains unresolved
  - The 'land for peace' formula worked for Egypt and Sinai in 1979 but nowhere else
  - 242 named the Palestinians only as a 'refugee problem,' not as a national party
  - The war turned the Arab-Israeli conflict into a US-Soviet Cold War proxy
