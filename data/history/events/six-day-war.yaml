- viewpoint: Revisionist Historiography / War of Choice
  viewpoint_type: revisionist
  region_origin: global
  narrative: 'Decades of declassified records, Israeli, American, and Soviet, have let historians reconstruct what decision-makers actually knew in May 1967, and the picture is at odds with the memory
    of unavoidable survival. Tom Segev''s 1967 and Avi Shlaim''s The Iron Wall draw on Israeli cabinet minutes to show a leadership that feared not annihilation so much as the erosion of deterrence, and
    an army whose generals pressed a hesitant Levi Eshkol to seize the initiative while the odds were overwhelming.


    The intelligence is the crux. Both Israeli military intelligence and the American CIA assessed in late May that Nasser was not planning to attack, and that if war came Israel would win it in a matter
    of days, most estimates said under two weeks. President Johnson was told as much. Mossad chief Meir Amit flew to Washington and returned confident of an American "yellow light." The Egyptian deployment,
    in this analysis, was a defensive and political posture that Israel''s commanders understood as such even as the Israeli public lived in genuine dread. The gap between the terror on the street and the
    confidence in the war room is the heart of the revisionist case.


    The most cited piece of evidence is Israeli. In August 1982, defending the invasion of Lebanon, Prime Minister Menachem Begin told the National Defense College that the Sinai concentrations "did not
    prove that Nasser was really about to attack us" and that "we decided to attack him." Guy Laron''s The Six-Day War argues that militaries on both sides, Egyptian and Israeli, dragged reluctant civilian
    leaders toward a collision each general believed his side would win. Roland Popp, writing in the Middle East Journal, describes the crisis as a spiral of deterrence signals misread on every side.


    None of this makes 1967 a simple story of aggression. Revisionists acknowledge the closure of the Straits, the eliminationist broadcasts, and the real fear of a society built by survivors. Their claim
    is narrower and harder: that the war was a choice made by a state confident of victory to reshape the strategic map, not a last resort forced on a country facing extinction, and that the difference
    matters because it is the difference between a defensive war and a preventive one whose gains, the occupied territories, were kept.

    '
  key_arguments:
  - Israeli and US intelligence judged that Nasser was not about to attack and that Israel would win quickly
  - Israeli cabinet records show a fear of lost deterrence rather than of annihilation
  - Begin's 1982 speech and declassified minutes frame June 1967 as a preventive war of choice
  - Militaries on both sides pushed reluctant civilian leaders toward a war each expected to win
