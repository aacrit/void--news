perspectives:
- viewpoint: Israeli / Existential Pre-emption
  viewpoint_type: victor
  region_origin: middle-east
  narrative: 'The Israeli account begins with a siege. Through May 1967 the noose visibly tightened. Egypt poured 100,000 troops and roughly 900 tanks into Sinai. Nasser demanded and got the removal of
    the UN Emergency Force that had kept the border quiet for a decade. On May 22 he closed the Straits of Tiran, cutting Israel''s southern shipping route and its main oil supply. Israel had stated in 1957,
    in a commitment registered with the United States, that closure of the Straits would constitute a casus belli. On May 30 King Hussein signed a defense pact with Cairo and handed his army to an Egyptian
    general. Iraqi units moved toward Jordan. Israel, nine miles wide at its narrowest, faced three armies on three fronts.


    The rhetoric left little to interpretation. Cairo''s Voice of the Arabs broadcast that the hour of Israel''s destruction had come. Nasser told Arab trade unionists on May 26 that the basic objective
    was the destruction of Israel. Ahmad Shukeiri, the first chairman of the PLO, spoke of the surviving Jews being helped to return to their countries of origin. For a state founded by Holocaust survivors,
    these were not abstractions. During ha-hamtana, the three-week wait, the government requisitioned hotels for casualties and consecrated parks as cemeteries. The army estimated tens of thousands of Israeli
    dead if it let the enemy strike first.


    So Israel struck first. Operation Focus destroyed the Egyptian, Jordanian, and Syrian air forces on the ground in a single morning, and the ground campaign followed a defeated enemy. In this reading
    the pre-emptive strike was self-defense in the only form available to a small country that could not absorb a first blow. The reunification of Jerusalem, and the arrival of Israeli soldiers at the Western
    Wall on June 7 for the first time since 1948, is remembered as a homecoming rather than a conquest. The captured territory gave Israel strategic depth it had never had: the Sinai buffer against Egypt,
    the Golan escarpment above the Galilee, the Jordan River as a defensible line. Israel offered, through the United States, to return most of the land in exchange for peace. The Arab answer came from Khartoum
    in September: no peace, no recognition, no negotiation.

    '
  key_arguments:
  - Closing the Straits of Tiran was a casus belli Israel had declared in advance in 1957
  - Three Arab armies mobilized on three fronts against a state nine miles wide at its waist
  - Arab leaders publicly proclaimed the destruction of Israel as the war aim
  - Pre-emption was the only defense available to a country that could not survive a first strike
