legacy_points:
- Placed an estimated 1 million Palestinians under a military occupation that in 2026 has lasted 59 years
- Produced UN Resolution 242 and the 'land for peace' formula that has framed every negotiation since
- Displaced roughly 300,000 Palestinians in the Naksa, about 175,000 of them made refugees for the second time
- Broke Nasserist pan-Arabism and opened political space for the rise of political Islam
- Israel seized territory about 3.3 times its own size in 132 hours: Sinai, Gaza, the West Bank, East Jerusalem, and the Golan
