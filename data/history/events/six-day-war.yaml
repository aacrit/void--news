summary: 'At 7:45 a.m. on June 5, 1967, roughly 180 Israeli jets crossed the Mediterranean below Egyptian radar, banked south, and struck eleven airfields at once. Within three hours about 300 of Egypt''s
  420 combat aircraft were burning on the ground. The pilots who were supposed to defend Cairo never left the tarmac. Israel called it Operation Focus. The war was decided before most of the Arab world
  knew it had begun.


  Over the next five days Israel captured the Sinai Peninsula and the Gaza Strip from Egypt, the West Bank and East Jerusalem from Jordan, and the Golan Heights from Syria. The territory under Israeli control
  expanded from about 20,700 square kilometers to roughly 69,000. On the sixth day, an estimated one million Palestinians in the West Bank and Gaza woke up under military occupation. That occupation was
  given no end date. In 2026 it is 59 years old.


  The road to June 5 ran through three weeks of escalation. On May 14, Nasser moved Egyptian divisions into Sinai. On May 16 he demanded the withdrawal of the UN Emergency Force that had patrolled the
  frontier since 1957; Secretary-General U Thant complied within days. On May 22 Nasser closed the Straits of Tiran to Israeli shipping, choking the sea lane through which most of Israel''s oil passed. Israel
  had declared in 1957 that closing the Straits would be treated as an act of war. On May 30, King Hussein of Jordan flew to Cairo and placed his army under Egyptian command.


  Inside Israel the three weeks were called ha-hamtana, the waiting. Reservists sat in the Negev. Rabbis consecrated parks in Tel Aviv as emergency cemeteries and hotels cleared basements for casualties.
  A generation that had buried Europe''s Jews two decades earlier prepared for another ending. The cabinet debated for days, then chose to strike first.


  The killing ran one direction. Between 15,000 and 20,000 Arab soldiers died, many of them Egyptian conscripts who walked into the Sinai desert without water after their officers fled. Israel lost between
  776 and 983. Israeli paratroopers reached the Western Wall on June 7; the photograph of three soldiers looking up at the stone became the war''s icon.


  Whether Israel struck to survive or struck because it could is the question the war left open. In August 1982, Prime Minister Menachem Begin told Israel''s National Defense College: "In June 1967 we again
  had a choice. The Egyptian army concentrations in the Sinai approaches did not prove that Nasser was really about to attack us. We must be honest with ourselves. We decided to attack him."

  '
significance: 'The war produced UN Security Council Resolution 242, adopted unanimously on November 22, 1967, which paired the "withdrawal of Israeli armed forces from territories occupied in the recent
  conflict" with the right of every state in the region to "live in peace within secure and recognized boundaries." The land-for-peace formula framed every negotiation that followed: the 1978 Camp David
  Accords, the 1993 Oslo process, the 2000 Camp David summit, Annapolis in 2007. None resolved the territories the resolution named. Egypt recovered Sinai in 1982 under its 1979 peace treaty. Israel extended
  its law to East Jerusalem in 1967 and annexed the Golan Heights in 1981; no state recognizes either annexation. The West Bank and Gaza stayed under occupation, and the settlement enterprise that began
  at Kfar Etzion in September 1967 grew past 700,000 settlers by the 2020s. The roughly 300,000 Palestinians displaced in 1967 joined the 700,000 of 1948 in a refugee population that by 2026 exceeds 5.9
  million registered with UNRWA. The war also broke Nasserism: secular pan-Arab nationalism never recovered from six days, and the vacuum it left was filled over the following decade by political Islam.

  '
