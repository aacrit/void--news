  - title: Los mitos de la guerra civil
    author: Pio Moa
    year: '2003'
    type: book
  notable_quotes:
  - text: The transition to democracy was built on a collective and voluntary decision to forget.
    speaker: Paloma Aguilar
    context: The central argument of Memory and Amnesia, 2002
  - text: Today Spain closes a dark chapter of its history; this is a great victory for Spanish democracy.
    speaker: Pedro Sanchez
    context: On the exhumation of Franco from the Valley of the Fallen, October 24, 2019
  emphasized:
  - The politics of silence and the 1977 amnesty
  - The scale of the disappeared and the citizen-led exhumation movement
  - The ongoing historiographical and legal battles over blame
  - Memory as the war's unfinished front
  omitted:
  - The lived immediacy of the killing years themselves
  - The view of those who still defend the pact of forgetting as the price of peace
  - The Republican-zone atrocities, when the focus rests on Francoist repression
  - The individual perpetrators, dissolved into structural analysis
