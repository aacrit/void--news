  title: Farewell to the International Brigades, October 1938
  description: Republican Prime Minister Juan Negrin at the October 28, 1938 farewell parade for the International Brigades in Barcelona. Some 35,000 foreign volunteers fought for the Republic; the brigades were withdrawn in a failed bid to force German and Italian withdrawal.
