legacy_points:
- Roughly 500,000 dead and a dictatorship that lasted 36 years, until Franco's death in November 1975
- Guernica, April 26, 1937, made the deliberate bombing of a civilian town a global symbol and a template for Rotterdam, Coventry, and Dresden
- The German Condor Legion and Italian troops turned Spain into a testing ground for the tactics and aircraft Germany used to invade Poland five months later
- The 1977 Pact of Forgetting shielded the regime; an estimated 114,000 remain in unmarked mass graves, the world's second-largest count of enforced disappearances
- Homage to Catalonia and Guernica made the war a permanent parable of ideological truth and the manufacture of narrative
