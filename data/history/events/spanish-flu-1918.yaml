perspectives:
- viewpoint: Wartime Governments and Censorship
  viewpoint_type: victor
  region_origin: europe
  narrative: 'In the autumn of 1918 the governments of France, Britain, Germany, and the United States were fighting the final campaigns
    of the First World War, and they treated the influenza as a military secret. Reporting the scale of the dying was judged a threat
    to morale and war production, so censors in the belligerent countries suppressed it. Spain, neutral, had no such censorship. Spanish
    newspapers wrote openly about the epidemic, and when King Alfonso XIII fell gravely ill in May 1918 the story ran across Europe.
    The disease acquired a nationality it never had. Every belligerent capital called it the Spanish flu; Spaniards, resenting the label,
    called it the Naples Soldier or the French flu.


    The censorship was not passive. In the United States the Sedition Act of 1918 made it a crime to obstruct the war effort, and officials
    repeatedly assured citizens the flu was nothing unusual. Philadelphia''s public health director, Wilmer Krusen, allowed a Liberty
    Loan war-bond parade to proceed on September 28, 1918, over the warnings of physicians. More than 200,000 people lined the route.
    Within 72 hours every bed in the city''s 31 hospitals was full. In the week ending October 5, some 2,600 Philadelphians were dead;
    the following week more than 4,500. The parade had been staged to sell the war, and it seeded one of the deadliest urban outbreaks
    in the country.


    The war also built the virus''s highways. Crowded troop trains, barracks, and transports carried millions of young men between continents
    at the precise moment the second wave turned lethal. Camp Funston in Kansas recorded a major outbreak in March 1918; American troopships
    carried the infection to the Western Front; the autumn wave rode the same networks back out to the world. Commanders kept shipping
    soldiers to Europe even as men died in the holds, judging the war effort more important than the risk. The pandemic and the war
    were not two separate events. One was the transmission system of the other.


    In this account the flu was governed as an information problem before it was governed as a medical one. The states that could have
    warned their populations chose silence to protect the war. The name history remembers, Spanish flu, is the fossil of that choice:
    it records not where the disease came from but which government was willing to admit it existed.

    '
  key_arguments:
  - Belligerent governments censored flu reporting to protect wartime morale and production
  - Neutral Spain's uncensored press produced the misnomer 'Spanish flu'; the disease did not originate there
  - The Philadelphia Liberty Loan parade of September 28, 1918 traded public health for war-bond sales and seeded a mass outbreak
  - Troop mobilization and transport turned the World War into the pandemic's transmission network
