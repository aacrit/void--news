- viewpoint: Colonial and Global South Populations
  viewpoint_type: vanquished
  region_origin: south-asia
  narrative: 'India buried more of its people in the autumn of 1918 than any other country on earth, between 12 and 18 million dead,
    most of them in the months from September to December. The disease arrived at Bombay on returning troopships in the summer and moved
    inland along the colonial railways. The monsoon had failed, food prices had risen, and a population weakened by wartime grain requisitioning
    met the virus at its most lethal. The Sanitary Commissioner''s own report described streets littered with the dead and burning ghats
    swamped with corpses that could not be cremated fast enough. The poet Suryakant Tripathi ''Nirala'' lost his wife and much of his
    family within weeks and wrote of the Ganges swollen with bodies.


    The colonial administration offered almost nothing. Medical services were concentrated in the cantonments and the European districts;
    rural India, where the vast majority died, had, in the Commissioner''s words, an absolute lack of any public health organization.
    British officials in the hill stations recorded the epidemic as a statistical event of little consequence to them, while Indians
    experienced universal devastation. Mridula Ramanna and David Arnold have documented how the gap between the two experiences, government
    indifference set against mass death, became one more grievance in the case against colonial rule. Gandhi himself fell ill during
    the epidemic. The Non-Cooperation movement that mobilized millions began the following year.


    Africa was struck along the same colonial arteries. The virus entered West African ports such as Freetown, Cape Coast, and Lagos
    on wartime shipping and spread inland through Sierra Leone, Ghana, Nigeria, and the Gambia; it reached Southern Africa by late September.
    In South Africa the weeks that followed were remembered as Black October: an estimated 300,000 people died, about 6 percent of the
    population, with the heaviest mortality among Black and Coloured residents crowded into segregated townships and mine compounds.
    Across sub-Saharan Africa the pandemic killed close to 2 percent of the population in six months. Howard Phillips has shown how
    the epidemic exposed and deepened the racial inequalities of colonial medicine, and how its trauma fed early African independent-church
    and welfare movements.


    The Global South perspective insists that the pandemic''s true center of gravity was never in Europe or North America. The overwhelming
    majority of the 50 to 100 million dead lived in Asia and Africa, where colonial governments had built extraction economies and railways
    but almost no public health. The virus was global, but the dying was concentrated among the colonized, the poor, and the malnourished.
    The people who lost the most are the people the standard Western memory of the pandemic forgets first.

    '
  key_arguments:
  - India suffered the highest national death toll, 12-18 million, concentrated in a rural population the colonial state left unprotected
  - British administrative indifference to the mass death fed directly into anti-colonial mobilization and the Non-Cooperation movement
  - Africa was struck along colonial shipping and rail routes; South Africa's 'Black October' killed about 300,000, hitting Black residents
    hardest
  - The majority of the 50-100 million dead were in Asia and Africa, where colonial economies had built railways but almost no public
    health
