  connection_type: parallel
  description: The two deadliest pandemics of their eras, both misnamed and misplaced by the people who feared them. Yersinia pestis
    rode the Mongol and Genoese trade routes; the 1918 virus rode the troop trains of a world war. Each killed a large fraction of humanity
    and reorganized the societies that survived.
