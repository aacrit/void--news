affected_population: About one third of the global population, roughly 500 million people, infected across 1918-1919
duration: 'Three waves: spring 1918, autumn 1918 (deadliest), and winter 1918-1919'
hero_image_url: null
hero_image_attribution: null
summary: 'In the first week of March 1918, a mess cook reported to the camp infirmary at Camp Funston, Kansas, with a fever. By noon
  the surgeon had more than a hundred men on cots. Within three weeks, 1,100 soldiers at the camp were too sick to stand. It looked
  like ordinary influenza. Most of the men recovered. Then they shipped out to France.


  The first wave, in the spring of 1918, was mild enough that most governments ignored it. The second wave was not. Somewhere in the
  late summer the virus changed, and when it returned in the autumn it killed with a speed physicians had never seen. Victims turned
  blue as their lungs filled with fluid; some died within a day of the first cough, drowning in their own tissue. The autumn of 1918
  killed more people in thirteen weeks than any comparable span in recorded history.


  It was called the Spanish flu, but it did not begin in Spain. The belligerent governments of the First World War censored reports
  of the epidemic to protect morale and war production. Spain, neutral, did not. When Spanish newspapers wrote openly about the dying,
  and when King Alfonso XIII fell gravely ill in May 1918, the rest of Europe pinned the disease on Spain. The name records only which
  country was willing to admit the truth.


  The war built the roads the virus traveled. Troopships and railways moved millions of young men between continents at the exact moment
  the disease turned lethal, and the flu followed them to every inhabited continent within months. It reached the Arctic and the South
  Pacific. In Western Samoa it killed roughly a fifth of the population in two months; across the strait, quarantined American Samoa
  recorded not a single influenza death.


  By the time the third wave faded in the spring of 1919, the virus had infected about a third of the people then alive, some 500 million,
  and killed somewhere between 50 and 100 million. The best-known contemporary figure, 21 million, has been revised upward by every
  study since. Unlike almost every other respiratory disease, it killed the young and the healthy in the greatest numbers: the mortality
  curve for 1918 has a peak among adults aged 20 to 40 that no ordinary flu has ever shown. India buried the most, between 12 and 18
  million dead, the highest toll of any country. Then, for most of a century, the world largely forgot it had happened.

  '
significance: 'The 1918 pandemic killed more people than the First World War it accompanied, and by most estimates more than either
  world war, yet it left almost no monuments and little literature. It reset demography across the colonized world. India lost 12 to
  18 million people; sub-Saharan Africa lost roughly 2 percent of its population in six months; Western Samoa lost about a fifth of
  its people. Those losses, met by colonial administrations that offered little relief, hardened into anti-colonial politics, from the
  Non-Cooperation movement in India to the Mau movement in Samoa. The contrast between St. Louis, which closed schools and gatherings
  within two days, and Philadelphia, which held a war-bond parade instead, became the founding evidence base for the closures and distancing
  orders imposed worldwide in 2020. In 2005 a team led by Jeffery Taubenberger reconstructed the virus from lung tissue frozen in the
  Alaskan permafrost since 1918, identified it as an avian-descended H1N1, and gave modern science its clearest warning of what a novel
  influenza can do. The 21 million figure that circulated for decades is now regarded as less than half the likely total, and every
  serious revision has moved the number up.

  '
