  connection_type: influenced
  description: Between 12 and 18 million Indians died within a few months in 1918 while the colonial administration offered almost no
    relief. The perception of British indifference fed directly into the mass mobilization of Gandhi's Non-Cooperation movement, launched
    in 1920.
- target_slug: scramble-for-africa
  connection_type: influenced
  description: The railways, ports, and labor compounds built during the colonial partition of Africa carried the virus inland from
