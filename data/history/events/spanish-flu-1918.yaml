- viewpoint: Pacific and Indigenous Peoples
  viewpoint_type: vanquished
  region_origin: oceania
  narrative: 'The Samoan archipelago in 1918 was split between two colonial administrations, and the influenza revealed the difference
    between them with brutal clarity. Western Samoa, a former German colony governed by New Zealand since 1914, received the steamer
    SS Talune from Auckland on November 7, 1918. The ship carried infected passengers; New Zealand authorities in Auckland had not warned
    the port, and the Samoan administrator allowed it to dock without quarantine. Within weeks, roughly a fifth of the population of
    Western Samoa was dead, an estimated 8,500 people, most of them adults between 18 and 50, the generation that held families and
    villages together. It remains the highest documented death rate of any territory in the pandemic.


    Fifty miles across the strait, American Samoa recorded not a single influenza death. Its US Navy governor, John Martin Poyer, imposed
    a strict maritime quarantine, cut off contact, and held it in place. When Poyer offered by wireless to help Western Samoa, the New
    Zealand administrator, Robert Logan, refused and broke off communication. The two Samoas became the pandemic''s clearest natural
    experiment: identical people, identical islands, opposite outcomes decided entirely by the choices of colonial officials. Logan
    was later recalled and censured.


    The catastrophe was not confined to Samoa. Across the Pacific and among Indigenous peoples worldwide, the flu killed at rates far
    above the global average, because isolation had left populations with little acquired immunity and because colonial health services
    were thin or absent. Fiji, Tonga, Tahiti, and the Cook Islands suffered heavily. In New Zealand, Maori died at roughly seven to
    eight times the rate of Pakeha settlers. Across the Americas and the Arctic, entire Indigenous villages were wiped out; at Brevig
    Mission in Alaska, 72 of about 80 residents died within a week, and it was their frozen remains that would later yield the reconstructed
    virus.


    For Samoans the flu became a permanent political wound. It fed directly into the Mau movement, the non-violent resistance to New
    Zealand rule whose slogan was Samoa mo Samoa, Samoa for Samoans. New Zealand formally apologized to Samoa for the epidemic in 2002,
    eighty-four years later. In this perspective the pandemic is inseparable from empire: the same colonial authority that governed
    these islands also decided, by a single quarantine choice, which of them would live and which would bury a fifth of its people.

    '
  key_arguments:
  - Western Samoa lost about 22 percent of its people after New Zealand let the infected SS Talune dock without quarantine
  - Quarantined American Samoa recorded zero flu deaths; the two Samoas are the pandemic's clearest natural experiment
  - Indigenous and isolated Pacific populations died at rates far above the global average, Maori at seven to eight times the Pakeha
    rate
  - The Samoan deaths fed the Mau independence movement; New Zealand apologized only in 2002
