- viewpoint: Public Health and Medicine
  viewpoint_type: bystander
  region_origin: americas
  narrative: 'For the doctors and public health officers who faced the second wave, the 1918 influenza was unlike any illness in living
    memory. Patients turned cyanotic, their faces darkening to a blue-black shade physicians called heliotrope cyanosis, as their lungs
    filled and they suffocated. Roy Grist, a physician at Camp Devens outside Boston, wrote that healthy men died within hours in a
    struggle for air. Victor Vaughan, sent to the same camp, counted 63 deaths in a single day. There was no vaccine, no antiviral,
    and no antibiotic for the bacterial pneumonias that killed most victims. Medicine in 1918 could describe the catastrophe with precision
    and stop almost none of it.


    What officials could control was human contact, and the American cities of 1918 became an accidental experiment in what would later
    be called non-pharmaceutical intervention. St. Louis reported its first civilian cases on October 5, 1918; its health commissioner,
    Max Starkloff, closed schools, churches, theaters, and public gatherings on October 7, over the objections of businessmen. Philadelphia
    had let its Liberty Loan parade proceed and delayed closures for weeks. The peak weekly death rate in Philadelphia reached roughly
    eight times that of St. Louis, and St. Louis finished with about half Philadelphia''s excess mortality. Nearly a century later,
    epidemiologists reanalyzing the 1918 city data (Hatchett, Mecher, and Lipsitch, 2007) turned this contrast into the founding evidence
    base for the closures deployed against COVID-19.


    The lessons were unevenly learned. Masks, quarantine placards, and gauze-screened streetcars became familiar, but enforcement varied
    and public patience was short. San Francisco passed a mask ordinance, achieved high compliance, then relaxed too early and was struck
    by a later wave; an Anti-Mask League formed in protest. Nurses, not physicians, carried the actual burden of care, and there were
    nowhere near enough of them because so many had been sent to military service. The pandemic exposed how thin the public health infrastructure
    was even in wealthy cities, and how quickly it collapsed where it barely existed at all.


    In this perspective the pandemic is a story about the limits and the leverage of public health. The virus was untreatable, but its
    spread was not ungovernable. The difference between a city that closed early and a city that did not was measured in tens of thousands
    of lives. The evidence sat largely unexamined for eighty years, until a new pandemic sent scientists back to the mortality ledgers
    of 1918 to relearn what Max Starkloff had demonstrated in a single week.

    '
  key_arguments:
  - The 1918 virus was clinically untreatable before antivirals and antibiotics; most deaths came from secondary bacterial pneumonia
  - 'Timing of closures determined outcomes: St. Louis acted in two days and saw roughly half Philadelphia''s death rate'
  - The 1918 city data became the modern evidence base for non-pharmaceutical interventions (Hatchett et al., 2007; Markel et al., 2007)
  - Nursing shortages, worsened by military conscription, left care to overwhelmed volunteers
