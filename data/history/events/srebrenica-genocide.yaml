    context: Bosnia and Herzegovina v. Serbia and Montenegro, Judgment, February 26, 2007
  emphasized:
  - The terminology and structural analysis of ethnic cleansing as deliberate policy
  - The continuity of Srebrenica with the wider campaign and with 20th-century precedents
  - The legal debate over the boundary between ethnic cleansing and genocide
  omitted:
  - The intimate, individual experience of the victims in favor of structural analysis
  - The immediate horror of the July days
  - The post-war politics of memory and denial
