- viewpoint: The UN Safe Area and the Dutch Peacekeepers
  viewpoint_type: bystander
  region_origin: global
  narrative: |
    On April 16, 1993, the UN Security Council passed Resolution 819. It demanded that Srebrenica be treated as a safe area, free from armed attack. It did not send an army. The task fell to a lightly armed Dutch battalion of roughly 600 men, Dutchbat, operating under a mandate written for peacekeeping, not war. The Serbs surrounding the enclave controlled its supply road. By July 1995 Dutchbat was low on fuel, food, and ammunition, and had lost dozens of men taken hostage.

    When Mladic's forces advanced on July 6, the Dutch commander, Thom Karremans, requested NATO close air support. The request moved through a chain of forms and headquarters. When two aircraft finally attacked on July 11, they dropped two bombs; the Serbs then threatened to shell the town and the compound and to kill the Dutch soldiers they held, the Netherlands Minister of Defence asked for the air action to stop, and it was halted. That afternoon Mladic walked into the town. A photograph shows Karremans accepting a glass from Mladic and forcing a smile.

    By the evening of July 11, some 20,000 to 25,000 civilians had gathered at Potocari, several thousand of them inside the Dutch compound. The battalion had shelter and food for a fraction of them. Over two days, Dutch soldiers stood aside as Bosnian Serb troops separated the men, and in some cases handed people out through the gate. Then Dutchbat was allowed to leave.

    In 1999 the UN Secretary-General issued a report titled The Fall of Srebrenica. It called the enclave's abandonment a failure of the entire international system, from the Security Council to the field. In 2002 the Netherlands Institute for War Documentation published a study of some 3,000 pages; days later, the Dutch government resigned. Dutch courts eventually found the state partly liable for a number of the deaths, a share fixed by the Supreme Court in 2019. The lesson the UN report drew was blunt: a deliberate campaign of mass murder must be met with force, not flags.
  key_arguments:
  - Resolution 819 declared a safe area but sent no force capable of defending it
  - Dutchbat faced an army under a peacekeeping mandate, low on supplies and holding hostages taken by the Serbs
  - Requested NATO air support arrived late, briefly, and was withdrawn under threat to hostages
  - The Security Council, the UN command, and the field all failed; the Dutch government resigned in 2002
  sources:
