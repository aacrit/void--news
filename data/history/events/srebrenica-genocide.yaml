summary: |
  On July 11, 1995, General Ratko Mladic walked into the town of Srebrenica, turned to a Serbian television camera, and said the time had come to take revenge on the Turks. Srebrenica was a United Nations safe area. The peacekeepers who held it were lightly armed and at any one time numbered no more than 600; from January 1995 they were a battalion from the Netherlands. They never fired directly on the advancing Serb forces.

  Over the next five days, Bosnian Serb forces separated the men and boys from the women at the battery factory in Potocari. The women, children, and elderly, between 25,000 and 30,000 people, were loaded onto buses and expelled. The men were held in fields, schools, and warehouses, then shot in groups and buried by bulldozer. The tribunal's judgment lists nine mass execution sites: eight dated from July 13 to 16 (the Jadar River, the Cerska valley, the Kravica warehouse, Tisca, Grbavci and Orahovac, Petkovci, Pilica and the Branjevo Military Farm, and the Pilica Cultural Dom), and a ninth, Kozluk, undated in its heading. At Branjevo a firing squad that included Drazen Erdemovic shot men in groups of ten from ten in the morning until about three in the afternoon; he believes he personally killed about 70. The Krstic Trial Chamber put the total executed likely within 7,000 to 8,000 men; the UN General Assembly's 2024 resolution recites at least 8,372 lives lost.

  A column of men that may have numbered up to 15,000, perhaps a third of them armed, had already left Susnjari on foot shortly after midnight on July 12, trying to reach Bosnian government lines at Nezuk, more than 60 kilometers away. The column was shelled, split, and ambushed for days. Fewer than half reached safety. Survivors called it the death march.

  The killing at Srebrenica was the culmination of a war that had begun in April 1992, when Bosnia and Herzegovina declared independence and Bosnian Serb forces, armed by the Yugoslav army under Slobodan Milosevic, moved to carve out an ethnically pure Serb republic. In the Prijedor region, non-Serbs were herded into the camps at Omarska, Keraterm, and Trnopolje. In Visegrad, families were burned alive in houses on the Drina. In Sarajevo, a siege of 1,425 days, the longest in modern European history, killed 11,541 people, 1,601 of them children, under daily shelling and sniper fire.

  The perpetrators buried the Srebrenica dead, then dug them up. To hide the crime, over several weeks in September and early October 1995, Bosnian Serb units used excavators to move bodies from primary graves into scattered secondary graves, such as those on the Cancari road, breaking single corpses across multiple sites. The International Commission on Missing Persons has since reassembled more than 6,900 victims from bone fragments matched by DNA. The graves are still being found.
significance: |
  The 1948 Genocide Convention was written after the Holocaust under the banner never again. In July 1995, inside a United Nations safe area in Europe, thousands of captured men were executed: 7,000 to 8,000 by the tribunal's finding of 2001, at least 8,372 in the General Assembly's recital of 2024. The International Criminal Tribunal for the former Yugoslavia, created in 1993, convicted General Radislav Krstic of genocide in 2001, the first genocide conviction on European soil and the first by the tribunal; in 2004 its Appeals Chamber substituted a conviction for aiding and abetting genocide and a sentence of 35 years. Ratko Mladic and Radovan Karadzic were both sentenced to life. In 2007 the International Court of Justice ruled that genocide had been committed at Srebrenica and that Serbia had violated the Convention by failing to prevent it. The phrase ethnic cleansing entered international law. The collapse of the UN safe areas reshaped peacekeeping doctrine and fed directly into the 2005 Responsibility to Protect framework. The Dutch government resigned in 2002 over its battalion's role. The president of Republika Srpska denies the genocide occurred; a 2024 UN General Assembly vote established July 11 as a day of commemoration over the objections of Serbia.
