connections:
- target_slug: rwandan-genocide
  connection_type: parallel
  description: In 1994 UN peacekeepers watched 800,000 die in Rwanda; in 1995 a UN battalion held Srebrenica as 8,000 were marched away. Both failures produced international tribunals, the ICTR and the ICTY, that first defined genocide and mass rape in modern law
- target_slug: the-holocaust
  connection_type: influenced
  description: The 1948 Genocide Convention was written after the Holocaust under the phrase never again. Srebrenica, called Europe's worst mass killing since 1945, was the first case in which a European court applied that Convention and returned a genocide conviction
- target_slug: armenian-genocide
  connection_type: parallel
  description: 'A century after 1915, both crimes share a second act: state-sponsored denial. Serbia and Republika Srpska deny Srebrenica as Turkey denies the Armenian genocide, treating the naming of the dead as an attack on the nation'
- target_slug: fall-of-berlin-wall
  connection_type: influenced
  description: The 1989 collapse of communist Europe dissolved Yugoslavia along with the Eastern Bloc. As the federation broke apart, suppressed nationalisms hardened into the borders that Serb forces tried to purify by force between 1992 and 1995
- target_slug: soviet-union-collapse
  connection_type: influenced
  description: The same collapse of European communism that ended the Soviet Union in 1991 dissolved Yugoslavia. As the federation came apart in the Cold War's wake, the war to build ethnically pure states out of it led to Srebrenica.
