slug: srebrenica-genocide
title: The Srebrenica Genocide and the Bosnian War
subtitle: The United Nations called it a safe area. The buses still came for the men and boys.
date_display: July 11-22, 1995 (Srebrenica genocide); April 1992-December 1995 (Bosnian War)
date_sort: 1995
date_precision: day
era: contemporary
region: europe
country: Bosnia and Herzegovina
category: genocide
severity: catastrophic
death_toll: 7,000 to 8,000 men executed at Srebrenica (ICTY, Krstic Trial Judgement, 2001); at least 8,372 lives lost (UN General Assembly resolution 78/282, 2024); approximately 100,000 in the wider Bosnian War
affected_population: 2.2 million displaced (over half of Bosnia's prewar population); 25,000-30,000 women, children, and elderly expelled from Srebrenica in 72 hours
duration: 11 days at Srebrenica (July 11-22, 1995); the Bosnian War lasted 44 months (April 1992-December 1995), including the 1,425-day siege of Sarajevo
hero_image_url: https://commons.wikimedia.org/wiki/File:Srebrenica_massacre_memorial_gravestones_2009_1.jpg
