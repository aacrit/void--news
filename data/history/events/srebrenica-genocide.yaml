legacy_points:
- The ICTY (Krstic, 2001) and the International Court of Justice (2007) both ruled Srebrenica a genocide; 20 people were tried and Mladic and Karadzic were sentenced to life
- The Netherlands Institute for War Documentation report forced the resignation of the entire Dutch government on April 16, 2002
- The failure of the UN safe areas reshaped peacekeeping doctrine and fed the 2005 Responsibility to Protect framework
- The International Commission on Missing Persons has identified more than 6,900 victims by DNA from over 90 grave sites; reburials continue each July 11 at Potocari
- A 2024 UN General Assembly vote designated July 11 the International Day of Reflection and Commemoration of the Srebrenica Genocide, over the objections of Serbia and Republika Srpska
