perspectives:
- viewpoint: Bosniak Survivors and the Legal Record
  viewpoint_type: vanquished
  region_origin: europe
  narrative: |
    Hasan Nuhanovic worked as an interpreter for the Dutch battalion. On July 13, 1995, Dutch soldiers ordered his mother, father, and younger brother off the UN compound at Potocari, into the hands of the Bosnian Serb forces waiting at the gate. He was allowed to stay because he held a UN badge. His family did not. He never saw them alive again. He spent the next two decades in courtrooms, and in 2013 the Supreme Court of the Netherlands ruled that the Dutch state was liable for their deaths.

    The killing followed a pattern the courts would later document in forensic detail. At the battery factory in Potocari, Bosnian Serb soldiers separated men and boys from their families; boys were judged by height, not by age. At the Kravica warehouse on July 13, between 1,000 and 1,500 men captured from the column were packed inside, and at around six in the evening the soldiers began throwing grenades and shooting into them; guards killed the prisoners who tried to escape through the windows. At Orahovac, Petkovci, Branjevo Farm, and the Pilica cultural center, prisoners were bused to fields, lined up, and shot. The dead were pushed into pits by excavator.

    A column that may have numbered up to 15,000 men chose the forest instead. They formed a column and set out for Bosnian government lines near Nezuk, more than 60 kilometers through Serb-held territory. The column was shelled, split, and ambushed for days. Some surrendered to men wearing stolen UN uniforms and were executed. Others died of thirst and gunfire on what survivors named the death march. Fewer than half reached safety.

    The legal record is unambiguous. In 2001 the International Criminal Tribunal for the former Yugoslavia convicted General Radislav Krstic of genocide, the first genocide conviction on European soil. In 2017 it convicted Ratko Mladic; in 2019 the Appeals Chamber of its successor, the International Residual Mechanism for Criminal Tribunals, gave judgment on Radovan Karadzic's appeal. In 2007 the International Court of Justice ruled that the killings were genocide. Twenty men were tried for Srebrenica. The victims are not a claim. They are a court finding, a DNA database, and a field of white headstones at Potocari.
  key_arguments:
  - The genocide is an established legal fact confirmed by the ICTY (Krstic, 2001), the ICJ (2007), and 20 prosecutions
  - More than 8,000 men and boys were separated, executed in groups, and buried by machine over five days
  - "The killing was organized execution, not combat: forensic teams recovered bound wrists, blindfolds, and mass graves"
  - The forest column toward Nezuk was hunted for days; fewer than half survived the death march
