affected_population: Suez Canal blocked by scuttled ships and closed for five months; Port Said (population about 230,000) shelled and occupied
duration: Military phase October 29 to November 7, 1956; Anglo-French withdrawal completed December 22, 1956; Israeli withdrawal March 1957
