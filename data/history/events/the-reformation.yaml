legacy_points:
- Print turned a Latin academic dispute into a mass movement in weeks; one in three German books sold between 1518 and 1525 was written by Luther
- Vernacular Bibles broke the clergy's monopoly on scripture, standardized German and English, and drove mass literacy
- The Peace of Augsburg (1555) and Peace of Westphalia (1648) made the ruler, not the Church, the arbiter of a territory's religion, a foundation of state sovereignty
- Split Western Christianity permanently into Catholic and Protestant worlds; today more than 900 million Protestants across tens of thousands of denominations
- The Thirty Years' War (1618-1648) killed an estimated 4 to 8 million people, up to a third of the population in parts of the Holy Roman Empire
