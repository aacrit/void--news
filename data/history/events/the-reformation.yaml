  description: Gutenberg's press printed Bibles and indulgences for seventy years without threatening the Church. Then Luther aimed it at the Church itself, and one in three German books sold from 1518 to 1525 carried his name
- target_slug: fall-of-constantinople
  connection_type: influenced
  description: When Constantinople fell in 1453, Greek scholars fled west with manuscripts that fueled humanist scholarship. Erasmus's 1516 Greek New Testament, built on that learning, gave Luther the source text he used to challenge the Latin Vulgate
- target_slug: french-revolution
  connection_type: influenced
  description: The Reformation proved a printed idea could not be recalled once set in type. Two and a half centuries later, French pamphlets and newspapers broke a monarchy's grip on public opinion using the same machine
