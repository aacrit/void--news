- viewpoint: The Public and the Loss of Trust
  viewpoint_type: bystander
  region_origin: americas
  narrative: 'For the citizens watching, Watergate is measured less in court rulings than in a number that fell and stayed down. When the American National Election Studies first asked in the late 1950s
    and 1960s, roughly three in four Americans said they trusted the federal government to do what is right most of the time. By 1974 it was near one in three. It has rarely climbed back. Rick Perlstein''s
    Nixonland (2008) and Garrett Graff''s Watergate: A New History (2022) treat this collapse as the scandal''s largest and most durable effect.


    The televised Ervin hearings in the summer of 1973 were a national civics lesson in reverse. Millions watched a White House counsel, John Dean, describe a "cancer growing on the presidency," and heard,
    day after day, that officials at the top had lied, wiretapped, kept enemies lists, and paid hush money. The Pentagon Papers had already shown citizens that four administrations had misrepresented a
    war in which 58,000 Americans died. Together the two scandals confirmed a suspicion that hardened into a worldview: that government routinely deceives, and that official reassurance is worth little.


    The consequences cut in several directions. A generation of "Watergate babies" entered Congress in 1974 promising reform. Investigative journalism gained prestige and audience. But cynicism gained more.
    Distrust of institutions became a permanent feature of American politics, available to reformers and demagogues alike. The "-gate" suffix trivialized the memory even as it spread, so that a genuine
    constitutional crisis and a minor sports controversy could share a grammar.


    In this account the ordinary citizen is neither hero nor villain but the party left holding the loss. The system, people were told, had worked: the courts ruled, Congress acted, the president left.
    Yet the felt experience was of having been lied to for years by the highest offices in the land, and of learning it only because a night watchman noticed tape on a door. The institutions survived. The
    trust did not.

    '
  key_arguments:
  - Public trust in government fell from about 77% (1964) to 36% (1974) and never fully recovered
  - The televised hearings and the Pentagon Papers together confirmed that officials routinely deceive
  - The scandal seeded a durable, bipartisan cynicism toward institutions
  - 'The "-gate" suffix spread the memory while trivializing it'
