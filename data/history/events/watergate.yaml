summary: 'On June 13, 1971, The New York Times published the first installment of a 7,000-page classified Defense Department study of American decision-making in Vietnam. Robert McNamara had commissioned the
  study in 1967; it documented that four administrations had misled the public about the war. Daniel Ellsberg, a former Pentagon and RAND analyst who had helped write it, photocopied the volumes over months
  and passed them to the Times. Attorney General John Mitchell obtained a federal restraining order after three installments, the first prior restraint on a newspaper in American history. The Washington
  Post picked up the story and was enjoined too. On June 30, 1971, the Supreme Court ruled 6 to 3 in New York Times Co. v. United States that the government had not met the heavy burden required to censor
  publication. The presses ran that night.


  Three days after the ruling, a White House unit called the "Plumbers," formed to stop leaks, broke into the office of Ellsberg''s psychiatrist looking for material to discredit him. Their next operations
  led to the Watergate complex. At 2:30 a.m. on June 17, 1972, a security guard named Frank Wills found tape over a door latch and called police. Five men in suits and surgical gloves were arrested inside
  the Democratic National Committee headquarters, carrying bugging equipment and sequential hundred-dollar bills. One was James McCord, security coordinator for the Committee to Re-elect the President.


  A White House spokesman called it "a third-rate burglary." Nixon won 49 states that November. But two Washington Post reporters, Bob Woodward and Carl Bernstein, kept pulling the thread, guided in part
  by a source they called "Deep Throat," later revealed in 2005 to be FBI Associate Director W. Mark Felt. A Senate committee under Sam Ervin held televised hearings in 1973. On July 16, 1973, aide Alexander
  Butterfield disclosed that Nixon had taped his own conversations. The tapes became the battle.


  On October 20, 1973, Nixon ordered the firing of special prosecutor Archibald Cox, who had subpoenaed the tapes. Attorney General Elliot Richardson and his deputy William Ruckelshaus resigned rather than
  comply; Solicitor General Robert Bork carried out the order. The "Saturday Night Massacre" produced a flood of telegrams to Congress. On November 17, 1973, Nixon told a room of newspaper editors, "I am
  not a crook."


  On July 24, 1974, the Supreme Court ruled 8 to 0 in United States v. Nixon that executive privilege did not shield the tapes from a criminal subpoena. Between July 27 and 30, the House Judiciary Committee
  approved three articles of impeachment. On August 5, Nixon released the "smoking gun" tape of June 23, 1972, on which he ordered the FBI investigation obstructed six days after the break-in. His remaining
  support collapsed. On August 8, 1974, he announced his resignation on television, effective at noon the next day.

  '
significance: 'Watergate rewired the American constitutional order. United States v. Nixon (1974) established that not even a president stands above a criminal subpoena, a precedent cited in every executive-privilege
  fight since. New York Times Co. v. United States (1971) set a near-absolute bar against prior restraint that still governs press-versus-state conflicts. Roughly 48 officials were convicted, including two
  attorneys general and the White House chief of staff. Congress responded with the War Powers Resolution (1973), the Ethics in Government Act (1978) and its independent-counsel mechanism, the Federal Election
  Campaign Act amendments (1974), and the Foreign Intelligence Surveillance Act (1978). The Church Committee (1975-1976), spun out of the same crisis, exposed CIA assassination plots, FBI COINTELPRO surveillance
  of Martin Luther King Jr., and NSA interception of Americans'' cables, and created the permanent intelligence-oversight committees. The scandal also fixed "investigative journalism" as a professional
  ideal and attached the suffix "-gate" to every scandal that followed. Its other legacy is corrosive: American trust in the federal government, near 77% in 1964, fell to 36% by 1974 and never fully recovered.

  '
