- viewpoint: The Executive-Power Defense
  viewpoint_type: vanquished
  region_origin: americas
  narrative: 'Nixon and his defenders told a different story: a wartime president, elected in 1972 by the largest popular margin in history to that point, was brought down by a hostile press, partisan prosecutors,
    and a leak culture that made governing impossible. In this account the Pentagon Papers were stolen government property whose publication, in the middle of a war and secret peace talks, endangered sources
    and negotiations. Prior restraint, the government argued, was justified precisely because some secrets cost lives.


    On Watergate, the defense conceded a break-in it called unauthorized and foolish, but insisted the president neither ordered it nor knew of it in advance. The cover-up, in Nixon''s memoir RN (1978),
    is presented as a containment effort that spun out of control, driven by aides protecting themselves. Nixon''s deeper argument was constitutional. A president, he told David Frost in 1977, may take actions
    in the national interest that would be illegal for a private citizen: "When the president does it, that means that it is not illegal." Executive privilege, in this view, was not a dodge but a separation-of-powers
    necessity: confidential advice, like a judge''s deliberations, must stay confidential or the office cannot function.


    Nixon''s allies pointed to a double standard. Earlier presidents had wiretapped, taped, and covered up; Kennedy and Johnson had done worse in Vietnam and civil-rights surveillance and paid no price.
    The press that celebrated Ellsberg had ignored the leaks it disliked. H.R. Haldeman, in The Ends of Power (1978), argued that a Washington establishment that never accepted Nixon''s 1968 victory used
    a security lapse to reverse two elections.


    The defense does not deny the outcome. Nixon resigned rather than face near-certain impeachment and conviction once the June 23 tape surfaced. But it frames the fall as disproportionate: a burglary that
    killed no one, prosecuted by a special counsel structure Nixon considered unconstitutional, amplified by newspapers with a stake in the president''s destruction. Ford''s pardon, in this telling, was
    the one act that let the country move on, and it cost Ford the 1976 election.

    '
  key_arguments:
  - Publication of stolen classified files during a war endangered sources and secret negotiations
  - Executive privilege is a separation-of-powers necessity, not a cover for wrongdoing
  - Earlier presidents wiretapped and covered up without consequence, exposing a double standard
  - A security lapse was used by a hostile establishment to reverse two national elections
