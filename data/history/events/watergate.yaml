- viewpoint: The Institutional Rule-of-Law View
  viewpoint_type: academic
  region_origin: americas
  narrative: 'The scholarly account, anchored by Stanley Kutler''s The Wars of Watergate (1990), reads the crisis as a stress test the constitutional system barely passed. Its heroes are not reporters but
    institutions: grand juries, judges, a special prosecutor, two congressional committees, and a unanimous Supreme Court. Judge John Sirica pressed the burglars until McCord broke. The Senate Ervin Committee
    put the cover-up on live television and, through the accident of a question to Alexander Butterfield, learned the tapes existed. The tapes made proof possible.


    The decisive moment was legal. In United States v. Nixon (July 24, 1974) the Court ruled 8 to 0, with three Nixon appointees joining, that a generalized claim of executive privilege must yield to a
    specific criminal subpoena. The president who had appointed a third of the Court complied within days. Three years earlier, in the Pentagon Papers case, the same institution had refused the executive''s
    demand to censor the press. The pattern, in this view, is a judiciary willing to rule against the power that created it.


    Congress then wrote the failure into law. The War Powers Resolution (1973) tried to reclaim the war power the Pentagon Papers showed presidents had monopolized. The Foreign Intelligence Surveillance
    Act (1978) required warrants for national-security wiretaps. The Ethics in Government Act (1978) created an independent-counsel mechanism. The Church Committee (1975-1976), examining 110,000 documents
    and hearing more than 800 witnesses, documented CIA assassination plots, the FBI''s COINTELPRO campaign against Martin Luther King Jr., and NSA interception of Americans'' communications, and built the
    permanent Senate and House intelligence committees to watch the watchers.


    This perspective is sober about limits. Ford''s pardon foreclosed a criminal trial of the president. The independent-counsel statute was later judged a failure and allowed to lapse. FISA''s protections
    were narrowed after 2001. The rule of law, in the academic reading, is not a machine that runs itself; it worked in 1974 because enough officials in enough institutions chose to make it work, and there
    is no guarantee they always will.

    '
  key_arguments:
  - Grand juries, judges, Congress, and a unanimous Court, not the press alone, produced accountability
  - United States v. Nixon established that executive privilege yields to a criminal subpoena
  - Congress codified the lessons in the War Powers Resolution, FISA, and the Ethics in Government Act
  - The Church Committee created permanent intelligence oversight over the CIA, FBI, and NSA
