- viewpoint: The Skeptical Revisionist
  viewpoint_type: revisionist
  region_origin: americas
  narrative: 'A revisionist current, argued most sharply by Edward Jay Epstein in his 1974 essay "Did the Press Uncover Watergate?", holds that the heroic-press legend is largely a myth the press wrote about
    itself. On Epstein''s reading, almost every major Watergate revelation originated with government investigators, the FBI, federal prosecutors, the grand jury, and Judge Sirica, not with Woodward and
    Bernstein. The reporters, in this view, were skilled conduits for leaks from officials pursuing their own agendas, and the film All the President''s Men (1976) retrofitted a detective story onto what
    was really a bureaucratic and legal process.


    The Deep Throat legend draws particular fire. Max Holland''s Leak (2012) argues that W. Mark Felt did not leak out of conscience. Passed over to run the FBI after J. Edgar Hoover''s death, Felt fed
    the Post partly to damage the men who had leapfrogged him and to position himself for the top job. The famous line "follow the money" appears nowhere in the reporting; it was written for the movie. The
    lionized informant was, on this account, an ambitious bureaucrat, and the press that canonized him rarely examined his motives.


    This lens also questions the leak romance around Ellsberg. Publishing a classified history is not costless; the same logic that celebrates a sympathetic leaker is used, decades later, to condemn leakers
    whose causes the press dislikes. And the Watergate template, the revisionists argue, taught journalism bad habits: an appetite for anonymous sources, a scandal-first frame that turns every controversy
    into a "-gate," and a self-image of adversarial heroism that can substitute for the slow, unglamorous verification that actually holds power to account.


    The revisionist is not defending Nixon; the crimes were real and the resignation earned. The argument is narrower and about memory: that a nation flattered its newspapers into a myth, mistook stenography
    of official leaks for investigation, and drew from Watergate a lesson about press heroism that the record only partly supports.

    '
  key_arguments:
  - Most Watergate breaks came from the FBI, prosecutors, and the grand jury, not the reporters
  - Deep Throat's motives were careerist, and the heroic informant image went unexamined
  - The film rewrote a bureaucratic and legal process as a detective story
  - The Watergate template taught journalism to prize anonymous sourcing and scandal framing
