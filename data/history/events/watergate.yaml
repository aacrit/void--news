perspectives:
- viewpoint: The Investigative Press and the Leaker
  viewpoint_type: victor
  region_origin: americas
  narrative: 'In this account the story is about people who chose to publish. Daniel Ellsberg had carried a rifle through the Pentagon''s war rooms and read the classified record of how four presidents had
    deepened a war they privately expected to lose. He photocopied 7,000 pages, offered them first to senators who would not touch them, then to Neil Sheehan of The New York Times. When Attorney General
    John Mitchell demanded the Times stop, the paper''s lawyers advised against defying the government; the editors published anyway. The Washington Post''s Katharine Graham, facing a stock offering and
    a threat to her television licenses, told Ben Bradlee to run it. In New York Times Co. v. United States the Supreme Court sided with them 6 to 3.


    The Watergate half turned on two young metro reporters. Bob Woodward and Carl Bernstein were not the stars of the paper; they worked the phones, the courthouse, and the CREEP payroll. They traced the
    burglars'' money to a campaign slush fund. A source Woodward met in a parking garage, whom the paper called Deep Throat and who was revealed in 2005 to be FBI Associate Director W. Mark Felt, steered
    them past dead ends. In All the President''s Men (1974) the pair described a method more than a scoop: confirm every fact with two sources, follow the money, publish what you can prove.


    The lesson the press drew is institutional. The First Amendment worked as designed. A free press, protected from prior restraint, exposed official lies about a war and a crime, and the other branches
    then acted. Ellsberg framed his leak as an act of citizenship: the public''s right to know outweighed a classification stamp. The reporters framed theirs as verification under pressure. Together the
    Pentagon Papers and Watergate became the founding legend of American investigative journalism, taught in every newsroom as proof that documents and sourcing, not access and stenography, are the job.


    The stakes were personal. Ellsberg faced 115 years under the Espionage Act. Graham risked her company. The reporters risked their careers on stories the rest of Washington dismissed. That they were
    vindicated is, in this telling, not luck but the system functioning: the leak, the paper, the court, the Congress, each doing its part.

    '
  key_arguments:
  - A free press protected from prior restraint exposed official deception about a war and a crime
  - Verification discipline, following the money and confirming with two sources, cracked the cover-up
  - Ellsberg's leak was an act of citizenship, placing the public's right to know above classification
  - Publishers and reporters accepted personal legal and financial risk to publish
