gaps:
  - entry: src-gaa-1950
    what: "The Group Areas Act, No. 41 of 1950, in its own words"
    tried: ["https://disa.ukzn.ac.za/sites/default/files/pdf_files/leg19500707.028.020.041.pdf", "https://sahistory.org.za/sites/default/files/group_areas_act.pdf"]
    status: "DISA's scan of the statute book has no text layer, so nothing can be sliced from it without retyping; SAHO's PDF is a typescript of the Act's last section and schedules bound with unrelated documents, not the operative sections. What the Act did is carried from the TRC Report (src-trc-v1-ch2.para30, src-trc-v1-ch13.p453). The YAML's 3.5 million is NOT a Group Areas Act figure in the Report (src-trc-v1-ch2.para45b)"
  - what: "Biko, 'The most potent weapon in the hands of the oppressor is the mind of the oppressed' (the YAML's excerpt and notable quote, 'Cape Town conference, 1971')"
    tried: ["https://www.saha.org.za/nonracialism/black_man_youre_on_your_own.htm", "https://sahistory.org.za/archive/quotes-steve-biko"]
    status: "The essay that carries it is collected in I Write What I Like (1978), in copyright, and no lawful full copy was found. SAHO's page is a list of quotations without the document, not a source. Unverified; withdrawn by the quote ledger; the brief does not offer it as a read"
  - what: "'Black man, you are on your own' as a SASO founding principle of 1969 (YAML notable quote)"
    tried: ["https://www.saha.org.za/nonracialism/black_man_youre_on_your_own.htm"]
    status: "The SAHA page holds the words only inside a later interviewee's paraphrase ('Black man you are on your own, you must free yourself'), not as Biko's or SASO's; no 1969 document was found"
  - what: "Mandela, Long Walk to Freedom (1994), and the YAML line 'If you want to make peace with your enemy, you have to work with your enemy. Then he becomes your partner'"
    tried: ["https://openlibrary.org/books/OL1097546M"]
    status: "in copyright; no lawful open copy. The live script reads the line in the document voice; it is unverified and must not be read"
  - what: "Verwoerd, 'We did not colonize the Bantu peoples' land. We found a largely empty country' (YAML notable quote, 'Parliamentary debate on the Bantustan policy, 1959')"
    tried: []
    status: "no Hansard of the House of Assembly was sought in this session. Unverified; the live script reads it in the document voice and must not"
  - what: "De Klerk, 'Today we have closed the book on apartheid' (YAML, after the 1992 referendum)"
    tried: []
    status: "no text of his referendum-night statement was found; the referendum's 68.7% is not held either"
  - what: "Thatcher, 'The lady's not for sanctioning' (YAML, which itself calls it a paraphrase)"
    tried: ["https://www.margaretthatcher.org/document/106151"]
    status: "not in the Nassau press-conference transcript; what she did say there is held (src-thatcher-nassau-1985). The live script reads the paraphrase in a document voice; it must not"
  - what: "Tutu, 'Without forgiveness there is no future, but without confession there can be no forgiveness' (YAML, 'Opening address to the TRC, 1996') and 'A person with ubuntu is open and available to others' (No Future Without Forgiveness, 1999)"
    tried: ["https://www.justice.gov.za/trc/report/finalreport/Volume%201.pdf"]
    status: "neither sentence is in Volume One of the Report, which carries his foreword; no text of a 1996 opening address was found; the 1999 book is in copyright. Unverified. His own words on amnesty and restorative justice are held (src-trc-v1-ch1.para22, .para29, .para36)"
  - what: "Tutu, 'Anyone who thinks they are going to help end apartheid by having nice lunches with South African businessmen is deluded' (YAML, 1986)"
    tried: []
    status: "no source document named or found"
  - what: "The YAML's figures with no held source: 17 million pass-law prosecutions 1948-1986; ten homelands on 13% of the land for 75% of the people; 155 US companies divested; Chase Manhattan's $500 million and the rand's 35% in two weeks; $20 billion divested by pension funds; 470 Voortrekkers and 15,000-20,000 Zulu at Blood River; 116,000 interned and 27,927 dead in the camps; 12,000 Broederbond members; 50,000 armed men under Viljoen; the override votes 313-83 and 78-21; Boipatong's 45 dead; 1,500 amnesties granted; 87% of the land in 1994; the 2024 Gini of 0.63 and unemployment figures"
    tried: []
    status: "not held. The TRC Report gives 13% only as the 1936 extension of the reserves (src-trc-v3-ch1, chronology for 1913, not sliced), 'Ten homeland administrations' (src-trc-v2-ch1.para40) and 'some eight million Africans' de-nationalised by 1981 (src-trc-v2-ch5.para33); the NP gives 'more than 20 000' camp dead (src-np-trc-1996.secmemory)"
  - what: "Books the event YAML names as sources: Thompson, A History of South Africa (1990); Woods, Biko (1978); Massie, Loosing the Bonds (1997); Krog, Country of My Skull (1998)"
    tried: ["https://archive.org/metadata/historyofsouthaf00thom", "https://archive.org/metadata/biko0000wood", "https://archive.org/metadata/loosingbondsunit00mass", "https://archive.org/metadata/countryofmyskull00krog"]
    status: "all four Internet Archive items are controlled lending copies (access-restricted-item: true), not openable here"
  - what: "Books the event YAML names with no identifier: Giliomee (2003), Welsh (2009), Callinicos (2004), Kasrils (1993), Hirson (1979), Klotz (1995), Hadland (2003), Biko, I Write What I Like (1978), Tutu (1999)"
    tried: []
    status: "no open copy sought; in copyright"
  - what: "Archival recordings (for example Mandela's speech on his release in 1990, or de Klerk's address of 2 February 1990)"
    tried: []
    status: "none sought in this session; no recording is admitted (recordings: [])"

