# The evidence ledger for apartheid (docs/proposals/HISTORY-THESIS-PAGE.md §3, §4c, §8).
# Begun 2026-10-09 for the first-listener rewrite of the episode. Every entry was fetched on
# 2026-10-09 from the URL it names; every extract under extracts/ was sliced from the fetched
# copy by a builder script (start marker to end marker in the whitespace-collapsed text of
# the fetched page; scratch out/ledger-apartheid/build.py), never retyped. Nothing here was
# written from memory. Where a scan's OCR layer or a PDF text layer is the free copy, the
# extract keeps the layer's glyphs and line-end hyphens and says so in a note.
#
# This is NOT a thesis ledger: no positions, contested claims, exhibits or analyses are
# adjudicated here, and the event renders the Hearing. The bar of §4e is not claimed.
#
# The five perspectives of the event YAML, at parity, each in its own holders' words:
#   ANC / liberation movement   Mandela at Rivonia (1964) and underground (1961); the Freedom
#                               Charter (1955); the ANC's own submission to the TRC (1996)
#   Afrikaner nationalist       the Population Registration Act (1950) in the state's words;
#                               the National Party's submission to the TRC by F W de Klerk (1996)
#   Black Consciousness         the SASO Policy Manifesto and Biko's 'Black Souls in White
#                               Skins?' (1970), as the South African History Archive reprints them
#   International sanctions     Security Council resolutions 134 (1960), 181 (1963), 418 (1977);
#                               the US Comprehensive Anti-Apartheid Act (1986); Thatcher at Nassau (1985)
#   Truth and Reconciliation    the 1993 Constitution's closing provision, the 1995 Act, the
#                               Constitutional Court in AZAPO (1996), the TRC Report, and one
#                               amnesty hearing (the death of Steve Biko, 1997)
#
# DISAGREEMENTS the record holds (each figure with its producer; never averaged):
#   Sharpeville dead: the TRC Report's own legislation register says 67 killed and 186 wounded
#     (src-trc-v1-ch13.p458); its chronology and its Transvaal finding say 69 killed, with 186
#     wounded (src-trc-v3-ch1.p14) or 'more than 300 injured' (src-trc-v3-ch6.secsharpevillefinding).
#   Soweto 1976 dead: 575 is the OFFICIAL figure in every TRC passage, for the whole revolt, not
#     the first week (src-trc-v3-ch1.p18; .ch6.para108; .ch6.para168). Wounded: 'over 2 000'
#     (p18), 2 380 (para108), 2 389 per the Cillie Commission (para168). The YAML's 'at least 176
#     in its first week' is not held.
#   Hector Pieterson: the TRC Report calls him 'thirteen-year-old Hector Zolile Peterson'
#     (src-trc-v3-ch6.para127); the YAML says 12. Spelling: the Report prints Peterson and
#     Mbuyiswa Makhubo; the YAML Pieterson and Mbuyisa Makhubu.
#   Racial groups under the Population Registration Act: the 1950 Act classifies every person
#     as 'a white person, a coloured person or a native' (three), with ethnic sub-groups by
#     proclamation (src-pra-1950.sec5); the TRC Report says 'one of four' (src-trc-v1-ch2.para26,
#     src-trc-v1-ch13.p453) and quotes definitions that are not the 1950 wording (para26).
#   Amnesty applications: 7 127 (TRC Report vol 1, src-trc-v1-ch10.para2, 1998) against 7115
#     (vol 6, src-trc-v6-s1.sec3para4, 2003).
#   Boer women and children who died in the camps: 'more than 20 000' in the National Party's
#     submission (src-np-trc-1996.secmemory); the YAML's 27,927 is not held.
#   Statements to the TRC: 'some 21 300 persons filed gross human rights violations petitions'
#     (src-trc-v1-ch2.para45). These are statements, not testimony heard in public; the YAML's
#     'heard testimony from 21,000 victims' is not what the Report says.
#   3.5 million: the Report gives 'at least 3.5 million black South Africans' for expulsions,
#     forced migration, passes and forced removals together (src-trc-v1-ch2.para45b), not for
#     the Group Areas Act alone, as the YAML does.
#   Biko's death: the inquest found no one responsible; the TRC found the probabilities are that
#     he died of injuries sustained in detention and could not confirm a perpetrator
#     (src-trc-v3-ch2.secbiko, .secbikofinding); the applicants told the Amnesty Committee his
#     head hit a wall in a scuffle (src-trc-amnesty-biko-1997.secbooyens); counsel for his widow
#     counted 'over 80 specific falsehoods' (.secbizos). Tutu's foreword says 'We know now what
#     happened to Steve Biko' (src-trc-v1-ch1.para29). All four are said, none settled here.
#   The 1994 vote: SAHO's table gives polling as 26-29 April 1994 and total votes as
#     '19,726,610 (approx.)' (src-saho-election-1994.p1); the YAML says 27 April and 19.7 million.
#   Necklacing: the ANC says it 'was never the policy of the ANC' and was at times the work of
#     state agents (src-anc-trc-1996.secnecklace2); the US Congress in 1986 called on the ANC to
#     'strongly condemn' it (src-caaa-1986.sec108).
slug: apartheid
