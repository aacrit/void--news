# ------------------------------------------------------------- recordings
# Archival audio artifacts (docs/proposals/HISTORY-AUDIO-ARCHIVAL.md §4a).
# A recording is a factual claim four times over: this speaker, this
# occasion, this date, these words. Every `*_as_stated` field is copied from
# the repository's own item page or metadata API as fetched on `fetched_at`,
# never from memory. `transcript` is verbatim from the ledger extract named in
# `transcript_extract`. `verification` names the record
# pipeline/history/verify_clip.py wrote; its WER, coverage, excerpt sha256 and
# verified_at are the check's, never hand-typed. `signed_by` / `signed_at` are
# the CEO's, per clip, and nothing plays in an episode until both are set
# (policy B, §2). These rows are read by the History producer only.
#
# Rights, for all three admissible rows: works of the United States government
# (a President addressing Congress, recorded by the White House; NASA's own
# mission communications, digitised by NASA's Johnson Space Center). Each row
# still records what its REPOSITORY states, which is what policy B admits on.
