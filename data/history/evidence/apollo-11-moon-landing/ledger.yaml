  - id: clip-kennedy-congress-19610525
    kind: audio
    title: "John F. Kennedy, the Moon goal, in the White House recording of the Special Message to Congress on Urgent National Needs"
    speaker: John F. Kennedy
    occasion: "Special Message to Congress on Urgent National Needs, delivered before a joint session of Congress, as the Library titles it; the text edition heads it 'Delivered in person before a joint session of Congress May 25, 1961'"
    date: "1961-05-25"
    date_as_stated: "25 May 1961 (the item's 'Date(s) of Materials')"
    repository: "John F. Kennedy Presidential Library and Museum (National Archives and Records Administration), White House Audio Collection"
    accession: "JFKWHA-032"
    url: "https://www.jfklibrary.org/asset-viewer/archives/jfkwha-032"
    file: "https://static.jfklibrary.org/pox43o6b4t44m6wwihi7hx7kfxf33776.mp3"
    file_md5: "674385e75f3ff32a8cbac1f9ac036383"
    file_md5_as_stated: "the Library publishes no checksum. This is the md5 of the file as fetched on 2026-10-03 from the item page's Download link (110,471,927 bytes, audio/mpeg, Last-Modified Thu, 25 Jun 2026 13:01:13 GMT, ETag a3457f27cf0dc0d4; the link carried ?filename=JFKWHA-032-AU_WR.mp3 and a dated odc parameter, dropped here), recorded so the render job refuses a changed file"
    title_as_stated: "Special Message to Congress on Urgent National Needs, 25 May 1961"
    creator_as_stated: "Contributor(s): Kennedy, John F. (John Fitzgerald), 1917-1963"
    origin_as_stated: "Collection: White House Audio Collection. Series: Series 1. White House Audio Recordings, 1961-1963. Preferred Citation: 'White House Audio Collection. Special Message to Congress on Urgent National Needs, 25 May 1961'. Extent: 1 audio tape/reel (46 minutes). Description: 'Sound recording of President John F. Kennedy's Special Message to Congress' (the item page)"
    uploader_as_stated: "the Library's own asset viewer; no third-party uploader"
    licence_as_stated: "Copyright Status: Public Domain (the item page's own field). The collection's Copyright Notice on the same page: 'Documents in this collection that were prepared by officials of the United States as part of their official duties are in the public domain. Some of the archival materials in this collection may be subject to copyright or other intellectual property restrictions. Users of these materials are advised to determine the copyright status of any document from which they wish to publish.'"
    licence_url: "https://www.jfklibrary.org/asset-viewer/archives/jfkwha-032"
    rights_basis: public-domain-as-stated
    rights_reading: "A recording made by the White House of the President addressing Congress, held by a federal presidential library that marks it Public Domain: a work of the United States government, not subject to copyright under 17 U.S.C. 105, in the US and with no URAA question (a domestic work). The excerpt is the President's own words. Admissible under policy B with the CEO's signature, the basis printed beside the exhibit"
    fetched_at: 2026-10-03
    duration_s: 2761.74
    excerpt: {in: "00:33:51.200", out: "00:34:03.600"}
    transcript_extract: src-jfk-19610525.sec9
    transcript: "First, I believe that this nation should commit itself to achieving the goal, before this decade is out, of landing a man on the moon and returning him safely to the earth."
    verification: recordings/clip-kennedy-congress-19610525.verification.json
    observed: "The spoken words match the Library's printed text word for word (faster-whisper base.en heard every word). The window opens in the 0.4 s pause after 'national goals.' and closes in the pause after 'the earth.', before 'No single space project'. Applause is not heard inside the window. The sentence that follows ('No single space project in this period will be more impressive to mankind ... none will be so difficult or expensive to accomplish', 2043.6 to 2057.1 s) was checked too and heard word for word, and is left out so that the clip is exactly the sentence the document voice otherwise reads: the event record carries only the first sentence as a quotation, and the script narrates the second. The file is mono, 44.1 kHz, 320 kb/s MP3, 46 min 2 s; the passage sits at 33 min 51 s"
    shows: "Kennedy's voice, the one sentence the episode's document voice otherwise reads: the commitment and its deadline"
    does_not_show: "the sentence after it, the eight paragraphs of section IX around it, the rest of the 46-minute address, and the chamber's response, which the window excludes"
    signed_by: CEO
    signed_at: 2026-10-03

