    licence_as_stated: "Public Domain Mark 1.0 (the item's licenseurl is http://creativecommons.org/publicdomain/mark/1.0/)"
    licence_url: "https://creativecommons.org/publicdomain/mark/1.0/"
    rights_basis: pdm-as-stated
    rights_reading: "NASA's recording of its own mission air-to-ground loop, digitised by NASA's Johnson Space Center and uploaded from a nasa.gov address: a work of the United States government, not subject to copyright under 17 U.S.C. 105, with no URAA question. NASA's media guidelines state that NASA audio 'generally are not subject to copyright in the United States' (https://www.nasa.gov/nasa-brand-center/images-and-media/). The PDM is the repository's mark. Admissible under policy B with the CEO's signature, the basis printed beside the exhibit"
    fetched_at: 2026-10-03
    duration_s: 8.22
    excerpt: {in: "00:00:00.000", out: "00:00:08.224"}
    transcript_extract: src-alsj-a11-step.sec1092423
    transcript: "That's one small step for man; one giant leap for mankind"
    verification: recordings/clip-armstrong-one-small-step-19690721.verification.json
    observed: "The file is NASA's own cut of the one transmission and is used whole. The transcripts print an 'a' in brackets, 'for (a) man', which the Journal says honours Armstrong's stated intent and which it and this check do not hear in the recording; the transcript here is the sentence as the Journal says the world heard it, which is what the audio carries. faster-whisper base.en heard 'It's' for 'That's' and every other word. The Journal notes that NASA's cut of this moment ends inside the sentence and that the Journal's own clip was merged from two; this file is continuous"
    shows: "Armstrong's voice, through the air-to-ground loop, saying the one sentence; the pause before 'one giant leap' is the recording's own"
    does_not_show: "the words before it ('I'm going to step off the LM now', 109:24:12) and after it ('And the surface is fine and powdery'); the inaudible 'a'; where the microphone was"
    signed_by: CEO
    signed_at: 2026-10-03

