  method: 'From the notes to the opening summary page of the interior minister''s report of 1917: the total the report gives for the 1914 census of Gregorian and Catholic Armenians, and the total it counts as present in 1917, natives and outsiders together. The result is the ratio, the 1917 count over the 1914 census.'
  finding: 'On the interior minister''s own summary page, the Armenians counted in 1917 were 284,157 against a 1914 census total of 1,256,403: fewer than a quarter remained on the ministry''s own books.'
  confidence: 'moderate: the arithmetic is on a pair of figures in one note of one document, but the document is read in an English edition and its figures are read from one note, the report''s own note calls the census incomplete and would raise the 1917 count by 30 percent, and the editor notes that provinces with Armenian populations are missing from the report'
  against: the same note says the true 1914 figure should be around 1,500,000 and the 1917 count around 350,000 to 400,000, which gives a similar share but not this one; the report counts survivors present, not the dead, and deportees in Syria and Mesopotamia are counted where they were found
