  claim: 'The deportation was the means of killing: the columns were robbed, raped and cut down on the road by design, the state''s own figures for the Armenian population were kept low on purpose, and the Ottoman court-martial of 1919 itself sentenced the leaders to death for it; the events are the genocide the Republic seeks recognised.'
  omits: The Armenian volunteer units on the Russian side and the risings at Van and elsewhere, which the German consular record and the Ottoman pamphlet both describe and which the survivors' accounts do not weigh.
  adjudications:
  - claim: 'The deportation was a means of killing, not a relocation: the columns were attacked on the road and the destination could not sustain life.'
    verdict: supported
    basis: presence
    rests_on:
    - src-de-19150707.para6
    - src-gust-19150707-en.para6
    - src-frus-d1406.whole
    - src-de-19150805.para5
    - src-bryce-1916.p92
    reasoning: The German ambassador wrote that the transport to a destination many hundreds of kilometres away, without means of transport, through country offering neither shelter nor food and infested with typhus, was bound to claim numerous victims, and that from Erzincan the deportees were left to run the gauntlet of Kurdish bands; the American ambassador wrote that those herded into the arid and hostile wastes of the interior would doubtless perish by murder or slow starvation; the German administrator at Erzurum counted between 10 and 20,000 killed on the road to Erzincan against the government's 3 to 4,000; and the deported woman's own narrative from Moush records the company of 8,000 to 10,000 diminished by half. Three producers, the ally, a neutral and the survivors as a British ministry printed them, carry the claim.
  - claim: Some 100,000 to 200,000 Armenian women and girls were taken into Muslim households.
    verdict: untestable
    basis: absence
    rests_on:
    - src-kurt-2016.para1
    - src-de-19150727.para5
    would_settle: the Ottoman Interior Ministry's directives on conversion that Kurt cites, and Sarafian's edition of the American records
    gap: no document in the free record counts the women and children absorbed into Muslim households
    reasoning: The German consul at Aleppo recorded girls of 8 to 12 sold at Tel Abiad and women dragged off by Bedouins between Mardin and Ras-ul-Ain, and Kurt describes conversion and absorption as a bureaucratic process from Ottoman directives; no document held here counts them, so the figure stands as the diaspora's estimate and cannot be tested.
  - claim: The Ottoman court-martial pronounced death sentences on Talât, Enver, Cemal and Nazım on 5 July 1919.
    verdict: untestable
    basis: absence
    rests_on:
    - src-anumyan-2025.p38
    would_settle: Takvîm-i Vekayi No. 3604 of 22 July 1919, or the Dadrian and Akçam edition of the verdicts
    gap: no open copy of the gazetted verdict was reached
    reasoning: The verdict is known here only as an Armenian scholar summarises it from the gazette; the Treaty of Sèvres, which this record holds, obliges Turkey to hand over those responsible for the massacres to an Allied tribunal but does not recite the Ottoman sentences, so nothing in the Tier A record can test the claim.
- id: international-witness
  name: 'The witnesses: the neutral ambassador, the British compilers and the German pastor'
  holders:
  - Henry Morgenthau (1918)
  - Toynbee and Bryce (1916)
  - Lepsius (1919)
  rests_on:
  - src-morgenthau-1918
