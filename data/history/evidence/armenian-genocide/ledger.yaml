  title: What the dispatches called it, June 1915 to December 1916
  method: Every contemporaneous document this record holds from the war years, written by an official of a government other than the Ottoman, that names the destruction of the Armenians as a people as the aim or the result of the measures; one row per document, with the date, the producer and the word used. The result is the count.
  finding: 'Of the wartime documents held here, 11 name the destruction of the Armenians as a people as the aim or the result of the measures: 6 from the German Foreign Office''s files (2 of them reporting the words of the interior minister and of the Armenian Patriarch), 4 telegrams of the American ambassador and his consul, and the British compiler''s preface of 1916.'
  confidence: high for the count, which is of held documents and each row quotes the word; the corpus is what this ledger reached, not a sample of all dispatches, and the pair that report the words of others are the German embassy's record of them
