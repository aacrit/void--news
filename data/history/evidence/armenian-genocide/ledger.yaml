  claim: The deportation was a death warrant to a whole race, understood as such by the ministers who ordered it, carried out under a pretext of military necessity beyond any war zone, and known in Berlin and Washington while it ran; the numbers can be estimated only from neutral witnesses, and Toynbee put the dead at about a third of the Armenians in Turkey.
  omits: The Armenian risings and the Muslim dead that the German consuls and the Ottoman government both recorded, which the memoir passes over and the British compilation treats as the government's pretext.
  adjudications:
  - claim: The Ottoman ministers made no particular attempt to conceal, in their conversations with the ambassador, that the deportation was the death warrant of a race.
    verdict: qualified
    basis: presence
    rests_on:
    - src-frus-d1399.whole
    - src-frus-d1400.whole
    - src-de-19150617.para4
    - src-morgenthau-1918.p309
    reasoning: 'The ambassador''s own telegrams of 1915 record the Grand Vizier resenting foreign interference and the ministers justifying the measures on the ground of military necessity, which is concealment rather than candour; the German record carries the interior minister''s blunt words to an embassy official, that the Porte would use the war to make a clean sweep of its internal enemies. The memoir''s claim is borne out by the German file and not by the ambassador''s own contemporaneous file, so the verdict is qualified: candour to the German embassy, pretext to the American.'
  - claim: Germany, the Ottoman Empire's ally, protested and did not stop the deportations.
    verdict: supported
    basis: presence
    rests_on:
    - src-frus-d1416.whole
    - src-frus-d1400.whole
    - src-de-19150707.para10
    - src-de-19161204.para22
    - src-bundestag-2016.p1
    reasoning: The German embassy's memoranda of 4 July and 9 August 1915 are in the American file, sent by the German ambassador in Washington; the German ambassador at Constantinople wrote that he handed the first to the Grand Vizier to answer later accusations of complicity; by December 1916 his own consul reported the Turkish Armenians as good as wiped out outside the large cities; and the Bundestag's resolution of 2016 states that the Reich did not try to stop it. Three producers, the German files, the American file and the German parliament, agree.
