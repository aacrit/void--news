positions:
- id: ottoman-turkish-state
  name: The Ottoman government's case and the Turkish state's
  holders:
  - The Imperial Ottoman Government (1916)
  - Ahmed Rüstem Bey (1918)
  - Ministry of Foreign Affairs of Türkiye
  - Genç (2020)
  - Lewy (2005)
  - McCarthy and others (2006)
  rests_on:
  - src-verite-1916
  - src-rustem-1918
  - src-mfa-tr
  - src-genc-2020
  - src-lewy-2005
  - src-mccarthy-2006
  described_by:
  - src-ep-1987.p119
  claim: The Armenians of the war zone were relocated as a security measure after risings and collaboration with the Russian army; deaths came from wartime conditions, banditry and local revenge, not from a premeditated plan; more Turks died in the same years; and the word genocide is legally unfounded for it.
  omits: The provinces far from any front that the measures reached, which its ally's ambassador and the neutral ambassador both recorded, and any count of its own of the Armenians who died, which the ministry's 1917 tally does not give.
  adjudications:
  - claim: The relocation was ordered for the Armenian population residing in or near the war zone, away from the supply routes of the army.
    verdict: contradicted
    basis: presence
    rests_on:
    - src-de-19150707.para2
    - src-gust-19150707-en.para2
    - src-frus-d1400.whole
    - src-frus-d1406.whole
    - src-de-19150716.para13
    - src-mfa-tr.para6
    reasoning: The German ambassador reported on 7 July 1915 that the Porte had extended the measure to Trebizond, Mamuret-ul-Aziz and Sivas although those provinces were threatened by no enemy invasion; the American ambassador reported on 10 July that the deportations were directed from Constantinople often in districts where no military operations were likely, and on 11 August that Ada Bazar, Izmid and Bardizag, some 50 miles from the capital, were being cleared; the consul at Samsun on the Black Sea reported the expulsion of every Armenian there. Two producers, the Ottoman Empire's ally and a neutral, record the same extension. The foreign ministry's own page concedes that some Armenians living away from the front were included, and this record holds the extension as the rule of the summer of 1915, not an exception.
  - claim: No authentic evidence exists to support the claim that there was a premeditated plan by the Ottoman Government to kill off Armenians.
    verdict: qualified
    basis: presence
    rests_on:
    - src-de-19150617.para4
    - src-gust-19150617-en.para4
    - src-de-19150707.para3
    - src-frus-d1400.whole
    - src-mfa-tr.para7
    reasoning: The free record holds no Ottoman order to kill and no Ottoman archival file; the Ottoman archives, the interior ministry's ciphered telegrams and the 1919 court-martial verdict could not be read free, and that gap is stated in the record. What it holds is the German ambassador's report of the interior minister's own words to an embassy official, that the Porte meant to use the war to make a clean sweep of its internal enemies, and the two ambassadors' independent readings of measures directed from the capital with the eradication of the Armenians as their purpose. That is evidence of intent recorded by the ally and by a neutral, not the plan itself; the position's word authentic goes to documents this record does not hold, so the verdict stops at qualified.
  - claim: Greater numbers of Turks died or were killed in the years leading to and during the War.
    verdict: untestable
    basis: absence
    rests_on:
    - src-mfa-tr.para4
    would_settle: the Ottoman and Turkish demographic literature, of which McCarthy's work is paywalled, and the Ottoman archives
    gap: no document in the free record counts the Muslim dead of the eastern provinces
    reasoning: No document in the free record counts the Muslim dead of the war. The German consul at Samsun and the Ottoman pamphlet both record Muslims killed at Van and Şebinkarahisar, so the claim's premise is not empty, but its comparison of two counts cannot be tested against artifacts that count neither.
