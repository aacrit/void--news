  finding: The record holds 9 figures for the Armenians of the Ottoman Empire before 1915, from 1,100,000 to 2,100,000; the lowest is the Ottoman government's and the highest the Patriarchate's, both as a British compiler reported them in 1916, and the interior minister's own report of 1917 gives the census as 1,256,403 and says it should be around 1,500,000.
  confidence: 'moderate: the range is the extreme of 9 stated figures from 4 documents, but the two extremes are figures of 1912 and of the government''s returns as Toynbee reports them, not read in the returns themselves, and the Ottoman census and the Patriarchate''s count are of different years'
  against: Tatoyan's like-for-like comparison of the two official series gives 1,294,851 against 2,026,700, a ratio of 1.57, so the two extremes here overstate the gap between the parties; and the interior minister's own note says the census figure undercounts
