  claim: The events of 1915 to 1917 are genocide within the meaning of the Convention of 1948, as the European Parliament, the Bundestag and the President of the United States have each stated, with the qualification the Parliament added, that no claim against present-day Turkey follows from the finding.
  omits: That no court of competent jurisdiction has ruled on the characterisation, which the Convention reserves to tribunals; the one judgment that touched it, at Strasbourg in 2015, is behind a challenge wall and is not held.
  adjudications:
  - claim: The tragic events in 1915-1917 involving the Armenians living in the territory of the Ottoman Empire constitute genocide within the meaning of the Convention.
    verdict: qualified
    basis: presence
    rests_on:
    - src-un-convention-1948.art2
    - src-de-19150707.para3
    - src-frus-d1400.whole
    - src-de-19150716.para13
    - src-ep-1987.p120
    reasoning: 'Article II names killing members of a group and deliberately inflicting conditions of life calculated to bring about its physical destruction, with intent to destroy the group as such; the German and American files of 1915 record measures whose purpose the ambassadors read as the eradication of the Armenian race and whose conditions they read as fatal by design. Two producers carry the acts and the purpose in the Convention''s own terms. What the record does not hold is a judgment: the Convention gives the characterisation to a competent tribunal, none has ruled on these events in the free record, and a parliament''s resolution is a political finding, which the Parliament''s own text calls recognition. Supported in substance by the artifacts, qualified because the claim is a legal one and the tribunal is absent.'
  - claim: The French Parliament adopted, on 18 January 2001, the bill recognising the Armenian genocide of 1915.
    verdict: untestable
    basis: absence
    rests_on:
    - src-masseret-2001.p113
    would_settle: Loi n° 2001-70 of 29 January 2001 on Légifrance
    gap: Légifrance answered a challenge page, so the law's text is not held
    reasoning: The adoption is stated in a French political scientist's article, whose first page Persée serves; the law itself could not be read, so the claim rests on scholarship and is untestable here.
