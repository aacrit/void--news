  claim: Mass murder, deportation and forced assimilation were three faces of one process of destruction organised by the Young Turk regime, documented from the German, American and Ottoman archives; the estimates of the dead run from 800,000 to 1,500,000; the open question is timing and mechanism, a pre-war design against a wartime radicalisation.
  omits: The books that carry the argument in full, none of which could be read free, so the position is held here through three open articles and a German preprint, with the monographs listed and unpinned.
  adjudications:
  - claim: Mass murder, deportation and forced assimilation were three faces of the same process of destruction.
    verdict: supported
    basis: presence
    rests_on:
    - src-de-19161204.para22
    - src-gust-19161204-en.para22
    - src-frus-d1410.whole
    - src-de-19150716.para13
    - src-de-19150805.para17
    - src-bryce-1916.p650
    reasoning: The consul at Samsun in July 1915 described the measures as nothing less than the destruction or forced Islamisation of a whole people; the administrator at Erzurum in August called the expulsion a campaign of revenge, destruction and robbery; the same man in December 1916 wrote that his fear that evacuation would be tantamount to annihilation had come true; the American ambassador in September 1915 telegraphed that the destruction of the Armenian race was progressing rapidly; and the British compilation's convoy figures show columns of 18,000 reduced to 150. Three producers carry the three faces the scholarship names.
  - claim: The decision was a pre-war design of the Committee, or was reached in the spring of 1915 under the pressure of the war.
    verdict: untestable
    basis: absence
    rests_on:
    - src-kevorkian-2013.para3
    - src-de-19161204.para26
    would_settle: the fonds of the Interior Ministry's Second Bureau opened in 2005, which Kévorkian names, and the monographs of Akçam, Bloxham and Suny, all unreached
    gap: no Ottoman central-committee record is in the free record
    reasoning: The one contemporaneous statement of a programme held here is Scheubner-Richter's report of December 1916, that a large part of the Committee held the empire should rest on a purely Muslim basis and that the first item was the Armenians; it is one German officer's summary and undated as to when the programme was adopted, so it cannot settle timing, and the archival fonds that could is unreached.
- id: law-and-recognition
  name: The law and the parliaments
  holders:
  - United Nations General Assembly (1948)
  - European Parliament (1987)
  - Deutscher Bundestag (2016)
  - President Biden (2021)
  - Masseret (2001)
