# ------------------------------------------------------------- positions and their adjudication
positions:
  - id: tribunal-record
    name: The tribunal's findings
    holders: ["ECCC Trial Chamber (Case 001, 2010)", "ECCC Supreme Court Chamber (Case 001, 2012)", "ECCC Trial Chamber (Case 002/01, 2014; Case 002/02, 2018)", "ECCC Supreme Court Chamber (Case 002/02, 2022)"]
    rests_on: [src-eccc-001-tj, src-eccc-001-aj, src-eccc-002-01-tj, src-eccc-002-02-tj, src-eccc-002-02-summary, src-eccc-002-02-summary-km, src-eccc-002-02-aj, src-eccc-law-2004, src-un-rgc-agreement-2003]
    claim: "No fewer than 12,273 people were detained at S-21 and no fewer than 12,272 executed; between 600,000 and 3 million died under the regime, with 1.5 to 2 million the most accurate band; genocide was committed against the Cham and the Vietnamese, and the killing of Khmer was charged as crimes against humanity."
    omits: "Why genocide was charged for two minorities only: the Closing Order did not explain it, and the one judge who asked the question wrote a separate opinion rather than a finding."
    adjudications:
      - claim: "No fewer than 12,273 people were detained at S-21, and no fewer than 12,272 were executed."
        verdict: qualified
        basis: presence
        rests_on: [src-eccc-001-tj.para141, src-eccc-001-tj.fn240, src-eccc-001-tj.para597, src-eccc-duch-apology.p7]
        reasoning: "The count is the tribunal's revised list, built by the Co-Prosecutors from lists DC-Cam compiled out of S-21's own prisoner registers and execution logs, and the accused put his own figure at more than 12,300 killed. The registers are the perpetrators' record read through the court, and the court itself says certain entries carry minimal information; a floor carried by the prison's own books and its commandant's admission is not an independent count, so the verdict is capped at qualified."
      - claim: "The crime of genocide was committed against the Cham and against the Vietnamese."
        verdict: qualified
        basis: presence
        rests_on: [src-eccc-002-02-summary.para30, src-eccc-002-02-summary.para34, src-eccc-002-02-tj.para3993, src-un-goe-1999.para63]
        reasoning: "The finding is the court's, entered in Khmer and English in 2018; the United Nations' experts had found in 1999 that the two groups qualify as protected groups and that intent had support in the evidence, and asked a tribunal to investigate. Two producers, but the second asked the question the first answered, so the verdict is qualified rather than supported."
      - claim: "Estimates of the dead range from 600,000 to 3 million, and experts accept 1.5 to 2 million as the most accurate."
        verdict: supported
        basis: presence
        rests_on: [src-eccc-002-01-tj.para174, src-eccc-002-01-tj.fn523, src-un-goe-1999.para35]
        reasoning: "The tribunal's own survey lists every estimate from 740,800 to the 2 to 3 million used by governments; the United Nations' experts, a second producer, put the scholars' figures at 1.5 million and nearly 1.7 million, about 20 per cent of a population of 7.3 to 7.9 million, and record that historians reject 2 to 3 million. The experts' figures sit inside the tribunal's band and their rejection matches its edge."
  - id: united-nations
    name: The United Nations' experts and Council
    holders: ["Group of Experts for Cambodia (Stephen, Lallah, Ratner, 1999)", "The Security Council's record of 11 January 1979"]
    rests_on: [src-un-goe-1999, src-un-spv2108]
    claim: "The evidence justifies investigating genocide against the Cham, the Vietnamese and the Buddhist monkhood; whether the Khmer national group was a victim of genocide is an open question for a tribunal; the dead were about 20 per cent of a population of 7.3 to 7.9 million, and the figure of 2 to 3 million is rejected."
    omits: "What the Council did with the accounts it heard in January 1979: the record holds the statements, not a resolution, and the experts' report leaves the Council's inaction outside its scope."
    adjudications:
      - claim: "The Khmer Rouge subjected the Cham, the Vietnamese and the Buddhist monkhood to the acts in the Convention with intent, so a tribunal should investigate genocide against them."
        verdict: qualified
        basis: presence
        rests_on: [src-un-goe-1999.para63, src-un-goe-1999.para64, src-eccc-002-02-summary.para30, src-eccc-002-02-summary.para34, src-eccc-002-02-tj.para3228]
        reasoning: "The tribunal, a second producer, found genocide against the Cham and the Vietnamese and found that the party targeted the Cham as an ethnic and religious group throughout the period. On the monkhood the held extracts are silent, so the third group in the experts' list is not carried by the artifacts, and the verdict is qualified."
      - claim: "The dead were approximately 20 per cent of the April 1975 population of 7.3 to 7.9 million, and the 2 to 3 million figure is rejected by historians."
        verdict: qualified
        basis: presence
        rests_on: [src-un-goe-1999.para35, src-eccc-002-01-tj.para174, src-eccc-002-02-tj.para297]
        reasoning: "The tribunal accepts 1.5 to 2 million as most probable, a band whose lower end is the experts' 20 per cent and whose upper end is above it, and whose stated ceiling still reaches 3 million; two producers agree on the floor and on the implausibility of 3 million as a count, and differ on how far above 1.7 million the truth may lie."
      - claim: "By 1977 Cambodia had escalated a low-intensity border war into raids that massacred hundreds of Vietnamese in border villages."
        verdict: qualified
        basis: presence
        rests_on: [src-un-goe-1999.para37, src-eccc-002-02-summary.para34, src-un-spv2108.para115]
        reasoning: "The tribunal dates an international armed conflict between Vietnam and Democratic Kampuchea from May 1975, and Vietnam's own delegate told the Council the border war was started by Phnom Penh; both agree there was a war and that it did not begin in Hanoi. Neither artifact counts the dead in the border villages, so the massacres rest on the experts alone."
  - id: vietnam-prk-account
    name: Viet Nam and the People's Republic of Kampuchea
    holders: ["Ha Van Lau, for the Socialist Republic of Viet Nam (Security Council, 1979)", "People's Revolutionary Tribunal, Phnom Penh (August 1979)"]
    rests_on: [src-prt-1979, src-un-spv2108]
    claim: "The Pol Pot-Ieng Sary clique committed genocide against the whole Kampuchean people, killing about 3 million; it started the border war against Viet Nam immediately after 1975 and massed 19 of its 23 divisions on the frontier; the war that ended it was the Kampuchean people's own."
    omits: "Viet Nam's own army, which entered Phnom Penh: the delegate's two wars leave no room for a third, the one Viet Nam fought, and the tribunal's documents name Vietnamese witnesses only as victims."
    adjudications:
      - claim: "About 3 million innocent people were killed by the Pol Pot-Ieng Sary clique."
        verdict: contradicted
        basis: presence
        rests_on: [src-prt-1979.secprosecution, src-prt-1979.secconsequences, src-un-goe-1999.para35, src-eccc-002-01-tj.para174]
        reasoning: "The prosecution of 1979 charged 3 million on the strength of a survey of Phnom Penh's former residents, one commune in Siem Reap and a journalist's figures from three provinces, by its own account. The United Nations' experts record that historians reject the 2 to 3 million used by the governments in Cambodia since 1979, and the ECCC places the accepted band at 1.5 to 2 million with 3 million as the outer edge of every estimate ever made. Two producers, the experts and the court, say otherwise."
      - claim: "The Pol Pot-Ieng Sary clique started the border war immediately after 1975 and massed 19 of the army's 23 divisions on the frontier."
        verdict: qualified
        basis: presence
        rests_on: [src-un-spv2108.para115, src-un-spv2108.para120, src-un-goe-1999.para37, src-eccc-002-02-summary.para34]
        reasoning: "The experts date a low-intensity border war from 1975 and Cambodia's escalation to 1977, and the tribunal dates the international armed conflict from May 1975; both carry the war and its early start. The count of 19 divisions in 23 is Viet Nam's own and nothing else in the record carries it."
      - claim: "The regime abolished Islam, killed its leaders and forced believers to eat pork at gunpoint."
        verdict: supported
        basis: presence
        rests_on: [src-prt-1979.secislam, src-eccc-002-02-tj.para3228, src-un-goe-1999.para64]
        reasoning: "The ECCC found that the party restricted the Cham's cultural and religious practices, executed the leaders of their rebellions and ordered purges of all Cham in 1977 and 1978; the United Nations' experts found intent evidenced by the total prohibition of the group's distinctive traits and the execution of its leadership. Two producers carry the abolition and the killing of the leaders; the pork is the 1979 witnesses' detail and is not tested here."
  - id: khmer-rouge-account
    name: The Khmer Rouge leadership's own account
    holders: ["Pol Pot (interview of October 1997)", "Prince Norodom Sihanouk, for Democratic Kampuchea (Security Council, January 1979)"]
    rests_on: [src-thayer-1997, src-un-spv2108]
    described_by: [src-williams-jessee-2024.p11, src-eccc-002-02-tj.para3228]
    claim: "The movement came to carry out the struggle, not to kill people; to say that millions died is too much; Tuol Sleng was a Vietnamese exhibition; the regime had no choice but to defend itself against a Viet Nam that meant to swallow Cambodia."
    omits: "The prison's own registers, which the tribunal read, and the commandant's admission of more than 12,300 killed; and the ethnic Vietnamese inside Cambodia, whom the account never mentions."
    adjudications:
      - claim: "To say that millions died is too much."
        verdict: contradicted
        basis: presence
        rests_on: [src-thayer-1997.p4, src-eccc-002-01-tj.para174, src-un-goe-1999.para35, src-eccc-duch-apology.p7]
        reasoning: "Every count the record carries from a producer other than the leadership itself exceeds a million: the tribunal's accepted band is 1.5 to 2 million, the United Nations' experts put the scholars' figures at 1.5 million and nearly 1.7 million, and the commandant of S-21 told the court he was morally responsible for the loss of more than one million lives. Three producers say otherwise."
      - claim: "Tuol Sleng was a Vietnamese exhibition set up for propaganda after the invasion."
        verdict: contradicted
        basis: presence
        rests_on: [src-thayer-1997.p4, src-eccc-001-tj.para141, src-eccc-001-tj.fn240, src-eccc-duch-apology.p7]
        reasoning: "The tribunal's count of 12,273 detainees is built from S-21's own prisoner lists and execution logs, and the prison's commandant, in his own words before the court, said he killed more than 12,300 people there. The perpetrators' registers and the perpetrator's admission are two producers, and neither is Vietnamese."
      - claim: "The regime had no choice but to defend itself against Viet Nam."
        verdict: qualified
        basis: presence
        rests_on: [src-thayer-1997.p3, src-eccc-002-02-summary.para34, src-un-goe-1999.para37]
        reasoning: "The record holds an international armed conflict from May 1975 in the tribunal's finding, and the experts' account of a border war that Cambodia escalated in 1977 into raids massacring hundreds of Vietnamese villagers. Two producers carry the war; both place the escalation on Phnom Penh's side, which is the part of the claim they do not bear out."
  - id: survivors
    name: The survivors' testimony
    holders: ["Vann Nath (witness, Case 001, 29 June 2009)", "Chum Mey (civil party, Case 001, 30 June 2009)"]
    rests_on: [src-eccc-tr-20090629, src-eccc-tr-20090630, src-ung-2000, src-ngor-1987]
    described_by: [src-eccc-001-tj.para266, src-eccc-002-02-tj.para4447]
    claim: "Prisoners were photographed on arrival, shackled in rows of 20 or 30 and stripped; a painter lived because a colour portrait could please Angkar; a mechanic had his fingers broken, his toenails pulled and a live wire put to him; about 13 people walked out of the prison on the last day, and the children left at the cooperatives died."
    omits: "The years before arrest and the killing outside the prison, which two men who survived S-21 saw only from inside it; and the Cham, the Vietnamese and the base people, none of whom testified in these two days."
    adjudications:
      - claim: "Prisoners were photographed on arrival at S-21 and only a few survived it."
        verdict: qualified
        basis: presence
        rests_on: [src-eccc-tr-20090629.p20, src-eccc-tr-20090629.p52, src-eccc-001-tj.para598, src-eccc-002-02-tj.para2083]
        reasoning: "The tribunal found that only a very small number of those detained survived, and in 2018 tested one survivor's account against the list Ung Pech gave the 1979 tribunal and against the photographs, and found the absence from both inconclusive. The witness's about 13 on the last morning and the court's very small number are two producers agreeing on the order of magnitude, not on a count, so the verdict is qualified."
      - claim: "Chum Mey's fingers were broken, his toenails removed and he was electrocuted during interrogation."
        verdict: qualified
        basis: presence
        rests_on: [src-eccc-tr-20090630.p11, src-eccc-tr-20090630.p12, src-eccc-002-02-tj.para4447]
        reasoning: "The Case 002/02 Judgement records the same torture as a finding: beaten for 12 days and nights, electrocuted twice until he lost consciousness, two toenails removed. The court's finding rests on the same man's testimony in a later trial, so it is one producer heard twice, and the verdict is capped at qualified."
  - id: demographers
    name: The demographers
    holders: ["Heuveline (1998, 2015)", "de Walque (2004)", "Tabeau and They Kheam (2009)"]
    rests_on: [src-heuveline-2015, src-dewalque-2004, src-heuveline-1998, src-tabeau-kheam-2009]
    claim: "The death toll is a distribution, not a number: a 95 per cent simulation interval of 1.2 to 2.8 million excess deaths with a median of 1.9 million; adult men, the urban and the educated were the most likely to die."
    omits: "Who killed whom and why: a reconstruction from censuses and electoral lists yields a count of the missing, not a cause of death or a perpetrator, and it cannot separate the Cham or the Vietnamese from the total."
    adjudications:
      - claim: "The 95 per cent simulation interval for excess deaths runs from 1.2 to 2.8 million, with a median of 1.9 million."
        verdict: qualified
        basis: presence
        rests_on: [src-eccc-002-01-tj.para174, src-eccc-002-01-tj.fn523, src-un-goe-1999.para35]
        reasoning: "Every figure the primary record carries from the tribunal and the experts, 1.5 million, 1.7 million, the 1.5 to 2 million band, sits inside the interval, and the median sits inside the tribunal's band; but no Tier A artifact states the interval or the median, so the verdict is qualified: consistent with the record, not carried by it."
      - claim: "Adult men, the urban and the educated were the most likely to die."
        verdict: qualified
        basis: presence
        rests_on: [src-un-goe-1999.para35, src-prt-1979.secconsequences, src-eccc-002-01-tj.para170]
        reasoning: "The experts reproduce a death rate of 25 per cent for the urban and rural new people against 15 per cent for the rural base people, and the 1979 tribunal charged the killing of the quasi totality of intellectuals, scientists and technicians; two producers carry the urban and the educated. Neither counts men against women, so that part of the claim is not tested here."
  - id: race-genocide-scholarship
    name: The race-centred scholarship
    holders: ["Ben Kiernan (1985, 1996, 2003)"]
    rests_on: [src-kiernan-1996, src-kiernan-2003, src-kiernan-1985]
    claim: "The regime targeted ethnic minorities as such, with death rates the scholarship puts near 100 per cent for the ethnic Vietnamese, 50 per cent for the Chinese and 36 per cent for the Cham, against 25 per cent for the Khmer new people and 15 per cent for the base people."
    omits: "The tribunal's reasons for not charging genocide of the Khmer majority, and the question the experts left open; the scholarship's rates for the Chinese and the Thai have no artifact behind them in this record."
    adjudications:
      - claim: "The death rates by group were close to 100 per cent for the ethnic Vietnamese, 50 per cent for the Chinese, 36 per cent for the Cham, 25 per cent for the new people and 15 per cent for the base people."
        verdict: qualified
        basis: presence
        rests_on: [src-un-goe-1999.para35, src-un-goe-1999.fn5, src-eccc-002-02-summary.para32]
        reasoning: "The experts reproduce these rates from the scholarship's own table, so the recital is the position's data read back, not a second measurement; the tribunal found that the Vietnamese were expelled until late 1976 and targeted for destruction from April 1977, which carries the direction of the Vietnamese rate and nothing of the others. The verdict is qualified: the direction is carried for one group, the percentages for none."
      - claim: "The regime's violence against the Cham was directed at them as an ethnic and religious group, as such."
        verdict: supported
        basis: presence
        rests_on: [src-eccc-002-02-tj.para3228, src-eccc-002-02-tj.para3993, src-un-goe-1999.para64]
        reasoning: "The tribunal found that the party targeted the Cham as an ethnic and religious group throughout the period and that its policy had their physical destruction as such as its primary objective; the United Nations' experts found the intent to destroy the Cham evidenced by the announced policy of homogenization and the execution of their leadership. Two producers carry the claim."
  - id: revisionist
    name: The revisionist count
    holders: ["Michael Vickery (1984)"]
    rests_on: [src-vickery-1984]
    claim: "About 740,800 deaths were caused by the special conditions of Democratic Kampuchea, more than half by hunger, exhaustion and illness, about 300,000 by execution; a figure of 1 to 2 million executions could not be projected from the data available in 1984."
    omits: "Everything counted after 1984: the mapping of 19,733 burial pits, the S-21 registers read by a court, and the demographic reconstructions from the 1992 electoral lists and the 1998 census."
    adjudications:
      - claim: "About 740,800 people died as a result of the regime, about 300,000 of them executed."
        verdict: contradicted
        basis: presence
        rests_on: [src-eccc-002-01-tj.fn523, src-eccc-002-01-tj.para174, src-un-goe-1999.para35]
        reasoning: "The tribunal's own survey records the figure beside Ponchaud's 800,000 and the embassies' 1 million at the bottom of its list, and reports the court's demographers' finding that the earlier estimates heavily underestimated the scale of the killing; it accepts 1.5 to 2 million as most accurate. The United Nations' experts put the scholars' figures at 1.5 million and nearly 1.7 million. Two producers say otherwise, and the position's figure is known here only as the first of them reports it."
  - id: transitional-justice-scholarship
    name: The transitional-justice scholarship
    holders: ["Sperfeldt (2023)", "Williams and Jessee (2024)"]
    rests_on: [src-sperfeldt-2023, src-williams-jessee-2024]
    claim: "The court's genocide label reached the Cham and the Vietnamese only, and Khieu Samphan was found guilty of genocide against the Vietnamese but not the Cham; the ethnic Vietnamese were expelled and then killed, and many of those in Cambodia are stateless or at risk of it; former Khmer Rouge cadres' claims to victim status have been largely accepted."
    omits: "The victims' own reading of the label: neither article asks Khmer survivors whether the word genocide, reserved by the court for two minorities, describes what was done to them."
    adjudications:
      - claim: "The court's genocide convictions cover the Cham and the Vietnamese only, and Khieu Samphan's covers the Vietnamese alone."
        verdict: qualified
        basis: presence
        rests_on: [src-eccc-002-02-summary.para30, src-eccc-002-02-summary.para34, src-eccc-002-02-summary.para62, src-eccc-002-02-tj.para4468]
        reasoning: "The court's own summary enters genocide for the Cham and for the Vietnamese, finds Khieu Samphan not responsible for the Cham, and its separate opinion states that the case focused exclusively on those two groups. Only the court's record can carry what the court decided, so the verdict is one producer's and is capped at qualified, by the rule and not by any doubt."
      - claim: "The Khmer Rouge expelled the ethnic Vietnamese and then killed those who stayed, so that by late 1978 the minority had disappeared."
        verdict: qualified
        basis: presence
        rests_on: [src-eccc-002-02-summary.para32, src-eccc-001-tj.para425]
        reasoning: "The tribunal found a policy of expulsion until late 1976 and of destruction as such from April 1977, with killings on a massive scale, and a floor of 345 Vietnamese prisoners of war and civilians at S-21 alone. The record carries the sequence; it does not carry the article's counts of 150,000 to 170,000 expelled and 20,000 killed, which rest on the demographic report this record could not read."
      - claim: "Former Khmer Rouge cadres' claims to victim status have been largely accepted in Cambodia."
        verdict: untestable
        basis: absence
        rests_on: [src-williams-jessee-2024.p4]
        reasoning: "No court record or United Nations document in the free record measures how Cambodians receive former cadres; the claim rests on the authors' interviews with 58 former cadres and cannot be tested against artifacts that do not speak to it."
        would_settle: "DC-Cam's interview archive and the ECCC's civil-party admissions of former cadres, neither of which is served free"

