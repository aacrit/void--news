  - id: an-s21-list
    title: What the revised S-21 list records and what it leaves blank
    method: "From paragraph 141 of the Case 001 Judgement: the entries the revised list records as men, as women and as children, one row each, summed. The result is the sum, to be read against the list's total of 12,273 entries."
    finding: "Of the 12,273 entries on the revised list, 7,781 are recorded as a man, a woman or a child, so the sex or age of 4,492 people on the tribunal's own list is not recorded; 89 entries are children."
    confidence: "high: the three figures and the total are in one paragraph of the judgment, and the sum is arithmetic"
    against: "the judgment says certain entries contain minimal information, which is the gap this sum measures rather than a challenge to it; the same paragraph's other breakdowns (5,609 soldiers, 4,371 cadres, 1,751 neither) overlap this one, so the blank 4,492 cannot be read as unregistered people, only as entries without a sex or an age"
    result: 7781
    derivation:
      compute: sum
      column: entries
      columns: [recorded_as, entries, of_total]
      rows:
        - {recorded_as: men, entries: 5994, of_total: 12273, extract: src-eccc-001-tj.para141}
        - {recorded_as: women, entries: 1698, of_total: 12273, extract: src-eccc-001-tj.para141}
        - {recorded_as: children, entries: 89, of_total: 12273, extract: src-eccc-001-tj.para141}
  - id: an-vietnamese-share
    title: The Vietnamese on the S-21 list
    method: "The Vietnamese entries on the revised S-21 list, as the Case 001 Judgement counts them by category, summed and divided by the list's total. The result is the ratio."
    finding: "The 345 Vietnamese entries, 122 soldiers, 144 spies and 79 with no description, are 2.8 per cent of the 12,273 on the list."
    confidence: "high for the ratio, which is arithmetic on one paragraph; the judgment itself says the spies were so labelled on order and were in fact civilians or combatants, so the three categories are the prison's, not the court's"
    against: "the tribunal's finding of genocide against the Vietnamese rests on killings across the country, at Svay Rieng, on the waters, in Kampong Chhnang, at Wat Khsach and in Kratie, so a share of the S-21 list measures the prison, not the group's fate; and a list that leaves 4,492 entries without a sex may leave Vietnamese unlabelled too"
    result: 0.0281
    derivation:
      compute: ratio
      column: vietnamese
      over: listed
      columns: [category, vietnamese, listed]
      rows:
        - {category: "soldiers", vietnamese: 122, listed: 0, extract: src-eccc-001-tj.para425}
        - {category: "spies", vietnamese: 144, listed: 0, extract: src-eccc-001-tj.para425}
        - {category: "no description", vietnamese: 79, listed: 12273, extract: src-eccc-001-tj.para141}
  - id: an-genocide-answers
    title: Three producers, three lists of the genocide's victims
    method: "One row per group that a Tier A producer named when it said who the genocide's victims were, with the producer, the year and what it held; the result is the number of distinct producers. The producers are the 1979 tribunal, the United Nations' experts and the ECCC."
    finding: "The 1979 tribunal named the whole people; the experts of 1999 named the Cham, the Vietnamese and the Buddhist monkhood and left the Khmer national group open; the court of 2018 found genocide against the Cham and the Vietnamese only, and one of its judges wrote that the narrow charge was never explained."
    confidence: "high: each row is a group named in a held extract, and a name is either there or not; what the count cannot say is which producer is right"
    against: "the three answers are not on one question: the 1979 decree-law defined genocide to include evacuation, forced labour and the abolition of religion, the experts applied the 1948 Convention's groups, and the court answered only the charges the Closing Order brought, so the lists differ partly because the definitions did"
    result: 3
    derivation:
      compute: distinct
      column: producer
      columns: [producer, year, group, held]
      rows:
        - {producer: prk-state, year: 1979, group: "the whole people, all social strata", held: "genocide under Decree-Law No 1 of 15 July 1979", extract: src-prt-1979.secjudgment}
        - {producer: un-experts, year: 1999, group: "the Cham", held: "a protected group; genocide to be investigated", extract: src-un-goe-1999.para63}
        - {producer: un-experts, year: 1999, group: "the Vietnamese", held: "a protected group; genocide to be investigated", extract: src-un-goe-1999.para63}
        - {producer: un-experts, year: 1999, group: "the Buddhist monkhood", held: "a protected group; genocide to be investigated", extract: src-un-goe-1999.para63}
        - {producer: un-experts, year: 1999, group: "the Khmer national group", held: "a national group; the question left to a tribunal", extract: src-un-goe-1999.para65}
        - {producer: eccc, year: 2018, group: "the Cham", held: "genocide by killing, found", extract: src-eccc-002-02-summary.para30}
        - {producer: eccc, year: 2018, group: "the Vietnamese", held: "genocide, found", extract: src-eccc-002-02-summary.para34}
        - {producer: eccc, year: 2018, group: "the Khmer national group", held: "not charged; the narrow focus never explained (separate opinion)", extract: src-eccc-002-02-tj.para4468}
