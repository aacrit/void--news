# ------------------------------------------------------------- the thesis's own analysis
analyses:
  - id: an-toll-counts
    title: Every count of the dead the record carries
    method: "One row per figure that a fetched Tier A document or open Tier B study gives for the number who died under the regime, with the producer, the year of the count and the document; a range stated in a source is entered as a low row and a high row, and a figure the source prints in words is entered as digits. The result is the range of the column."
