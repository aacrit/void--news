      - extract: sectruth
        shows: "Gorbachev's closing words: 'by no means will we agree to hide the truth'"
        does_not_show: "whether that happened; the Ukrainian national report says the information was concealed (src-ukraine-national-report-2006.p8)"

  - id: src-insag7-1992
    tier: A
    kind: report
    author: International Nuclear Safety Advisory Group (INSAG), IAEA
    title: "The Chernobyl Accident: Updating of INSAG-1 (INSAG-7), Safety Series No. 75-INSAG-7"
    container: null
    publisher: International Atomic Energy Agency
    place: Vienna
    year: 1992
    edition: "the IAEA's PDF, a scan with an OCR text layer; Annex I prints in English the 1991 report of a Commission of the USSR State Committee for the Supervision of Safety in Industry and Nuclear Power (SCSSINP)"
    volume: null
    document_number: "Safety Series No. 75-INSAG-7"
    identifiers: {isbn: null, doi: null, archive_org: null, hathitrust: null, url: "https://www-pub.iaea.org/MTCD/publications/PDF/Pub913e_web.pdf"}
    access:
      free_copy: "https://www-pub.iaea.org/MTCD/publications/PDF/Pub913e_web.pdf"
      verified_at: 2026-10-07
      verified_by: document-fetch
      verified_title: "SAFETY SERIES No. 75-INSAG-7. INSAG-7 The Chernobyl Accident: Updating of INSAG-1 (the PDF's title page)"
    language: en
    region_of_authorship: global
    producer: iaea-insag
    position: null
    perspective: iaea-who-consensus
    rights: copyright
    holds:
      - extract: p1
        shows: "INSAG's account of the Soviet presentation in Vienna, 1986: 'a low probability coincidence of a number of violations of rules and procedures by the operating staff'"
        does_not_show: "the Soviet report's own words; those are in p60"
      - extract: item2
        shows: "INSAG-7's revised finding: the concurrence of reactor physics, control-element design and a state not specified by procedures"
        does_not_show: "the event YAML's notable quote, which paraphrases this sentence ('origins ... not only in the operators but in the design') and is not in the report"
      - extract: item4
        shows: "the rod defect discovered at Ignalina in 1983, not corrected and not followed up"
        does_not_show: "the 18-second insertion time the event YAML gives; no held extract carries it"
      - extract: item6
        shows: "INSAG-1's weight on 'the Soviet view ... which laid blame almost entirely on actions of the operating staff' is lessened, yet critical operator actions were 'most ill judged'"
        does_not_show: "an acquittal of the operators; INSAG keeps the human factor as a major element"
      - extract: p60
        shows: "the VERBATIM sentence of the USSR's August 1986 report to the IAEA, as a later Soviet state commission quotes it: 'the prime cause of the accident was an extremely improbable combination of violations of instructions and operating rules committed by the staff of the unit', and that commission's judgement that all causes 'were reduced exclusively to personnel errors'"
        does_not_show: "the 1986 report itself; it is read here through the 1991 SCSSINP Commission in INSAG-7's English (the 1986 report and INSAG-1 are gaps)"

