    container: "Top Secret Chernobyl (National Security Archive Electronic Briefing Book, 2019), document 12"
    publisher: National Security Archive, George Washington University
    place: Washington
    year: 1986
    edition: "translated by Svetlana Savranskaya for the National Security Archive; the letter covers his visit 'From May 4 to 9' and is signed 'V. Gubarev, Pravda Science editor'; the briefing book dates it May 10, 1986"
    volume: null
    document_number: "NSA doc 12"
    identifiers: {isbn: null, doi: null, archive_org: null, hathitrust: null, url: "https://nsarchive.gwu.edu/sites/default/files/documents/6279556/National-Security-Archive-Doc-12-Letter-from.pdf"}
