        shows: "Gorbachev: nothing was ready, 'Weddings were celebrated in the vicinity. Kids were playing outdoors.'"
        does_not_show: "where or when the weddings were; the script's 'weddings that afternoon' is not in this text"
      - extract: secblame
        shows: "Gorbachev, inside the Politburo, in July 1986: the personnel are to blame, 'but the scale of the accident is due to the design of the reactor'"
