# The evidence ledger for chernobyl-disaster (docs/proposals/HISTORY-THESIS-PAGE.md §3, §4c, §8).
# Begun 2026-10-07 for the documentary: the sources a 15-minute episode with five perspectives
# at parity may read from (the Soviet state's account; the liquidators and the evacuated; the
# IAEA/WHO consensus; the critics' higher estimates; Ukrainian and Belarusian national memory),
# and the record its narration is checked against. Every entry was fetched on 2026-10-07 from
# the URL it names; every extract under extracts/ was sliced from the fetched copy by a builder
# script (start marker to end marker; scratch out/ledger-chernobyl/build.py), never retyped.
# Nothing here was written from memory. Where a PDF is a scan with an OCR layer (INSAG-7, the
# Ukrainian national report) the extract was compared line by line with the rendered page and
# the note says what, if anything, was corrected. A Russian extract carries a Void translation
# beside it (*.en.txt), never presented as a published quotation.
#
# Each entry names the perspective it serves (`perspective`) and, under `holds`, what each of
# its extracts shows and does not show. The DEATH TOLL is held as each producer's own figure
# with the producer's own method (`death_toll_ranges` below): it is not averaged, and no range
# here is a Void estimate.
#
# This is NOT a thesis ledger: no positions, contested claims, exhibits or analyses are
# adjudicated here, and the event renders the Hearing. The bar of §4e is not claimed.
#
# Five quotations the event YAML or the live script carries were checked against the documents
# they name, or the nearest primary text, and are NOT held in the form the record gives them
# (see gaps:). Two of them diverge from the document they name: Gorbachev's 2006 sentence, and
# the INSAG-7 finding presented as a quotation. Three are paraphrases with no verbatim source.
slug: chernobyl-disaster
bootstrapped: 2026-10-07

