# Each producer's figure, its method and its population, as the held extracts give them.
# NOT averaged, NOT reconciled, and no Void estimate. Read with the extract named.
death_toll_ranges:
  - producer: Soviet record, 28 April 1986 (src-nsa-politburo-19860428.secdolgikh)
    figure: "one died, one not found"
    counts: "deaths at the plant reported to the Politburo two days after the explosion"
    method: "report from the site"
  - producer: UNSCEAR 2000 (src-unscear-2000-annex-j.para12)
    figure: "five firefighters"
    counts: "deaths caused by the firefighting actions"
    method: "medical records summarised by UNSCEAR"
  - producer: UNSCEAR 2008 (src-unscear-2008-annex-d.p64, p64-65)
    figure: "28 of 134 ARS cases fatal; 15 thyroid-cancer deaths by 2005; no projection of total deaths"
    counts: "observed deaths only"
    method: "observation; the Committee declines to project absolute numbers at low dose"
  - producer: Chernobyl Forum 2006 (src-chernobyl-forum-2006.p16)
    figure: "up to four thousand fatal cancers"
    counts: "the 600,000 most exposed (liquidators, evacuees, residents of the most contaminated areas)"
    method: "projection from risk estimates of other exposed populations; under one per cent difference projected for 5 million elsewhere, not counted"
  - producer: WHO joint news release 2005 (src-who-iaea-undp-20050905.para1-2)
    figure: "up to 4000; fewer than 50 directly attributed by mid-2005"
    counts: "as the release states, without naming the population"
    method: "the Forum's projection"
  - producer: IARC 2006 (src-iarc-2006.secconclusions, secuncertainty)
    figure: "about 16,000 cancer deaths by 2065 (95% UI 6,700 to 38,000)"
    counts: "570 million people in 40 European countries"
    method: "BEIR VII risk projection models applied to updated dose estimates"
  - producer: TORCH 2006 (src-torch-2006.secestimates)
    figure: "30,000 to 60,000 excess cancer deaths"
    counts: "worldwide collective dose of 600,000 person sieverts"
    method: "collective dose times a fatal-cancer risk factor; the range is the choice of factor"
  - producer: Greenpeace 2006, citing Malko 2006 (src-greenpeace-2006.p23)
