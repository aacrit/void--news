        does_not_show: "graphite scraped off with boots, which no held extract carries"
      - extract: para14
        shows: "about 5,000 t of material dropped, about 1,800 helicopter flights"
        does_not_show: "the event YAML's 'over 5,000 tons of sand, clay, lead, and boron': UNSCEAR gives approximately 5,000 t, dumped from 27 April to 2 May, of boron compounds, lead, sand and clay, dolomite and other materials"
      - extract: para68
        shows: "the firemen had no dosimeters; staff film badges could not register more than 20 mSv"
        does_not_show: "individual doses"
      - extract: para92
        shows: "Pripyat 49,360 persons; decision to evacuate at 22:00 on 26 April; nearly 1,200 buses arranged; the evacuation 14:00 to 17:00 on 27 April"
        does_not_show: "where the buses came from (the event YAML says Kyiv; this paragraph does not) or what residents were told to pack"

