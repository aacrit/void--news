    producer: soviet-press-witness
    position: null
    perspective: liquidators-evacuees
    rights: copyright
    holds:
      - extract: item1
        shows: "an eyewitness inside the system: the radiation situation in Pripyat 'was clear within an hour'; no evacuation plan; nobody took responsibility"
        does_not_show: "the hour of the evacuation decision (UNSCEAR gives 22:00 on 26 April; the Ukrainian report says Moscow postponed it)"
      - extract: item2
        shows: "soldiers and helicopter pilots without protective clothing"
        does_not_show: "doses received"
      - extract: item4
        shows: "civil defence 'completely paralyzed', 'not even any working dosimeters'"
        does_not_show: "the plant staff's own badges (UNSCEAR 2000 para. 68)"
      - extract: item5
        shows: "the firefighters 'performed marvelously' but lacked uniforms for radiation"
        does_not_show: "names or deaths; the letter's last section names Telyatnikov, Pravik and Kibenkov, not held"
      - extract: item9
        shows: "panic in Kiev 'primarily because of the absence of information'"
        does_not_show: "the May Day parade, which this letter does not mention"

