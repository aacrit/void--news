# ------------------------------------------------------------- recordings
# Archival audio artifacts (docs/proposals/HISTORY-AUDIO-ARCHIVAL.md §4a). A recording is a
# factual claim four times over: this speaker, this occasion, this date, these words. Every
# `*_as_stated` field is copied from the Library's item page as read in a browser on
# `fetched_at`, never from memory. `transcript` is verbatim from the ledger extract named in
# `transcript_extract`. `verification` names the record pipeline/history/verify_clip.py
# wrote; its WER, coverage, excerpt sha256 and verified_at are the check's, never hand-typed.
# `signed_by` / `signed_at` are the CEO's, per clip, and nothing plays in an episode until
# both are set (policy B, §2). All three rows are windows on ONE recording, the White House
# recording of the address of 22 October 1962; each is left UNSIGNED for the CEO.
recordings:
