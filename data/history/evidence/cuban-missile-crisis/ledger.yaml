# The evidence ledger for cuban-missile-crisis (docs/proposals/HISTORY-THESIS-PAGE.md §3, §4c, §8).
# Begun 2026-10-04 for the cinematic Orpheus episode (docs/proposals/HISTORY-AUDIO-ARCHIVAL.md,
# policy B; docs/proposals/HISTORY-FIRST-LISTENER.md): the sources the script's document voice
# reads from, the record its narration is checked against, and the recordings it may play.
# Every entry was fetched on 2026-10-04 from the URL it names; every extract under extracts/
# was sliced from the fetched copy by a builder script (start marker to end marker), never
# retyped. Nothing here was written from memory. Two hosts could not be read by a plain
# fetch: the JFK Library answers it with a 403 challenge page and was read in a browser; the
# UN Digital Library answers it with an empty 202 and its PDF was fetched from inside the
# record page in a browser. digitalarchive.wilsoncenter.org did not resolve at all from this
# machine on the day, so its documents are known here through the Cold War International
# History Project Bulletin, which prints the same translations. The National Security
# Archive's scanned PDFs carry no text layer, so they are listed under gaps and known here
# through the Archive's own pages and the Bulletin.
# This is NOT a thesis ledger: no positions, contested claims, exhibits or analyses are
# adjudicated here, and the event renders the Hearing. The bar of §4e is not claimed.
# Continued 2026-10-07 (same method, builder out/ledger-cuban/build_extracts.py): the JFK
# Library's Cuban Missile Crisis pages (microsites.jfklibrary.org/cmc/), which answer a plain
# fetch, supply Castro's letter of 26 October in English and Khrushchev's letter of 23 October;
# the Bulletin's own documents (Zorin, Dobrynin, Castro's 1968 speech, Shakhnazarov's notes,
# Kramer) are held as entries of their own, because the Bulletin entry already holds the five
# extracts a copyrighted work may carry; the National Security Archive's 2008 Dobbs postings,
# its 2013 briefing book on the warheads and its 2023 briefing book on the Jupiters are added.
# digitalarchive.wilsoncenter.org still did not resolve (a CNAME to Cloudflare with no address
# record, by dns.google and cloudflare-dns.com on 2026-10-07), so the rest of the Castro-
# Khrushchev correspondence stays a gap. Where two held sources disagree, both are held and
# the disagreement is listed under `disagreements` at the end, unadjudicated.
slug: cuban-missile-crisis
