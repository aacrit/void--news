# ------------------------------------------------------------- disagreements held, not adjudicated
# Where two held sources disagree, both are held. This is a list for the writer, not a verdict
# (no positions are adjudicated in this ledger).
# 1. What Castro asked for on 26 October. The letter (src-castro-khrushchev-19621026.secopinion)
#    urges that after an invasion 'the moment to eliminate this danger forever' had come, 'in an
#    act of the most legitimate self-defense', and never names a Soviet nuclear act; the JFK
#    Library's summary of the day says he 'urges Nikita Khrushchev to initiate a nuclear first
#    strike' (src-jfkl-cmc-19621026.secday). Castro in 1968 (src-castro-cc-19680126.p86) calls Khrushchev's reading of it
#    'insinuations of a nuclear strike in the sense that we had advised the USSR to attack the
#    United States'; in 1987 (src-shakhnazarov-castro-19871105.p87) he describes the letter as
#    saying 'we should not allow the Americans to deliver a first strike'.
# 2. When the time for Turkey was set: Dobrynin reports Robert Kennedy saying 'we need 4-5
#    months' (src-cwihp-bulletin-5.p80); the Archive's 2002 release says '4-5 months'
#    (src-nsa-press-20021011.sec2); the sentence crossed out of Robert Kennedy's own memorandum
#    says 'four or five months' (src-frus11-d96.fn2). None says six. McNamara's note of 25 April 1963 says the last
#    Jupiter in Turkey 'came down yesterday' (src-nsa-jupiter-2023.secturkey).
# 3. Who was responsible for the U-2: the Library's summary says 'a Soviet-supplied
#    surface-to-air missile' (src-jfkl-cmc-19621027.secday); Castro in 1987 says 'a Soviet
#    anti-aircraft missile', ordered most probably below Pliyev, and that Khrushchev 'accused us'
#    (src-shakhnazarov-castro-19871105.p88); Kramer says Moscow 'mistakenly thought that Castro
#    had ordered Soviet troops to fire' (src-kramer-1995.p112).
# 4. The pilot's name: 'Rudolph' and 'Rudolf' on one Library page (src-jfkl-cmc-19621027.secday);
#    'Rudolf' in the Public Papers note (src-app-homestead-19621126.secnote) and the Archive.
# 5. The ships on 24 October: the Archive's Dobbs posting says the missile-carrying ships 'were
#    at least 500 nautical miles from the closest American warship' and that the 'eyeball to
#    eyeball' claim was incorrect (src-nsa-dobbs-eyeball-2008.secclaim, .secships); the same
#    paragraph quotes Rusk as 'we were eyeball to eyeball, and the other fellow just blinked',
#    where the event YAML has 'We're eyeball to eyeball, and I think the other fellow just
#    blinked'. That sentence is not held as an extract: the posting is not a source for Rusk's
#    words, and no source for either wording is held.
# 6. Medium-range missiles: 'a total of 42' by later photography (src-nsa-press-20021011.sec1)
#    against 36 R-12 warheads aboard Indigirka (src-nsa-ebb449.sectimeline). A missile count and
#    a warhead count are different counts; they are listed so neither is read as the other.
# 7. Warheads: 98 tactical warheads left on Arkhangelsk and 36 R-12 warheads on Aleksandrovsk
#    (src-nsa-ebb449.seccargo); Indigirka brought 90 and Aleksandrovsk 68, of which the 24 R-14
#    warheads were never unloaded (src-nsa-ebb449.sectimeline). No held source states 162.
#    Aleksandrovsk arrived on 25 October by the essay and on 23 October by the chronology.
# 8. When the tactical weapons became known: Gribkov 'revealed their presence' at the Havana
#    conference of January 1992 (src-nsa-ebb449.secgribkov); the Archive's 2002 releases are
#    about further documents (src-nsa-press-20021012.sec1).
# 9. Soviet troops: Castro in 1968 says 'over 40,000' (src-castro-cc-19680126.sectroops); the
#    event YAML's 42,000 rests on a source not held (src-fursenko-naftali-1997, a gap).
# 10. B-59: the only held account of the torpedo is Orlov's, as the Archive's editors summarise
#    it, with their note that 'the other submarine commanders do not believe' Savitsky gave the
#    order (src-nsa-ebb75.secorlov). It has Arkhipov, 'Deputy brigade commander', calming
#    Savitsky; no held source states a rule requiring three officers' consent.
