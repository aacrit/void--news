# ------------------------------------------------------------- disagreements held, not adjudicated
# Where two held sources disagree, both are held. A list for the writer, not a verdict.
# 1. Who asked 'when'. The CWIHP English has 'Question: (many voices)' and 'Question: When does it
#    come into effect?' with no name (src-cwihp-doc8-19891109.secwhen); Ehrman (ANSA) is named only
#    for an earlier question about 'mistakes' (.secehrman). Hertle's revised German transcription
#    names Janowski (Voice of America), Brinkmann (Bild) and Niemeyer (DAPA), the last 'basierend
#    auf der eigenen Aussage' with no independent confirmation (src-cdm-pk-19891109.secwann,
#    .secantwort, .fn1). The YAML and the live script give the question to Ehrman.
# 2. Whether Schabowski read 'immediately' or said it. The transcripts show him looking through
#    his papers and a murmured prompt (secanswer; secantwort 'leiser Zuruf: unverzüglich'); the
#    National Security Archive's editors write that he 'read from his briefing papers the words'
#    (src-nsa-ebb490-2014.secread). The draft itself says 'Starting immediately' in point 2 and
#    dates the press release 10 November in point 3 (src-cwihp-doc6-19891109).
# 3. How many at the crossings, when. Volkspolizei report, 8.15 p.m.: 80 people at three
#    crossings (src-cdm-chronicle-198911.sec2015); 9.30 p.m.: 500 to 1,000 at Bornholmer
#    (.sec2130); 11.30 p.m.: 'Thousands' (.sec2330). The YAML's 'By 8:00 p.m., thousands' is none of these.
# 4. The opening at Bornholmer: Hertle, controls ceased at 11:30 p.m. by the controllers' own
#    decision (src-hertle-cwihp-2001.p138); the Chronicle's 11.30 p.m. entry describes the pressure,
#    not the opening. Jäger is 'head of Ministry of Security passport control' in the Chronicle's link
#    captions (not in a held extract) and 'stellvertretender Leiter der Passkontrolleinheit' in t-online
#    (src-tonline-jaeger-2019.secintro).
# 5. The dead at the Wall: at least 140 (Hertle and Nooke, by a stated criterion that includes
#    30 non-escapees, one Soviet soldier and eight border soldiers) against 78, 86, 92, 122 and
#    'more than 200' (Working Group 13 August) by earlier counts (src-hertle-nooke-2017.p1, .secdefinition,
#    .p2, .p3); 251 deaths at checkpoints counted apart (.seccheckpoints). Not averaged.
# 6. First and last: Siekmann, fatally injured 22 August 1961 (src-cdm-victims-s); Litfin, the
#    first shot dead, 24 August 1961 (src-cdm-victims-l); Gueffroy, the last shot dead, 5 February
#    1989 (src-cdm-victims-g; the YAML says 6 February); Freudenberg, the last death, 8 March 1989
#    (src-cdm-victims-f).
# 7. Leipzig: 1,200 on 4 September (src-cdm-chronicle-198909.sec0904; the YAML says 1,000);
#    300,000 on 23 October (src-cdm-chronicle-198910.sec1023; the YAML says 30 October).
# 8. Soviet troops: 350,000 men (src-cdm-chronicle-198911.secsnetkov) against the YAML's 380,000.
# 9. Soviet non-intervention, decision or absence: 'instructions from Moscow' to leave them in
#    barracks (secsnetkov, 10 November); Gorbachev in 2014, a 'unanimous' decision 'not to let our
#    troops leave their garrisons' (src-rbth-gorbachev-2014.secgarrisons); Hertle, the Soviet
#    leadership 'sound asleep' during the night (src-hertle-cwihp-2001.secmoscow); Shevardnadze,
#    recalled, 'we only rejected one possibility from the beginning, that of the use of force'
#    (secforce, at second hand). The YAML's 'received no instructions' is not held.
# 10. The NATO assurance: Baker's 'not one inch eastward' and the Soviet record's 'not an inch of
#    NATO's present military jurisdiction' (src-nsa-nato-2017.seclead, .secdoc06); Gorbachev in
#    2014: 'not discussed at all', the assurance concerned the GDR's territory, but expansion was
#    'a violation of the spirit' (src-rbth-gorbachev-2014.secnato, .secspirit); Kramer calls the
#    pledge a 'myth', Shifrinson a double game (src-nsa-nato-2017.secpanel); the treaty is silent
#    beyond Germany (src-two-plus-four-19900912.art6).
# 11. The Treuhand: about 8,000 enterprises (src-bt-wd-treuhand-2019.secowner) against the YAML's
#    8,500; 14,500 privatised (secintro) counts enterprises and parts after splitting, a different count.
# 12. Panama: 202 civilians (Southern Command) / 300 to 600 / more than 2,000 / at least 300
#    (src-iachr-121-18.para135, .para22, .para120); military dead 314 (para22) or 'fewer than
#    100' (para135) inside the same report.
# 13. The critics among themselves: Mau, 'The one side feels colonized' as a description of a
#    feeling, and his distance from the claim that East Germans are a 'product' of the West
#    (src-mau-2024.p3, .p6), against the YAML's 'colonization' as the critics' thesis.
