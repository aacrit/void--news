# The evidence ledger for fall-of-berlin-wall (docs/proposals/HISTORY-THESIS-PAGE.md §3, §4c, §8).
# Begun 2026-10-09 for the Orpheus episode and its writer brief (out/briefs/fall-of-berlin-wall.brief.md):
# the sources the script's document voice may read from and the record its narration is checked
# against. Every entry was fetched on 2026-10-09 from the URL it names; every extract under
# extracts/ was sliced from the fetched copy by a builder script (start marker to end marker,
# out/ledger-fall-of-berlin-wall/build.py), never retyped, with the copy's whitespace collapsed
# and that said in a note. Nothing here was written from memory. A work the free record could
# not reach is listed under `gaps`, by name, with what was tried.
# Translation provenance: every English text of a German or Russian original names its
# translator in the entry (Sargeant for the CWIHP documents, Zubok and Melyakova for Chernyaev,
# Savranskaya for the Gorbachev-Kohl record, Riemer for Kohl, Brown and Cooper for the New Forum,
# Burnett for Mau, the State Department for the treaty); the RBTH interview names none. German
# extracts are held in German and NO English rendering is held, official or Void's: nothing here
# may be read in the document voice in a translation this ledger made.
# Five perspectives at parity: West German/NATO (Reagan, Bush, Kohl, the treaty); East German
# citizens' movement (New Forum, the election and accession record, Jäger); Soviet (Chernyaev,
# the Gorbachev-Kohl record and message, Gorbachev in 2014, Shevardnadze as Hertle quotes him);
# reunification critics (Mau, the Bundestag research service, the unity report); Global South
# (the Non-Aligned Movement, the General Assembly, the Inter-American Commission).
# Hosts: digitalarchive.wilsoncenter.org did not resolve (no address record, by dns.google), and
# web.archive.org answered HTTP 429 to every fetch on the day, so the Wilson Center documents are
# held from the CWIHP Bulletin PDF on www.wilsoncenter.org, which prints the same translations.
# This is NOT a thesis ledger: no positions, contested claims, exhibits or analyses are
# adjudicated here, and the event renders the Hearing. The bar of §4e is not claimed.
