gaps:
  - entry: src-ddhc-1789-en
    what: "Article 1 of the Declaration as the event YAML quotes it (primary_source_excerpts) and the live script reads it in the document voice: 'Men are born and remain free and equal in rights. Social distinctions may be based only upon general usefulness.'"
    tried: ["https://www.conseil-constitutionnel.fr/en/declaration-of-human-and-civic-rights-of-26-august-1789", "https://avalon.law.yale.edu/18th_century/rightsof.asp", "https://revolution.chnm.org/d/295", "https://oll.libertyfund.org/quotes/liberty-in-the-french-declaration-of-the-rights-of-man-and-of-the-citizen-1789"]
    status: "No translation read carries the YAML's second sentence. The Conseil constitutionnel's English: 'Social distinctions may be based only on considerations of the common good.' Avalon (Yale): 'Social distinctions may be founded only upon the general good.' Hunt (1996), on the Liberty, Equality, Fraternity site: 'Social distinctions may be based only on common utility.' The Liberty Fund page answered HTTP 403. The French is held whole (src-ddhc-1789.art1: 'Les distinctions sociales ne peuvent être fondées que sur l'utilité commune'). Only the first sentence is held in English, because any English extract of the second sentence would fail the YAML's divergent excerpt under tests/test_history_quote_ledger.py, and this task may not alter the YAML. The YAML excerpt is therefore unpinned and withdrawn; the first sentence is appended as its own excerpt. Pin the whole article once the YAML excerpt is corrected to a held translation"
  - entry: src-robespierre-17940205
    what: "Robespierre's sentence on virtue and terror as the event YAML (primary_source_excerpts, and the Republican narrative) and the live script give it: 'If the basis of popular government in peacetime is virtue, the basis of popular government during a revolution is both virtue and terror.'"
    tried: ["https://revolution.chnm.org/d/413", "https://sourcebooks.fordham.edu/mod/robespierre-terror.asp", "https://sites.pitt.edu/~syd/terror.html"]
    status: "No translation read carries the YAML's wording. Bienvenu, on the Liberty, Equality, Fraternity site: 'If the mainspring of popular government in peacetime is virtue, amid revolution it is at the same time [both] virtue and terror: virtue, without which terror is fatal; terror, without which virtue is impotent.' The Internet Modern History Sourcebook (no translator named): 'If the spring of popular government in time of peace is virtue, the springs of popular government in revolution are at once virtue and terror: virtue, without which terror is fatal; terror, without which virtue is powerless.' The Pittsburgh page, which names its source as Raymond P. Stearns (ed.), Pageant of Europe (1947), pp. 404 to 405, and names no translator: 'If the basis of popular government in time of peace is virtue, the basis of popular government in time of revolution is both virtue and terror: virtue without terror is murderous, terror without which virtue is powerless.' That is the nearest to the YAML ('in peacetime', 'during a revolution') but not the same words. The YAML's Republican narrative adds 'virtue, without which terror is destructive; terror, without which virtue is impotent', which no translation read carries. Note that the three translations disagree on the clause the YAML omits: 'fatal' (Bienvenu, the Sourcebook), 'murderous' (Stearns); the French is 'funeste'. The French is held (src-robespierre-17940205.secterreur); no English of the sentence is held, for the reason given under src-ddhc-1789-en"
  - entry: src-robespierre-17921203
