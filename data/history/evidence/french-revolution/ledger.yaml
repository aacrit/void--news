# Each producer's figure, its method and its population, as the held extracts give them.
# NOT averaged, NOT reconciled, and no Void estimate. Read with the extract named. Figures
# held only at second hand say so.
death_toll_ranges:
  - producer: Greer 1935 (src-greer-1935.p26)
    figure: "16,594; 'if every death sentence of the period were known it is extremely doubtful that the total would reach 17,000'"
    counts: "death sentences of the period (the 'obituary census of the Terror'), exclusive of persons condemned in absentia and a few reprieved or escaped; ALL courts and commissions, not the Paris Revolutionary Tribunal alone, and not only by guillotine"
    method: "lists of victims by department or region, from court records, as monographs print them"
  - producer: Greer 1935 (src-greer-1935.p38)
    figure: "Paris 2,639 (16%); the provinces 13,955 (84%); the Loire-Inférieure 3,548 (21%)"
    counts: "the same death sentences, by where they were rendered"
    method: "the census of p. 26, distributed (his Table I)"
  - producer: Greer 1935 (src-greer-1935.p37)
    figure: "'at least ten or twelve thousand persons executed without trial' (a guess, his word); 'between thirty-five and forty thousand persons' in all"
    counts: "all who 'lost their lives as a consequence of terrorism', including those who died in the prisons and those killed without any form of trial"
    method: "'if the figures we have cited may be taken as a rough index'; he states 'the impossibility of determining with any degree of exactitude the total death roll'"
  - producer: Lallié, Fleury, and Vélasque and G. Martin, as Greer reports them (src-greer-1935.p35, p36)
    figure: "noyades of Nantes: 4,860 (Lallié); 2,800 (Fleury); 2,000 or less (Vélasque and Martin); against a 'tale of ten, twenty, or thirty thousand'"
    counts: "the drowned of Nantes"
    method: "at second hand; Greer accepts the last 'based on a careful analysis of the existing evidence'"
  - producer: Prudhomme 1797, as Jean-Clément Martin reports him (src-martin-2017.para1)
    figure: "2 022 903 dead 'du fait de la Révolution', of whom 120 000 in the Vendée, 184 000 in the colonies, 800 000 in the armies, and 18 613 'toutes causes confondues'"
    counts: "the whole Revolution, as Prudhomme framed it"
    method: "at second hand; Martin: figures 'avancés sans preuves', discredited by his partisan positions"
  - producer: Berriat-Saint-Prix (nineteenth century), as Martin reports him (src-martin-2017.para2a)
    figure: "14 807"
    counts: "condemned to death judicially"
    method: "at second hand; not described"
  - producer: Greer as Martin reads him (src-martin-2017.para2a, para2b)
    figure: "16 594 tried and executed; 10 000 to 12 000 deaths in prison; a similar number killed without trial; 35 000 to 40 000 in all"
    counts: "as Martin states them"
    method: "Martin's summary. Greer's own p. 37 gives 'ten or twelve thousand' for those executed WITHOUT TRIAL and gives no separate prison figure on the pages held. The two readings differ: say Greer's, from Greer"
  - producer: Hussenet 2007, as Rolland-Boulestreau reports him (src-rolland-boulestreau-2024.fn85)
    figure: "170 000 at the least, 220 000 at the most"
    counts: "the Vendée war, 'Bleus et Blancs confondus' (republicans and insurgents together)"
    method: "at second hand; Hussenet's 'Quel bilan ?' is not held"
  - producer: Hussenet 2007, as Biard and Linton report him (src-biard-linton-2020.fn14)
    figure: "up to a maximum of 50 000 men"
    counts: "republican losses in the Vendée war"
    method: "at second hand"
  - producer: the event YAML and the live script (not a held source)
    figure: "'an estimated 16,594 people by guillotine' by 'the Revolutionary Tribunal'; '~40,000 executed'; '170,000-250,000 in the Vendee'; '600,000-1,000,000' for the whole period"
    counts: "as written"
    method: "no held source carries the tribunal-and-guillotine framing (Greer's 16,594 is all courts, and Paris is 2,639), the upper 250,000 for the Vendée, or the 600,000 to 1,000,000"

