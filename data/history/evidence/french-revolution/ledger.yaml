# The evidence ledger for french-revolution (docs/proposals/HISTORY-THESIS-PAGE.md §3, §4c, §8).
# Begun 2026-10-09 for the History episode's writer brief: the sources its document voice
# may read from and the record its narration is checked against. Every entry was fetched on
# 2026-10-09 from the URL it names; every extract under extracts/ was sliced from the fetched
# copy by a builder script (start marker to end marker, out/ledger-french-revolution/build.py),
# never retyped. Whitespace runs are collapsed to single spaces and nothing else is changed;
# where a scan's OCR layer is the free copy the extract keeps the layer's glyphs (long s read
# as f, misreadings) and says so in a note. Nothing here was written from memory.
#
# Translations. A French extract that the episode may need in English carries a rendering
# beside it (`<extract>.en.txt`): every rendering in this ledger is a Void translation, made
# here at $0 and never to be presented as a published quotation. Where a PUBLISHED English
# translation is held, it is its own entry with its translator named (the Conseil
# constitutionnel's English of the 1789 Declaration; Whitcomb 1899 for Sieyes; Hunt 1996 for
# Olympe de Gouges; Bienvenu as the Liberty, Equality, Fraternity site prints him for
# Robespierre; Dubois and Garrigus for the Haitian declaration; Cocks for Michelet; Bonner for
# Tocqueville). Three passages the event YAML already quotes in an English that no held
# translation carries are held in French ONLY, deliberately (see gaps): article 1 of the
# Declaration (second sentence), Robespierre's sentence on virtue and terror, and his
# "Louis must die". An English text of any of them would sit within a few words of the YAML's
# divergent excerpt and fail tests/test_history_quote_ledger.py, and this task may append to
# the YAML but not alter it.
#
# This is NOT a thesis ledger: no positions, contested claims, exhibits or analyses are
# adjudicated, and the event renders the Hearing. The bar of §4e is not claimed. The death
# counts are carried below as each producer's figure with its method, never averaged.
