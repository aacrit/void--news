positions:
  - id: haitian-national
    name: The Haitian national account
    holders: ["Dessalines and the generals, in the proclamation and the Act of 1 January 1804 and the proclamation of April 1804 as Madiou prints them", "the Chamber of Representatives of 1826", "Madiou (1847 to 1848)", "Saint-Rémy (1853)", "Joachim (1975)", "Mezilas (2009)"]
    rests_on: [src-madiou-1847-t1, src-madiou-1847-t2, src-madiou-1848-t3, src-saint-remy-1853, src-haiti-loi-18260226, src-haiti-adresse-18260510, src-joachim-1975, src-mezilas-2009]
    claim: "The people of Saint-Domingue freed themselves, declared independence at Gonaïves by an oath of the generals, avenged the cruelties of the French, abolished slavery for ever in their constitution, and were made to pay France for a recognition that France imposed with a squadron."
    omits: "The date and place of the ceremony of August 1791, which Madiou tells as a meeting at Lenormand and not as a sacrifice; the killing of the French civilians of 1804, which Madiou counts and defends; and the text of the treaties of 1838."
    adjudications:
      - claim: "On 1 January 1804 the general in chief and the assembled generals swore at Gonaïves to renounce France for ever, and the Act carries their names."
        verdict: qualified
        basis: presence
        rests_on: [src-madiou-1848-t3.p117, src-dubois-garrigus-2006.sec21, src-us-act-18060228.sec1, src-lentz-2003.abstract]
        reasoning: "The Act and its signatures are held here only as Madiou prints them and as Dubois and Garrigus translate them; the one Tier A artifact on the point is the United States statute of 1806, which speaks of parts of the island not in possession of France and does not name the Act. The National Archives' original was not fetched, so the verdict is qualified."
      - claim: "France imposed the indemnity by an ordinance, and Haiti's legislature declared 150,000,000 francs a national debt."
        verdict: supported
        basis: presence
        rests_on: [src-ordonnance-18250417.p258-259, src-haiti-loi-18260226.p353, src-haiti-adresse-18260510.p456-457]
        reasoning: "The ordinance's own text, as the Haitian Recueil reprints it, concedes independence on the condition of the payment; the law of 26 February 1826 and the Chamber's address of 10 May 1826 declare the sum a national debt and vote a contribution to pay it. Two producers, the French crown and the Haitian legislature, agree on the terms."
  - id: french-imperial
    name: The French imperial account
    holders: ["Bonaparte, in the correspondence of October and November 1801", "the Corps législatif of 30 floréal an X", "Lacroix (1819)"]
    rests_on: [src-napoleon-corr-7, src-loi-30-floreal-anx, src-lacroix-1819]
    described_by: [src-saint-remy-1853.p83, src-lentz-2003.abstract]
    claim: "The expedition went to restore the sovereignty of the French people over a colony whose governor had made his own constitution; the liberty of the blacks was guaranteed by proclamation, and the government of the blacks, not their liberty, was what had to be annihilated."
    omits: "The law of 30 floréal an X, which maintained slavery where Amiens restored it and left Saint-Domingue unnamed; and what Leclerc wrote from the colony, which this ledger could not read."
    adjudications:
      - claim: "The expedition's purpose was to restore French sovereignty, and the liberty of the blacks was guaranteed."
        verdict: qualified
        basis: presence
        rests_on: [src-napoleon-corr-7.item5859, src-napoleon-corr-7.item5863, src-napoleon-corr-7.item5874, src-loi-30-floreal-anx.whole]
        reasoning: "The proclamation of 8 November 1801 says the Republic gave the blacks their liberty and will not let it be taken; the note to Talleyrand of 13 November says the course taken is to annihilate the government of the blacks at Saint-Domingue and that their liberty, recognised, would be a point of support for the Republic; the Exposé of 22 November says there are no more slaves at Saint-Domingue and all will stay free, while Martinique keeps slavery. The law of 30 floréal an X then maintains slavery in the colonies restored by Amiens and beyond the Cape, and does not name Saint-Domingue. Every document here is the French state's own, so under Rule A the verdict is capped at qualified: the papers show a guarantee of liberty and an intention to destroy the black government stated in the same fortnight, and a law that restores slavery elsewhere without naming the colony."
  - id: colonist-and-claimant
    name: The colonists' and claimants' account
    holders: ["Dalmas (1814)", "Edwards (1797)", "Barbé-Marbois, in the Chambre des Pairs (1826)", "the ordinance of 17 April 1825, which names the former colonists as the indemnity's object"]
    rests_on: [src-dalmas-1814, src-edwards-1797, src-barbe-marbois-1826, src-ordonnance-18250417]
    described_by: [src-eugene-2003.abstract, src-garran-1797-t1.p212-213]
    claim: "The rising of 1791 was planned by the slaves' chiefs and sealed by a blood sacrifice; it destroyed the plantations and killed the whites; the colonists' property was lost, and the indemnity of 1825 was owed to them for it."
    omits: "The regime of the plantations that the rising answered, which Dalmas and Edwards describe as their own losses; and who paid the indemnity."
    adjudications:
      - claim: "The rising of August 1791 was planned days ahead at Lenormand and preceded by a sacrifice at the Caïman wood on the Choiseul plantation."
        verdict: qualified
        basis: presence
        rests_on: [src-garran-1797-t1.p212-213, src-dalmas-1814.p117-118, src-madiou-1847-t1.seclenormand]
        reasoning: "The Convention's commission reports the rumour of three days a week, the slaves of Turpin and Flaville fetching those of Clément at ten in the evening, the chiefs Boukmans and Auguste, and the fire beginning towards midnight; it reports no ceremony. Madiou reports a meeting of delegates at Lenormand that fixed the night of the 22nd, and no sacrifice. Dalmas alone carries the sacrifice, and he places it after the plan was fixed at Le Normand and before it was carried out, without a date. One Tier A producer, the commission, on the plan; the ceremony rests on a colonist's memoir alone: qualified."
  - id: french-republican-scholarship
    name: The French republican account and its scholarship
    holders: ["Sonthonax and Polverel, in the proclamations of 1793", "Garran de Coulon, for the Convention's commission (1797)", "Dorigny (2003)", "Gainot and Macé (2003)", "Lentz (2003)", "Schneider (2002)", "Pluchon (1992)"]
    rests_on: [src-sonthonax-17930829, src-commissaires-17930702-fr, src-commissaires-17930702-ht, src-garran-1797-t1, src-dorigny-2003, src-gainot-mace-2003, src-lentz-2003, src-schneider-2002, src-pluchon-1992]
    claim: "The Republic's commissioners freed the enslaved of the North in August 1793 under a labour regime; the Consulate's choices of 1801 and 1802 were disastrous and broke with the revolutionary legacy; the defeat of 1803 was the colonial authorities' own doing more than the fever's."
    omits: "That the commissioners' freedom bound the freed to their former masters' plantations by its own articles; and the voices of the freed themselves, whom the proclamations address and do not quote."
    adjudications:
      - claim: "The civil commissioner declared the enslaved of the North free on 29 August 1793, with a labour regime attached to the grant."
        verdict: supported
        basis: presence
        rests_on: [src-sonthonax-17930829.art2, src-sonthonax-17930829.art9, src-sonthonax-17930829.secsign, src-toussaint-procl-17970829.sec3]
        reasoning: "Article II declares all the negroes and people of mixed blood then in slavery free, article IX keeps those attached to the plantations of their former masters on them, and the broadside is dated at the Cap, 29 August 1793. Toussaint Louverture's proclamation of 1797 tells the cultivators of the inestimable gift of the liberty France gave them. Two producers, the commission and the general who had fought against it, on the grant."
  - id: anglophone-academic
    name: The anglophone and Atlantic account
    holders: ["Beard (1863)", "Nicholls (1978)", "Hoffmann (1990)", "Geggus (1997)", "Dubois and Garrigus, as translators of the declaration (2006)", "Yakubu and Opondo (2025)"]
    rests_on: [src-beard-1863, src-nicholls-1978, src-hoffmann-1990, src-geggus-1997, src-dubois-garrigus-2006, src-yakubu-opondo-2025]
    claim: "The revolution's founding texts and their afterlife are the subject: the name Haiti taken from an Amerindian past, the declaration read in translation, the ceremony read as history and as myth, and the insurgency read from Africa as the precursor of the acts of emancipation."
    omits: "The French and Haitian primary record in its own language, which this school reads in translation; and the counting of the dead, on which none of its holders in this ledger offers a figure."
    adjudications:
      - claim: "The United States suspended commerce with the parts of the island not under France in 1806 and did not authorise diplomatic representatives to Haiti until 1862."
        verdict: qualified
        basis: presence
        rests_on: [src-us-act-18060228.sec1, src-us-act-18620605.whole]
        reasoning: "The act of 28 February 1806 prohibits commercial intercourse with any part of the island of St. Domingo not in possession of France; the act of 5 June 1862 authorises the President to appoint diplomatic representatives to the republics of Hayti and Liberia. Both are the same producer's record, the Congress, so the verdict is capped at qualified."
  - id: the-indemnity-accountants
    name: The accountants of the indemnity
    holders: ["Eugène (2003)", "Blancpain (2003)"]
    rests_on: [src-eugene-2003, src-blancpain-2003]
    claim: "The ordinance of 1825 fixed the indemnity at cent cinquante millions de francs or, imposed in form though accepted in principle by Boyer; two treaties of 1838 separated recognition from the debt; and the sum paid, and later the loans, belong to their historical frames rather than to a claim of slavery's debts."
    omits: "The Haitian legislature's own acts of 1826, which declared the sum a national debt and voted the contribution, and which neither abstract mentions."
    adjudications:
      - claim: "The ordinance of 17 April 1825 fixed 150,000,000 francs in five equal annual terms, halved the duties for French ships, and conceded independence on those conditions."
        verdict: supported
        basis: presence
        rests_on: [src-ordonnance-18250417.p258-259, src-haiti-loi-18260226.p353, src-haiti-adresse-18260510.p456-457]
        reasoning: "The ordinance's article 2 sets the payment in five equal annual terms and its article 1 halves the duties for the French flag; the Haitian law of 26 February 1826 and the Chamber's address of 10 May 1826 state the sum as 150,000,000 francs. Two producers, the French crown and the Haitian legislature. The 1838 treaties are a gap, and the reduced balance is not stated here."

