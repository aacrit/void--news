  - id: an-slavery-documents
    title: What the acts of state in this ledger say about slavery in Saint-Domingue, 1793 to 1805
    method: "Every act of state this ledger holds that speaks to the status of the enslaved of Saint-Domingue, one row per act, in date order, with the producer and what the act says of Saint-Domingue: free where it declares the enslaved free or slavery abolished there, silent where it maintains slavery elsewhere and does not name the colony. The result is the share of rows that say free."
    finding: "Of the 6 acts of state held here that speak to slavery between 1793 and 1805, 5 declare the people of Saint-Domingue free, 2 of them issued by Bonaparte in November 1801; the 1 that maintains slavery, the law of 30 floréal an X, names the colonies restored by the treaty of Amiens and those beyond the Cape of Good Hope and does not name Saint-Domingue."
    confidence: "high for what each document says, which is read from its own text; the set is the ledger's, not the archive's, and the decree of 16 pluviôse an II is a gap"
    against: "the note to Talleyrand of 13 November 1801, held here, states the aim of annihilating the government of the blacks at Saint-Domingue in the same fortnight as the two documents that guarantee their liberty, so the count of what the acts say is not a count of what the government intended; and Sonthonax's freedom binds the freed to the plantations by its own article IX"
    result: 0.8333
    derivation:
      compute: share
      column: saint_domingue
      of: free
      columns: [date, act, producer, saint_domingue]
      rows:
        - {date: "1793-08-29", act: "Sonthonax's proclamation, article II", producer: french-civil-commission, saint_domingue: free, extract: src-sonthonax-17930829.art2}
