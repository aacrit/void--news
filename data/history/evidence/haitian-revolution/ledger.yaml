    title: The names on the Act of Independence, as Madiou prints it
    method: "Every name printed under Signé at the foot of the Acte de l'Indépendance in Madiou's tome III, page 117, one row per name, with the rank the print groups it under. Magloire Ambroise is counted as one name, because the second act on page 118 prints him as one; the print of page 117 sets a comma between the two words. The result is the count of rows."
    finding: "The Act as Madiou prints it carries 37 names: the general in chief, 6 generals of division, 12 generals of brigade, 5 adjudants-généraux, 2 chefs de brigade, 10 officers of the army and the secretary."
