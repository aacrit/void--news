  - id: an-expedition-ships
    title: The ships of the line Bonaparte told London were sailing
    method: "The letter to Talleyrand of 30 October 1801 (No. 5845) lists, port by port, the ships of the line and frigates that were to sail for Saint-Domingue; one row per port, ships_of_line as the letter counts them in words (six, cinq and huit, un, trois, trois); the Spanish ships of Brest are one row and the French ships of Brest another. The result is the sum. Frigates are not summed, because the letter adds quelques frégates at Brest without a number."
    finding: "The letter counts 26 ships of the line in the squadrons it told the British cabinet were sailing for Saint-Domingue, from 6 ports, with 18 frigates named by number and some at Brest not numbered, carrying à peu près 20,000 hommes de débarquement under Leclerc."
    confidence: "high for the arithmetic, which is the letter's own words summed; the letter is a diplomatic communication to London and states what was to sail, not what sailed"
