  - id: src-commissaires-17930702-ht
    tier: A
    kind: primary-document
    author: Étienne Polverel and Léger-Félicité Sonthonax, civil commissioners of the Republic
    title: "Proclamation nous, Étienne Polverel et Léger Félicité Sonthonax, commissaires civils, que nation française voyé dans pays-ci: Haut-du-Cap, 2 July 1793 (Creole text)"
    container: null
    publisher: null
    place: Cap-Français
    year: 1793
    edition: "the John Carter Brown Library's copy, read from the Internet Archive scan; the library's record calls it an exceedingly rare translation, printed mostly in Creole, of the French proclamation of the same date"
    volume: null
    document_number: null
    identifiers: {isbn: null, doi: null, archive_org: "proclamation09sain", hathitrust: null, url: "https://archive.org/details/proclamation09sain"}
    access:
      free_copy: "https://archive.org/download/proclamation09sain/proclamation09sain_djvu.txt"
      verified_at: 2026-09-25
      verified_by: archive-item-fetch
      verified_title: "Proclamation nous, Étienne Polverel & Léger Félicité Sonthonax, commissaires civils, que nation française voyé dans pays-ci, pour mettre l'ordre et la tranquillité tout par-tout"
    language: ht
    region_of_authorship: americas
    producer: french-civil-commission
    position: french-republican-scholarship
    rights: public
    notes: "the French column of the same proclamation (src-commissaires-17930702-fr) is the official parallel text; the Void rendering beside the Creole extract is checked against it. Haitian Creole is not on the proposal's reliable list, so the rendering carries a stated moderate confidence and a back-translation was made in a separate pass: 'Non, pays cila li pas lé mouri: li pas lé jamais connin roi encore, ni connin maîtres qui méchans; li va sorti de cendres à li, et li va plus brillante que jamais; li va semblé en France, qui astor terre à liberté et terre à l'égalité, et république française la va trouver encore petites à li qui va servi li ben.' The back-translation keeps the one name (France) and carries no number, as the original carries none"

