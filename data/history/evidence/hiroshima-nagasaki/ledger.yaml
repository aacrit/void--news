# The evidence ledger for hiroshima-nagasaki (docs/proposals/HISTORY-THESIS-PAGE.md §3, §4c, §8).
# Begun 2026-10-05 for the ninth Orpheus episode and the first-listener cinematic script: the
# sources the script's document voice reads from and the record its narration is checked
# against. Every entry was fetched on 2026-10-05 from the URL it names; every extract under
# extracts/ was sliced from the fetched copy by a builder script (start marker to end marker,
# scratchpad hiro_build.py), never retyped. Nothing here was written from memory. A work the
# free record could not reach is listed under `gaps`, by name, with what was tried. Where a
# scan's OCR layer or a PDF text layer is the free copy, the extract keeps the layer's glyphs
# and line breaks and says so in a note.
# This is NOT a thesis ledger: no positions, contested claims, exhibits or analyses are
# adjudicated here, and the event renders the Hearing. The bar of §4e is not claimed.
#
# Four quotations the event YAML carries were checked against the documents they name and
# are NOT held, because the documents do not carry them in that form (see gaps:): the
# Imperial Rescript as the YAML words it, the Franck Report sentence that names Hiroshima,
# Thurlow's "instruments of extinction", and Taniguchi's "it is not merely a picture".
#
# Continued 2026-10-07 (second session): the rescript in the original Japanese from a
# Japanese government host; Sunao Tsuboi's own account; the pocket watch; and the
# historians of the decision in their own words, at parity and as a disagreement:
# Frank (traditionalist), Alperovitz (critic), Hasegawa (the Soviet entry), and Burr's
# National Security Archive commentary, which states the contested questions without
# taking a side. A historian is held only for his own sentences; the memoir quotations
# his article carries at second hand are not held.
slug: hiroshima-nagasaki
