# The evidence ledger for indian-independence-movement (docs/proposals/HISTORY-THESIS-PAGE.md §3, §4c, §8).
# Begun 2026-10-09 for the first-listener rewrite of the episode. Every entry was fetched on
# 2026-10-09 from the URL it names; every extract under extracts/ was sliced from the fetched
# copy by a builder script (start marker to end marker in the whitespace-collapsed text;
# scratch out/ledger-indian-independence-movement/build.py), never retyped. Nothing here was
# written from memory. Where a scan's OCR layer is the free copy, the extract keeps the layer's
# glyphs and line-end hyphens and says so in a note. Where the English is a translation (the
# Collected Works' renderings from Hindi and Gujarati), the entry and the extract say so.
#
# This is NOT a thesis ledger: no positions, contested claims, exhibits or analyses are
# adjudicated here, and the event renders the Hearing. The bar of §4e is not claimed.
# The partition-of-india ledger is not edited; its Jinnah address is re-fetched here.
#
# The five perspectives of the event YAML, at parity, each in its own holders' words:
#   Gandhian / Congress       Gandhi in the Collected Works (1922 trial, Chauri Chaura, the
#                             letter to Irwin, the Dandi message, Quit India); the Congress's
#                             Punjab report (1920), the 26 January declaration, the AICC
#                             resolution of 8 August 1942
#   Revolutionary             the HSRA notice of 8 April 1929; Bhagat Singh and B. K. Dutt's
#                             statement (1929); Bose's speeches (1942, 1944) as the
#                             Publications Division prints them
#   British Colonial          the Hunter Committee (majority), the Government of India's and
#                             the Secretary of State's despatches (1920); Hansard: Churchill on
#                             Dyer (1920), the Lords' motion, Churchill (1942), Attlee (1946);
#                             the Famine Inquiry Commission (1945)
#   Dalit / Ambedkarite       Ambedkar, What Congress and Gandhi Have Done to the Untouchables
#                             (1945); his speeches in the Constituent Assembly (1948, 1949)
#   Muslim League             Jinnah at Lucknow (1937) and Lahore (1940); his letter to Gandhi
#                             (1944); his address of 11 August 1947
#
# DISAGREEMENTS the record holds (each figure with its producer; never averaged):
#   Jallianwala Bagh dead: 'At first it was thought that about 200' (Hunter majority); 'not more
#     than 290' (Mr. Thompson, as the Congress report quotes him); 'approximately 379' (Hunter
#     majority, the official investigation with the Seva Samiti list); 'at least 379' (minority);
#     379 (Government of India); 500, the Sewa Samiti's figure 'practically accepted' (Congress
#     report); 1,000, Lala Girdhari Lal's computation, which the Congress report adopts.
#   Wounded: 'probably three times as great as the number of killed' (Hunter majority); 'about
#     1,200' (minority); 192, an official figure the Government of India says omits the slightly
#     wounded (its despatch of 3 May 1920). The Congress report's 'nearly 1,200 lives ... at least
#     3,600 men wounded' is for the whole Punjab martial-law period.
#   The crowd: 'about 6,000' (Dyer's report, per Hunter); 'about 5,000' (Montagu's despatch, as
#     Dyer estimated it); '5,000 or 6,000' at the time and '15,000 to 20,000' (minority); '10 to 20
#     thousand' (Hunter majority); 20,000 (Congress report).
#   The force: 25 and 25 troops firing (Hunter); '50 Indian Infantry armed with rifles, 40 ...
#     armed only with Kukris' (Montagu); 'his 90 soldiers' (Congress report). The YAML's 'fifty
#     soldiers' is the riflemen only.
#   'A sufficient moral effect' is Dyer's WRITTEN report (to the General Staff), quoted by the
#     Hunter majority and in the Lords, not words he spoke to the Committee.
#   Salt March marchers: 'seventy-two' (Gandhi, 12 March 1930) against the editors' 'Actually
#     seventy-eight' (src-cwmg-43-sabarmati-speech.secmarchers).
#   'I want world sympathy in this battle of Right against Might': Dandi, April 5, 1930 (CWMG);
#     the YAML and the live script give Sabarmati, March 12, 1930.
#   Bengal famine dead: 'A million and a half' / 'some 1*5 million deaths in excess' (Famine
#     Inquiry Commission, 1945), which reports and rejects Professor Chattopadhyaya's 3.5 million.
#     The YAML's 3 million is held by no source here.
#   Quit India dead: 'Less than 500 persons have been killed' (Churchill, 10 September 1942); the
#     YAML's 1,060 official and 10,000 Indian figures are not held.
#   The naval mutiny: 7,000 ratings in Bombay (Attlee, 22 February 1946); the YAML says 20,000
#     sailors and 78 ships. Bombay disturbances: 223 deaths, 1,037 injured (Attlee, 26 February).
#   Bhagat Singh's execution: Gandhi's own letter of the same day asked the Viceroy to suspend it
#     (src-cwmg-45-viceroy-letter); the revolutionary account says Congress made 'no serious
#     effort'. Both are said, neither settled here.
#   The Poona Pact: 148 reserved seats against the Award's 78 (Ambedkar, 1945), and his own
#     reading that the double vote it took away was worth more.
#   Ambedkar's constitution sentence: the YAML's 'if those who are implementing it are not good,
#     it will prove to be bad' is a paraphrase of 'it is sure to turn out bad because those who
#     are called to work it, happen to be a bad lot' (src-cad-19491125.secgood).
#   Jinnah's 'a nation with our own distinctive culture and civilization...' is his letter of 17
#     September 1944, and it reads 'art and architecture' and 'sense of value' where the YAML
#     drops the first and writes 'values' (src-cwmg-78-jinnah-letter.secnation).
#   'Himalayan': Gandhi called his own 1919 error 'a Himalayan mis- calculation'
#     (src-cwmg-22-chauri-chaura.sechimalayan); the YAML gives 'the Himalayan blunder' to Bose,
#     which is not held.
