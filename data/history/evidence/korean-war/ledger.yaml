# The evidence ledger for korean-war (docs/proposals/HISTORY-THESIS-PAGE.md §3, §4c, §8).
# Begun 2026-10-09 for the Orpheus episode and its writer brief (out/briefs/korean-war.brief.md):
# the sources the script's document voice may read from and the record its narration is checked
# against. Every entry was fetched on 2026-10-09 from the URL it names; every extract under
# extracts/ was sliced from the fetched copy by a builder script (start marker to end marker,
# out/ledger-korean-war/build.py), never retyped, with the copy's whitespace collapsed and that
# said in a note. Nothing here was written from memory. A work the free record could not reach
# is listed under `gaps`, by name, with what was tried.
# Translation provenance: the Soviet, North Korean and Chinese documents are held only in the
# English of the Cold War International History Project (Weathersby for Bulletin 5, Mansourov
# for Bulletin 6-7, Goncharov, Lewis and Xue for the Chinese-published Mao text, Kim and Becker
# for Shen Zhihua). Kim Il Sung's January 1950 words are the Soviet ambassador's report of them.
# No Void translation is held, and no Korean- or Chinese-language original.
# Five perspectives at parity (the event YAML's): American/UN (the Security Council, Truman, FRUS,
# MacArthur, LeMay, Appleman, the CRS count, No Gun Ri as Washington stated it); North Korean (the
# Kim-Pak letter, the armistice orders, Kim through Shtykov, the Soviet record that bears on Kim's
# agency); South Korean (the Truth and Reconciliation Commission, Rhee's letters); Chinese (Mao's
# two texts of 2 October, Shen Zhihua, the People's Daily, the PRC count); civilians and divided
# families (KBS's own record, the unification ministry's register, the Korean witnesses as the
# No Gun Ri briefing reports them, the TRC's verified massacres on all sides).
# Hosts: digitalarchive.wilsoncenter.org did not resolve (getaddrinfo failed), so the Wilson Center
# documents are held from the CWIHP Bulletin PDFs on www.wilsoncenter.org. history.army.mil
# answered HTTP 403; Appleman is held from the Göttingen library's 2005 copy of the Army's page.
# This is NOT a thesis ledger: no positions, contested claims, exhibits or analyses are
# adjudicated here, and the event renders the Hearing. The bar of §4e is not claimed.
