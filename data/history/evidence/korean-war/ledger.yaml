# ------------------------------------------------------------- disagreements held, not adjudicated
# Where two held sources disagree, both are held. A list for the writer, not a verdict.
# 1. Mao's answer of 2 October 1950. The Soviet cable (Roshchin, received 3 October): 'such actions
#    may entail extremely serious consequences', 'better to show patience now', 'A final decision has
#    not been taken' (src-cwihp-mao-19501002-ru). The Chinese-published text of the same date: 'We
#    have decided to send some of our troops to Korea', 12 divisions 'to set off on October 15'
#    (src-mao-wengao-19501002). Mansourov judges the Chinese text 'unreliable: inaccurate, unsent,
#    or perhaps misdated' and the Russian ones unlikely to be fakes (src-mansourov-1996).
# 2. Who started the war. The People's Daily, 1953: 'the reactionary Syngman Rhee clique ...
#    unleashed the Korean war' (src-pc1953-peoples-daily). The Soviet record: Kim pressing to
#    attack, 'Lately I do not sleep at night' (src-cwihp-shtykov-19500119), Moscow refusing in 1949
#    (src-cwihp-politburo-19490924) and assenting in January 1950, 'I am ready to help him'
#    (src-cwihp-stalin-19500130). The Security Council: 'the armed attack on the Republic of Korea by
#    forces from North Korea' (src-unsc-res82-1950.op1).
# 3. The Han bridges. Time: 'about 0215' (src-appleman-1961.secbridge); the live script says
#    2:30. Who ordered it: advisers believed Chae; 'General Chae denied'; others the Vice Minister
#    of Defense, who had ordered it 'at 0130' per General Kim (secblame, secvice). Dead: 'between
#    500 and 800 people', an estimate by 'The best informed American officers' (secbridge); the
#    YAML's 'Eight hundred civilians' is the top of that range, and 'civilians' is not held.
# 4. No Gun Ri. The U.S.: 'an unconfirmed number' (src-dod-nogunri-20010111.seccohen,
#    src-clinton-20010111). 248, 'provided to the Yongdong County office by the civilians', 'not the
#    figure that the South Korean government has given' (sec248). Duration: 'over 60 hours' as a
#    reporter puts the victims' testimony (sec60hours). Orders: none found; some veterans
#    'believed that such an order must have been given' (secorders). The YAML's '250-300' is held by
#    none of these.
# 5. 'Police action'. A reporter's phrase, which Truman accepted: 'Yes. That is exactly what it
#    amounts to.' (src-truman-19500629.secpolice). The live script says 'He called it a police action'.
# 6. The 38th parallel. Rusk, in 1950, from memory: he and Bonesteel withdrew to 'an adjoining
#    room', on 'I believe, the night of August 10-11' (src-frus-1945v06-d771). The YAML's 'thirty
#    minutes and a National Geographic map' is not held.
# 7. Chinese dead. The PRC: 'More than 197,000' (src-govcn-20241130). The YAML: 183,108 (PRC
#    official) and 'US estimates range to 400,000'. Only the first is held.
# 8. American dead. 36,574 is in-theater deaths of all causes; 33,739 hostile; 54,246 worldwide
#    in the war years (src-crs-rl32492). The YAML calls 36,574 'killed in action'. Cohen in 2001:
#    '36,000 of whom lost their lives in battle' (briefing, not sliced).
# 9. The armistice and the South. Rhee: 'Although we cannot sign truce, we shall not obstruct it'
#    (src-rhee-19530709.secsign). Kim and Peng: 'the Syngman Rhee clique' 'strongly opposed to the
#    signing' (src-pc1953-armistice.secrhee). The agreement carries the commanders of the UNC, the
#    KPA and the CPV (src-armistice-19530727.pre1), and in this copy the senior delegates' names.
# 10. Who won. Kim and Peng: 'a glorious victory of an armistice' (src-pc1953-armistice.secorders);
#    Xinhua: the CPV 'eventually won' (src-govcn-20241130); Truman, the aim was 'to prevent a third
#    world war' (src-truman-19510411.secopen); MacArthur, 'no substitute for victory'.
# 11. Wake Island. MacArthur: Chinese intervention chances 'Very little', 'Only 50/60,000 could be
#    gotten across' (src-frus-1950v07-d680). Panikkar, twelve days before: the Chinese decision
#    'final' (src-frus-1950v07-d595). The Chinese crossing on 19 October is not held.
# 12. Killings by every side. The TRC verified Bodo League killings by South Korean police
#    (src-trck-2009.secbodo, .seculsan), North Korean soldiers' killing of 1,557 at Daejeon
#    (.secdaejeon), and civilian deaths from U.S. bombing (.secbombing). Each perspective's
#    account omits one of these; the TRC holds all three.
# 13. The divided families. KBS: 'Ten million people were separated', no source given
