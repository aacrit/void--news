# The evidence ledger for nanjing-massacre (docs/proposals/HISTORY-THESIS-PAGE.md §3, §4c, §8).
# Begun 2026-10-09 for the first-listener rewrite of the episode. Every entry was fetched on
# 2026-10-09 from the URL it names; every extract under extracts/ was sliced from the fetched
# copy by a builder script (start marker to end marker in the whitespace-collapsed text of the
# fetched page; scratch out/ledger-nanjing-massacre/build.py), never retyped. Nothing here was
# written from memory. Where a scan's OCR layer is the free copy (the Tokyo trial transcripts
# on the Legal Tools Database), the extract keeps the layer's glyph errors and the transcript's
# printed line numbers as the layer gives them, and says so in a note. Chinese and Japanese
# extracts carry a Void translation beside them (.en.txt), never presented as a quotation.
#
# This is NOT a thesis ledger: no positions, contested claims, exhibits or analyses are
# adjudicated here, and the event renders the Hearing. The bar of §4e is not claimed.
#
# The five perspectives of the event YAML, at parity, each in its own holders' words:
#   Chinese National Memory        the Nanjing tribunal's judgment on Tani Hisao (1947) as the
#                                  Second Historical Archives of China publish it (2014); the
#                                  Nanking District Court prosecutor's estimate (1946) as the
#                                  Tokyo prosecution named it; the PRC Embassy in Washington (2014)
#   Western Witnesses / Safety Zone the Committee's letters signed by John H. D. Rabe, and the
#                                  affidavits and diary of Fitch and McCallum, as read into the
#                                  Tokyo record (29 August 1946); Bates on the stand (29 July 1946)
#   Japanese Historiography/Memory the Ministry of Foreign Affairs' Q&A as read into the Diet
#                                  record, Foreign Minister Aso and the member Watanabe Shu
#                                  (25 April 2007); Hatano Sumio's survey of Japanese scholarship
#   Survivor Testimony             statements of Nanjing residents (Mrs Tsen of Ginling College,
#                                  Sun Yuen Cheng, Lee Tih Sung, Mrs Loh Sung Sze, Chu Yong Ung
#                                  and Chang Chi Hsiang) read into the Tokyo record; for Xia
#                                  Shuqin, only the National Diet Library's record of her case
#   Legal Record                   the Tokyo Judgment (1948), chapter VIII and the verdict on
#                                  Matsui; the defence's objection to unsworn statements
#
# DISAGREEMENTS the record holds (each figure with its producer; never averaged):
#   The dead. The Tokyo Judgment says, in its chapter on Nanking, 'over 200,000' civilians and
#     prisoners murdered in Nanking and its vicinity in the first six weeks, on later estimates,
#     with burial societies counting 'more than 155,000' bodies (src-imtfe-judgment-ch8.sectotal);
#     in its verdict on Matsui the same Judgment says 'upwards of 100,000 people were killed' in
#     'six or seven weeks' (src-imtfe-judgment-ch10.secnanking). The Nanking District Court
#     prosecutor's report of 20 January 1946 gives 'approximately 260,000 dead', and the
#     Tsung-shan-tang (Chongshantang) teams 112,266 buried (src-imtfe-prosecution-exh324.sec260000,
#     as the Tokyo prosecution summarised it). The Nanjing tribunal (1947) gives more than 190,000
#     shot and burned plus more than 150,000 buried by charities, 'more than 300,000' in total
#     (src-saac-tani-1947.sectotal), and in the next passage 'several hundred thousand'
#     (.seccommon). The PRC (2014): 'Over 300,000 people were slaughtered' (src-prc-embassy-2014.
#     secmassacre). The Japanese government: 'difficult to determine which number is correct'
#     (src-diet-20070425-mofa.secq8); its Foreign Minister in 2007 doubted 300,000 against the city's
#     size (src-diet-20070425-aso.secthirty). Hara Takeshi (2008), as Hatano reports him: 'close to
#     20,000 people were illegally murdered' (src-hatano-scholarship.sechara). The YAML's 40,000
#     (Hata) and 160,000-170,000 (Kasahara) are not held.
#   Civilians killed in the first days. The Judgment: 'At least 12,000' in 'the first tow or three
#     days' (src-imtfe-judgment-ch8.secindiscriminate); Bates told the Tribunal he and Smythe
#     concluded 'twelve thousand' civilians were killed 'inside the walls' (src-bates-imtfe-1946.sectwelve,
#     the middle of the sentence garbled by the OCR layer), and the Committee buried more than thirty thousand soldiers
#     (src-bates-imtfe-1946.secsurrender). Prisoners of war: 'Over 30,000' (src-imtfe-judgment-ch8.secpow).
#   Rape. The Judgment: 'Approximately 20,000 cases' in the first month (src-imtfe-judgment-ch8.
#     secrape). McCallum's diary as read: an estimate whose figure the OCR layer garbles
#     (src-mccallum-diary-1937 entry). The YAML's 80,000 is not held.
#   The duration. 'the first six weeks' (ch8.sectotal); 'six or seven weeks', from 13 December 1937
#     to 'early in February 1938' (ch10.secnanking); the PRC: 'more than 40 days' (src-prc-embassy-
#     2014.secmassacre).
#   Iris Chang's book. The PRC framing is not held for it; Foreign Minister Aso says historians judge
#     it inaccurate (src-diet-20070425-aso.secchang); the member Watanabe called it fabricated
#     (src-diet-20070425-watanabe.secchang). Neither is a verdict on the massacre itself, which the
#     Ministry says cannot be denied (src-diet-20070425-mofa.secq8).
#   Plain-clothes soldiers. The Judgment finds the murder of male civilians was done 'on the pretense
#     that Chinese soldiers had removed their uniforms' (ch8.secmen); Bates describes the callus and
#     hat-mark inspections (src-bates-imtfe-1946.seccalluses); the member Watanabe argued in the Diet
#     that executing plain-clothes soldiers may be said to be unavoidable under the Hague rules
#     (src-diet-20070425-watanabe.secexecution).
#   Statements as evidence. The defence asked that the residents' statements not be called
#     affidavits; the President: 'It goes to weight, not to admissibility'
#     (src-imtfe-defence-affidavits-1946.secstatements).
#   Sun Yuen Cheng's statement ends 'The massacre happened December, 1938', a year after the fall of
#     the city, as the record prints it (src-sun-yuen-cheng-1946 entry note).
slug: nanjing-massacre
