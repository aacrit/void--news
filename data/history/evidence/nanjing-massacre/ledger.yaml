gaps:
  - what: "Xia Shuqin in her own words: the YAML and the live script's 'Seven of my family were killed in front of me. How can they say it did not happen?' (H11_KNOWN marks the line 'Survivor testimony, recounted through her Tokyo defamation case, 2007')"
    tried: ["https://crd.ndl.go.jp/reference/entry/index.php?id=1000089680&page=ref_view", "https://www.courts.go.jp/hanrei/search1/index.html", "https://adhoc.yalepages.org/Media/PDFs/Nanking/NMP0343.pdf"]
    status: "No verbatim primary source of the sentence was found. The National Diet Library's reference record says its judgment databases do not carry the Tokyo District Court judgment of 2 November 2007 and points to an excerpt printed in a 2009 book (src-ndl-crd-xia.secanswer), not openly readable. John Magee's film notes at Yale (NMP0343, 24 pages) may describe her family's case in 1937-38, but the scan has no text layer and was not read. The line is unverified and must not be spoken as her words. The 4 million yen, the 2009 Supreme Court ruling and her family's deaths are not held either"
  - what: "The Ministry of Foreign Affairs of Japan's own pages: 'Historical Issues Q&A' (https://www.mofa.go.jp/policy/q_a/faq16.html) and the Japan-China Joint History Research Report, provisional translation (https://www.mofa.go.jp/mofaj/files/100512970.pdf)"
    tried: ["https://www.mofa.go.jp/policy/q_a/faq16.html", "https://www.mofa.go.jp/mofaj/files/100512970.pdf", "https://web.archive.org/web/20260719150757id_/https://www.mofa.go.jp/policy/q_a/faq16.html", "https://archive.ph/newest/https://www.mofa.go.jp/policy/q_a/faq16.html"]
    status: "mofa.go.jp answered HTTP 403 to every request from this machine; the Wayback Machine answered 429 for the length of the session; archive.ph refused. The Ministry's Q&A is held only as a Diet member read it into the record in 2007 (src-diet-20070425-mofa.secq8). The Joint History Research Report, and with it each side's figure and method as the two committees wrote them, is NOT held: neither the Japanese side's range nor the Chinese side's figure may be quoted from it"
  - what: "Documents of the Nanking Safety Zone, ed. Hsu Shuhsi (Shanghai: Kelly and Walsh, 1939)"
    tried: ["https://archive.org/metadata/bwb_W9-DEE-408", "https://babel.hathitrust.org/cgi/pt?id=mdp.39015001149114"]
    status: "The Internet Archive copy is a controlled lending copy (access-restricted-item: true) and HathiTrust shows limited view only. The Committee's letters are held only as the prosecution read some of them into the Tokyo record (src-safety-zone-letters-1937), with OCR errors"
  - what: "Minnie Vautrin's diary (the YAML's 16 December 1937 entry, 'There probably is no crime that has not been committed in this city today...'), and Yale's Nanking Massacre Project scans of the Committee's letters (NMP0149, NMP0158, NMP0159)"
    tried: ["https://adhoc.yalepages.org/Media/PDFs/Nanking/Vautrin.pdf", "https://adhoc.yalepages.org/Media/PDFs/Nanking/NMP0158.pdf", "https://adhoc.yalepages.org/Media/PDFs/Nanking/NMP0149.pdf"]
    status: "Yale's PDFs are scans of the typescripts with no text layer. A trial OCR of the diary's pages for 15 to 17 December (RapidOCR, CPU) misread letters on most lines ('vben Te have' for 'when we have'), so nothing could be sliced without retyping. The YAML's Vautrin excerpt and the live script's DOCUMENT reading of it are unverified. Her colleague Mrs Tsen's statement of 1946 is held (src-tsen-statement-1946)"
  - what: "John Rabe's diary, The Good Man of Nanking (ed. Erwin Wickert; English 1998), and the YAML's two Rabe excerpts ('Last night up to 1,000 women and girls are said to have been raped...' of 17 December 1937; 'You simply cannot conceive of the misery')"
    tried: []
    status: "the English translation is in copyright and no lawful open copy was sought out or found. Both YAML excerpts, the live script's Rabe DOCUMENT and its 'You simply cannot conceive of the misery' line are unverified. Rabe's own words held here are the Committee's letters he signed (src-safety-zone-letters-1937)"
  - what: "The Nanjing tribunal's judgment on Mukai Toshiaki and Noda Tsuyoshi, and the Tokyo Nichi Nichi Shimbun's reports of the killing contest (the YAML's 89 to 78 and 106 to 105, the photographs, the execution on 28 January 1948)"
    tried: []
    status: "no official or archival text was found in this session. Every particular of the contest in the live script is unverified"
  - what: "The sentence on Matsui and its execution on 23 December 1948; Prince Asaka, the 'kill all captives' order and MacArthur's immunity for the imperial family; Radhabinod Pal's dissent"
    tried: ["https://www.ibiblio.org/hyperwar/PTO/IMTFE/IMTFE-8.html", "https://www.ibiblio.org/hyperwar/PTO/IMTFE/IMTFE-10.html"]
    status: "the two chapters held name no Asaka and carry no sentence; the sentences and Pal's dissent were not fetched. All of these are unverified"
  - what: "Iris Chang, The Rape of Nanking (1997), and the YAML's 'The Nanking massacre would be the forgotten Holocaust of World War II'; Shintaro Ishihara's Playboy interview (1990); the memorial hall's inscription 'We must remember...'"
