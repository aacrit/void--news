    - src-dinmohammad-1947.p383-385
    - src-top-xi.item45
    reasoning: 'The 1942 note''s own 1931 table puts Gurdaspur at 50.8 and Amritsar at 47.0 per cent Muslim, and the 1941 table the League''s judge prints puts Gurdaspur at 51.14; the 3 June appendix lists Gurdaspur and Lahore, not Amritsar, as Muslim-majority. Balanced is true of the margins and false of the label the plan used: qualified.'
  - claim: The Sikh bodies asked, before the award, that the partition carry a transfer of population and property.
    verdict: qualified
