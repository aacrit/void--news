    reasoning: The League-nominated judge prints the tehsil table; the Congress-nominated judge gives the same district figures, 589,923 Muslims of 1,153,511, and concedes the majority while disputing its size; the Viceroy's press conference and the 3 June appendix list the district as Muslim-majority. Three producers, on both sides, agree on the majority.
  - claim: The allocation of Gurdaspur to East Punjab was a political decision, not a judicial one.
    verdict: qualified
    basis: presence
    rests_on:
    - src-top-xii.item335
    - src-top-xii.item428
    - src-radcliffe-punjab.para9
    - src-radcliffe-punjab.para11
    - src-radcliffe-punjab.item1
    reasoning: The Viceroy's staff recorded him, on 4 August, treating part of Gurdaspur's transfer to East Punjab as the condition of Kashmir's freedom to join either Dominion, eight days before the award; Ismay's reply to Liaquat denies any influence. The award's reasons say nothing of Kashmir; the two stated grounds that name Gurdaspur or its tahsils are the Upper Bari Doab Canal from Madhopur in Pathankot and the Mandi hydro-electric scheme, and the schedule names the State of Kashmir only as where the Ujh enters the Punjab. The papers show the motive existed on the Viceroy's side; no document in this record shows it reached Radcliffe, so the claim is qualified, not supported.
  - claim: The Security Council resolved that the accession of Jammu and Kashmir should be decided by a free and impartial plebiscite.
    verdict: supported
    basis: presence
    rests_on:
    - src-un-sres47.pre3
    - src-un-sres47.op1
    - src-hansard-19471030.p1086
    reasoning: Resolution 47 notes that both governments desire the question decided by plebiscite and recommends measures to create the conditions for one; the Commons was told on 30 October 1947 that India accepted the accession 'subject to a reference to the people of Kashmir'. Two producers.
  - claim: The League's demand of 1940 was that the Muslim-majority zones of the north-west and east be grouped as independent states.
    verdict: supported
    basis: presence
    rests_on:
    - src-lahore-resolution-1940.p1
    - src-hansard-lords-19460516.p273
    reasoning: The Lahore resolution asks that areas in which the Muslims are numerically in a majority, as in the North-Western and Eastern zones, be grouped to constitute 'Independent States'. The Cabinet Mission's statement of 1946 describes the League's claim as a separate sovereign state of Pakistan in two areas, the provinces of the north-west and of the north-east. The League's own text and the British reading of it agree on the zones; they differ on the plural, which the resolution prints and the Mission's statement does not.
  - claim: The League's leaders disowned the Calcutta violence of August 1946, and its leaders and press said the riot had been started by the supporters of the Congress.
    verdict: qualified
    basis: presence
    rests_on:
    - src-jinnah-papers-xiv.p642
    - src-khosla-1949.p66
    - src-hansard-19461212.p1348
    reasoning: Jinnah's interview of 17 August 1946 condemns the violence, says any Leaguer who used it broke the League's instructions, and says he did not know who was responsible. The Indian fact-finding body wrote that, if the hospital returns were accepted as a basis for the ratio, the Muslims fared almost as badly as the Hindus. The words held here of the League's resolution of 29 July, as Cripps read them to the Commons, resolve on direct action to achieve Pakistan and do not describe the action. The record holds the disavowal in Jinnah's own words and the charge against the Congress only as the hostile fact-finding body reports it, and no document that investigates how the riot began, so the verdict is qualified.
  - claim: The Punjab award was finalised by Radcliffe about a week before partition and then gerrymandered in favour of India, Mountbatten and Radcliffe acting in league with the Congress leadership.
    verdict: qualified
    basis: presence
    rests_on:
    - src-abell-19470808.p456
    - src-jenkins-19480407.p706-707
    - src-jenkins-19480407.p707
    - src-mountbatten-19480319.p703
    - src-radcliffe-punjab.item4
    reasoning: 'British documents bear out part of the first half: Abell''s letter of 8 August 1947 sent a map of the boundary Radcliffe proposed to demarcate, the Governor of the Punjab recalled that it showed a salient enclosing the Ferozepur and Zira tehsils in Pakistan and that after a message from Viceroy''s House about 10 or 11 August those told of it were apprised of a change, and the award runs the line along the Lahore and Ferozepore district boundary, leaving Ferozepore east. Mountbatten records Liaquat Ali Khan making the same point. No document held says who decided the change or why, and none bears on intent, or on the collusion between Mountbatten, Radcliffe and the Congress leadership that the Pakistani state''s edition asserts, which this record can neither confirm nor test. Every document is British: under Rule A the verdict is capped at qualified in any case.'
