analyses:
- id: an-migration-counts
  title: One migration, six counts
  method: Every figure the fetched documents give for the number of people displaced by the partition, one row per figure, in millions as the document states it, with the border, the period and the direction each figure counts. The result is the number of rows. No range is taken across them, because they do not count the same thing.
  finding: 'The record holds six counts of six different things: one border by December 1947 (8.5 million), one direction into India by 1951 (7.3 million), one direction into Pakistan by 1951 (7.15 million), both borders over four years (14.5 million), the whole transfer (nearly 17 million), and one province over twenty years (at least 6 million). The only two that count the whole transfer are the economists'' own, 14.5 to 17 million, both from Bharadwaj and Mirza, the first citing Bharadwaj, Khwaja and Mian; the two census counts, one per country, can be added, but that sum is this thesis''s arithmetic (Two censuses, one migration), not a count.'
  confidence: high for the count of rows; the 14.5 to 17 span is one producer's, and the other four are not comparable with it or with each other
  against: the SGPC compilation's 'over twelve millions' and the Indian fact-finding body's warning that refugee estimates 'do not give a true picture' are both in the record and neither is a digit this table can hold; the Hansard figure is 'or thereabouts' and covers the Punjab only
  result: 6
  derivation:
    compute: count
    columns:
    - document
    - counts
    - period
    - millions
    rows:
    - document: Noel-Baker, Commons, 18 December 1947
      counts: moved between East and West Punjab, both ways
      period: to December 1947
      millions: 8.5
      extract: src-hansard-19471218.p1845
    - document: Bharadwaj and Mirza 2019, p. 40, citing the 1951 Census of India
      counts: displaced persons enumerated in India
      period: to March 1951
      millions: 7.3
      extract: src-bharadwaj-mirza-2019.p40
    - document: Abbas, Gillani and Ahmad 2020, p. 164, citing the Census of Pakistan 1951
      counts: people who migrated from India to Pakistan
      period: to 1951
      millions: 7.15
      extract: src-abbas-2020.p164
    - document: Bharadwaj and Mirza 2019, p. 5, citing Bharadwaj, Khwaja and Mian 2008
      counts: displaced across both borders
      period: four years after partition
      millions: 14.5
      extract: src-bharadwaj-mirza-2019.p5
    - document: Bharadwaj and Mirza 2019, p. 1
      counts: the population transfer, 'nearly'
      period: 1947 onward
      millions: 17
      extract: src-bharadwaj-mirza-2019.p1
    - document: Chatterji 2007, introduction
      counts: Hindu refugees from East Bengal into West Bengal, 'at least'
      period: 1947 to 1967
      millions: 6
      extract: src-chatterji-2007.p1-2
- id: an-calcutta-counts
  title: Calcutta's dead, seven figures of four kinds
  method: 'Every figure a fetched document gives for the dead of the Calcutta killings of August 1946, one row per figure as the document prints it, with the document and the kind of count it is: a newspaper''s running total as the Indian fact-finding body reports it, bodies collected by three organisations, the hospital figures, or an estimate given to Parliament. No range is taken across the rows, because they do not count the same thing; the result is the number of rows.'
  finding: 'The record holds seven figures for Calcutta''s dead and they are four kinds of count: a newspaper''s running total, from over 170 killed on 18 August to between 2,000 and 3,000 on 20 August and 3,468 bodies accounted for on 28 August; 3,173 bodies collected and disposed of by three organisations, which the fact-finding body says does not represent the total number of deaths; 570 dead in the hospital figures; and some 4,000 deaths, the figure the British government gave the Commons. None of them is a count of the same thing as another, and the estimate the fact-finding body reports, more than five thousand killed, is higher than any of them.'
  confidence: 'moderate: the running totals are the Statesman''s as the fact-finding body reports them, not read from the newspaper, and every figure but the Commons one comes from that one body''s pages'
  against: the League's leaders and press, as the same body reports them, said the riot was started by the Congress's supporters, which bears on who died and not only on how many; the Commons figure is given as 'some 4,000' with no stated basis
  result: 7
  derivation:
    compute: count
    columns:
    - document
    - kind
    - figure
    rows:
    - document: The Statesman, 18 August 1946, as reported
      kind: running total, killed
      figure: over 170
      extract: src-khosla-1949.p78
    - document: The Statesman, 19 August 1946, as reported
      kind: running total, killed
      figure: '270'
      extract: src-khosla-1949.p78
    - document: The Statesman, 20 August 1946, as reported
      kind: running total, death roll
      figure: between 2,000 and 3,000
      extract: src-khosla-1949.p78
    - document: The Statesman, 28 August 1946, as reported
      kind: running total, bodies accounted for
      figure: 3,468
      extract: src-khosla-1949.p78
    - document: Stern Reckoning, bodies collected and disposed of by three organisations
      kind: bodies collected
      figure: 3,173
      extract: src-khosla-1949.p65
    - document: Stern Reckoning, the hospital figures
      kind: hospital figures
      figure: '570'
      extract: src-khosla-1949.p66
    - document: Cripps, Commons, 12 December 1946
      kind: government estimate
      figure: some 4,000
      extract: src-hansard-19461212.p1350-1351
- id: an-two-censuses
  title: Two censuses, one migration
  method: The census each country took in 1951 counted the people who had crossed into it. Each figure is taken as the scholarship that cites it states it, in millions, one row per census; the result is their sum.
  finding: The two censuses of 1951, as the scholarship cites them, count 7.3 million people who had crossed into India and 7.15 million into Pakistan; added, 14.45 million. That sum is this thesis's arithmetic, not a count, and the economists' 14.5 million displaced within four years may rest on the same two censuses, so the closeness of the two is not a corroboration.
  confidence: 'low: neither census volume is held here, both figures are read through the scholarship that cites them, the two censuses need not have defined a migrant alike, and the Pakistani figure is not consistent with its own parts in the passage that gives it'
  against: Abbas, Gillani and Ahmad give 4.8 million in the Punjab as 68.22 per cent of the refugees, which implies about 7.04 million in all, not 7.15; Bharadwaj and Mirza's 14.5 million cites Bharadwaj, Khwaja and Mian, which may rest on these same two censuses, so the agreement may be one count seen twice; Chatterji's migration from East Bengal ran to 1967, after both censuses; the Commons' 8,500,000 by December 1947 counts the Punjab alone
  result: 14.45
  derivation:
    compute: sum
    column: millions
    columns:
    - census
    - counts
    - millions
    rows:
    - census: Census of India 1951, as Bharadwaj and Mirza cite it
      counts: displaced persons enumerated in India, from West and East Pakistan
      millions: 7.3
      extract: src-bharadwaj-mirza-2019.p40
    - census: Census of Pakistan 1951, as Abbas, Gillani and Ahmad cite it
      counts: people who migrated from India to Pakistan
      millions: 7.15
      extract: src-abbas-2020.p164
