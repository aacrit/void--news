# JSON, the audio gates and the ledger register never see it. A keyed row here
# replaces the base row with the same id (the positions, contested records and
# the migration analysis below are the base rows with additions); a new id is
# appended; gaps are appended. Every entry was fetched on 2026-09-25 from the
# URL it names and every extract under draft/extracts/ was sliced from that
# copy by a builder script, start marker to end marker, never retyped.
# Promotion folds this file into ledger.yaml and draft/extracts/ into
# extracts/ in the commit that publishes the draft thesis.
