  claim: Partition was the Indian parties' choice and the notional division, the commissions and their terms were theirs; the Viceroy kept out of the award; haste was the price of a divided government.
  omits: What the Viceroy's own staff wrote about Gurdaspur and Kashmir before the award, and the strength at which the Governor found the Boundary Force the day after the award was signed.
  adjudications:
  - claim: The 1941 census figures were to be taken as authoritative for the notional division, and the Boundary Commissions were to work from contiguous majority areas plus other factors.
    verdict: supported
    basis: presence
    rests_on:
    - src-hansard-19470603.p36
    - src-hansard-19470603.p37
    - src-radcliffe-punjab.para3
    - src-dinmohammad-1947.p383-385
    - src-mahajan-1947.p327-328
    reasoning: The statement read to the Commons on 3 June 1947 says the 1941 figures would be authoritative; the award reproduces the terms of reference; and both the League-nominated and the Congress-nominated judges argue Gurdaspur from the 1941 census. Four producers carry the same basis.
  - claim: The Viceroy had nothing to do with the award and kept clear of the Boundary Commissions.
    verdict: qualified
    basis: presence
    rests_on:
    - src-top-xii.item428
    - src-top-xii.item335
    - src-mountbatten-press-19470604.p99-100
    - src-abell-19470808.p456
    - src-jenkins-19480407.p706-707
    - src-jenkins-19480407.p707
    reasoning: 'Ismay''s letter says so, and Liaquat''s message is what it answers; but the Viceroy''s own interview record of 4 August has him saying Kashmir could join either Dominion ''provided part of Gurdaspur were put into East Punjab by the Boundary Commission'', and on 4 June he had told the press it was unlikely the commission would place the whole district in the Muslim majority area. Every document here is the Viceroy''s staff''s own, so under Rule A the verdict is capped at qualified: the papers show a Viceroy who had a view of Gurdaspur''s fate, not one who conveyed it to Radcliffe. The Ferozepur papers add to this without settling it: Abell''s letter of 8 August 1947 sent a map of the boundary Radcliffe proposed to demarcate, and the Governor of the Punjab''s account of April 1948 records that about 10 or 11 August a message from Viceroy''s House containing the words ''Eliminate salient'' reached him, after which those told of the forecast were apprised of a change. They show the Viceroy''s house carrying word of the line and of a change to it; no document here says who decided the change.'
  - claim: 'The British government did not propose the partition of the Punjab and Bengal: its Cabinet Mission rejected it in 1946, and the Congress asked for the division of the Punjab before the plan of 3 June 1947.'
    verdict: supported
    basis: presence
    rests_on:
    - src-hansard-lords-19460516.p274
    - src-hansard-lords-19460516.p275
    - src-cwc-19470308.p23
    - src-aicc-19470615.p109
    reasoning: 'The Cabinet Mission''s statement of 16 May 1946 says that any solution involving a radical partition of the Punjab and Bengal would be contrary to the wishes and interests of a very large proportion of their inhabitants, and that the Mission could not advise handing power to two entirely separate sovereign states. On 8 March 1947 the Congress Working Committee resolved that the Punjab be divided so that the predominantly Muslim part might be separated from the predominantly non-Muslim part; on 15 June the A.I.C.C. accepted the 3 June proposals. Two producers, each on the part it wrote: the British government on its 1946 position, the Congress on its 1947 demand. What London decided between March and June is not in these documents.'
