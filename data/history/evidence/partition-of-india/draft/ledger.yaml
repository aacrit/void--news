  claim: Division was the only solution; Gurdaspur was a Muslim-majority district by the census the plan itself made authoritative, and its award to India was a political decision; Kashmir's accession is to be decided by a plebiscite the Security Council called for.
  omits: The award's two stated grounds that name Gurdaspur or its tahsils, the Upper Bari Doab Canal from Madhopur in Pathankot and the Mandi hydro-electric scheme; and the 1942 Sikh note listing Gurdaspur at 50.8 per cent by the 1931 census.
  adjudications:
  - claim: 'Gurdaspur had a Muslim majority by the 1941 census: 51.14 per cent, with three of its four tehsils Muslim-majority.'
    verdict: supported
    basis: presence
    rests_on:
