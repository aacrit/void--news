  claim: 'The partition''s longest work was resettlement: the two states moved the Punjab''s minorities in convoys and trains, held them in camps, and settled them on land and in houses the other community had left, on less than they had lost.'
  omits: The dead of the convoys and the camps, whom the resettlement records do not count, and the migrants of Bengal, who crossed for two decades and are not in either Punjab's scheme.
  adjudications:
  - claim: The refugee farmers of East Punjab were resettled on less land than they had left.
    verdict: qualified
    basis: presence
    rests_on:
    - src-randhawa-1954.p93
    reasoning: By the resettling administration's own figures, as Randhawa records them, 67 lakh acres abandoned by Hindu and Sikh landholders in West Pakistan against 47 lakh acres available in East Punjab and Pepsu, a gap of 20 lakh acres which he gives as 38 per cent of the area abandoned, measured in standard acres, and 43 lakh irrigated acres left against 13 lakh. The foreword says the views are the author's. The figures are the resettling administration's own, and this record holds no Pakistani count of the land Muslim evacuees left or received, so under Rule A the verdict is capped at qualified.
- id: bengal-long-partition
  name: The Bengal and Bangladeshi account
  holders:
  - Chatterji (2007)
  - Mahbub and Saba (BRAC University, 2018)
  - Rabbani (Asiatic Society of Bangladesh, 2024)
  - Rahman and van Schendel (2003)
  rests_on:
  - src-chatterji-2007
  - src-mahbub-saba-2018
  - src-rabbani-2024
  - src-rahman-vanschendel-2003
  claim: In the east the partition was not an event but a decades-long migration, at least 6 million Hindus leaving by 1967, and a boundary whose enclaves were not exchanged until 2015.
  omits: The award's own reasons for Calcutta, Khulna and Murshidabad, and the Muslim migration into East Bengal, which its stories carry and its counts do not.
  adjudications:
  - claim: The award placed Khulna, a district the 3 June plan did not list as Muslim-majority, in East Bengal, and Murshidabad, which it did list, in West Bengal.
    verdict: supported
    basis: presence
    rests_on:
    - src-radcliffe-bengal.item5
    - src-radcliffe-bengal.item8
    - src-top-xi.item45
    - src-gandhi-19470824.para6
    reasoning: The schedule runs the line along the Malda-Murshidabad and Rajshahi-Murshidabad district boundaries, leaving Murshidabad west of it, and southwards along the Khulna and 24-Parganas boundary, leaving Khulna east of it; the appendix lists Murshidabad and not Khulna; Gandhi's speech of 24 August deplores Khulna celebrating its entry into Pakistan. Three producers.
  - claim: Between 1947 and 1967 at least 6 million Hindu refugees crossed from East Bengal into West Bengal.
    verdict: untestable
    basis: absence
    rests_on:
    - src-chatterji-2007.p1-2
    reasoning: No census or government count for Bengal is held in this record; the figure stands as the scholarship's.
    would_settle: the Census of India 1951 and 1961 displaced-persons tables for West Bengal, which no open archive reached from this container holds
  - claim: The partition of Bengal was carried by the votes of its western members against those of its eastern.
    verdict: qualified
    basis: presence
    rests_on:
    - src-top-xi.item278
    reasoning: The Governor of Bengal's telegram of 20 June 1947 reports the members from the western districts voting 58 to 21 that the province be partitioned, and the members from the eastern districts voting by 106 votes that it should not. It is the one record of the vote this ledger holds, and it is the Viceroy's correspondence, so qualified.
