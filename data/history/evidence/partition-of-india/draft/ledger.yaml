  - claim: The Congress accepted the 3 June plan because the Muslim League refused the Cabinet Mission's plan of 16 May 1946 and would not join the Constituent Assembly, and because the Congress would not compel any territorial unit to remain in the Indian Union against its declared will.
    verdict: qualified
    basis: presence
