analyses:
- id: an-migration-counts
  title: One migration, six counts
  method: Every figure the fetched documents give for the number of people displaced by the partition, one row per figure, in millions as the document states it, with the border, the period and the direction each figure counts. The result is the number of rows. No range is taken across them, because they do not count the same thing.
  finding: 'The record holds six counts of six different things: one border by December 1947 (8.5 million), one direction into India by 1951 (7.3 million), one direction into Pakistan by 1951 (7.15 million), both borders over four years (14.5 million), the whole transfer (nearly 17 million), and one province over twenty years (at least 6 million). The only two that count the whole transfer are the economists'' own, 14.5 to 17 million, both from Bharadwaj and Mirza, the first citing Bharadwaj, Khwaja and Mian.'
  confidence: high for the count of rows; the 14.5 to 17 span is one producer's, and the other four are not comparable with it or with each other
  against: the SGPC compilation's 'over twelve millions' and the Indian fact-finding body's warning that refugee estimates 'do not give a true picture' are both in the record and neither is a digit this table can hold; the Hansard figure is 'or thereabouts' and covers the Punjab only
  result: 6
  derivation:
    compute: count
    columns:
    - document
    - counts
    - period
    - millions
    rows:
    - document: Noel-Baker, Commons, 18 December 1947
      counts: moved between East and West Punjab, both ways
      period: to December 1947
      millions: 8.5
      extract: src-hansard-19471218.p1845
    - document: Bharadwaj and Mirza 2019, p. 40, citing the 1951 Census of India
      counts: displaced persons enumerated in India
      period: to March 1951
      millions: 7.3
      extract: src-bharadwaj-mirza-2019.p40
    - document: Abbas, Gillani and Ahmad 2020, p. 164, citing the Census of Pakistan 1951
      counts: people who migrated from India to Pakistan
      period: to 1951
      millions: 7.15
      extract: src-abbas-2020.p164
    - document: Bharadwaj and Mirza 2019, p. 5, citing Bharadwaj, Khwaja and Mian 2008
      counts: displaced across both borders
      period: four years after partition
      millions: 14.5
      extract: src-bharadwaj-mirza-2019.p5
    - document: Bharadwaj and Mirza 2019, p. 1
      counts: the population transfer, 'nearly'
      period: 1947 onward
      millions: 17
      extract: src-bharadwaj-mirza-2019.p1
    - document: Chatterji 2007, introduction
      counts: Hindu refugees from East Bengal into West Bengal, 'at least'
      period: 1947 to 1967
      millions: 6
      extract: src-chatterji-2007.p1-2
- id: an-calcutta-counts
  title: Calcutta's dead, eight figures
  method: 'Every figure a fetched document gives for the dead of the Calcutta killings of August 1946, one row per figure, with the document and the kind of count it is: a newspaper''s running total as the Indian fact-finding body reports it, bodies collected, deaths in the hospital returns, or an estimate given to Parliament. A range the newspaper printed is entered as its lower and its upper bound, each on its own row. The result is the range of the column.'
  finding: 'Eight figures for Calcutta''s dead run from 170 to 4,000, and they count four different things: a newspaper''s running total, which rose from over 170 killed on 18 August to 3,468 bodies accounted for on 28 August; 3,173 bodies collected and disposed of; 570 deaths in the hospital returns; and 4,000, the round figure the British government gave the Commons. The Indian fact-finding body''s own estimate, more than five thousand killed, is above every count it prints.'
  confidence: 'moderate: the running totals are the Statesman''s as the fact-finding body reports them, not read from the newspaper, and every count but the Commons figure comes from one producer''s pages'
  against: the fact-finding body says the body count does not represent the total number of deaths and that hospital figures undercount the Hindu dead, whose bodies it says were burnt or destroyed; the League's leaders and press, as the same body reports them, said the riot was started by the Congress's supporters, which bears on who died and not only how many
  result:
  - 170
  - 4000
  derivation:
    compute: range
    column: dead
    columns:
    - document
    - kind
    - dead
    rows:
    - document: The Statesman, 18 August 1946, as reported
      kind: running total, killed
      dead: 170
      extract: src-khosla-1949.p78
    - document: The Statesman, 19 August 1946, as reported
      kind: running total, killed
      dead: 270
      extract: src-khosla-1949.p78
    - document: The Statesman, 20 August 1946, lower bound
      kind: running total, death roll
      dead: 2000
      extract: src-khosla-1949.p78
    - document: The Statesman, 20 August 1946, upper bound
      kind: running total, death roll
      dead: 3000
      extract: src-khosla-1949.p78
    - document: The Statesman, 28 August 1946, as reported
      kind: bodies accounted for
      dead: 3468
      extract: src-khosla-1949.p78
    - document: Stern Reckoning, table of bodies collected and disposed of
      kind: bodies collected
      dead: 3173
      extract: src-khosla-1949.p65
    - document: Stern Reckoning, the Surgeon-General's hospital returns
      kind: hospital deaths
      dead: 570
      extract: src-khosla-1949.p66
    - document: Cripps, Commons, 12 December 1946
      kind: government estimate
      dead: 4000
      extract: src-hansard-19461212.p1350-1351
- id: an-two-censuses
  title: Two censuses, one migration
  method: The census each country took in 1951 counted the people who had crossed into it. Each figure is taken as the scholarship that cites it states it, in millions, one row per census; the result is their sum.
  finding: 'The two censuses of 1951, as the scholarship cites them, together count 14.45 million people who had crossed: 7.3 million into India and 7.15 million into Pakistan. The sum sits within a rounding of the 14.5 million the economists give as displaced within four years.'
  confidence: 'moderate: neither census volume is held here, both figures are read through the scholarship that cites them, and the two censuses need not have defined a migrant alike'
  against: Bharadwaj and Mirza's 14.5 million cites Bharadwaj, Khwaja and Mian, which may rest on these same two censuses, so the agreement may be one count seen twice; Chatterji's migration from East Bengal ran to 1967, after both censuses; the Commons' 8,500,000 by December 1947 counts the Punjab alone
  result: 14.45
  derivation:
    compute: sum
    column: millions
    columns:
    - census
    - counts
    - millions
    rows:
    - census: Census of India 1951, as Bharadwaj and Mirza cite it
      counts: displaced persons enumerated in India, from West and East Pakistan
      millions: 7.3
      extract: src-bharadwaj-mirza-2019.p40
    - census: Census of Pakistan 1951, as Abbas, Gillani and Ahmad cite it
      counts: people who migrated from India to Pakistan
      millions: 7.15
      extract: src-abbas-2020.p164
