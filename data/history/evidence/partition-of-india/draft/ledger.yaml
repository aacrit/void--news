    - src-hansard-19461212.p1353
    reasoning: 'The A.I.C.C.''s resolution of 15 June 1947 gives two reasons for accepting the 3 June proposals: the League''s refusal to accept the plan of 16 May and to participate in the Constituent Assembly, and the Congress''s own policy that it could not think of compelling the people of any territorial unit to remain in an Indian Union against their declared and established will. The British government''s account to the Commons in December 1946 confirms that the League withdrew its acceptance on 29 July 1946, and records that the Mission, the government and the League read the plan''s grouping procedure one way and the Congress the other. The documents bear out the withdrawal; they also show a dispute over the plan to which the Congress was a party, and which the resolution does not mention. Qualified.'
