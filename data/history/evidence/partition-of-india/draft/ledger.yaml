    - src-top-xi.item59
    - src-tejasingh-1947.p353-354
    reasoning: The Viceroy said so at his press conference; the Sikh member's own report counts 3,767,401 Sikhs by the 1941 census, of whom 1,683,855 lived in the seventeen notional western districts and 2,073,546 in the east. Two producers agree on the division; the Sikh judge's own figures make it 45 to 55 rather than equal, so the claim is qualified by the position's own count.
  - claim: Gurdaspur, Amritsar and Lahore were districts of balanced population, not Muslim-majority districts.
    verdict: qualified
    basis: presence
    rests_on:
