    language: pa
    region_of_authorship: south-asia
    producer: punjabi-poet
    position: sikh-panthic
    rights: null
    notes: "a copyrighted poem, held only as the eight lines cited. The rendering beside it is a Void translation; Punjabi is on the proposal's weaker list, so the rendering carries a stated moderate confidence and a back-translation was made in a separate pass: 'ਅੱਜ ਮੈਂ ਵਾਰਸ ਸ਼ਾਹ ਨੂੰ ਆਖਦੀ ਹਾਂ, ਕਬਰਾਂ ਵਿੱਚੋਂ ਕਿਤੋਂ ਬੋਲ, ਤੇ ਅੱਜ ਇਸ਼ਕ ਦੀ ਕਿਤਾਬ ਦਾ ਕੋਈ ਅਗਲਾ ਵਰਕਾ ਖੋਲ੍ਹ। ਪੰਜਾਬ ਦੀ ਇੱਕ ਧੀ ਰੋਈ ਸੀ ਤੇ ਤੂੰ ਉਸ ਦੇ ਵੈਣ ਲਿਖਦਾ ਰਿਹਾ; ਅੱਜ ਲੱਖਾਂ ਧੀਆਂ ਰੋਂਦੀਆਂ ਤੈਨੂੰ ਵਾਰਸ ਸ਼ਾਹ ਨੂੰ ਆਖਦੀਆਂ ਹਨ: ਉੱਠ, ਦੁਖੀਆਂ ਦੇ ਦਰਦੀ, ਉੱਠ ਤੇ ਆਪਣਾ ਪੰਜਾਬ ਵੇਖ; ਅੱਜ ਬੇਲਿਆਂ ਵਿੱਚ ਲਾਸ਼ਾਂ ਵਿਛੀਆਂ ਹਨ ਤੇ ਚਨਾਬ ਲਹੂ ਨਾਲ ਭਰਿਆ ਹੈ। ਕਿਸੇ ਨੇ ਪੰਜਾਂ ਪਾਣੀਆਂ ਵਿੱਚ ਜ਼ਹਿਰ ਰਲਾ ਦਿੱਤਾ, ਤੇ ਉਨ੍ਹਾਂ ਹੀ ਪਾਣੀਆਂ ਨੇ ਧਰਤੀ ਨੂੰ ਸਿੰਜਿਆ।' The back-translation keeps every name (Waris Shah, Punjab, Chenab) and the one count (lakhs); it loses nothing the original carries and adds nothing"

