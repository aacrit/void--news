# ------------------------------------------------------------- the thesis's own analysis
analyses:
  - id: an-notional-vs-award
    title: The notional line against the award, district by district
    method: "Every district the award's schedules name or place, one row per district, read against the Appendix to the Statement of 3 June 1947 (src-top-xi.item45), which lists the Muslim-majority districts by the 1941 census. The listed column is read from the appendix; the award column from the schedule paragraph the row cites, the districts west of the Bengal line and the remainder rule for the rest; crossed is yes where the award put a listed district wholly or mostly on the non-Muslim side or an unlisted district on the Muslim side, part where the schedule divides the district along thana lines, and no otherwise; crossed_n is 1 for yes and 0 otherwise. The result is the sum of crossed_n, the number of districts the award put across the line. No share is given, because the schedules place every other district of both provinces by remainder and the two documents let this thesis name only the 40 rows below."
    finding: "Of the 40 districts the two documents let this thesis place, the award put 4 across the notional line: Murshidabad, Khulna and the Chittagong Hill Tracts in Bengal, and Gurdaspur, three of whose four tehsils went east, in the Punjab; 5 more it divided along thana lines. The other 31 fell where the 3 June list had put them."
    confidence: "high for the whole districts, whose side the schedule states in words; moderate for the divided ones, where which part is larger is this thesis's reading of the thana list"
    against: "the Bengal report itself says the parties propounded the most diverse solutions and that the province offers few satisfactory natural boundaries, so a count of crossings measures the award against the notional list, not against any alternative line; the Sylhet transfer, decided by referendum and a separate report, is outside the count"
    result: 4
    derivation:
      compute: sum
      column: crossed_n
      columns: [province, district, listed, award, crossed, crossed_n]
      rows:
        - {province: Bengal, district: Chittagong, listed: "yes", award: East Bengal, crossed: "no", crossed_n: 0, extract: src-radcliffe-bengal.item2}
