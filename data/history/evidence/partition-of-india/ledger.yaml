  - id: an-rifles-per-head
    title: One rifle for at least 1,600 people
    method: "The Governor of the Punjab's telegram of 8 August 1947 gives the Boundary Force's strength as 5 brigade groups averaging 1,500 effective rifles, 7,500 in all, for 12 districts with a population of no less than 12 million. One row; the result is the population divided by the rifles."
    finding: "By the Governor's telegram of 8 August 1947, the Boundary Force had, in addition to police, one effective rifle for at least 1,600 people in the 12 districts it was to hold: the telegram says 'no less than 12 million', so the ratio is a floor."
    confidence: "high: both figures sit in one sentence of one telegram, and the result is a division"
    against: "the strength is 'in addition to police', whose numbers the telegram does not give, so the ratio counts the Force alone; the same Governor's letter of 13 August gives 14.5 million people and about 9,000 including static troops and training centres, which is one rifle to about 1,611, and 17,932 inhabited towns and villages; and he had estimated the need at a minimum of about 20,000 effective fighting men, so the ratio measures the force he had, not the force the task needed"
    result: 1600
    derivation:
      compute: ratio
      column: population
      over: rifles
      columns: [document, population, rifles]
      rows:
        - {document: "Jenkins to Mountbatten, telegram No. 219-G, 8 August 1947, paragraph 4", population: 12000000, rifles: 7500, extract: src-top-xii.item382}
  - id: an-gurdaspur-counts
    title: Every count of Gurdaspur in the record
    method: "Every figure a fetched document gives for the Muslim share of Gurdaspur district's people, one row per figure, with the document, its census year and the side it was written from; where the document gives counts rather than a share (the Governor's 590,000 Muslims and 560,000 non-Muslims), the share is the Muslim count over the two, to one decimal. The result is the range of the column."
    finding: "Five documents from five sides put the Muslim share of Gurdaspur's people between 50.4 and 51.3 per cent, and no count of its people in the record puts it below half; the one count that runs the other way is of voters, 74,790 Muslim to 81,525 non-Muslim, which is 47.8 per cent."
    confidence: "high for the range, which is the extreme of five figures from five documents; the figures rest on two censuses, so the range spans 1931 and 1941 rather than one count"
    against: "the Congress-nominated judge's report carries an affidavit that reduces the 1941 majority from 26,435 to about 20,000 and electoral rolls with 81,525 non-Muslim voters to 74,790 Muslim; the Viceroy's 50.4 is described by the League's judge as an error, and the Viceroy himself said 'I think' when he gave it"
    result: [50.4, 51.3]
    derivation:
      compute: range
      column: muslim_share
      columns: [document, census, side, muslim_share]
      rows:
        - {document: "Note on the Sikhs' Position, 1942, district table", census: 1931, side: "Sikh All Parties Committee", muslim_share: 50.8, extract: src-sikh-note-1942.p7}
        - {document: "Jenkins, The Punjab Problem, 7 March 1947 (590,000 Muslims, 560,000 non-Muslims)", census: 1941, side: "Governor of the Punjab", muslim_share: 51.3, extract: src-jenkins-punjab-problem-1947.p19-20}
        - {document: "Mountbatten, press conference of 4 June 1947", census: 1941, side: "the Viceroy", muslim_share: 50.4, extract: src-mountbatten-press-19470604.p99-100}
        - {document: "Din Mohammad, report of 5 August 1947", census: 1941, side: "League-nominated judge", muslim_share: 51.14, extract: src-dinmohammad-1947.p383-385}
        - {document: "Mahajan, report of 3 August 1947", census: 1941, side: "Congress-nominated judge", muslim_share: 51.14, extract: src-mahajan-1947.p327-328}
  - id: an-migration-counts
    title: One migration, five counts
    method: "Every figure the fetched documents give for the number of people displaced by the partition, one row per figure, in millions as the document states it, with the border, the period and the direction each figure counts. The result is the number of rows. No range is taken across them, because they do not count the same thing."
    finding: "The record holds five counts of five different things: one border by December 1947 (8.5 million), one direction by 1951 (7.3 million), both borders over four years (14.5 million), the whole transfer (nearly 17 million), and one province over twenty years (at least 6 million). The only two that count the whole transfer are the economists' own, 14.5 to 17 million, both from Bharadwaj and Mirza, the first citing Bharadwaj, Khwaja and Mian."
    confidence: "high for the count of rows; the 14.5 to 17 span is one producer's, and the other three are not comparable with it or with each other"
    against: "the SGPC compilation's 'over twelve millions' and the Indian fact-finding body's warning that refugee estimates 'do not give a true picture' are both in the record and neither is a digit this table can hold; the Hansard figure is 'or thereabouts' and covers the Punjab only"
    result: 5
    derivation:
      compute: count
      columns: [document, counts, period, millions]
      rows:
        - {document: "Noel-Baker, Commons, 18 December 1947", counts: "moved between East and West Punjab, both ways", period: "to December 1947", millions: 8.5, extract: src-hansard-19471218.p1845}
        - {document: "Bharadwaj and Mirza 2019, p. 40, citing the 1951 Census of India", counts: "displaced persons enumerated in India", period: "to March 1951", millions: 7.3, extract: src-bharadwaj-mirza-2019.p40}
        - {document: "Bharadwaj and Mirza 2019, p. 5, citing Bharadwaj, Khwaja and Mian 2008", counts: "displaced across both borders", period: "four years after partition", millions: 14.5, extract: src-bharadwaj-mirza-2019.p5}
        - {document: "Bharadwaj and Mirza 2019, p. 1", counts: "the population transfer, 'nearly'", period: "1947 onward", millions: 17, extract: src-bharadwaj-mirza-2019.p1}
        - {document: "Chatterji 2007, introduction", counts: "Hindu refugees from East Bengal into West Bengal, 'at least'", period: "1947 to 1967", millions: 6, extract: src-chatterji-2007.p1-2}
