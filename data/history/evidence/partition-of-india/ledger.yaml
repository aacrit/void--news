# ------------------------------------------------------------- positions and their adjudication
positions:
  - id: british-administrative
    name: The British administrative account
    holders: ["Attlee (Commons, 3 June and 10 July 1947)", "Listowel (Lords, 16 July 1947)", "Mountbatten and his staff (Transfer of Power, vols. XI and XII)", "Jenkins, Governor of the Punjab", "Talbot (2019)"]
    rests_on: [src-hansard-19470603, src-hansard-19470710, src-hansard-lords-19470716, src-top-xi, src-top-xii, src-jenkins-punjab-problem-1947, src-mountbatten-press-19470604, src-talbot-2019]
    claim: "Partition was the Indian parties' choice and the notional division, the commissions and their terms were theirs; the Viceroy kept out of the award; haste was the price of a divided government."
    omits: "What the Viceroy's own staff wrote about Gurdaspur and Kashmir before the award, and the strength at which the Governor found the Boundary Force the day after the award was signed."
    adjudications:
      - claim: "The 1941 census figures were to be taken as authoritative for the notional division, and the Boundary Commissions were to work from contiguous majority areas plus other factors."
        verdict: supported
        basis: presence
        rests_on: [src-hansard-19470603.p36, src-hansard-19470603.p37, src-radcliffe-punjab.para3, src-dinmohammad-1947.p383-385, src-mahajan-1947.p327-328]
        reasoning: "The statement read to the Commons on 3 June 1947 says the 1941 figures would be authoritative; the award reproduces the terms of reference; and both the League-nominated and the Congress-nominated judges argue Gurdaspur from the 1941 census. Four producers carry the same basis."
      - claim: "The Viceroy had nothing to do with the award and kept clear of the Boundary Commissions."
        verdict: qualified
        basis: presence
        rests_on: [src-top-xii.item428, src-top-xii.item335, src-mountbatten-press-19470604.p99-100]
        reasoning: "Ismay's letter says so, and Liaquat's message is what it answers; but the Viceroy's own interview record of 4 August has him saying Kashmir could join either Dominion 'provided part of Gurdaspur were put into East Punjab by the Boundary Commission', and on 4 June he had told the press it was unlikely the commission would place the whole district in the Muslim majority area. Every document here is the Viceroy's staff's own, so under Rule A the verdict is capped at qualified: the papers show a Viceroy who had a view of Gurdaspur's fate, not one who conveyed it to Radcliffe."
  - id: indian-nationalist
    name: The Indian nationalist account
    holders: ["Nehru (Constituent Assembly, 14 August 1947)", "Mahajan (Boundary Commission report, 3 August 1947)", "Khosla, for the Fact Finding Organisation (1949)", "Gandhi (Calcutta, 24 August 1947)"]
    rests_on: [src-cad-19470814, src-mahajan-1947, src-khosla-1949, src-gandhi-19470824]
    claim: "Freedom came with a partition Congress accepted; the 1941 census on which Gurdaspur's majority rests was unreliable and the district's electors were non-Muslim in majority; the dead were counted by an official body at hundreds of thousands, not millions."
    omits: "The Muslim victims of the eastern districts, whom the fact-finding body counts only as 'an equal number', and the League's case that a census cannot be replaced by a voters' roll."
    adjudications:
      - claim: "On the electoral rolls Gurdaspur's non-Muslim voters outnumbered its Muslim voters, 81,525 to 74,790."
        verdict: qualified
        basis: presence
        rests_on: [src-mahajan-1947.p328-329, src-dinmohammad-1947.p383-385]
        reasoning: "The Congress-nominated judge's report carries the roll figures; the League-nominated judge's report, the only other producer on the point, argues from the 1941 population figures and does not mention the rolls in the passage held here. The rolls are one side's evidence, so the verdict is qualified."
      - claim: "The fact-finding body's count is between 200,000 and 250,000 non-Muslims killed, with an equal number of Muslims believed killed in India."
        verdict: qualified
        basis: presence
        rests_on: [src-khosla-1949.p299, src-khosla-1949.p298]
        reasoning: "The count is the body's own, from nearly fifteen thousand witnesses and 2,094 of 19,914 villages in West Punjab by its own footnote, and the Muslim figure is a belief, not a count. One producer, and the producer says its own method is approximate: qualified."
  - id: pakistani-nationalist
    name: The Pakistani nationalist account
    holders: ["Jinnah (Constituent Assembly of Pakistan, 11 August 1947)", "the Muslim League (memorandum to the Punjab Boundary Commission)", "Din Mohammad (Boundary Commission report, 5 August 1947)", "Liaquat Ali Khan (message of 11 August 1947)", "Hanif (2020)", "Jalal (1985)"]
    rests_on: [src-jinnah-19470811, src-league-memo-1947, src-dinmohammad-1947, src-hanif-2020, src-jalal-1985]
    claim: "Division was the only solution; Gurdaspur was a Muslim-majority district by the census the plan itself made authoritative, and its award to India was a political decision; Kashmir's accession is to be decided by a plebiscite the Security Council called for."
    omits: "The award's one stated ground touching Gurdaspur by name, the Upper Bari Doab Canal from Madhopur in Pathankot; and the 1942 Sikh note listing Gurdaspur at 50.8 per cent by the 1931 census."
    adjudications:
      - claim: "Gurdaspur had a Muslim majority by the 1941 census: 51.14 per cent, with three of its four tehsils Muslim-majority."
        verdict: supported
        basis: presence
        rests_on: [src-dinmohammad-1947.p383-385, src-mahajan-1947.p327-328, src-mountbatten-press-19470604.p99-100, src-top-xi.item45]
        reasoning: "The League-nominated judge prints the tehsil table; the Congress-nominated judge gives the same district figures, 589,923 Muslims of 1,153,511, and concedes the majority while disputing its size; the Viceroy's press conference and the 3 June appendix list the district as Muslim-majority. Three producers, on both sides, agree on the majority."
      - claim: "The allocation of Gurdaspur to East Punjab was a political decision, not a judicial one."
        verdict: qualified
        basis: presence
        rests_on: [src-top-xii.item335, src-top-xii.item428, src-radcliffe-punjab.para9, src-radcliffe-punjab.para11, src-radcliffe-punjab.item1]
        reasoning: "The Viceroy's staff recorded him, on 4 August, treating part of Gurdaspur's transfer to East Punjab as the condition of Kashmir's freedom to join either Dominion, eight days before the award; Ismay's reply to Liaquat denies any influence. The award's reasons say nothing of Kashmir; the one ground it states that touches Gurdaspur by name is the Upper Bari Doab Canal from Madhopur in the Pathankot Tahsil, and the schedule names the State of Kashmir only as where the Ujh enters the Punjab. The papers show the motive existed on the Viceroy's side; no document in this record shows it reached Radcliffe, so the claim is qualified, not supported."
      - claim: "The Security Council resolved that the accession of Jammu and Kashmir should be decided by a free and impartial plebiscite."
        verdict: supported
        basis: presence
        rests_on: [src-un-sres47.pre3, src-un-sres47.op1, src-hansard-19471030.p1086]
        reasoning: "Resolution 47 notes that both governments desire the question decided by plebiscite and recommends measures to create the conditions for one; the Commons was told on 30 October 1947 that India accepted the accession 'subject to a reference to the people of Kashmir'. Two producers."
  - id: sikh-panthic
    name: The Sikh and Punjabi account
    holders: ["the Sikh All Parties Committee (1942 note)", "Teja Singh (Boundary Commission report, 4 August 1947)", "the Shiromani Gurdwara Parbandhak Committee (Talib, 1950)", "Amrita Pritam (Ajj Aakhaan Waris Shah Nu, 1949)"]
    rests_on: [src-sikh-note-1942, src-tejasingh-1947, src-talib-1950, src-amrita-pritam-1949]
    described_by: [src-top-xi.item59, src-tejasingh-1947.p353-354]
    claim: "Any partition on Muslim-majority districts cuts the Sikhs in two and leaves their shrines and canal colonies in the west; the migration ran to more than twelve million and the dead to about a million; the Punjab's central districts were balanced, not Muslim; and the Punjab itself, in its poet's lament, had its five waters poisoned."
    omits: "The Muslim majorities of the tehsils east of the Ravi that its own judge's report concedes, and the Muslim dead of the eastern districts after 15 August."
    adjudications:
      - claim: "The plan of 3 June divided the Sikh community into two almost equal parts."
        verdict: qualified
        basis: presence
        rests_on: [src-top-xi.item59, src-tejasingh-1947.p353-354]
        reasoning: "The Viceroy said so at his press conference; the Sikh member's own report counts 3,767,401 Sikhs by the 1941 census, of whom 1,683,855 lived in the seventeen notional western districts and 2,073,546 in the east. Two producers agree on the division; the Sikh judge's own figures make it 45 to 55 rather than equal, so the claim is qualified by the position's own count."
      - claim: "Gurdaspur, Amritsar and Lahore were districts of balanced population, not Muslim-majority districts."
        verdict: qualified
        basis: presence
        rests_on: [src-sikh-note-1942.p7, src-dinmohammad-1947.p383-385, src-top-xi.item45]
        reasoning: "The 1942 note's own 1931 table puts Gurdaspur at 50.8 and Amritsar at 47.0 per cent Muslim, and the 1941 table the League's judge prints puts Gurdaspur at 51.14; the 3 June appendix lists Gurdaspur and Lahore, not Amritsar, as Muslim-majority. Balanced is true of the margins and false of the label the plan used: qualified."
  - id: bengal-long-partition
    name: The Bengal and Bangladeshi account
    holders: ["Chatterji (2007)", "Mahbub and Saba (BRAC University, 2018)", "Rabbani (Asiatic Society of Bangladesh, 2024)", "Rahman and van Schendel (2003)"]
    rests_on: [src-chatterji-2007, src-mahbub-saba-2018, src-rabbani-2024, src-rahman-vanschendel-2003]
    claim: "In the east the partition was not an event but a decades-long migration, at least 6 million Hindus leaving by 1967, and a boundary whose enclaves were not exchanged until 2015."
    omits: "The award's own reasons for Calcutta, Khulna and Murshidabad, and the Muslim migration into East Bengal, which its stories carry and its counts do not."
    adjudications:
      - claim: "The award placed Khulna, a district the 3 June plan did not list as Muslim-majority, in East Bengal, and Murshidabad, which it did list, in West Bengal."
        verdict: supported
        basis: presence
        rests_on: [src-radcliffe-bengal.item5, src-radcliffe-bengal.item8, src-top-xi.item45, src-gandhi-19470824.para6]
        reasoning: "The schedule runs the line along the Malda-Murshidabad and Rajshahi-Murshidabad district boundaries, leaving Murshidabad west of it, and southwards along the Khulna and 24-Parganas boundary, leaving Khulna east of it; the appendix lists Murshidabad and not Khulna; Gandhi's speech of 24 August deplores Khulna celebrating its entry into Pakistan. Three producers."
      - claim: "Between 1947 and 1967 at least 6 million Hindu refugees crossed from East Bengal into West Bengal."
        verdict: untestable
        basis: absence
        rests_on: [src-chatterji-2007.p1-2]
        reasoning: "No census or government count for Bengal is held in this record; the figure stands as the scholarship's."
        would_settle: "the Census of India 1951 and 1961 displaced-persons tables for West Bengal, which no open archive reached from this container holds"
  - id: women-and-recovery
    name: The feminist and subaltern account
    holders: ["Butalia (1998)", "Menon and Bhasin (1998)", "Pandey (2001)", "Kaur (2007)", "Dey (2018)", "the Inter-Dominion decisions of 6 December 1947, as Kirpal Singh summarises them"]
    rests_on: [src-dey-2018, src-butalia-1998, src-menon-bhasin-1998, src-pandey-2001, src-kaur-2007, src-kirpal-intro-recovery]
    claim: "The violence was done on women's bodies as a message between communities, and the two states' recovery of abducted women, decided on 6 December 1947 'even against the wishes of persons concerned', abducted them a second time."
    omits: "The recovered women who wished to return, whom the liaison reports count without naming, and the men killed in the same columns."
    adjudications:
      - claim: "Recovery was slow, contested by the courts, and done against the recovered women's stated wishes."
        verdict: qualified
        basis: presence
        rests_on: [src-clo-19480429.p610-611, src-pa-sarla-dutta.para6, src-kirpal-intro-recovery.secxxxi]
        reasoning: "The two governments' decision of 6 December 1947, as the editor summarises it, was that all persons abducted after March 1947 were to be restored 'even against the wishes of persons concerned'. The Chief Liaison Officer's letter of April 1948 counts 16 women and 10 children recovered in Sheikhupura in a month against about 100 still to find, and 'clues' held for 47; Sarla Dutta's account has an army search reach her abductor's house and her own scream from inside a seed drum bring her out. An official record and a survivor agree that recovery was slow and contested; on consent they point opposite ways, so the verdict is qualified."
      - claim: "About 75,000 women were abducted."
        verdict: untestable
        basis: absence
        rests_on: [src-clo-19480429.p610-611]
        reasoning: "No count of abductions is held in this record; the liaison letter counts districts, not the whole, and the books that carry the figure could not be read."
        would_settle: "the Ministry of External Affairs' recovery returns under the Abducted Persons (Recovery and Restoration) Act 1949, which Kirpal Singh cites and no open archive holds"
  - id: the-counters
    name: The demographers and economists
    holders: ["Bharadwaj and Mirza (2019)", "Hill, Seltzer, Leaning, Malik and Russell (2008)"]
    rests_on: [src-bharadwaj-mirza-2019, src-hill-2008]
    claim: "Nearly 17 million people were transferred and nearly a million died; 14.5 million were displaced within four years; India's 1951 census enumerated 7.3 million displaced persons."
    omits: "The direction and timing of the counts it combines, which the British Government's own figure of December 1947 and the Bengal scholarship split apart."
    adjudications:
      - claim: "About 8.5 million people had moved between the two Punjabs by December 1947."
        verdict: qualified
        basis: presence
        rests_on: [src-hansard-19471218.p1845, src-bharadwaj-mirza-2019.p5]
        reasoning: "The Commons was told 8,500,000 'or thereabouts' had moved between East and West Punjab by 18 December 1947; the economists put 14.5 million displaced across both borders in four years. The two are not the same count, so they agree without confirming each other."

