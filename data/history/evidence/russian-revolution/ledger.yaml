election_returns:
  - producer: Svyatitsky 1918 (src-svyatitsky-1918.secsr, secbolsheviks)
    figure: "SRs 20.893.734 of 36.257.960 (58%); Bolsheviks 9.023.963 (25%, 'or 1/.' as the layer prints the fraction)"
    counts: "votes, 54 of 79 constituencies (Lenin's reading of the same article, src-lenin-ca-elections-1919.secsource); the SR total includes the SRs of other nations and separate right and left SR groups"
    method: "returns as published by constituency, compiled by an SR statistician in 1918"
  - producer: Lenin 1919, reading Svyatitsky (src-lenin-ca-elections-1919.secreturns, secbolsheviks)
    figure: "36,262,560 votes in all; Russian SRs 16.5 million, 20.9 million or 58 per cent with SRs of other nations; Bolsheviks 9,023,963"
    counts: "the same 54 constituencies; Lenin re-adds Svyatitsky's party figures and gets 36,262,560 against Svyatitsky's 36,257,960"
    method: "Lenin's arithmetic on Svyatitsky's tables"
  - producer: Radkey 1950, 'Sviatitski' column (src-radkey-1950.p16, p17)
    figure: "total 36,256,960; SR 16,509,756; Bolshevik 9,023,963"
    counts: "Radkey's transcription of Svyatitsky; his total differs from both Svyatitsky's printed 36.257.960 and Lenin's 36,262,560"
    method: "as Radkey prints it"
  - producer: Radkey 1950, 'AOR' column (src-radkey-1950.p16)
    figure: "SR 17,490,837; Bolshevik 9,562,358; total not given"
    counts: "a Soviet compilation Radkey cites as AOR"
    method: "at second hand in Radkey"
  - producer: Radkey 1950, 'Present Study' (src-radkey-1950.p16, p17, p18)
    figure: "SR 15,848,004; Bolshevik 9,844,637; Menshevik 1,364,826; total 41,686,876 ('a grand total of nearly 42,000,000')"
    counts: "the whole country as far as returns survive, by Radkey's own reconstruction"
