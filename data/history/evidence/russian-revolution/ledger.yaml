# The evidence ledger for russian-revolution (docs/proposals/HISTORY-THESIS-PAGE.md §3, §4c, §8).
# Begun 2026-10-09 for the History episode's writer brief: the sources its document voice
# may read from and the record its narration is checked against. Every entry was fetched on
# 2026-10-09 from the URL it names; every extract under extracts/ was sliced from the fetched
# copy by a builder script (start marker to end marker, out/ledger-russian-revolution/build.py),
# never retyped. Whitespace runs are collapsed to single spaces and nothing else is changed;
# where a scan's OCR layer is the free copy the extract keeps the layer's glyphs (misreadings,
# pre-reform spelling read as other letters) and says so in a note. Nothing here was written
# from memory.
#
# Dates. Russian documents of 1917 and January 1918 are dated in the Old Style (Julian)
# calendar, thirteen days behind the New Style. Golder (1927) converts every date to the New
# Style; FRUS dates its telegrams New Style; the Soviet decrees and Lenin's texts print Old
# Style, sometimes with the New in brackets ("January 6 (19)"). Each extract is dated as it
# prints; the brief says which calendar a date is in.
#
# Translations. Where a PUBLISHED English is held it is its own entry with its translator
# named: Golder 1927 (Emanuel Aronsberg and others, revised by Golder) for the abdication
# manifesto, Grand Duke Michael's act and Order No. 1; the Progress Publishers Collected
# Works (Bernard Isaacs for the April Theses; Yuri Sdobnikov and George Hanna for volume 26;
# George Hanna for volume 30) as the Marxists Internet Archive prints them; Max Eastman for
# Trotsky; the FRUS translation of the Brest-Litovsk treaty. Every `.en.txt` rendering in
# this ledger is a Void translation, made here at $0 and never to be presented as a
# published quotation. Khabalov's recital of the Tsar's telegram is held in Russian ONLY,
# deliberately (see gaps).
#
# This is NOT a thesis ledger: no positions, contested claims, exhibits or analyses are
# adjudicated, and the event renders the Hearing. The bar of §4e is not claimed. Election
# returns and execution figures are carried below as each producer's figure with its
# method, never averaged.
