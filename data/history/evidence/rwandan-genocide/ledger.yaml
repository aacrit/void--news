      verified_title: "The Prosecutor versus Jean-Paul Akayesu, Case No. ICTR-96-4-T, Judgement"
    language: en
    region_of_authorship: africa
    producer: ictr
    position: tribunal-record
    rights: public
    does_not_show: "Who planned the genocide nationally: the case is one bourgmestre in one commune, Taba. Its historical chapter (paras. 78 to 111) is the chamber's summary of expert evidence, chiefly Alison Des Forges, not a finding beyond reasonable doubt. Witness JJ's words are the chamber's English record of testimony given in Kinyarwanda through interpreters (para. 154 records one contested translation)."

