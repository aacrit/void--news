  # ----------------------------------------------------------- Tier A: the United Nations
  - id: src-unamir-cable-19940111
    tier: A
    kind: primary-document
    author: UNAMIR Force Headquarters, Kigali (the Force Commander)
    title: "Outgoing code cable to Baril, DPKO, New York: 'Request for protection for informant'"
    container: "National Security Archive Electronic Briefing Book No. 452, The Rwanda 'Genocide Fax': What We Know Now, document 3"
    publisher: National Security Archive
    place: Washington
    year: 1994
    edition: null
    volume: null
    document_number: "11 January 1994; Bates L0016678-L0016679 (WM002285-WM002286)"
    identifiers: {isbn: null, doi: null, archive_org: null, hathitrust: null, url: "https://nsarchive2.gwu.edu/NSAEBB/NSAEBB452/docs/doc03.pdf"}
    access:
      free_copy: "https://nsarchive2.gwu.edu/NSAEBB/NSAEBB452/docs/doc03.pdf"
      verified_at: 2026-10-07
      verified_by: document-fetch
      verified_title: "OUTGOING CODE CABLE, DATE: 11 JANUARY 1994, TO: BARIL\\DPKO\\UNATIONS NEW YORK, SUBJECT: REQUEST FOR PROTECTION FOR INFORMANT"
    language: en
    region_of_authorship: africa
    producer: unamir
    position: united-nations
    rights: public
    does_not_show: "Who sent it, in the text layer: the FROM field is blank as the scan's OCR prints it; the Briefing Book's index and the Carlsson inquiry name Dallaire. It holds no request to raid the caches in those words: paragraph 9 says 'IT IS OUR INTENTION TO TAKE ACTION WITHIN THE NEXT 36 HOURS'. It does not use the words 'I have been in contact with the informant who has confirmed the following', which the event record quotes. The informant's reliability was doubted by the Force Commander in paragraph 11 and by the Bagosora trial chamber (para. 12)."

