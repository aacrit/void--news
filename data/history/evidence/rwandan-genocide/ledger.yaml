# The evidence ledger for rwandan-genocide (docs/proposals/HISTORY-THESIS-PAGE.md §3, §4c, §8).
# Every entry was fetched on 2026-10-07 from the URL it names; every extract under
# extracts/ was sliced from the fetched copy by a start and an end string that occur
# in it verbatim, never retyped. Nothing here was written from memory. An entry the
# free record could not reach, or reached only as an image with no text, is listed
# under `gaps`, by name, with what was tried.
#
# Perspectives the record is built to serve, at parity: the survivors (court
# testimony and one published survivor statement), the international community
# and the United Nations (the cables, the Council, the Secretariat, the inquiry, the
# US State Department), the perpetrators' own record (two guilty pleas as the
# tribunal records them, and the tribunal's findings), the RPF and the post-genocide
# Rwandan state (the presidency, the state's commissioned report), and scholarship
# (counts and their methods, said as disagreements). No RTLM audio is held.
slug: rwandan-genocide
bootstrapped: 2026-10-07

