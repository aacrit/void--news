    status: "both PDFs were fetched (34.7 MB and 26.0 MB) but are scans whose OCR text layer is unusable for verbatim slicing ('w here d id a ll the Insota nyi', words run together in the appeal); no clean text copy was found. RTLM is held here only as two broadcasters' admissions (Kambanda, Ruggiu) the tribunal records. No RTLM audio is held, by rule."
