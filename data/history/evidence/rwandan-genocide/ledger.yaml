# ------------------------------------------------------------- positions and their adjudication
positions:
  - id: survivors-testimony
    name: The survivors, in the record of the courts and the state
    holders: ["Witness JJ, a Tutsi woman of Taba commune, testifying before the ICTR (Akayesu, 1998)", "Bernard Kayumba, a survivor of Bisesero, interviewed for the Muse report (2021)"]
    rests_on: [src-ictr-akayesu-tj, src-rw-muse-2021]
    claim: "The killing and the rapes were done at close range by people with authority over the victims, at the places where they had gone for protection, and help from outside came late."
    omits: "Survivors' own unmediated words: every survivor here is heard through a court's English summary or a government-commissioned report. No Gacaca hearing record is held."
    adjudications:
      - claim: "Tutsi women who sought refuge at the bureau communal of Taba were raped repeatedly by Interahamwe while the bourgmestre was present, and the rapes were part of the destruction of the group."
        verdict: supported
        basis: presence
        rests_on: [src-ictr-akayesu-tj.para421, src-ictr-akayesu-tj.para731, src-un-dpi-justice-2014.secictr]
        reasoning: "The chamber records Witness JJ's testimony and finds sexual violence 'an integral part of the process of destruction'; the UN's 2014 backgrounder records the judgment as the first to conclude that rape could constitute genocide. Two producers, the tribunal and the UN Secretariat, though the second reports the first."
      - claim: "At Bisesero, French soldiers met survivors on 27 June 1994, left, and returned on 30 June, and the survivors were attacked in between."
        verdict: qualified
        basis: presence
        rests_on: [src-rw-muse-2021.p205, src-fr-duclert-2021.p985]
        reasoning: "Kayumba's account carries the dates; the Duclert commission, a different producer, calls Bisesero 'the human tragedy' and 'the profound failure' for France, without the dates in the passage held. One producer for the dates, so qualified."

  - id: tribunal-record
    name: The tribunal's findings
    holders: ["ICTR Trial Chamber I (Akayesu, 1998)", "ICTR Trial Chamber I (Bagosora et al., 2008)"]
    rests_on: [src-ictr-akayesu-tj, src-ictr-bagosora-tj]
    claim: "A genocide of the Tutsi took place; the first killings after the plane fell were an organised military operation; but a conspiracy to commit genocide before 7 April 1994 was not proven against the four senior officers tried."
    omits: "The RPF, whose conduct is outside every case held; and the death toll, which the Akayesu chamber gives only as a range of others' estimates."
    adjudications:
      - claim: "The killing of the Prime Minister and of five prominent personalities on 7 April was part of an organised military operation pursuant to orders from superior military authorities."
        verdict: supported
        basis: presence
        rests_on: [src-ictr-bagosora-tj.para20, src-ictr-bagosora-tj.para18, src-un-carlsson-1999.secpm]
        reasoning: "The chamber's finding, and the UN inquiry's separate reconstruction of soldiers entering the UNV compound and shooting the Prime Minister. Two producers agree on who killed her (soldiers, not militia); the inquiry does not rule on orders."
      - claim: "The genocide was planned in advance by the accused senior officers."
        verdict: qualified
        basis: presence
        rests_on: [src-ictr-bagosora-tj.para13, src-ictr-bagosora-tj.para14, src-ictr-kambanda-js.para39, src-un-sgsm6552.secopening]
        reasoning: "The chamber accepts 'indications which may be construed as evidence of a plan' but acquits all four of conspiracy because the evidence is also consistent with preparations for a power struggle or the war. Kambanda's plea admits groups 'which had planned the elimination of the Tutsi', and Annan in 1998 calls the campaign 'planned'. The record supports planning by some; it does not support the planning claim against these four."

  - id: perpetrators-admissions
    name: The perpetrators' own record, as the tribunal took their pleas
    holders: ["Jean Kambanda, interim Prime Minister (plea agreement, 28 April 1998)", "Georges Ruggiu, RTLM broadcaster (plea agreement, 11 May 2000)"]
    rests_on: [src-ictr-kambanda-js, src-ictr-ruggiu-js]
    claim: "The interim government ran the massacres, set up the roadblocks, distributed arms and used the radio to incite; RTLM's 'Inyenzi' came to mean persons to be killed, and 'go to work' came to mean go kill."
    omits: "Their own words at length: the admissions are the chamber's summary of plea agreements negotiated with the Prosecutor. Kambanda later sought to withdraw his plea; that record is not held."
    adjudications:
      - claim: "Roadblocks manned by soldiers and Interahamwe went up in Kigali as soon as the President's death was announced."
        verdict: supported
        basis: presence
        rests_on: [src-ictr-kambanda-js.para39, src-ictr-akayesu-tj.para107, src-un-carlsson-1999.secconc5a]
        reasoning: "Kambanda's admission (vi) ('as soon as the death of President J.B. Habyarimana was announced on the Radio') and the Akayesu chamber ('immediately erected roadblocks') are the tribunal's; the Carlsson inquiry, a second producer, records that after the plane was shot down 'Roadblocks were set up'. None of the three gives 'within one hour'; that timing is not in any extract held."
      - claim: "RTLM broadcasts incited the killing of Tutsi and moderate Hutu."
        verdict: qualified
        basis: presence
        rests_on: [src-ictr-ruggiu-js.para44, src-ictr-kambanda-js.para39]
        reasoning: "Two pleas, Ruggiu's admission (xi) and Kambanda's (vii), both taken by the ICTR: one producer, so qualified. The tribunal's own trial of the station's founders (the Media case) could not be read here."

  - id: united-nations
    name: The United Nations' own account of its failure
    holders: ["Independent Inquiry (Carlsson, Han, Kupolati, 1999)", "Secretary-General Kofi Annan (1998, 1999)", "The Security Council (resolutions 872, 912, 918, 929, 955, 2150)", "UNAMIR and DPKO (the cables of 11 January 1994)"]
    rests_on: [src-un-carlsson-1999, src-un-sgsm6552, src-un-sgsm7263, src-un-sres-912, src-un-sres-918, src-un-sres-929, src-unamir-cable-19940111, src-un-dpko-cable-19940111, src-un-s1994-470]
    claim: "The failure was the system's as a whole: a mission too small, a mandate never corrected, a Secretariat that read genocide as a broken ceasefire, and member states without the will to act or to say the word."
    omits: "The killers, whom an account of institutional failure passes over, and the RPF."
    adjudications:
      - claim: "On 21 April 1994 the Council cut UNAMIR to about 270."
        verdict: qualified
        basis: presence
        rests_on: [src-un-sres-912.whole, src-un-s1994-470.para16, src-un-carlsson-1999.sec912, src-ictr-akayesu-tj.para108]
        reasoning: "The resolution authorises the force level of the Secretary-General's report, whose paragraph 16 estimates 'about 270' including civilian staff; the inquiry says 'about 270'. The Akayesu chamber says 450. The Secretariat's paragraph 7 shows the military already at 1,515 on 20 April. The cut is supported; the number depends on who counts what."
      - claim: "UN headquarters refused the Force Commander's plan to act on the informant's information as beyond the mandate, and told him to inform the President."
        verdict: supported
        basis: presence
        rests_on: [src-un-dpko-cable-19940111.whole, src-un-carlsson-1999.seccable, src-unamir-cable-19940111.whole]
        reasoning: "The reply cable itself ('We cannot agree to the operation contemplated ... it clearly goes beyond the mandate'; 'SRSG and FC should request urgent meeting with the President') and the inquiry's reconstruction, two producers."
      - claim: "The informant's information was reliable and everything it warned of happened."
        verdict: qualified
        basis: presence
        rests_on: [src-unamir-cable-19940111.whole, src-ictr-bagosora-tj.para12, src-ictr-bagosora-tj.para22]
        reasoning: "The Force Commander himself recorded 'certain reservations' and the 'possibility of a trap'; the Bagosora chamber records 'concerns with the reliability of the information provided by an informant, Jean-Pierre'. Belgian peacekeepers were killed (para. 22), as the cable warned, but the tribunal did not find the cable's plan proved."

  - id: united-states
    name: The United States government in public
    holders: ["State Department spokesman Christine Shelly (10 June 1994)"]
    rests_on: [src-us-dos-briefing-19940610]
    claim: "'Acts of genocide have occurred', with a formulation agreed with the lawyers 'because there are obligations which arise in connection with the use of the term'."
    omits: "The internal record, which this ledger cannot read (image scans), and US action at the Council, known here only through the Carlsson inquiry."
    adjudications:
      - claim: "Governments avoided the word genocide because of what it would oblige them to do."
        verdict: supported
        basis: presence
        rests_on: [src-us-dos-briefing-19940610.secobligations, src-un-carlsson-1999.secword, src-un-carlsson-1999.sec925]
        reasoning: "The US spokesman links the formulation to 'obligations which arise in connection with the use of the term'; the UN inquiry finds the reluctance 'motivated by a lack of will to act' and records 'acts of genocide' as a compromise after China objected. Two producers."

  - id: french-state
    name: The French state's two inquiries
    holders: ["Assemblée nationale, mission d'information (Quilès, 1998)", "Commission Duclert (2021)"]
    rests_on: [src-fr-an-1271-1998, src-fr-duclert-2021]
    claim: "1998: France in no way incited, encouraged, aided or supported the organisers, though errors of judgement and institutional failures were made. 2021: France was not complicit in the sense of willing to join the genocide, but was blind, slow, and bears serious and overwhelming responsibilities."
    omits: "Each other's evidence: the 1998 mission had no access to the presidential archives that the 2021 commission read; neither is a court."
    adjudications:
      - claim: "France was not complicit in the genocide."
        verdict: qualified
        basis: presence
        rests_on: [src-fr-duclert-2021.p986, src-fr-an-1271-1998.secmilices, src-rw-muse-2021.secpreface]
        reasoning: "Both French inquiries deny complicity, the second only 'if by this we mean a willingness to join a genocidal operation'. The Rwandan state's report holds France bears 'significant responsibility for having enabled a foreseeable genocide'. Both French findings are one state's; the Rwandan finding is the other party's. Qualified, and published as a disagreement."

  - id: rwandan-state
    name: The post-genocide Rwandan state
    holders: ["President Paul Kagame (7 April 2014)", "The Government of Rwanda's commissioned report (Muse, 2021)"]
    rests_on: [src-rw-kagame-2014, src-rw-muse-2021]
    claim: "The genocide against the Tutsi killed more than a million in a hundred days; it was planned and carried out by Rwandans but its roots go beyond the country, and France enabled it knowingly."
    omits: "Killings by the RPF, which neither text held mentions."
    adjudications:
      - claim: "More than one million people were killed."
        verdict: qualified
        basis: presence
        rests_on: [src-rw-muse-2021.secexecsum, src-un-sres-2150.whole, src-mcdoom-2020.secintro]
        reasoning: "The Security Council in 2014 recalls 'more than a million'; the state's census counted 1,074,017 declared victims as McDoom reports. McDoom estimates 491,000 to 522,000 Tutsi killed and HRW at least half a million. The figures count different things; the higher figure stands as the state's and the Council's, not as settled."

  - id: scholarship
    name: Documentation and scholarship on the count
    holders: ["Alison Des Forges, Human Rights Watch (1999)", "Omar McDoom (2020)", "Nyseth Brehm, Uggen and Gasanabo (2014)"]
    rests_on: [src-hrw-leave-none-1999, src-mcdoom-2020, src-nysethbrehm-2014]
    claim: "The number of Tutsi killed lies near half a million on the best demographic reconstruction; site figures were often inflated by a factor of ten; the RPF killed civilians in the tens of thousands, by estimates no one has been able to confirm."
    omits: "The survivors' and the state's figures except as the scholars report them."
    adjudications:
      - claim: "The RPF killed between 25,000 and 45,000 people from April to August 1994."
        verdict: untestable
        basis: absence
        rests_on: [src-hrw-leave-none-1999.secnumbersrpf, src-mcdoom-2020.sechutu, src-hrw-leave-none-1999.secrpfdenials]
        reasoning: "Gersony's estimate survives only as HRW and McDoom report it; no written report was issued. HRW has 'too little data to confirm or revise'; RPF authorities put the Gersony cases at sixty to seventy. Nothing held can test the range."
      - claim: "Murambi, Bisesero and Nyamata tolls of 20,000 to 70,000, 50,000 and 35,000 are reliable."
        verdict: qualified
        basis: presence
        rests_on: [src-hrw-leave-none-1999.secnumberssites]
        reasoning: "HRW sets each against a smaller count (some 5,000 exhumed at Murambi in 1996; just over 5,100 names at Bisesero; a church capacity of some 3,000 at Nyamata). One producer; the figures disagree and are published as disagreeing."

