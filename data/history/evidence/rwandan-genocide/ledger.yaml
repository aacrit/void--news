# ------------------------------------------------------------- analyses
analyses:
  - id: an-death-toll-figures
    title: One death toll, eight figures
    method: "Every figure for all persons killed (not Tutsi only) that a held Tier A or B extract gives, one row per figure, with its producer; a 'more than' or 'at least' figure enters as its stated bound. The result is the range of the column."
    finding: "The figures for everyone killed run from 500,000 to 1,074,017: the lowest is a floor ('at least half a million', HRW; the bottom of the Akayesu chamber's range), the highest is the Rwandan census's count of declared victims as McDoom reports it."
    confidence: "moderate: the range is arithmetic on eight figures from five producers, but the figures count different things (victims of the genocide, of the conflict, declared or enumerated) and two are bounds, so the range is a spread of claims, not an interval estimate"
    against: "McDoom's 491,000 to 522,000 counts Tutsi only and is left out by the method; included, it would lower the bottom of the range to 491,000. The Secretary-General's 250,000 to 500,000 of 31 May 1994 is a count made during the killing, reported by the Carlsson inquiry but not held as an extract, and is left out."
    result: [500000, 1074017]
    derivation:
      compute: range
      column: figure
      columns: [document, producer, figure]
      rows:
        - {document: "Akayesu Judgement, para. 111, low", producer: ictr, figure: 500000, extract: src-ictr-akayesu-tj.para111}
        - {document: "Akayesu Judgement, para. 111, high ('or more')", producer: ictr, figure: 1000000, extract: src-ictr-akayesu-tj.para111}
        - {document: "Carlsson inquiry, introduction", producer: un-independent-inquiry, figure: 800000, extract: src-un-carlsson-1999.secintro}
        - {document: "Annan, statement of 16 December 1999", producer: un-secretariat, figure: 800000, extract: src-un-sgsm7263.whole}
        - {document: "Resolution 2150 (2014), 'more than a million'", producer: un-security-council, figure: 1000000, extract: src-un-sres-2150.whole}
        - {document: "HRW, 'at least half a million'", producer: hrw, figure: 500000, extract: src-hrw-leave-none-1999.secnumbers}
        - {document: "Rwandan census, declared victims, as McDoom reports it", producer: scholarship, figure: 1074017, extract: src-mcdoom-2020.secintro}
        - {document: "Muse report, 'more than one million'", producer: government-of-rwanda, figure: 1000000, extract: src-rw-muse-2021.secexecsum}
  - id: an-force-after-cut
    title: The force after 21 April on three counts
    method: "Every figure a held extract gives for the size of UNAMIR after the decision of 21 April 1994, one row per figure. The result is the range of the column."
    finding: "Three documents put the reduced mission at 270, about 270 and 450; the 270 of the Secretary-General's option counts civilian staff in it."
    confidence: "high for the range, which is three figures read from three documents of two producers; low for any one of them as a head count, since none says how many were actually present"
    against: "none found in the resolution itself, which gives no figure, nor in the Bagosora summary or the Carlsson conclusions; the Secretary-General's paragraph 7 shows the military at 1,515 on 20 April, a strength before the vote, not after it"
    result: [270, 450]
    derivation:
      compute: range
      column: troops
      columns: [document, troops]
      rows:
        - {document: "S/1994/470, para. 16 ('about 270')", troops: 270, extract: src-un-s1994-470.para16}
        - {document: "Carlsson inquiry, chronology ('to 270 from 2,539')", troops: 270, extract: src-un-carlsson-1999.secchron}
        - {document: "Akayesu Judgement, para. 108", troops: 450, extract: src-ictr-akayesu-tj.para108}
