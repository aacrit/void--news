    rests_on: [src-hansard-18841120, src-ferry-1885, src-hertslet-charter-1889, src-lugard-1922, src-robinson-gallagher-1961, src-brunschwig-1971, src-tessieres-1972, src-wesseling-1996, src-pakenham-1991]
    described_by: [src-uzoigwe-1985.p28]
    claim: "The conference settled rules between European states, not territory; the partition that followed was made by treaties, charters and conquest, justified in Paris as a duty of the superior races and in Britain as a mandate for the benefit of both Europe and Africa."
    omits: "What the rules did to the peoples on the coasts they named, and the African rulers whose agreements the charters and treaties were built on."
    adjudications:
      - claim: "The decision of territorial claims was not among the bases of the conference."
        verdict: supported
        basis: presence
        rests_on: [src-hansard-18841120.whole, src-berlin-act-1885.toc, src-berlin-act-1885.art34, src-berlin-act-1885.art35]
        reasoning: "The Under-Secretary told the Commons on 20 November 1884 that the decision of territorial claims was not among the bases of the conference, and the Act the fourteen plenipotentiaries signed lists six documents, none of which assigns a territory to a Power; Articles 34 and 35 speak only of future acts of possession on the coasts and of notifying the other signatories. Two producers, the British government and the signatory powers, and the Act is the parties' own text."
      - claim: "The occupation was a work of civilisation carried out for the mutual benefit of Europe and of the native races."
        verdict: qualified
        basis: presence
        rests_on: [src-ferry-1885.secraces, src-berlin-act-1885.art6, src-casement-1904.p34, src-congo-commission-1906.p67]
        reasoning: "Ferry said it and Article VI of the Act binds the Powers in the Congo basin to watch over the preservation of the native tribes; the Free State's own commission found women held as hostages for rubber and the British consul recorded hands cut off by government soldiers in the same basin. The words are in the record from the European side and the practice is in the record from the same side, so the claim is borne out as a statement of intent and contradicted as a description of the Congo; qualified."

  - id: berlin-not-partition
    name: The it-did-not-happen-at-Berlin account
    holders: ["Katzenellenbogen (1996)", "Craven (2015)", "Makamu Ngangula Mbela and Tekila Kapamba-Zay (Kinshasa, 2025), who ask the question in their title"]
    rests_on: [src-craven-2015, src-katzenellenbogen-1996, src-makamu-tekila-2025]
    claim: "The conference drew no border and allocated no territory; the boundaries of Africa were set later, in bilateral treaties made in ignorance of the ground; the Act's real subject was free trade and navigation, and the picture of a partition at the table is a later myth."
    omits: "That the Act's rules for the coasts and its recognition of a free-trade basin defined by watersheds were themselves a claim on land whose owners were not consulted, as the African historians read it."
    adjudications:
      - claim: "The General Act allocated no territory to any Power and drew no border."
        verdict: supported
        basis: presence
        rests_on: [src-berlin-act-1885.toc, src-berlin-act-1885.art34, src-berlin-act-1885.art35, src-hansard-18841120.whole]
        reasoning: "The Act's own list of its six documents and its Articles 34 and 35 name no Power's possession and no line; the British government told the Commons before the conference opened that territorial claims were not among its bases. Two producers. The only line the Act draws is in Article I, the watershed and parallels that bound the free-trade basin, which is a limit on where a rule applies, not a grant of the land to anyone; the adjudication of the African account below carries that."
      - claim: "The borders were set by later bilateral treaties."
        verdict: untestable
        basis: absence
        rests_on: [src-uzoigwe-1985.p30]
        reasoning: "No delimitation treaty after 1885 is held as an extract in this record; Uzoigwe's chapter states that the treaties did the work, but that is a Tier B statement and the treaties themselves would settle it."
        would_settle: "the Anglo-German agreements of 1885, 1886 and 1890 and the Anglo-French conventions of 1890 and 1898, all printed in Hertslet's vol. III, which was fetched whole and not sliced in this pass"
      - claim: "The Act's importance is symbolic and legal, not territorial."
        verdict: untestable
        basis: absence
        rests_on: [src-berlin-act-1885.toc]
        reasoning: "Craven's argument could not be read and the Kinshasa article is paywalled; the Act's text bears on what it allocated, not on what it came to mean."
        would_settle: "Craven's article at Oxford Academic or the SOAS repository, and the Congo-Afrique article behind its 2 dollar paywall"

  - id: african-historiography
    name: The African historians' account (the UNESCO General History)
    holders: ["Uzoigwe (1985)", "Boahen (1985)", "Rodney (1972)", "Waktola (Addis Ababa, 2024)"]
    rests_on: [src-uzoigwe-1985, src-boahen-1985, src-rodney-1972, src-waktola-2024]
    claim: "To all intents and purposes the appropriation of territory took place at the conference; Articles 34 and 35 became the doctrine of effective occupation that made the conquest murderous; and the great majority of African rulers chose to defend their sovereignty, some of them, at Adwa, successfully."
    omits: "The Act's own silence on any territory, which the same chapter concedes in the words 'in the most technical sense', and the treaties Africans signed with the Europeans, which the account reads as misunderstood without holding the treaties."
    adjudications:
      - claim: "To all intents and purposes the appropriation of territory took place at the conference."
        verdict: qualified
        basis: presence
        rests_on: [src-berlin-act-1885.toc, src-berlin-act-1885.art34, src-berlin-act-1885.art35, src-berlin-act-1885.art1, src-hansard-18841120.whole]
        reasoning: "The Act names no Power's territory and the British government said territorial claims were not on its agenda, so the claim is contradicted as a matter of text; but Article I bounds a basin by watersheds and parallels in which the Powers' rules run, and Articles 34 and 35 lay down how future possessions on the coasts will be recognised, which is what Uzoigwe means by the appropriation being implied. Two producers, both European: qualified, and the position's own 'in the most technical sense' concedes the text."
      - claim: "Article 35's requirement of authority sufficient to protect existing rights was the doctrine of effective occupation."
        verdict: supported
        basis: presence
        rests_on: [src-berlin-act-1885.art35, src-berlin-act-1885.art34, src-hansard-18841120.whole]
        reasoning: "Article 35 says what Uzoigwe quotes it as saying, and Article 34 confines it to the coasts; the British government's answer of 20 November 1884 shows the conference was understood in London as rule-making. Two producers."
      - claim: "The great majority of African rulers chose to defend their sovereignty."
        verdict: qualified
        basis: presence
        rests_on: [src-witbooi-1929.p79, src-hansard-18931109.p547, src-menelik-1897.p425, src-bluebook-1918.p54-55]
        reasoning: "Three rulers speak in this record and all three defend a sovereignty: Witbooi tells Maharero he has given his land and his right of government into the hands of the white people, Lobengula tells the Queen he has not given away the whole country, Menelik binds a treaty to a French text because he cannot compare the English with the Amharic; Daniel Kariko's affidavit says the Herero chose war. Three rulers and one under-chief are not the majority the claim counts, so the claim is borne out for every ruler this record holds and untested for the rest: qualified. Four producers on three sides."

  - id: african-rulers
    name: The rulers' own record
    holders: ["Hendrik Witbooi (letters of 1890 and 1891)", "Lobengula (letters to Queen Victoria of 1889, as read to the Commons)", "Menelik II (letter to Rodd, 1897)"]
    rests_on: [src-witbooi-1929, src-hansard-18931109, src-menelik-1897]
    claim: "Each chief is a sovereign answerable to God alone; the Germans say they protect the chiefs against other nations but it is the Germans who want the land; a paper signed was not the paper read out; and where two languages disagree the emperor names the version that governs."
    omits: "The wars the rulers fought with one another, which Witbooi's own letter to Maharero is about, and the rulers who did make the treaties the Europeans held."
    adjudications:
      - claim: "The concession Lobengula signed was read to him as containing his words and gave away more than he had granted."
        verdict: qualified
        basis: presence
        rests_on: [src-hansard-18931109.p546, src-hansard-18931109.p547, src-hertslet-charter-1889.p174]
        reasoning: "The king's two letters say so, and the Crown's editor records that a concession was granted on 30 October 1888 and that the Company was chartered to use it 'so far as they are valid'. The letters and the footnote are both British records of the exchange, so under Rule A the verdict is capped at qualified: the papers show a king who denied the paper and a Crown that reserved the question of validity, and the concession itself is not held."
      - claim: "The German protection Maharero accepted in 1890 would cost him his land and his right of government."
        verdict: qualified
        basis: presence
        rests_on: [src-witbooi-1929.p79, src-witbooi-1929.p105, src-trotha-1904.whole, src-bluebook-1918.p54-55]
        reasoning: "Witbooi wrote it in May 1890 and repeated in June 1891 that the Germans said they protected the chiefs against other nations but seemed to be the man who wanted the land; fourteen years later the German commander's order told the Herero to leave the country, and a Herero under-chief swore that their people had been compelled to work on farms and flogged. The order is the German army's own record, the affidavit is a British one, the letters the chief's own: three producers agree, but the order and the affidavit describe 1904, not the terms of 1890, so the prediction is borne out by what followed rather than tested against the protection treaty itself, which is not held: qualified."

  - id: congo-reform
    name: The Congo reform account
    holders: ["Casement (report of 1903, presented 1904)", "Samuel and Gorst (Commons, 20 May 1903)", "Morel (Red Rubber, 1906)", "Hochschild (1998)"]
    rests_on: [src-casement-1904, src-hansard-19030520, src-morel-1906, src-hochschild-1998]
    described_by: [src-roes-2010.p15]
    claim: "The Free State ran a rubber system enforced by armed sentries, hostages and mutilation, in breach of the guarantees of humanity and free trade given at Berlin; whole districts were emptied, and the Powers that signed the Act had the right and the duty to intervene."
    omits: "The share of the depopulation the consul himself assigned to sleeping sickness, and the years after 1908 when the reform association's own estimate of ten million became a figure historians argue over."
    adjudications:
      - claim: "The rubber system took women as hostages and was enforced by armed sentries who killed."
        verdict: supported
        basis: presence
        rests_on: [src-congo-commission-1906.p67, src-congo-commission-1906.p70, src-casement-1904.p34, src-hansard-19030520.p1332]
        reasoning: "The Free State's own commission found that when the prestations were not forthcoming the chiefs were arrested and 'often the women were held as hostages', that the State had forbidden the practice and been unable to suppress it, and that the sentries detailed to villages were 'by far the worst sort'; the consul saw two mutilated people at Lake Mantumba and was told of many more; the Commons resolved that the guarantees had been given. Three producers, one of them the perpetrator state."
      - claim: "Whole districts were emptied by the system."
        verdict: qualified
        basis: presence
        rests_on: [src-casement-1904.p22, src-casement-1904.p27, src-casement-1904.p21, src-congo-commission-1906.p115, src-congo-commission-1906.p117]
        reasoning: "The consul counted Bolobo down from fully 40,000 to 7,000 or 8,000 and the south shore of Stanley Pool from fully 5,000 Bateke to fewer than 100 at Leopoldville; the commission agreed that a large part of the river population had disappeared and that some fled the impositions to the French bank. But the consul himself gave sleeping sickness a prominent place among the causes, and the commission put smallpox and sleeping sickness above every other cause. Two producers on opposite sides agree on the emptying and disagree on the cause: qualified."

  - id: free-state-defence
    name: The Free State's own account (the Commission of Enquiry, 1905)
    holders: ["the Commission of Enquiry appointed by the Congo Free State Government (Janssens, Nisco, de Schumacher)"]
    rests_on: [src-congo-commission-1906]
    claim: "The impositions were lawful and the abuses were the work of native sentries and of practices the State had forbidden; the river population was scattered rather than destroyed, and the ravages of smallpox and sleeping sickness dwarfed every other cause of depopulation."
    omits: "Who armed the sentries and set the quotas the commission calls prestations, and any count of the people it says had disappeared."
    adjudications:
      - claim: "The causes of depopulation other than disease are secondary in importance."
        verdict: qualified
        basis: presence
        rests_on: [src-congo-commission-1906.p117, src-casement-1904.p21, src-casement-1904.p22, src-congo-commission-1906.p115]
        reasoning: "The commission wrote it, and the consul gave the disease a prominent place too; but the consul also recorded that the people themselves attributed their decrease principally to other causes, and that the Bateke of Stanley Pool crossed to the French shore in one night, while the commission's own chapter says the river people fled the impositions. Two producers, and they divide on the weight of the causes: qualified."
      - claim: "The State had long forbidden the taking of women as hostages."
        verdict: qualified
        basis: presence
        rests_on: [src-congo-commission-1906.p67, src-morel-1906.p46-47]
        reasoning: "The commission says so and says in the same sentence that the State had been unable to suppress it; Morel's summary of the missionary Sjoblom describes sentries bringing hands to the Commissioner in 1897. The prohibition is stated by the State alone, so under Rule A the verdict cannot rise above qualified, and the same document records the practice continuing."

  - id: congo-violence-historians
    name: The historians of Congo violence
    holders: ["Roes (2010)", "Stengers and Vansina, Vellut, Ndaywel, Nzongola-Ntalaja, as Roes cites them"]
    rests_on: [src-roes-2010]
    claim: "The violence was systemic, multi-causal and inexcusable; its demographic cost is contested between a maximalist position that puts the dead at roughly half the population and agnostics who call the data too thin, and no firm count is possible."
    omits: "Any figure of its own, which is the position's point; and the testimony of the people counted, which it reaches only through the reform campaign's records."
    adjudications:
      - claim: "The maximalist estimate of roughly fifty per cent, or ten million, rests on data the agnostics call shaky, and no firm estimate is possible."
        verdict: qualified
        basis: presence
        rests_on: [src-casement-1904.p27, src-casement-1904.p22, src-congo-commission-1906.p115, src-bluebook-1918.p67]
        reasoning: "The two contemporary counts this record holds are local: Bolobo, from fully 40,000 to 7,000 or 8,000, and the south shore of Stanley Pool, from fully 5,000 to under 100 at Leopoldville; the commission counted nothing and said the banks were almost deserted. Nothing in the primary record holds a figure for the whole territory, so the position's statement that no firm count exists is borne out by the absence of one, which under Rule B cannot be more than qualified; the local counts show the direction, not the total. Two producers."

  - id: herero-genocide
    name: The genocide account
    holders: ["the 1918 Blue Book", "Gewald (2004)", "Dedering (1993)", "Zimmerer and Zeller (2008)", "Adhikari (Cape Town, 2008)"]
    rests_on: [src-bluebook-1918, src-gewald-2004, src-dedering-1993, src-zimmerer-zeller-2008, src-adhikari-2008]
    claim: "The German commander's order of 2 October 1904 declared that every Herero within the German frontier would be shot; the people were driven into the Omaheke and its wells held against them; the survivors were put in camps where thousands died; no fewer than 80 per cent of the Herero were lost, and the policy was conscious."
    omits: "The order's own addendum that told the troops to shoot over the heads of women and children, and the range of the counts, which the German state's own research paper puts at anything between 29 and 86 per cent."
    adjudications:
      - claim: "The order of 2 October 1904 declared that every Herero within the German frontier, with or without a gun, with or without cattle, would be shot, and that no women or children would be taken in."
        verdict: supported
        basis: presence
        rests_on: [src-trotha-1904.whole, src-bluebook-1918.p59, src-gewald-2004.p62-63]
        reasoning: "The German army's own copy of the order says it; the British administration's report and Gewald's translation of von Estorff describe the campaign that followed. The perpetrator's record and its enemy's record agree: supported, two producers."
      - claim: "Herero leaders who came in to make peace were shot."
        verdict: qualified
        basis: presence
        rests_on: [src-bluebook-1918.p59, src-bluebook-1918.p59-60]
        reasoning: "Two Herero witnesses swore it before the British administration in 1917 and 1918, thirteen years after the event, and the report that prints them was compiled by Germany's enemy in wartime; no German record of Ombakaha is held. One producer's record of two witnesses: qualified."
      - claim: "No fewer than 80 per cent of the Herero lost their lives."
        verdict: qualified
        basis: presence
        rests_on: [src-gewald-2004.p60-61, src-bluebook-1918.p67, src-bundestag-2004.p19-20]
        reasoning: "Gewald states the share; the Blue Book counted about 15,000 alive at the end of 1905 out of 80,000 to 90,000; the Bundestag's research service reports pre-war estimates from 35,000 to 100,000 and post-war from 14,000 to 25,000, which it says yields loss rates from 29 to 86 per cent. The share is inside every range the record holds and is the top of none but the Blue Book's; three producers, and they do not agree on a number: qualified."

  - id: german-record
    name: The German state's account (the Bundestag's research service, 2004)
    holders: ["Wissenschaftliche Dienste des Deutschen Bundestages (WD 1 - 080/04)"]
    rests_on: [src-bundestag-2004]
    claim: "The losses were very heavy and cannot be counted: 7682 prisoners died in the camps between October 1904 and March 1907, a death rate of 30 to 50 per cent; estimates of the whole people run from 35,000 to 100,000 before the war and 14,000 to 25,000 after, and the genocide question divides historians, whose critics call the camps humanitarian and the counts inflated."
    omits: "Its own verdict on the genocide question, which it leaves to the historians it summarises, and the Herero witnesses, whom it does not quote."
    adjudications:
      - claim: "Between October 1904 and March 1907 a total of 7682 prisoners died in the camps."
        verdict: qualified
        basis: presence
        rests_on: [src-bundestag-2004.p19, src-bluebook-1918.p102-103, src-gewald-2004.p62-63]
        reasoning: "The German paper states the count, citing Zimmerer; the British report prints the amnesty proclamation of 1 December 1905 that called the survivors in and says thousands then died in the camps; Gewald puts 8,800 Herero in camps by late 1905. The count is one producer's, the German state's, and the other two producers give no figure that tests it: qualified under Rule A."
      - claim: "The critics of the genocide thesis hold that the camps were set up on humanitarian grounds and that the counts are inflated."
        verdict: qualified
        basis: presence
        rests_on: [src-bundestag-2004.p25, src-trotha-1904.whole, src-bluebook-1918.p102-103]
        reasoning: "The paper describes the critics' position; the order the critics must read around told the troops to take no more male prisoners, and the amnesty proclamation that filled the camps promised the survivors food, clothing and just treatment. The order is the German army's record and the proclamation is reproduced by the British; the critics' claim is described, not tested, and the documents cut both ways: qualified."

