# ------------------------------------------------------------- the thesis's own analysis
analyses:
  - id: an-act-chapters
    title: What the General Act allocates, chapter by chapter
    method: "The Act's seven chapters, one row per chapter, read in the Act's own text: the articles each chapter holds, the subject the chapter heading gives, and whether any article in it assigns a territory, a border or a place to a named Power. allocates is yes or no, read from the chapter's articles; allocates_n is 1 for yes and 0 for no. The result is the sum of allocates_n."
    finding: "Of the Act's 7 chapters, 0 allocate a territory, a border or a place to any Power. The 2 articles on occupation, 34 and 35, set rules for future acts of possession on the coasts and the authority a Power must establish there, and name no Power, no border and no place. The one line the Act draws, in Article 1, bounds the basin in which its free-trade rules run, by watersheds and parallels, and gives that basin to no one."
    confidence: "high: the rows are read from the Act's own articles in a public document, and the result is a sum of 0 and 1"
    against: "Uzoigwe reads the same articles as an appropriation 'to all intents and purposes' and the recognition of the Congo Free State as disposing of territory (p28, p30); the protocol of the conference in which the Powers recognised the flag of the International Association of the Congo (Hertslet No. 129) is not held here, and Article 1's basin, though given to no Power, was a claim that the Powers' rules ran over land whose rulers were not asked"
    result: 0
    derivation:
      compute: sum
      column: allocates_n
      columns: [chapter, articles, subject, allocates, allocates_n]
      rows:
        - {chapter: 1, articles: "1 to 8", subject: "freedom of trade in the basin of the Congo", allocates: "no", allocates_n: 0, extract: src-berlin-act-1885.art1}
        - {chapter: 2, articles: "9", subject: "the slave trade", allocates: "no", allocates_n: 0, extract: src-berlin-act-1885.art9}
        - {chapter: 3, articles: "10 to 12", subject: "neutrality of the territories in the conventional basin of the Congo", allocates: "no", allocates_n: 0, extract: src-berlin-act-1885.art10}
        - {chapter: 4, articles: "13 to 25", subject: "navigation of the Congo", allocates: "no", allocates_n: 0, extract: src-berlin-act-1885.art13}
        - {chapter: 5, articles: "26 to 33", subject: "navigation of the Niger", allocates: "no", allocates_n: 0, extract: src-berlin-act-1885.art26}
        - {chapter: 6, articles: "34 to 35", subject: "future occupations on the coasts of the African continent", allocates: "no", allocates_n: 0, extract: src-berlin-act-1885.art34}
        - {chapter: 7, articles: "36 to 38", subject: "general dispositions", allocates: "no", allocates_n: 0, extract: src-berlin-act-1885.art36}
  - id: an-herero-counts
    title: Every count of the Herero in the record
    method: "Every figure a fetched document gives for the Herero people before and after the war of 1904, one row per figure, with the document, its producer, and the before, after and share as the document states them; where a document gives only a share the counts are blank, and where it gives a range the range is kept. No range is taken across the rows, because the rows do not count the same thing: two are estimates of a whole people, one is a share, one is a prisoner count. The result is the number of rows."
    finding: "The record holds four counts of the Herero from three producers, and they do not agree: the British administration's 80,000 to 90,000 reduced to about 15,000; a missionary-quoting historian's no fewer than 80 per cent; a British campaigner of 1949, as the same historian quotes him, at all but 15,000 of 90,000; and the German parliament's research service, which reports 35,000 to 100,000 before and 14,000 to 25,000 after, and 7682 prisoners dead in the camps. Every count is a reconstruction after the fact, and the German paper says why: no census of the Herero exists for before or after the war."
    confidence: "high for the count of rows; low for any share, which the rows do not agree on and which the German paper puts anywhere between 29 and 86 per cent"
    against: "the Blue Book was compiled in wartime by Germany's enemy and Adhikari calls it a work of propaganda that is nonetheless remarkably accurate; the Bundestag paper warns that its own ranges rest on missionaries' estimates before the war and on prisoner counts by the German military after it, and that no calculation allows for natural change in the population; Gewald's 80 per cent is stated without a base"
    result: 4
    derivation:
      compute: count
      columns: [document, producer, before, after, share]
      rows:
        - {document: "Report on the Natives of South-West Africa (1918), p. 67", producer: "Union administration, Windhuk", before: "80,000 to 90,000", after: "about 15,000 at the end of 1905", share: "", extract: src-bluebook-1918.p67}
        - {document: "Gewald (2004), pp. 60-61", producer: "historian", before: "", after: "", share: "no fewer than 80 per cent lost", extract: src-gewald-2004.p60-61}
        - {document: "Michael Scott (1949), as Gewald quotes him, pp. 68-69", producer: "British campaigner, quoted by a historian", before: "90,000", after: "15,000", share: "", extract: src-gewald-2004.p68-69}
        - {document: "Bundestag research service (2004), pp. 19-20", producer: "German parliament's research service", before: "35,000 to 100,000", after: "14,000 to 25,000", share: "29 to 86 per cent lost, at the extremes", extract: src-bundestag-2004.p19-20}
  - id: an-congo-counts
    title: Every count of the Congo's people in the record
    method: "Every figure a fetched document gives for a population of the Congo Free State or for its dead, one row per figure, with the document, what the figure counts, and the before and after or the total as the document states them. The consul's counts are of named places; the historian's are of the whole territory as others estimated it. No range is taken across the rows, because a town's people and a territory's dead are not the same quantity. The result is the number of rows."
    finding: "The record holds four counts of four different things: one town, Bolobo, from fully 40,000 to 7,000 or 8,000; one shore of Stanley Pool, from fully 5,000 to not 100 at Leopoldville; the maximalist historians' roughly fifty per cent of the whole population; and the reform campaign's estimated 10 million, which Roes reports as Morel's and Hochschild's figure and the agnostics dispute. The two contemporary counts are the consul's, of places he had known before; the two totals are twentieth-century estimates that the one Tier B source held calls contested. Nothing in the primary record counts the whole."
    confidence: "moderate: the count of rows is exact, but two of the four figures are estimates reported at second hand by a historian describing a controversy, and the consul's counts are his own recollection of places against a missionary's belief"
    against: "the consul assigned a prominent place among the causes of the decrease to sleeping sickness (p21), and the Free State's commission put smallpox and sleeping sickness above every other cause (p117), so the counts measure a fall and not a cause; the commission also recorded that the Bateke crossed to the French bank, which is emigration, not death"
    result: 4
    derivation:
      compute: count
      columns: [document, counts, before, after]
      rows:
        - {document: "Casement, Africa No. 1 (1904), p. 27", counts: "the population of Bolobo, chiefly Bohangi", before: "fully 40,000 in the early days of civilised rule", after: "not more than 7,000 or 8,000, as believed in 1903", extract: src-casement-1904.p27}
        - {document: "Casement, Africa No. 1 (1904), p. 22", counts: "the Bateke of the south shore of Stanley Pool", before: "fully 5,000", after: "not 100 of the original natives at Leopoldville", extract: src-casement-1904.p22}
        - {document: "Roes (2010), AAM pp. 12-13", counts: "the whole African population of the Free State, the maximalist position", before: "", after: "roughly fifty per cent perished", extract: src-roes-2010.p12-13}
        - {document: "Roes (2010), AAM p. 15", counts: "the dead of the whole territory, as Morel, Hochschild and others estimated", before: "", after: "an estimated 10 million victims", extract: src-roes-2010.p15}
