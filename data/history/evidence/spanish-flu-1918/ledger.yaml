# ------------------------------------------------------------- positions and their adjudication
positions:
  - id: official-contemporary
    name: The official record's own account
    holders: ["Ministry of Health (1920)", "Registrar-General (1920)", "Sanitary Commissioner with the Government of India (1920)", "Census Commissioner for India (1924)", "United States Public Health Service (1918 to 1919)"]
    rests_on: [src-moh-1920, src-rg-1920, src-sancom-1918, src-census-1921, src-phr-1918-12-27, src-phr-1919-10-17-samoa]
    claim: "No death from influenza could be counted directly; every official total is an estimate of the excess over normal mortality, stated with its method, and the officials who made it said so."
    omits: "The dead outside registration: British India's figure is built on registered deaths, the native states are a guess in the Ministry's summary, and no report here counts Africa's interior."
    adjudications:
      - claim: "In British India no method exists to count the deaths actually due to influenza, and the figure of 7,089,694 is the mean of three excess-mortality estimates."
        verdict: supported
        basis: presence
        rests_on: [src-sancom-1918.p56, src-sancom-1918.p57, src-moh-1920.secindia]
        reasoning: "The Sanitary Commissioner's report states the method and the mean in its own words, and the Ministry of Health's summary, from a second producer, carries the same approximately seven millions and says that in India anything other than approximations is impossible to obtain."
      - claim: "England and Wales lost about 200,000 people to the epidemic."
        verdict: qualified
        basis: presence
        rests_on: [src-rg-1920.sectotal, src-rg-1920.secestimate, src-moh-1920.para2]
        reasoning: "The Registrar-General's 200,000 is a round figure reached by adding deaths allocated to other causes to the 151,446 allocated to influenza; the Ministry of Health, in the same year, puts the loss at upwards of 150,000, which is the allocated count. Two producers, one quantity, two conventions, so the claim holds only with its method attached."
      - claim: "The pandemic destroyed more lives in the whole world than the European war in five years."
        verdict: untestable
        basis: absence
        rests_on: [src-moh-1920.para17]
        would_settle: "a count of the war's dead and a count of the pandemic's, neither of which this record holds"
        gap: "no document here counts the war dead, and no document counts the pandemic's dead across the world"
        reasoning: "The Ministry asserts the comparison and offers no figure for either side; nothing in the free record here can test it, and it is published as the Ministry's judgment."

  - id: mortality-revisionists
    name: The upward revision of the global count
    holders: ["Johnson and Mueller (2002)", "Taubenberger and Morens (2006)", "Chandra (2013)", "Patterson and Pyle (1991)"]
    rests_on: [src-johnson-mueller-2002, src-taubenberger-morens-2006, src-chandra-2013-indonesia, src-patterson-pyle-1991]
    claim: "The recorded statistics understate the dead; each re-examination has raised the global figure, from 21.5 million to the order of 50 million, and national counts such as Java's rise when census loss replaces registration."
    omits: "What a global figure is a figure of: the position sums national estimates made by unlike methods over unlike periods, and its own abstract calls the result an understatement of unknown size."
    adjudications:
      - claim: "The recorded statistics of influenza morbidity and mortality are a significant understatement."
        verdict: supported
        basis: presence
        rests_on: [src-sancom-1918.p56, src-rg-1920.secestimate, src-phr-1918-12-27.p2306]
        reasoning: "Three producers say so of their own returns: the Sanitary Commissioner that there is no method by which the deaths actually due to influenza can be calculated, the Registrar-General that the mortality attributed to the disease does not represent the whole of that caused by it, and the Public Health Service statistician that in practically no locality can complete reports of cases be assumed."
      - claim: "Global deaths were of the order of 50 million and arguably as high as 100 million."
        verdict: untestable
        basis: absence
        rests_on: [src-taubenberger-morens-2006.para2, src-johnson-mueller-2002.abstract, src-moh-1920.para17]
        would_settle: "the national series Johnson and Mueller compiled, behind Project MUSE, and a count for the countries no series covers"
        gap: "no document in the free record sums the world; the Ministry of Health's own world comparison names no figure"
        reasoning: "No artifact here counts the world's dead, and a total built from national estimates cannot be tested against national records that themselves call their counts approximations. The figures stand as their producers' and are set beside the others in the disagreements."

  - id: mortality-sceptics
    name: The downward revision
    holders: ["Spreeuwenberg, Kroneman and Paget (2018)", "Chandra, Kuljanin and Wray (2012)"]
    rests_on: [src-spreeuwenberg-2018, src-chandra-2012-india]
    claim: "Estimates above 25 million are not realistic on the mortality rates the vital records support; the world lost about 17.4 million in 1918 and 1919, and Davis's Indian figure is overstated by at least 24 per cent."
    omits: "Countries with no vital registration, which the Human Mortality Database does not hold; the position extrapolates from 13 countries and British India."
    adjudications:
      - claim: "British India's excess mortality is an outlier at the high end, the hardest-hit country in the sample."
        verdict: supported
        basis: presence
        rests_on: [src-moh-1920.secindia, src-sancom-1918.sec57table, src-spreeuwenberg-2018.para20]
        reasoning: "The Ministry of Health wrote in 1920 that no part of the world suffered as severely as India, and the Government of India's own table carries 7,089,694 deaths for 1918; two producers agree with the position on the point it uses India for."
      - claim: "The global toll of 1918 and 1919 together was about 17.4 million."
        verdict: untestable
        basis: absence
        rests_on: [src-spreeuwenberg-2018.para22, src-rg-1920.sectotal]
        would_settle: "the vital records of the countries outside the 14 in the sample, which the position itself says it lacks"
        gap: "no document in the free record counts the world; the one national total here that is built the same way, the Registrar-General's 200,000, is one of the position's own inputs"
        reasoning: "A model's output cannot be tested against artifacts that are its inputs, and no independent count of the world exists in this record; the figure is published as the position's, beside the others."

  - id: origin-america
    name: The Kansas origin
    holders: ["Barry (2004)", "Dicke (2015)"]
    rests_on: [src-barry-2004, src-dicke-2015]
    claim: "The pandemic most likely began in Haskell County, Kansas, in January 1918, travelled to Camp Funston with recruits in late February, and from there to other camps and to France."
    omits: "The purulent bronchitis of 1916 and 1917 in France and England that the position's opponents describe, and any record from China; the position's own author calls the question impossible to answer with certainty."
    adjudications:
      - claim: "Loring Miner's Haskell County warning was the only reference to influenza in Public Health Reports in the first six months of 1918."
        verdict: qualified
        basis: presence
        rests_on: [src-barry-2004.para26, src-phr-1918-06-21.p1003]
        reasoning: "The journal's issue of 21 June 1918 reports fevers of April and May from Norfolk to Louisiana that its physicians believed were mainly influenza of mild type, a second reference inside the six months. The Haskell note itself is not held here, and the journal is one producer, so under Rule A the finding is capped at qualified: the claim fails on the journal's own text, but this record holds only one side of the comparison."
      - claim: "The American spring wave began at Camp Funston in March 1918, where more than 1,100 men were hospitalised within three weeks."
        verdict: qualified
        basis: presence
        rests_on: [src-barry-2004.para30, src-dicke-2015.para18b, src-moh-1920.para16, src-taubenberger-morens-2006.para5]
        reasoning: "The Ministry of Health dates the mild American epidemic to April and May 1918, Taubenberger and Morens to March 1918; the Funston figures rest on the two scholars and no camp record is held, and the two scholars disagree on the camp's strength, Barry giving an average of 56,222 troops and Dicke roughly twenty-six thousand. One Tier A producer, and it does not name the camp, so the date is borne out only in the season."

