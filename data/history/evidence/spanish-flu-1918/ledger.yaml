    title: Influenza in the journal's first half of 1918, as held here
    method: "One row per issue of Public Health Reports dated between 1 January and 30 June 1918 held in this record whose text mentions influenza, with the date and what it reports. The result is the count."
    finding: "This record holds 1 issue of Public Health Reports from the first half of 1918 that reports influenza, dated 21 June 1918, on fevers of April and May from Norfolk to Louisiana believed to be mainly influenza of mild type; it is not the Haskell County note of April that Barry calls the journal's only reference to influenza in those six months."
