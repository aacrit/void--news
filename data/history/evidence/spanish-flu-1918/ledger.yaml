    against: "the Haskell note itself is not held, because PubMed Central answered every 1918 issue page with a reCAPTCHA page and JSTOR's Early Journal Content holds articles rather than issues; Barry's sentence could still be true of references to a named outbreak abroad, which the June issue is not, though it says anywhere in the world"
    result: 1
    derivation:
      compute: count
      column: issue
      columns: [issue, date, reports]
