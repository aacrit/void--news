        gap: "the Public Health Service statistician wrote in December 1918 that the data were not accurate or complete enough to correlate epidemic curves with the methods employed to control the epidemic; the record holds the courts contesting the closures, not their effect"
        reasoning: "The comparison is a later reconstruction from weekly returns this record does not hold in usable form; the contemporary record shows the closures existed and were fought over, and its own statistician declined the correlation. Absence of a contemporary test is not disproof, so the finding stands as the position's."
      - claim: "In Alaska some local units escaped the first wave by travel restrictions and quarantine, while communities the virus entered lost most of their people."
        verdict: qualified
        basis: presence
        rests_on: [src-khakurel-2025.abstract, src-khakurel-2025.para6, src-alaska-1919.p5, src-alaska-1919.p40]
        rests_on_note: "the escapes are the abstract's 8 local units (src-khakurel-2025.abstract); the paragraph cited for the rates says the territory's interventions did not prevent introduction"
        reasoning: "The Senate record carries the Bureau of Education's telegram of 2 January 1919 from Nome, three villages wiped out entirely and others averaging 85 per cent deaths, and its table of approximately 2,000 deaths, so the second half of the claim is borne out by the federal record; the escapes, 8 local units in the scholars' abstract, rest on their newspaper work, and one producer caps the verdict."

  - id: latin-america
    name: The Latin American case study
    holders: ["Souza (2023)"]
    rests_on: [src-souza-2023]
    claim: "In Brazil the railway carried the disease inland to towns whose elites thought their climate protected them, and local officials called the epidemic benign while the parish register filled."
    omits: "Any national count of the dead, and the rest of Latin America, which the position's single case study does not reach."
    adjudications:
      - claim: "In Brazil the authorities first announced that the epidemic was mild, and many deaths followed."
        verdict: qualified
        basis: presence
        rests_on: [src-souza-2023.para23, src-moh-1920.secbrazil, src-moh-1920.secbrazilcount]
        reasoning: "The Ministry of Health's Brazil section says of Rio de Janeiro that the authorities at first announced the type of the malady was mild, that many deaths occurred, and that the official returns for October and November give smaller figures than the city's estimate of 15,000; that is Rio, not Diamantina, and one producer, so the pattern the position describes is borne out for the capital and capped at qualified."

  - id: iran-scholarship
    name: The Iranian account
    holders: ["Afkhami (2003)"]
    rests_on: [src-afkhami-2003]
    claim: "Iran was among the regions hit hardest, its rural districts more than its towns, and famine, opium, malaria and anaemia rather than youth and health explain the mortality."
    omits: "Any count: the position's abstract gives no figure, and its full text is behind a paywall."
    adjudications:
      - claim: "Influenza reached Persia in 1918 and found a population already weakened by typhus, relapsing fever and two failed harvests."
        verdict: qualified
        basis: presence
        rests_on: [src-afkhami-2003.abstract, src-moh-1920.secpersia]
        reasoning: "The Ministry of Health's notes from Dr Neligan of the Tehran legation say exactly this: epidemics of typhus and relapsing fever in the winter and spring before, and the dry years 1916 and 1917 with crops failed. One producer, capped at qualified."
      - claim: "Iran's mortality was among the highest in the world."
        verdict: untestable
        basis: absence
        rests_on: [src-afkhami-2003.abstract]
        would_settle: "Afkhami's full text and the Persian and legation records it draws on"
        gap: "the Ministry of Health's Persia section, the only Tier A document here on Iran, gives routes and dates and no death rate"
        reasoning: "No document here counts Iran's dead; the claim is published as the position's."

  - id: physicians-memory
    name: The physicians' memory of Camp Devens
    holders: ["Vaughan (1926)", "Wever and van Bergen (2014)"]
    rests_on: [src-vaughan-1926, src-wever-2014]
    described_by: [src-wever-2014.para45]
    claim: "At Camp Devens in September 1918 the dead were stacked about the morgue like cord wood and the epidemic flaunted its red flag in the face of science: the physicians who saw it remembered it as medicine's defeat."
    omits: "Numbers: the memoir gives none, and the letters it stands beside give a day's deaths, not the camp's total."
    adjudications:
      - claim: "At Camp Devens in late September 1918 deaths ran at about 100 a day."
        verdict: qualified
        basis: presence
        rests_on: [src-wever-2014.para45, src-wever-2014.para45b, src-wever-2014.para35, src-phr-1918-09-27.p1625]
        reasoning: "Two letters the same article reproduces give about 20 deaths a day on 24 September and about 100 a day on 29 September; the Public Health Service's report of 27 September records the disease in Massachusetts from August and 333 influenza deaths in Boston in the week of 16 to 23 September, and does not count the camp. The witnesses agree on the direction and differ by the day; one Tier A producer, and it is silent on the camp."

  - id: indian-memory
    name: A survivor's memory of the Ganges
    holders: ["Suryakant Tripathi 'Nirala' (Kulli Bhat)"]
    rests_on: [src-nirala-kulli-bhat]
    described_by: [src-arnold-2019.fn89]
    claim: "When the influenza broke out the poet lost his wife, his elder cousin, his uncle and an infant niece within days while three nephews recovered; a cart carried corpses to the Ganges, and from a high mound he watched the river carry them, in a state of mind beyond telling."
    omits: "A year, a place-name for the scene, or a count: the memoir names the influenza and the river and gives no date, and the year is the biographers', not the page's."
    adjudications:
      - claim: "The epidemic fell on the United Provinces along the Ganges with a severity the official record confirms."
        verdict: qualified
        basis: presence
        rests_on: [src-nirala-kulli-bhat.p79, src-nirala-kulli-bhat.p80, src-sancom-1918.sec57table, src-census-1921.secnatural]
        reasoning: "The memoir names the influenza and the Ganges and no year; the Government of India's table gives the United Provinces 2,034,257 deaths, the largest provincial count, at 43.4 per 1,000, and the Census of 1921 says the population of the United Provinces was substantially reduced. One producer, so qualified: the province's dead are in the record, the poet's family is not, and the year of his scene is the biographers'."

