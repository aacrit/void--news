# ------------------------------------------------------------- the thesis's own analysis
analyses:
  - id: an-india-mean
    title: The Sanitary Commissioner's mean, recomputed
    method: "The Government of India's report for 1918 gives four estimates of the deaths directly and indirectly due to influenza, sets the first aside as an overestimate, and takes the mean of the other three as its figure. One row per figure the mean is taken over, each with a weight of 1; the result is the sum of the figures over the sum of the weights, which is the mean the report prints."
    finding: "The report's 7,089,694 is the mean of its own three figures, 6,812,633, 7,304,478 and 7,151,971, and it recomputes exactly; the fourth figure, 7,718,307, is the one the report calls an overestimate and leaves out."
    confidence: "high: arithmetic on four numbers printed in one paragraph of a document held whole, the third of them checked against the page scan because the text layer garbled a digit"
    against: "none found in the Government of India's report or the Ministry of Health's summary of it; the mean is of three estimates the report itself makes without any claim to accuracy, so the arithmetic is exact and the quantity is not"
    result: 7089694
    derivation:
      compute: ratio
      column: figure
      over: weight
      columns: [method, figure, weight]
      rows:
        - {method: "excess of all-cause deaths, 1 June to 31 December 1918, over the five-year mean", figure: 6812633, weight: 1, extract: src-sancom-1918.p56}
        - {method: "all-cause deaths less plague, cholera and smallpox, against the previous quinquennium", figure: 7304478, weight: 1, extract: src-sancom-1918.p56}
        - {method: "excess of deaths from fevers and respiratory diseases over the five-year average", figure: 7151971, weight: 1, extract: src-sancom-1918.p56}
  - id: an-samoa-share
    title: Samoa's loss as a share of its people, on the commission's own denominator
    method: "The Department of Native Affairs' table, as the Public Health Service printed it, gives the population of Upolu and Savaii before and after the epidemic and the loss. The result is the loss over the population before."
    finding: "Samoa lost 7,542 of 38,178 people in the December quarter of 1918, 19.75 per cent, on the table's own figures; the Ministry of Health's summary carries the same 7,542 against a population of 30,738, which would make the share 24.5 per cent."
    confidence: "high for the share on the table's denominator, which is one document's arithmetic; the two official denominators disagree, and the table's own men's-loss cell, 3,265, is the difference of its before and after cells while the text layer had misread it as 3,285"
    against: "the Ministry of Health's summary of the New Zealand commission gives the population as 30,738, a figure 102 above the table's population after the epidemic and 7,440 below its population before; the two cannot both be the pre-epidemic population, the loss is the same in both, and the share is not"
    result: 0.19755
    derivation:
      compute: ratio
      column: lost
      over: before
      columns: [population, before, after, lost]
      rows:
        - {population: "Upolu and Savaii, men, women and children", before: 38178, after: 30636, lost: 7542, extract: src-phr-1919-10-17-samoa.p2303}
  - id: an-global-figures
    title: Every figure for the world's dead that this record holds
    method: "One row per figure for the pandemic's worldwide dead that a fetched document states or recites, with the producer of the figure, the document it is read in, and the period the figure covers where the document says; each end of a stated range is its own row, and a figure recited by a second document is a second row, marked as a recital. Jordan's estimate is entered once, as Spreeuwenberg and colleagues recite it (Johnson and Mueller recite the same 1920s calculation as 21.5). The result is the count of rows."
    finding: "The record holds 16 figures for the world's dead in 6 sources, 7 of them originating estimates and 9 recitals of those; the originating estimates are Jordan's 21.6, Patterson and Pyle's 24.7 to 39.3, Johnson and Mueller's 50, Taubenberger and Morens's 50 to 100, and Spreeuwenberg, Kroneman and Paget's 15 for 1918 alone and 17.4 for 1918 and 1919; like for like, whole pandemic against whole pandemic, the low end is 17.4 and not 15, and this thesis does not average the column or run it together as one range."
    confidence: "high for the count, which is of rows in documents held; the figures themselves are each their producer's and are not tested here"
    against: "none found beyond the figures themselves: every document that gives a figure also says the true number is uncertain, Johnson and Mueller calling theirs an understatement and Spreeuwenberg and colleagues calling totals above 25 million unrealistic, so the list is a list of disagreements and not of measurements; Spreeuwenberg and colleagues recite Patterson and Pyle as 30 with a range, where Johnson and Mueller recite only the range"
    result: 16
    derivation:
      compute: count
      column: figure_millions
      columns: [producer, figure_millions, period, kind, read_in]
      rows:
        - {producer: "Jordan (1927)", figure_millions: 21.6, period: "the pandemic", kind: originating, read_in: "Spreeuwenberg and colleagues", extract: src-spreeuwenberg-2018.para2}
        - {producer: "Patterson and Pyle (1991), low", figure_millions: 24.7, period: "the pandemic", kind: originating, read_in: "Johnson and Mueller", extract: src-johnson-mueller-2002.abstract}
        - {producer: "Patterson and Pyle (1991), high", figure_millions: 39.3, period: "the pandemic", kind: originating, read_in: "Johnson and Mueller", extract: src-johnson-mueller-2002.abstract}
        - {producer: "Patterson and Pyle (1991), central", figure_millions: 30, period: "the pandemic", kind: recital, read_in: "Spreeuwenberg and colleagues", extract: src-spreeuwenberg-2018.para2}
        - {producer: "Johnson and Mueller (2002)", figure_millions: 50, period: "1918 to 1920", kind: originating, read_in: "their abstract", extract: src-johnson-mueller-2002.abstract}
        - {producer: "Johnson and Mueller (2002), low, as recited", figure_millions: 50, period: "1918 to 1920", kind: recital, read_in: "Spreeuwenberg and colleagues", extract: src-spreeuwenberg-2018.para2}
        - {producer: "Johnson and Mueller (2002), high, as recited", figure_millions: 100, period: "1918 to 1920", kind: recital, read_in: "Spreeuwenberg and colleagues", extract: src-spreeuwenberg-2018.para2}
        - {producer: "Taubenberger and Morens (2006), estimate", figure_millions: 50, period: "1918 to 1919", kind: originating, read_in: "their article", extract: src-taubenberger-morens-2006.para2}
        - {producer: "Taubenberger and Morens (2006), upper", figure_millions: 100, period: "1918 to 1919", kind: originating, read_in: "their article", extract: src-taubenberger-morens-2006.para2}
        - {producer: "Spreeuwenberg, Kroneman and Paget (2018), 1918 only", figure_millions: 15, period: "1918", kind: originating, read_in: "their conclusion", extract: src-spreeuwenberg-2018.para22}
        - {producer: "Spreeuwenberg, Kroneman and Paget (2018), total", figure_millions: 17.4, period: "1918 and 1919", kind: originating, read_in: "their conclusion", extract: src-spreeuwenberg-2018.para22}
        - {producer: "the literature's low end, as recited", figure_millions: 15, period: "the pandemic", kind: recital, read_in: "Chandra, Kuljanin and Wray", extract: src-chandra-2012-india.abstract}
        - {producer: "the literature's high end, as recited", figure_millions: 100, period: "the pandemic", kind: recital, read_in: "Chandra, Kuljanin and Wray", extract: src-chandra-2012-india.abstract}
        - {producer: "at least 50, as recited", figure_millions: 50, period: "1918 to 1920", kind: recital, read_in: "Khakurel, Sattenspiel and Mamelund", extract: src-khakurel-2025.para6}
        - {producer: "Souza (2023), low, as recited", figure_millions: "vinte", period: "the pandemic", kind: recital, read_in: "his article", extract: src-souza-2023.para2}
        - {producer: "Souza (2023), high, as recited", figure_millions: "cem", period: "the pandemic", kind: recital, read_in: "his article", extract: src-souza-2023.para2}
  - id: an-official-rates
    title: The official death rates this record holds, side by side
    method: "One row per death rate per 1,000 of population that an official document held here states for a named population, with the producer and the period the document gives. The result is the highest rate in the column. The rows for England and Wales and for the Punjab are converted from the document's own unit: the Registrar-General prints 3,129 and 4,774 per million, stored as 3.129 and 4.774 per 1,000, and the Punjab report prints 4.77 per cent, stored as 47.7; every other rate is stored as printed."
    finding: "Of 26 official death rates in this record, the highest is 66.4 per 1,000 for the Central Provinces and Berar in 1918 and the lowest is 3.129 for civilians in England and Wales in the same year; the Union of South Africa's rate for those other than European, 27.19, is more than three times its European rate, 8.26, and New Zealand's Māori rate, 22.6, is more than four times its European rate."
    confidence: "moderate: the rates are each a document's own and the periods differ (England and Wales for the calendar year 1918, India for 1918, New Zealand's Māori for October to December 1918, South Africa for 1 August to 30 November 1918), so the column compares official arithmetic, not one measurement"
    against: "the Sanitary Commissioner's provincial rates are built on registered deaths in a country whose registration the report itself calls unreliable, and the Registrar-General's rate is of deaths allocated to influenza, not of the 200,000 he estimates, so the two ends of the column are the ends of two conventions as much as of two countries; the Ministry of Health gives New Zealand's European rate only as about 5"
    result: 66.4
    derivation:
      compute: max
      column: rate_per_1000
      columns: [population, rate_per_1000, period, producer]
      rows:
        - {population: "England and Wales, civilians", rate_per_1000: 3.129, period: "1918", producer: "Registrar-General (printed as 3,129 per million)", extract: src-rg-1920.secestimate}
        - {population: "Delhi", rate_per_1000: 56.6, period: "1918", producer: "Government of India", extract: src-sancom-1918.sec57table}
        - {population: "Bengal", rate_per_1000: 8.5, period: "1918", producer: "Government of India", extract: src-sancom-1918.sec57table}
