# ------------------------------------------------------------- positions and their adjudication
positions:
  - id: tribunal-record
    name: The tribunal's findings
    holders: ["ICTY Trial Chamber (Krstić, 2001)", "ICTY Appeals Chamber (Krstić, 2004)", "ICTY Trial Chamber (Mladić, 2017)"]
    rests_on: [src-icty-krstic-tj, src-icty-krstic-aj, src-icty-mladic-tj, src-icty-erdemovic-sj]
    claim: "Bosnian Serb forces executed several thousand captured men after the fall, in the range of 7,000 to 8,000, with the intent to destroy the Bosnian Muslims of Srebrenica in part, which the law names genocide."
    omits: "What the record of the crime says about the fall itself: the judgments settle what was done to the captured men, not what the Security Council, UNPROFOR or the Bosnian government could have done before 11 July 1995."
    adjudications:
      - claim: "The total number of men executed is likely to be within the range of 7,000 to 8,000."
        verdict: qualified
        basis: presence
        rests_on: [src-icty-krstic-tj.para84, src-icty-krstic-tj.para80, src-un-ares78282.whole]
        reasoning: "The tribunal's 2001 range rests on exhumations to 2000 and a stated minimum of 2,028 bodies; the General Assembly's 2024 resolution counts at least 8,372 lives lost. Two producers, two figures; the later and larger count is the one the record now carries, so the tribunal's range stands as a floor, not a total."
      - claim: "The bodies in the graves were not combat casualties but executed prisoners."
        verdict: qualified
        basis: presence
        rests_on: [src-icty-krstic-tj.para75, src-icty-krstic-tj.para77, src-un-a54549.para2]
        reasoning: "The Secretariat's report reproduces the confirming judge's 1995 summary of the same evidence, so a second producer records the same finding; but the tribunal itself does not rule out that a share of the bodies were men killed in combat, and a claim the court hedges cannot be stronger on this page than in the judgment."
  - id: united-nations
    name: The United Nations' own account
    holders: ["The Secretary-General (A/54/549, 1999)", "The Security Council (resolution 819, 1993)", "The General Assembly (resolution 78/282, 2024)"]
    rests_on: [src-un-a54549, src-un-sres-819, src-un-ares78282]
    claim: "The safe area was declared without the consent of the parties and without a credible military deterrent, and the failure to hold it ran from the Council to the field."
    omits: "The perpetrators' own chain of command, which an account of institutional failure passes over, and the count of the dead, which the Secretariat's report leaves to the tribunal."
    adjudications:
      - claim: "The Netherlands battalion was lightly armed and outnumbered by a besieging force of 1,000 to 2,000 well-equipped soldiers."
        verdict: supported
        basis: presence
        rests_on: [src-un-a54549.para230, src-un-a54549.para472, src-icty-krstic-tj.para20, src-icty-krstic-tj.para21]
        reasoning: "The tribunal, from its own evidence, puts the peacekeepers at no more than 600 lightly armed men and the Drina Corps at between 1,000 and 2,000 soldiers with tanks, armoured vehicles, artillery and mortars, which is the Secretariat's account in different words. Two producers agree on the numbers and the arms."
      - claim: "Up to 20,000 people were killed in and around the six safe areas."
        verdict: untestable
        basis: absence
        rests_on: [src-un-a54549.para3]
        reasoning: "No document in the free record counts the dead across all six safe areas; the tribunal counts Srebrenica alone. The figure stands as the Secretariat's and nothing here can test it."
  - id: the-lawsuits
    name: The courts on liability
    holders: ["Supreme Court of the Netherlands (2019)", "European Court of Human Rights (2013)", "Rijnhout", "Spijkers"]
    rests_on: [src-nl-hr-2019, src-echr-mothers-2013, src-rijnhout-2021, src-spijkers-2021]
    claim: "The Dutch State is liable for 10 per cent of the damage to the relatives of the men evacuated from the compound on 13 July 1995 and for nothing before 23:00 on 11 July; the United Nations keeps its immunity."
    omits: "The men outside the compound, whom the Dutch judgment does not reach, and the perpetrators, whom a civil suit against a state cannot name as defendants."
    adjudications:
      - claim: "About 350 male refugees were inside the compound on 13 July 1995."
        verdict: qualified
        basis: presence
        rests_on: [src-nl-hr-2019.sec5, src-icty-krstic-tj.para37]
        reasoning: "The tribunal's witnesses put at least 300 men inside the perimeter of the compound on the evening of 11 July and 600 to 900 in the crowd outside; the Dutch court's approximately 350 on 13 July is of the same order and from a different producer. The two counts are not of the same day, so they agree without confirming each other."
      - claim: "The United Nations' immunity from Dutch jurisdiction served a legitimate purpose and was not disproportionate."
        verdict: qualified
        basis: presence
        rests_on: [src-echr-mothers-2013.para154, src-echr-mothers-2013.para169, src-echr-mothers-2013.para162]
        reasoning: "The Strasbourg court's own decision is the only record of this holding in the free ledger, and the same decision records that the claims commission the 1993 status agreement required was never set up. One producer, so the verdict is capped at qualified, and the court's own finding of the unmet remedy is the qualification."
  - id: dutch-inquiry-debate
    name: The Dutch inquiry and its critics
    holders: ["Blom, de Graaff and Schoonoord (NIOD, 2003)", "Brouwer (2003)"]
    rests_on: [src-blom-2003, src-brouwer-2003, src-niod-2002]
    claim: "The NIOD report was accepted by parliament as thorough and balanced, and its reviewers disagreed sharply on whether its length and its lateness were faults or the price of the method."
    omits: "The report's own text, which the free record does not hold, so this position is known here through the debate about it and through the Dutch Supreme Court's use of it."
    adjudications:
      - claim: "The NIOD report's findings of fact were adopted by the Dutch courts as the established facts of the case."
        verdict: qualified
        basis: presence
        rests_on: [src-nl-hr-2019.sec5]
        reasoning: "The Supreme Court's judgment builds its established facts on the NIOD report and cites it by page, so the report's authority in the Dutch record is documented; but the judgment is one producer and the report itself could not be read, so the verdict is capped at qualified."
  - id: serbian-denial
    name: Denial in Serbia and Republika Srpska
    holders: ["Atlagić and Martinović (2021)", "the Republika Srpska government's bureau report of 2002, as Manojlović Pintar describes it"]
    rests_on: [src-atlagic-2021]
    claim: "No genocide occurred; the real number of Muslim victims was between 800 and 1,200; the figure of 8,000 was constructed for propaganda by the United States and the Bosnian leadership."
    omits: "The forensic record of blindfolds, ligatures and reburied graves that the tribunal set out, and the count of bodies exhumed, which the position's own abstract does not mention."
    adjudications:
      - claim: "The real number of Muslim victims is between 800 and 1,200, and the figure of 8,000 is exaggerated."
        verdict: contradicted
        basis: presence
        rests_on: [src-icty-krstic-tj.para80, src-icty-krstic-tj.para84, src-un-ares78282.whole]
        reasoning: "By 2000 the prosecution's exhumations had established a minimum of 2,028 bodies in the graves examined, above the position's ceiling of 1,200 before a single unexhumed grave is counted; the tribunal's range is 7,000 to 8,000 and the General Assembly's count is at least 8,372. Two producers, the tribunal and the General Assembly, contradict the figure."
      - claim: "The killers had no intent to destroy the Muslim population, so there was no genocide."
        verdict: contradicted
        basis: presence
        rests_on: [src-icty-krstic-tj.para598, src-icty-krstic-aj.para37, src-icty-mladic-tj.para5214, src-un-ares78282.whole]
        reasoning: "The Trial Chamber found the intent to kill all the military-aged men to be an intent to destroy the group in part; the Appeals Chamber affirmed the name genocide; the Mladić chamber convicted on the genocide count; the General Assembly recites eight genocide verdicts and the ICJ's 2007 determination. Two producers."
      - claim: "The United States asked the Bosnian leadership to have 5,000 Muslims killed to justify bombing the Serbs."
        verdict: untestable
        basis: absence
        rests_on: [src-atlagic-2021.abstract]
        reasoning: "No document in the free record carries this conversation or anything about it, and a claim about a private conversation cannot be tested against artifacts that do not mention it. It is published here as the position's own words and nothing more."
  - id: serbian-critical
    name: Serbian critical historiography
    holders: ["Manojlović Pintar (Institute for Recent History of Serbia, 2024)"]
    rests_on: [src-pintar-2024]
    claim: "Republika Srpska's official reading of Srebrenica moved from concealment, through a period of alignment with the international courts, to organised denial, and three official reports of 2002, 2004 and 2021 reached conflicting conclusions."
    omits: "The reports themselves, which the free record does not hold, so what they concluded is known here only as this scholarship summarises them."
    adjudications:
      - claim: "Both the International Court of Justice and the tribunal classified the crime as genocide."
        verdict: supported
        basis: presence
        rests_on: [src-icty-krstic-aj.para37, src-un-ares78282.whole]
        reasoning: "The Appeals Chamber's judgment names the crime genocide, and the General Assembly's 2024 resolution recites the ICJ's determination of 26 February 2007 that the acts committed in Srebrenica were genocide. Two producers, the tribunal and the General Assembly, carry the two classifications."
      - claim: "The Republika Srpska government's reports of 2002 and 2004 reached conflicting conclusions."
        verdict: untestable
        basis: absence
        rests_on: [src-pintar-2024.p32]
        reasoning: "Neither report could be read from an open archive, so the conflict between them is recorded here as this scholarship describes it and cannot be tested against the documents."
  - id: bosniak-scholarship
    name: Bosniak scholarship and memory
    holders: ["Karčić (Institute for the Islamic Tradition of Bosniaks, 2022)", "Bakić (University of Sarajevo, 2021)", "Gerstein and Karčić (2025)"]
    rests_on: [src-karcic-2022, src-bakic-2021, src-gerstein-karcic-2025]
    claim: "The killing of the enclave's imams from 1992 was one segment of a genocide against the Bosniaks of the Drina valley, and the memorial at Potočari is the ground on which continuing denial is fought."
    omits: "The wartime conduct of the enclave's own forces, which the tribunal's record discusses and this scholarship leaves to the courts."
    adjudications:
      - claim: "A genocide took place in and around Srebrenica, and its denial continues."
        verdict: supported
        basis: presence
        rests_on: [src-icty-krstic-aj.para37, src-un-ares78282.whole]
        reasoning: "The tribunal's appellate finding and the General Assembly's 2024 resolution, which condemns any denial of the genocide as a historical event, carry both halves of the claim from two producers."
      - claim: "The Islamic Community's May 1995 report counted 51 imams in the Srebrenica area, and they were sought out to be killed."
        verdict: untestable
        basis: absence
        rests_on: [src-karcic-2022.p2]
        reasoning: "No judgment or UN document in the free record counts the enclave's imams or records the targeting of clergy as such, so the claim stands on the scholarship's own war reports and testimonies and cannot be tested here."

