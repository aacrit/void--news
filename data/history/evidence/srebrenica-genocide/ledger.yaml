# ------------------------------------------------------------- the thesis's own analysis
analyses:
  - id: an-crowd-counts
    title: One crowd, six counts
    method: "Every figure the fetched primary documents give for the number of people who gathered at Potočari on 11 to 13 July 1995, one row per figure, with the document and the moment it counts. The result is the range of the column."
    finding: "The record counts the crowd at Potočari at between 15,000 and 25,000, and the two lowest figures are the two the battalion commander wrote on the day."
    confidence: entailed
    against: null
    result: [15000, 25000]
    derivation:
      compute: range
      column: count
      columns: [document, moment, count]
      rows:
        - {document: "Karremans, report of 12 July 1995 (P 404/88)", moment: "as of 12 July", count: 17500, extract: src-icty-krstic-tj.fn2}
        - {document: "Mandžić, testimony (T. 963)", moment: "the crowd at Potočari", count: 25000, extract: src-icty-krstic-tj.fn2}
        - {document: "UNMO fax of 13 July 1995 (P 77/26), low", moment: "still to be transported on 13 July", count: 20000, extract: src-icty-krstic-tj.fn2}
        - {document: "UNMO fax of 13 July 1995 (P 77/26), high", moment: "still to be transported on 13 July", count: 25000, extract: src-icty-krstic-tj.fn2}
        - {document: "Krstić Trial Judgement, paragraph 37, low", moment: "evening of 11 July", count: 20000, extract: src-icty-krstic-tj.para37}
        - {document: "Krstić Trial Judgement, paragraph 37, high", moment: "evening of 11 July", count: 25000, extract: src-icty-krstic-tj.para37}
        - {document: "UN military observers, report at 1600 hours (A/54/549, paragraph 308)", moment: "1600 hours, 11 July", count: 20000, extract: src-un-a54549.para308}
