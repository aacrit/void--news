# The evidence ledger for the-holocaust (docs/proposals/HISTORY-THESIS-PAGE.md §3, §4c, §8).
# Begun 2026-10-07: the sources a fifteen-minute documentary with five perspectives at parity
# can read from (the victims and survivors; the perpetrators' own record; the Allies and
# bystanders, what was known when; resistance; historians and the death-toll methods), and
# the record the live script and event YAML are checked against. Every entry was fetched on
# 2026-10-07 from the URL it names; every extract under extracts/ was sliced from the fetched
# copy by a builder script (start marker to end marker, scratch out/ledger-holocaust/build.py),
# never retyped. Nothing here was written from memory. A work the free record could not reach
# is listed under `gaps`, by name, with what was tried.
#
# This is NOT a thesis ledger: no positions, contested claims, exhibits or analyses are
# adjudicated here, and the event renders the Hearing. The bar of §4e is not claimed.
#
# Each entry carries `perspective` (which of the five it serves; several serve two),
# `translation` (who made the English, where the record says), `shows` and `does_not_show`.
# Numbers: every figure below is the PRODUCER's, with its method and date where the record
# gives them. They are listed side by side and never averaged.
#
# None of the three `primary_source_excerpts` the event YAML carries is held: Levi's poem is a
# copyrighted translation with no lawful free copy and the YAML's wording is not the published
# one; the Wiesel line is not in the Nobel speech the YAML names (both 1986 Oslo texts were
# read whole); the Karski line has no document behind it here. See gaps.
slug: the-holocaust
