  - what: "Seymour Drescher, Econocide (1977); Hugh Thomas, The Slave Trade (1997); Paul Lovejoy, Transformations in Slavery (1983); John Thornton, Africa and Africans in the Making of the Atlantic World (1992); Adam Hochschild, Bury the Chains (2005); Saidiya Hartman, Lose Your Mother (2007); Joseph Inikori, Africans and the Industrial Revolution in England (2002); Karl Polanyi, Dahomey and the Slave Trade (1966)"
