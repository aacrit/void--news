gaps:
  - entry: src-cobbett-17890512
    what: "The event YAML's primary_source_excerpt attributed to William Wilberforce, Speech to the House of Commons, May 12, 1789: 'Is not the slave trade entirely a war with the heart of man? And surely that which is begun by breaking down the barriers of virtue, involves in its continuance destruction to every principle of justice and religion.' Also the perspective notable_quote of its first sentence"
    tried: ["https://archive.org/details/10279136bsb", "https://www.gutenberg.org/cache/epub/15399/pg15399.txt"]
    status: "The OCR of the 12 May 1789 debate in Cobbett vol. 28 was searched; the sentence is not found there. The words are OLAUDAH EQUIANO's, in his Narrative of 1789 (chapter V), in a different form: 'But is not the slave trade entirely a war with the heart of man? And surely that which is begun by breaking down the barriers of virtue involves in its continuance destruction to every principle, and buries all sentiments in ruin!' That passage is deliberately NOT held: holding it would let the YAML's first sentence pass the quote gate as Wilberforce's (a misattribution) and would fail tests/test_history_quote_ledger.py on the excerpt's divergent ending. Correct the YAML attribution first, then pin src-equiano-1789 at that passage"
  - what: "King Ghezo of Dahomey, 1849: 'The slave trade is the ruling principle of my people. It is the source and the glory of their wealth.' (perspective notable_quote)"
    tried: ["https://archive.org/details/dahomeyanddahom00forbgoog", "https://archive.org/details/dahomeyanddahom01forbgoog", "https://archive.org/details/dahomeyanddahom02forbgoog", "https://archive.org/details/dahomeyanddahom03forbgoog", "https://archive.org/details/dahomeyanddahom04forbgoog", "https://archive.org/details/dahomeydahomansb00forb"]
    status: "Forbes, Dahomey and the Dahomans (1851), both volumes in several scans, was searched for 'ruling principle', 'glory' and 'lull'; the sentence is not in it. Its source is unknown to this ledger and it is unverified; the context the YAML gives ('to British consul at Abomey, 1849') is unverified too"
  - what: "'We want nothing from the white man but gunpowder and shot, and we will sell slaves to get them.' attributed to an Ashanti trader, reported by Bowdich, Mission from Cape Coast Castle to Ashantee, 1819 (perspective notable_quote)"
    tried: ["https://archive.org/details/missionfromcapec00bowd"]
    status: "Bowdich 1819 was read whole in its OCR layer; 'gunpowder and shot' is not in it. Unverified. An Asante voice IS held instead: the King of Ashantee to Dupuis, 1820, as Dupuis records it (src-dupuis-1824)"
  - entry: src-afonso-15260706
    what: "The YAML's English for Afonso's letter of 1526: 'Each day the traders are kidnapping our people, children of this country, sons of our nobles and vassals, even people of our own family ... our land is entirely depopulated' (summary and notable_quote)"
    tried: ["https://archive.org/details/monumentamissionariaafricana"]
    status: "The Portuguese is held (Brásio's edition of the Torre do Tombo letter of 6 July 1526) with a Void translation. The YAML's English is a published translation this ledger did not read (its translator is not named in the YAML) and it does not match the original's structure: the letter says the merchants CARRY OFF ('leuam') our people every day and that thieves and men of bad conscience STEAL them ('os furtam') to sell for Portuguese goods. Not held; the notable_quote stays withdrawn"
  - what: "Nathan Nunn, 'The slave trade was not just a removal of people. It was a removal of possibilities.' (notable_quote, 'lecture summary, 2008'), and the YAML's '72% to 112% of its potential population growth'"
    tried: ["https://www.nber.org/system/files/working_papers/w13367/w13367.pdf", "https://scholar.harvard.edu/files/nunn/files/empirical_slavery.pdf"]
    status: "The 2007 working paper was read (the Harvard copy answered HTTP 403). Neither the sentence nor the 72-112% figure is in it. The paper's own population claim is Manning's: by 1850 Africa's population was only half of what it would have been. Unverified"
  - what: "Karl Marx, Capital, vol. 1, ch. 31 (notable_quote with an ellipsis) and Edward Gibbon Wakefield, A View of the Art of Colonization, 1849 (notable_quote)"
    tried: []
