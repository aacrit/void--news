# The evidence ledger for transatlantic-slave-trade (docs/proposals/HISTORY-THESIS-PAGE.md §3, §4c, §8).
# Begun 2026-10-09 for the Orpheus episode and the first-listener script: the sources the
# script's document voice may read from and the record its narration is checked against.
# Every entry was fetched on 2026-10-09 from the URL it names; every extract under extracts/
# was sliced from the fetched copy by a builder script (start marker to end marker, runs of
# whitespace collapsed; scratch out/ledger-transatlantic-slave-trade/build.py), never retyped.
# Where a scan's OCR layer is the free copy, the extract keeps the layer's glyphs (the long s
# read as f, note marks, line-end hyphens) and says so in a note. Nothing here was written
# from memory. A work the free record could not reach is listed under `gaps`, by name, with
# what was tried.
#
# This is NOT a thesis ledger: no positions, contested claims, exhibits or analyses are
# adjudicated here, and the event renders the Hearing. The bar of §4e is not claimed.
# `perspective:` on an entry names the event YAML perspective it chiefly serves (five, at
# parity); `does_not_show:` says what the document cannot carry.
#
# Three quotations the event YAML carries were checked against the documents they name and
# are deliberately NOT held, because holding the passage would make a misattribution pass
# the quote gate or would sit beside a divergent copy (see gaps): the sentence the YAML gives
# to Wilberforce, which is Equiano's (Narrative, 1789), in a different form; Ghezo's "ruling
# principle"; and the "Ashanti trader" line given to Bowdich.
#
# Translations: four Void translations (`*.en.txt`, rendering: void-translation) of the
# Kongo letter of 1526 and of three Brazilian laws. None is a published translation.
slug: transatlantic-slave-trade
bootstrapped: 2026-10-09

