# ------------------------------------------------------------- recordings
# Archival audio artifacts (docs/proposals/HISTORY-AUDIO-ARCHIVAL.md §4a). A recording is a
# factual claim four times over: this speaker, this occasion, this date, these words. Every
# `*_as_stated` field is copied from the repository's own page or file headers as fetched on
# `fetched_at`, never from memory. `transcript` is verbatim from the ledger extract named in
# `transcript_extract`. `verification` names the record pipeline/history/verify_clip.py wrote;
# its WER, coverage, excerpt sha256 and verified_at are the check's, never hand-typed.
# `signed_by` / `signed_at` are the CEO's, per clip, and nothing plays in an episode until both
# are set (policy B, §2). Every row here is left UNSIGNED for the CEO.
# All three are windows of ONE file, the LBJ Library's recording of the 27 May 1964 call with
# Bundy (the Apollo 11 precedent: several windows of one public-domain file). H-16 allows at most
# three clips per episode; an episode should take at most two of these, so that the call does
# not stand in for the war.
recordings:
  # A candidate that FAILS the transcript gate, kept so the reason is on the record. No `# CLIP:` directive should name it.
  - id: clip-johnson-biggest-damn-mess-19640527
    kind: audio
    title: "Lyndon B. Johnson, 'the biggest damn mess that I ever saw', in the LBJ Library's recording of his call with McGeorge Bundy, 27 May 1964"
    speaker: Lyndon B. Johnson
    occasion: "Telephone conversation between President Johnson and his Special Assistant for National Security Affairs, McGeorge Bundy, 11:24 a.m., recorded by the White House; LBJ Library telephone conversation #3522 (WH6405.10)"
    date: "1964-05-27"
    date_as_stated: "the Library's item page: 'ORIGIN DATE 05/27/1964'; FRUS: 'Washington, May 27, 1964, 11:24 a.m.' (src-frus-1964-68-v27-d53.secmess)"
    repository: Lyndon Baines Johnson Presidential Library (National Archives and Records Administration)
    accession: "LBJ Library telephone conversation #3522 (the file name: clip_lbj_wh6405_10_3522_Bundy)"
    url: "https://www.lbjlibrary.org/object/audio/may-27-1964-president-johnson-expresses-anguish-over-vietnam-war-his-national-security"
    file: "https://lbj-prod-staticfiles-4pgcba8v8q69.s3.amazonaws.com/artifacts/audio/2018-08/clip_lbj_wh6405_10_3522_Bundy.wav"
    file_md5: 79cf8308b368ff7962d701599a80c7c1
    file_md5_as_stated: "the Library publishes no checksum on its page; the file's S3 ETag as served on 2026-10-09 is \"79cf8308b368ff7962d701599a80c7c1\", which equals the md5 of the file as fetched (40,337,452 bytes, audio/x-wav, Last-Modified Thu, 02 Aug 2018 14:31:21 GMT); recorded so the render job refuses a changed file"
    title_as_stated: "May 27, 1964: President Johnson expresses anguish over the Vietnam War to his National Security Adviser McGeorge Bundy"
    creator_as_stated: "'CREDIT LBJ Library telephone conversation, #3522.' (the item page); the page names no recordist"
    origin_as_stated: "the Library's audio object page, which serves the file as 'clip_lbj_wh6405_10_3522_Bundy.wav' with a 'Download (WAV, 38.5 MB)' link; the file is a clip of the conversation (457.3 s, mono PCM, 44.1 kHz), not the whole call; the Library's lbjtapes.org page for the same conversation ('WH6405-10-3522') serves a separate MP3, which is not used"
    uploader_as_stated: the Library's own site and storage; no third-party uploader
    licence_as_stated: "the item page: 'RIGHTS Public domain'"
    licence_url: "https://www.lbjlibrary.org/object/audio/may-27-1964-president-johnson-expresses-anguish-over-vietnam-war-his-national-security"
    rights_basis: public-domain-as-stated
    rights_reading: "A presidential telephone conversation recorded by the White House and served by the federal presidential library, whose item page states 'RIGHTS Public domain'. The words are the President's own, spoken in office to a member of his staff. Admissible under policy B with the CEO's signature"
