    duration_s: 457.34
    excerpt: {in: '00:00:26.800', out: '00:00:32.480'}
    transcript_extract: src-frus-1964-68-v27-d53.secmess
    transcript: I don’t think it’s worth fighting for and I don’t think we can get out. And it’s just the biggest damn mess that I ever saw.
    verification: recordings/clip-johnson-biggest-damn-mess-19640527.verification.json
    observed: "NOT ADMITTED. The record: faster-whisper base.en, WER 0.133, coverage 0.867, FAIL ('the window does not close on the transcript's last words'): base.en heard '... the biggest damn mess it is.' for '... the biggest damn mess that I ever saw.' Moving the out point to 32.56 s and the in point to 26.90 s gave the same hearing. FRUS prints 'that I ever saw' and the Library's own title for the call (on lbjtapes.org) quotes 'just the biggest damn mess I ever saw'; the ASR does not confirm either ending, and the bar is not lowered: the document voice reads the line. The window sits between Johnson's 'in that area.' (ends about 26.4 s) and Bundy's 'It is an awful mess' (about 32.6 s). The file is mono PCM, 44.1 kHz, 7 min 37 s"
    shows: "Johnson's voice, ten weeks before the Gulf of Tonkin, saying he does not think Vietnam is worth fighting for and does not think the United States can get out"
    does_not_show: "what he decided; Bundy's answer ('It is an awful mess.'), which begins about 0.1 s after the window closes; the rest of the call"
    signed_by: null
    signed_at: null

