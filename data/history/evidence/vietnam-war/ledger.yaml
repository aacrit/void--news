# ------------------------------------------------------------- disagreements held, not adjudicated
# Where two held sources disagree, both are held. This is a list for the writer, not a verdict.
# Casualty and tonnage figures are listed per producer and are never averaged.
# 1. Jefferson in Ho Chi Minh's mouth. Three texts are held and none is Jefferson's sentence. The
#    Selected Works English: "All men are created equal. They are endowed by their Creator with
#    certain inalienable rights, among these are Life, Liberty, and the pursuit of Happiness."
#    (src-ho-declaration-1945-sw.secopening). The Pentagon Papers' English: "All men are created
#    equal; they are endowed by their Creator with certain unalienable Rights; among these ..."
#    (src-pp-part-i.secdeclaration). The Vietnamese as the Government portal prints it: "Tất cả
#    mọi người đều sinh ra có quyền bình đẳng, tạo hóa cho họ những quyền không ai có thể xâm
#    phạm được." (src-chinhphu-declaration-vi.secopening). The ledger holds no copy of the 1776
#    text. The event YAML and the live script say Ho quoted Jefferson "word for word"; the held
#    record shows a Vietnamese rendering and two English renderings of it that differ from each
#    other, and nothing that compares either with Jefferson's own words.
# 2. The crowd. The Government portal: read "trước hàng vạn đồng bào" at Ba Đình Square
#    (src-chinhphu-declaration-vi.secopening; "hàng vạn" is "tens of thousands", a working gloss).
#    The event YAML and the live script: "half a million people". No held source gives half a million.
# 3. Ho's appeals. The Pentagon Papers: "at least, eight communications from Ho to the President of
#    the United States, or to the Secretary of State, from October, 1945, to February, 1946", and
#    "There is no record of U.S. reply to any of HO's appeals for aid." (src-pp-part-i.secletters).
#    The YAML: "eight times" to Truman, "The letters went unanswered", "The State Department filed
#    them". The count in the record is a floor ("at least"), the addressee is the President OR the
#    Secretary of State, and "no record of reply" is the study's wording.
# 4. Eighty percent. The Pentagon Papers: "President Eisenhower is widely quoted to the effect that
#    in 1954 as many as 80% of the Vietnamese people would have voted for Ho Chi Minh ... in an
#    election against Bao Dai", and "by 1956 the proportion ... would have been much smaller than
#    80%" (src-pp-part-iva5.seceighty). Eisenhower's own words are a gap (src-eisenhower-1963). The
#    YAML quotes a sentence from his memoir that the ledger does not hold.
# 5. Geneva and the elections. The Final Declaration: "general elections shall be held in July
#    1956" (src-unts-geneva-1954.secpara7). The United States "TAKES NOTE" and declares it "will
#    refrain from the threat or the use of force to disturb them" (secusdeclaration). The State of
#    Viet-Nam undertakes not to use force "despite the objections and reservations it has expressed"
#    (secstateofvietnam). Diem, 16 July 1955, as the Pentagon Papers quote him: "we remain skeptical
#    concerning the possibility of fulfilling the conditions of free elections in the North", and the
#    study: "Diem obdurately refused to open talks with the Hanoi government" (src-pp-part-iva5.secdiem).
#    The YAML says the United States "refused to sign" and "installed" Diem, and that "Diem canceled
#    the elections"; the held record has the United States taking note and Diem refusing talks.
# 6. The second Tonkin attack. The Pentagon Papers (1968-69): "the evidence does not support beliefs
#    (which have been expressed) that the incident was staged" and points to "a deliberate DRV
#    decision" (src-pp-part-ivc2b.secsecondattack). NSA's history: "no attack happened that night"
#    (src-nsa-hanyok-2001.secfindings). Johnson on television that evening: the attack "was repeated
#    today by a number of hostile vessels attacking two U.S. destroyers with torpedoes"
#    (src-app-lbj-19640804.secopening). Not staged, and not real: the two held government histories
#    are not answering the same question.
# 7. What the sonar heard. NSA: the Desoto mission reported "all others were caused by reflections
#    off the two destroyers' screws", and Sharp relayed doubts "because of freak weather, over-eager
#    sonar operators, and the absence of visual sightings" (src-nsa-hanyok-2001.secsharp). The live
#    script and the YAML: operators "picked up their own ship's propeller wake". Screws (propellers)
#    and reflections are held; "wake" is not.
# 8. What Johnson knew, and when. NSA: Sharp's doubts reached the Pentagon at about 1400 EST on 4
#    August (secsharp); Johnson's "Hell, those damn, stupid sailors were just shooting at flying
#    fish" is printed "a few days later" with no footnote (secflyingfish), so the remark is held only
#    secondhand. The live script: "President Johnson knew within days that the second attack never
#    happened." The held record supports doubt reported the same day and a remark reported without
#    a source, not knowledge.
# 9. The vote. The Pentagon Papers: "by votes of 88 to 2 in the Senate and 416 to 0 in the House",
#    the day after committee discussion on 6 August (src-pp-part-ivc2b.secvotes). The statute was
#    approved 10 August (src-statute-78-384.secresolution). The live script's "five hundred and four
#    votes to two" adds two separate votes into one. The names of the two senators who voted no are
#    not in any held extract.
# 10. The dominoes. Eisenhower's own answer lists "the loss of Indochina, of Burma, of Thailand, of
#    the Peninsula, and Indonesia following" (src-app-eisenhower-19540407.secdomino). The live script:
#    "Laos and Cambodia would go next". The YAML: "Thailand, then Malaysia, then Indonesia". Laos,
#    Cambodia and Malaysia are not in his answer.
# 11. The hamlets. The Pentagon Papers: by the end of summer 1962 the GVN "claimed that 3,225 of the
#    planned 11,316 hamlets had already been completed and that over 33 percent of the nation's total
#    population was already living in completed hamlets" (src-pp-part-ivb2.sechamlets). The YAML
#    and the live script: 8,600 hamlets and 8.7 million people by October 1963, "fabricated". Neither
#    figure nor the word is held.
# 12. My Lai, the dead. The Army's inquiry: "at least 175 and may exceed 400" in two hamlets of Son
#    My Village, 16-19 March 1968 (src-peers-1970.secfindings); for Company C at My Lai (4), "at
#    least 175-200" (seccompany). A notice the report attributes to the other side: "502 people were
#    massacred at Tu Cung and Co Luy Hamlets" (secnotice). The Quảng Ngãi provincial government, 2026:
#    "504 civilians" (src-qn-sonmy-2026.secceremony, seckilled). The YAML and the live script state
#    504 as fact. The task force itself reported "a total of 128 VC killed" (sec128); the YAML
#    attributes the 128 to Medina.
# 13. My Lai, Thompson. The report: Thompson "landed his helicopter several times to aid the
#    inhabitants and in an attempt to stop the killing" (secthompson); his door gunner testified that
#    Thompson told the crew that if the American troops fired on the Vietnamese while he was trying to
#    get them out of the bunker, the crew was to fire back at them (secbunker). The live script: he
#    ordered his door gunner "to fire on any American who keeps killing". The held order is
#    conditional and concerns one bunker.
# 14. Cambodia, the tonnage. Representative Conyers, 1974: from 18 March 1969 to 1 May 1970, 3,695
#    B-52 sorties and 105,837 tons; to August 1973, "more than 150,000 sorties dropped in excess of
#    500,000 tons" (src-hjc-report-1974.secconyers). The Walrus, 2006, from the Air Force database:
#    "2,756,941 tons' worth, dropped in 230,516 sorties on 113,716 sites" from 4 October 1965, so "not
#    under Nixon, but under Lyndon Johnson" (src-walrus-owen-2006.sectonnage). The YAML: 2.7 million
#    tons, 1969-1973. The start date and the total both differ by source.
# 15. Cambodia, the dead and the cause. The Walrus: "Previously, it was estimated that between 50,000
#    and 150,000 Cambodian civilians were killed ... surely higher" (seccasualties), and the bombs
#    "drove ordinary Cambodians into the arms of the Khmer Rouge" (secdominoes). The YAML: "an
#    estimated 100,000-150,000". The Administration's case, as the House report records it:
#    "Cambodia's ruler, Prince Sihanouk, had privately agreed to the bombing" (secjustification).
#    Nixon, 30 April 1970: "American policy since then has been to scrupulously respect the
#    neutrality of the Cambodian people" (src-app-nixon-19700430.secneutrality), while the House
#    report dates the MENU strikes from 18 March 1969, reported as "in South Vietnam rather than in
#    Cambodia" (secmenu). The committee voted 26 to 12 not to report the article (seccambodia).
# 16. Laos, the missions and the casualties. The Lao government's report: "more than 500,000 bombing
#    missions dropped over two million tons" (src-undp-lao-2009.secscale). The YAML and the live
#    script: 580,000 missions. On the dead, the same report gives "more than 22,000 people ... have
#    fallen victim to UXO and bombies, almost half of whom died" since the conflict ended, and a
#    survey of "more than 50,000 UXO casualties" 1964-2007, "20,000 since the conflict ended"
#    (seccasualties). The YAML: "UXO killed more than 20,000 Laotians". Victims (killed or injured)
#    are not deaths.
# 17. Laos, unexploded. The Lao report: "More than 270 million bombies", "an average failure rate of
#    30 percent", "as many as 80 million" (secscale). The State Department, 2018: "as many as one-third
#    ... failed", "more than 80 million" (src-state-laos-2018.secintro). An estimate stated as a range
#    by one and a floor by the other.
# 18. The Vietnamese dead, per producer, never averaged. The official figures as Vũ Quang Hiển
#    states them: nearly 2 million civilians dead, about 1.1 million soldiers of the People's Army
#    (with the Liberation Army) dead, 600,000 wounded or sick (src-vu-quang-hien-ussh.seccasualties).
#    The Quảng Ninh veterans' list: 1,146,250 martyrs in all, 849,018 of them in the resistance
#    against the Americans (src-qn-ccb-2023.secnumbers), and more than 4 million civilians "dead and
#    disabled for life" across the wars against France and America and later (seccivilians). The
#    BMJ survey study: 3.8 million violent war deaths in Vietnam, 1955 to 2002, and 1.7 million for
#    1965-1975, against the Vietnam Life History Survey's 966,000 for 1965-1975
#    (src-bmj-obermeyer-2008.secresults, seccomparison). The YAML's "3.8 million Vietnamese" is the
#    BMJ's 1955-2002 total, not a 1955-1975 war total.
# 19. The American dead. The National Archives: the DCAS file "contains records of 58,220 U.S.
#    military fatal casualties", the earliest date of death "June 8, 1956", the most recent "May 28,
#    2006"; its predecessor file held 58,193 (src-nara-casualties.secdcas). The live script counts
#    58,220 names on Maya Lin's wall; the wall's own count is not held, and the two lists are not
#    shown to be the same list.
# 20. Agent Orange. The Congressional Research Service: "an estimated 18-20 million gallons of
#    herbicides—including approximately 11-12 million gallons of Agent Orange—over about 12,000
#    square miles of southern Vietnam between 1961 and 1971" (src-crs-agent-orange-2020.secranchhand).
#    The YAML: Agent Orange alone, "20 million gallons", "4.5 million acres", 1962-1971. Danang: cost
#    "over $110 million", about 90,000 m3, "officially declared completed on November 9, 2017"
#    (secdanang); the YAML says completed in 2018. Bien Hoa: "10 years at an estimated cost of $390
#    million", about 500,000 cubic meters (secbienhoa). Senator Leahy on both governments' positions
#    on birth defects (secleahy); the YAML's Vietnamese Red Cross figure is not held.
# 21. The Tricontinental. The YAML's "Create two, three — many Vietnams — that is the watchword" is
#    in neither held text. The English: "should two, three or many Vietnams flourish throughout the
#    world" (src-che-tricontinental-1967-en.secvietnams); the Spanish: "si dos, tres, muchos Vietnam
#    florecieran" (src-che-tricontinental-1967-es.secvietnams), under the title "CREAR DOS, TRES ...
#    MUCHOS VIETNAM" (sectitle). It is a message published in Havana on 16 April 1967 "en forma de
#    folleto como suplemento especial para la revista Tricontinental" (sectitle), not a speech at
#    the conference; the live script puts Guevara "at the Tricontinental Conference in Havana, in
#    April 1967".
# 22. The Pentagon Papers. The National Archives: "commissioned by Secretary of Defense Robert
#    McNamara in 1967", "48 boxes and approximately 7,000 declassified pages", and "small portions
#    of the report were leaked to the press" in June 1971 (src-nara-pentagon-papers.secintro). The
#    YAML: "47 volumes and 7,000 pages", passed whole to the Times.
# 23. Whom Johnson was talking to. FRUS: the 27 May 1964 call is with Bundy, 11:24 a.m.
#    (src-frus-1964-68-v27-d53.secmess). The YAML summary puts the same words in "a recorded phone call
#    with Secretary of Defense Robert McNamara"; its own notable_quotes context and the live script say
#    Bundy. The held record says Bundy.
