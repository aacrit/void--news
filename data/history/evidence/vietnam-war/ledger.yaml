# The evidence ledger for vietnam-war (docs/proposals/HISTORY-THESIS-PAGE.md §3, §4c, §8).
# Begun 2026-10-09 for the cinematic Orpheus episode (docs/proposals/HISTORY-AUDIO-ARCHIVAL.md,
# policy B; docs/proposals/HISTORY-FIRST-LISTENER.md): the sources the script's document voice
# reads from, the record its narration is checked against, and the recordings it may play.
# Every entry was fetched on 2026-10-09 from the URL it names; every extract under extracts/
# was sliced from the fetched copy by a builder script (out/ledger-vietnam-war/build.py, start
# marker to end marker, whitespace folded to single spaces; the two other changes, Unicode NFC
# for Vietnamese pages and U+02BC written as U+2019 in the FRUS transcript, are stated in the
# extract's own note), never retyped. Nothing here was written from memory.
# The five perspectives of the event YAML are held at parity as far as free copies allow: the
# American containment case in its presidents' own words; the Vietnamese state's record (the
# declaration in Vietnamese and in two English translations, the Sơn Mỹ figure, the official
# casualty figures as a Hanoi historian and a veterans' association print them); the anti-war
# record (the Pentagon Papers, the Court, the Peers report, NSA's own history of Tonkin); the
# Lao state's and the United States' accounts of the bombing of Laos and the House record of
# Cambodia; and the Tricontinental text in Spanish and English. Every book the event YAML names
# is a controlled lending copy or has no free copy; those are listed under gaps, with the Hmong
# and Khmer voices this session could not reach.
# Translation provenance is stated per entry. Where the ledger holds a text only in Vietnamese or
# Spanish, no English for it is held, and any English the brief gives is a working gloss.
# This is NOT a thesis ledger: no positions, contested claims, exhibits or analyses are
# adjudicated here, and the event renders the Hearing. The bar of §4e is not claimed.
# Where two held sources disagree, both are held and the disagreement is listed under
# `disagreements` at the end, unadjudicated. Casualty figures are held per producer and are
# never averaged.
slug: vietnam-war
bootstrapped: 2026-10-09

