# The evidence ledger for watergate (docs/proposals/HISTORY-THESIS-PAGE.md §3, §4c, §8).
# Begun 2026-10-09 for the cinematic Orpheus episode (docs/proposals/HISTORY-AUDIO-ARCHIVAL.md,
# policy B; docs/proposals/HISTORY-FIRST-LISTENER.md): the sources the script's document voice
# reads from, the record its narration is checked against, and the recordings it may play.
# Every entry was fetched on 2026-10-09 from the URL it names; every extract under extracts/
# was sliced from the fetched copy by a builder script (out/ledger-watergate/build.py, start
# marker to end marker, whitespace folded to single spaces and nothing else), never retyped.
# Nothing here was written from memory.
# Three hosts could not be read: washingtonpost.com (the 1972 stories on wp-srv) dropped the
# connection to a plain fetch and to a browser-headed one, and web.archive.org answered 429 on
# every attempt; electionstudies.org answered 403; the Internet Archive's text of the Statement
# of Information submitted on behalf of President Nixon answered 500. Every book the event YAML
# names is a controlled lending copy on the Internet Archive, which this container cannot open.
# Those are listed under gaps. The American National Election Studies series is read here as
# the Pew Research Center prints it.
# Where the Internet Archive holds a scanned government volume, the extract is the item's OCR
# text (its _djvu.txt) and keeps the OCR's misreadings and line-end hyphens as printed.
# This is NOT a thesis ledger: no positions, contested claims, exhibits or analyses are
# adjudicated here, and the event renders the Hearing. The bar of §4e is not claimed.
# Where two held sources disagree, both are held and the disagreement is listed under
# `disagreements` at the end, unadjudicated.
