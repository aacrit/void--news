# ------------------------------------------------------------- disagreements held, not adjudicated
# Where two held sources disagree, both are held. This is a list for the writer, not a verdict.
# 1. The money found on 17 June 1972. The Senate report's break-in chapter: police found
#    '$4,200 in $100 bills, all with serial numbers in sequence' and 'sets of blue surgical
#    gloves' in the burglars' hotel rooms the next afternoon (src-ssc-final-1974.secarrest).
#    Its chapter on the Mexican checks: a search of 'the five men arrested' 'produced $6,500 in
#    new $100 bills, most of which were serially numbered' (src-ssc-final-1974.secmexican).
#    The gloves are placed in the rooms, not on the men.
# 2. Who uncovered Watergate. Senator Ervin credits Judge Sirica, 'the investigative reporting
#    of Carl Bernstein, Bob Woodward, and other representatives of a free press', the Select
#    Committee and the Special Prosecutors together (src-ssc-final-1974.secervin13); Epstein,
#    the same summer: 'it was not the press which exposed Watergate; it was agencies of
#    government itself' (src-epstein-commentary-1974.secconclusion).
# 3. How the tapes came out. The Senate report: Butterfield 'was interviewed simply because he
#    was a satellite on Mr. Haldeman's chart', and told the committee of the taping system when
#    Deputy Minority Counsel Donald Sanders asked (src-ssc-final-1974.secbutterfield). The event
#    YAML calls it 'the accident of a question'. The House report dates the public disclosure
#    to 16 July 1973 (src-hjc-report-1974.sectapes).
# 4. Felt. Haldeman on the tape, 23 June 1972: Felt 'wants to cooperate because... he's
#    ambitious' (src-nl-wht-19720623.p4). Epstein, 1974: the prosecutors 'now believe' the source
#    was 'probably Mark W. Felt, Jr.', and he suspects a composite
#    (src-epstein-commentary-1974.secdeepthroat). Vanity Fair, 2005: Felt 'is finally admitting'
#    the role and is 'one of American democracy's heroes' (src-oconnor-vanityfair-2005.seclead);
#    Gray 'chose to leave an increasingly frustrated Felt in charge' (secgray). Holland's motive
#    argument is a gap.
# 5. What the June 23 tape proves, and when the House minority moved. The committee: the
#    transcripts 'conclusively confirm the finding that the Committee had already made'
#    (src-hjc-report-1974.secaugust5). The ten members of the minority: before them they 'did
#    not, and still do not, believe that the evidence ... was sufficient', and after them the
#    obstruction charge 'may be taken as substantially confessed' (secminority1); on the other
#    articles, 'for the most part, he was not guilty' (secminority).
# 6. The size of the Pentagon Papers leak. The Archives: 'small portions of the report were
#    leaked to the press' and the complete report is 'approximately 7,000 declassified pages',
#    34% of it released for the first time in 2011 (src-nara-pentagon-papers.secintro). Chief
#    Justice Burger in 1971: 'the analysis of 7,000 pages of complex material'
#    (src-lii-nyt-v-us-1971.para84). The event YAML has Ellsberg photocopying 7,000 pages and
#    passing 'the volumes' to the Times.
# 7. What the Court said about deference. Chief Justice Burger's sentence 'each branch ... must
#    initially interpret the Constitution, and the interpretation of its powers by any branch
#    is due great respect' is followed in the same paragraph by Marbury: 'the province and duty
#    of the judicial department to say what the law is' (src-lii-us-v-nixon-1974.para28). Read
#    alone, the first sentence states the President's side of the argument, not the holding,
#    which is para53.
# 8. Trust. Pew's table: NES 77 in October 1964 and 36 in December 1974, but 73 in 1958, 65 in
#    1966, 62 in 1968 and 53 in 1972 (src-pew-trust-2025.sectable). The event YAML's 'roughly
#    three in four ... in the late 1950s and 1960s' holds for 1958 and 1964 only.
# 9. Dean's words. On the tape: 'We have a cancer--within, close to the Presidency, that's
#    growing' (src-nl-wht-19730321.p5). Before the Senate, recounting it: 'I began by telling
#    the President that there was a cancer growing on the Presidency' (src-ssc-hearings-
#    book3-1973.p998). The event YAML's 'We have a cancer within, close to the presidency, that
#    is growing' is neither, and is attributed to the testimony.
# 10. The third-rate burglary. The Senate report: Ziegler on 19 June 1972 'declined to comment
#    on what he termed a "third-rate burglary attempt."' (src-ssc-final-1974.secthirdrate).
# 11. When the Plumbers broke into Dr. Fielding's office. The House report: 'On September 3,
#    1971, a team consisting of Bernard Barker, Felipe De- Diego and Eugenio Martinez ...
#    illegally broke into the office of Dr. Lewis Fielding, Ellsberg's psychiatrist'
#    (src-hjc-report-1974.secfielding). The event YAML and the live script: 'Three days after the
#    ruling' of 30 June 1971. The two cannot both be right; the held record says September.
# 12. Felt's title. Epstein, 1974: 'then a deputy associate director of the FBI'
#    (src-epstein-commentary-1974.secdeepthroat); Vanity Fair, 2005: 'number two at the F.B.I.'
#    (src-oconnor-vanityfair-2005.seclead); the event YAML: 'FBI Associate Director'.
