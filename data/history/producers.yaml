# The reader's name for every `producer` id a History ledger uses.
#
# A ledger entry names the body that produced a document by a short id
# (`uk-government`, `icty`); a thesis page prints the producers a verdict rests
# on, and an analysis may print a producer column. The page prints the label
# here, never the raw id.
#
# Every label is taken from the `author` or `publisher` of the ledger entry
# named in `from`, which carries that producer id: the gate
# (tests/test_history_thesis.py, test_producer_labels) fails when a producer id
# used in any committed ledger or draft overlay has no label, when a label's
# `from` entry does not exist or carries another producer, or when a label is
# left here with no ledger using it. Where one id covers several authors
# (scholarship, survivor testimony) the label is the class the ledger itself
# names, not a body it does not.
#
# Read by pipeline/history/export_thesis.py, which writes the labels a thesis
# needs into its JSON as `producerLabels`.
