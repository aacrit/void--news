# The documentary score for "Apollo 11 and the Space Race", as note data on
# sampled real instruments. Rendered by pipeline/history/score.py; the samples
# live in ~/.cache/void-score-samples (never in the repository), pinned by sha256.
#
# The music claims nothing about the event. Nothing here imitates a mission
# recording, a radio, a countdown or "space": the palette is a solo violin, an
# upright piano, a cello section and a harp, each presented as what it is. The
# theme is built from the house cell (tonic, fifth, tonic, third: the shape of
# the On Air motif), in D, in the major mode, at 60 beats a minute in two-beat
# bars: eight bars, sixteen beats of exactly one second, which is also the clock
# the procedure bed keeps.
#
# Cues are keyed to the producer's moods and segment kinds, never to a line of
# text, so the cinematic variant with its CLIP slots renders from the same
# manifest. Around a real recording the producer leaves to_clip and from_clip
# silence and mutes every bus (H-17); after one, `sting:from_clip` returns the
# music only once the trailing silence is over, and in a rupture scene the
# `rupture_entry` lands 1,200 ms after the clip's last word instead.
slug: apollo-11-moon-landing
title: Apollo 11 and the Space Race
version: 1
key: D
mode: major
tempo_bpm: 60
house_cell: [0, 7, 0, 4]
textures: []

