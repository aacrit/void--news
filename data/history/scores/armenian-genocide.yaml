# The documentary score for "The Armenian Genocide", as note data on sampled
# real instruments. Rendered by pipeline/history/score.py; the samples live in
# ~/.cache/void-score-samples (never in the repository) and are pinned by sha256.
#
# The music claims nothing about the event. Nothing here imitates a named
# instrument of the region or of the empire, a mode, a chant, a hymn, a folk
# tune, a bell, a march or a bugle: the palette is a tuba, a solo violin
# plucked, and a vibraphone bowed, each presented as what it is, and none of
# the seven earlier composed scores uses any of them. This is a story of a
# thing that was described for twenty-nine years and could not be named, of
# columns walking into a desert, of cables that were read and followed by
# nothing, and of a century of counting votes, so the score is given restraint
# rather than lament: the LINE IS NEVER HELD. The violin only plucks, so every
# note of the theme is touched and gone, and the one sustaining voice above the
# floor, the bowed vibraphone, is kept to the fifth for the whole episode and
# plays a note of the line exactly once, at the close. The tuba holds one note
# at a time, soft, and breathes where a player would, so nothing in it is a
# call. Grief and testimony carry silence: testimony and rupture have no bed
# at all (mood.py), and the grief bed is the tuba alone for thirty-five of its
# forty seconds.
#
# The theme is built from the house cell (tonic, fifth, tonic, third: the shape
# of the On Air motif), in E flat, in the minor mode with the sixth and seventh
# left unraised, at 52 beats a minute in two-beat bars: eight bars, sixteen
# beats of 1.154 s, then the floor alone. Bars 1 to 4 state the cell on E flat
# and step down home. Bars 5 to 8 rise by step, F, G flat, A flat, to B flat,
# then fall, A flat, G flat, and STOP on the third, two steps short of home,
# and the plucked G flat dies over the tuba's E flat; the title is spoken into
# that. The outro completes the fall, A flat, G flat, F, E flat, and on the
# E flat the bowed vibraphone enters in the line's own register and holds the
# note the line never held, once. The grief bed states the fall and stops where
# the theme stops.
#
# Cues are keyed to the producer's moods and segment kinds, never to a line of
# text, so the cinematic variant renders from this manifest whatever moods it
# picks. Where each cue plays is the producer's (mood_plan): the theme under
# the TITLE, the first word 1.2 s before its end; beds under the spoken body by
# mood, ducked to the mood's floor; transitions in the clear before a scene;
# the rupture entry on the last word of the moment, or 1,200 ms after a clip's
# trailing silence, never under it; the outro at the close, with the house
# promo riding its held bars, so it is at most 13.75 s and silent at its end.
slug: armenian-genocide
title: The Armenian Genocide
version: 1
key: Eb
mode: minor, with the sixth and seventh left unraised; the theme stops on the third and only the outro completes the fall
tempo_bpm: 52
house_cell: [0, 7, 0, 3]
textures: []

