  # Statement 1, under the TITLE: the plucked line once over the tuba's Eb.
  # Bars 1 to 4 are the cell on Eb and the step home; bars 5 to 8 the rise
  # by step to Bb, the fall, and the stop on Gb, the third, at beat 14. The
  # bowed vibraphone enters on the fifth under the rise and rings out under
  # the stop. The tuba breathes at bar 4 and at bar 7, each release running
  # into the next attack so the breath is a dip and not a gap (the first cut
  # left a 0.5 s hole 25 dB deep at the halfway bar, measured in 0.25 s
  # frames), and holds under the silence the line leaves: the title's first
  # word lands at 18.8 s, in the last second of that hold.
