# The documentary score for "The Cambodian Genocide", as note data on sampled
# real instruments. Rendered by pipeline/history/score.py; the samples live in
# ~/.cache/void-score-samples (never in the repository) and are pinned by sha256.
#
# The music claims nothing about the event. Nothing here imitates a regional,
# religious or folk music, a named instrument of the region, a bell, a gong, a
# loudspeaker or a march: the palette is a viola section, a bassoon and one
# double bass, bowed and plucked, each presented as what it is. None of the
# three earlier composed scores uses any of them. The theme is built from the
# house cell (tonic, fifth, tonic, third: the shape of the On Air motif), in F,
# in the minor mode with the seventh left unraised and the sixth raised (D, not
# Db), heard once as a passing note, at 48 beats a minute in two-beat bars:
# eight bars, sixteen beats of exactly 1.25 s. The cell is taken with its fifth
# BELOW the tonic rather than above, so the line's first move is a fall; its one
# reach upward is a fourth, to Bb, and from there it walks down by step through
# the whole second half and stops on the fifth, C, a fourth under where it
# began. It does not come home under the title. The outro takes the same
# descent one step further and lands on F. The viola never ornaments, the
# bassoon breathes where a player would, and the plucked bass keeps a count,
# one note to a beat, under procedure. Testimony and rupture carry no bed at
# all (mood.py): a survivor's words and the moment itself are in silence.
#
# Cues are keyed to the producer's moods and segment kinds, never to a line of
# text, so the cinematic variant renders from this manifest whatever moods it
# picks. Where each cue plays is the producer's (mood_plan): the theme under
# the TITLE, the first word inside its release; beds under the spoken body by
# mood, ducked to the mood's floor; transitions in the clear before a scene;
# the rupture entry on the last word of the moment, or 1,200 ms after a clip's
# trailing silence, never under it; the outro at the close, with the house
# promo riding its held bars, so it is at most 13.75 s and silent at its end.
