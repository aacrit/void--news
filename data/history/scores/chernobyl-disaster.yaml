# The documentary score for "The Chernobyl Disaster", as note data on sampled
# real instruments. Rendered by pipeline/history/score.py; the samples live in
# ~/.cache/void-score-samples (never in the repository) and are pinned by sha256.
#
# The music claims nothing about the event. Nothing in it imitates a counter, a
# siren or an alarm (no click, no pulse, no rising tone); nothing in it is a
# music of Ukraine, of Russia or of the church (no bell, no choir, no drone of a
# folk string); no brass, no drum, nothing that swells to a blow. The moment
# itself is dry (mood.py), and what follows it is a glass tone drawn out of
# silence and let go, with nothing struck. The palette is three instruments no
# earlier score uses, each presented as what it is: wine glasses, rubbed on the
# rim, a pure tone that does not breathe and does not decay while the finger
# moves; a harpsichord, the one keyboard whose keys cannot be played louder or
# softer, so every note is stated at the mechanism's one level and dies on its
# own in two or three seconds; and a tenor saxophone, played without vibrato
# and soft, in its lowest octave, the score's one low breath, chosen because
# every other low wind in the cache belongs to another episode (bassoon,
# horn, trombone, tuba, clarinet, bass recorder, organ pedal). The glass never
# moves: it holds the fifth, G sharp, or the tonic above it. The harpsichord
# states the cell and nothing else. The saxophone sings the same four notes,
# slowly, once, under the title, and otherwise holds one note at a time.
#
# The theme is built from the house cell (tonic, fifth, tonic, third: the shape
# of the On Air motif), in C sharp minor, at 38 beats a minute, the slowest of
# the eleven scores: one beat is 1.579 s. The same four notes are said twice,
# by two different things. First the harpsichord, dry and high, one key a beat
# (beats 1 to 4), each left to die; a beat and a half of nothing; then the
# saxophone, low and slow, two beats a note (beats 5.5 to 14.5), the third held
# longest. The glass holds G sharp above the first statement and C sharp above
# the second. Then, alone, the harpsichord's lowest C sharp, once, and the
# title is spoken into its decay. The outro says the cell once more on the
# harpsichord, in the low octave, over the saxophone's G sharp, and ends on
# the lowest key. Dread is the glass breathing over the saxophone; procedure
# is the harpsichord alone and dry; reckoning is the saxophone alone, in long
# breaths with gaps; grief is the glass alone, with the saxophone falling once
# from the third to the tonic and then silent.
#
# Cues are keyed to the producer's moods and segment kinds, never to a line of
# text, so the cinematic variant renders from this manifest whatever moods it
# picks. Where each cue plays is the producer's (mood_plan): the theme under
# the TITLE, the first word 1.2 s before its end; beds under the spoken body by
# mood, ducked to the mood's floor; transitions in the clear before a scene;
# the rupture entry on the last word of the moment, or 1,200 ms after a clip's
# trailing silence, never under it; the outro at the close, with the house
# promo riding its held bars, so it is at most 13.75 s and silent at its end.
slug: chernobyl-disaster
title: The Chernobyl Disaster
version: 1
key: C#
mode: minor, with the sixth and seventh left unraised; the glass holds only the fifth and the tonic, so the mode is said by the harpsichord and the saxophone alone
tempo_bpm: 38
house_cell: [0, 7, 0, 3]
textures: []

