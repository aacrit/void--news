# The documentary score for "The Cuban Missile Crisis", as note data on sampled
# real instruments. Rendered by pipeline/history/score.py; the samples live in
# ~/.cache/void-score-samples (never in the repository) and are pinned by sha256.
#
# The music claims nothing about the event. Nothing here imitates a music of
# the island, a dance, a drum, a march, a bugle, a clock, a sonar ping, a
# siren or a broadcast tone, and nothing in it pulses: the palette is one
# pipe organ, its quiet manual stop and its quiet pedal stop, presented as
# what it is, and none of the eight earlier composed scores uses an organ (the
# Partition score holds a harmonium, a free reed, which is a different
# instrument and a different sound). This is a story of two rooms where men
# sat for thirteen days, of a boat two hundred feet down with foul air and no
# word from Moscow, of one officer declining to sign, and of a bargain kept
# secret for a generation, so the score is given the one instrument that
# cannot swell with feeling: a pipe is open or shut, it breathes at a steady
# pressure, and it holds for as long as the air lasts. The line is a single
# voice over a single pedal; there is never a chord, so nothing in it is a
# hymn. Dread is the pedal breathing and a bare fifth above it. Procedure is
# the manual touched, one short note to a beat, dry. Grief and testimony carry
# silence: testimony and rupture have no bed at all (mood.py), and the grief
# bed is the pedal alone for thirty-five of its forty seconds, with gaps of
# more than a second between its breaths.
#
# The theme is built from the house cell (tonic, fifth, tonic, third: the
# shape of the On Air motif), in C, in the minor mode with the sixth and
# seventh left unraised, at 42 beats a minute in two-beat bars: eight bars,
# sixteen beats of 1.429 s, then the pedal alone. Bars 1 to 4 state the cell on
# C and step down home. Bar 5 rests. Bars 6 to 8 climb by step, F, G, A flat,
# to B flat, the seventh, and STOP there, held over the pedal's C: the one
# note of the scale that asks most plainly for the octave and is not given it.
# The deal was made and not announced; the line arrives at the step before
# home and is left there, and the title is spoken into that. The outro takes
# the fall, B flat, A flat, G, E flat, onto C, once. The grief bed states the
# first three notes of that fall and stops on G, the fifth.
#
# Cues are keyed to the producer's moods and segment kinds, never to a line of
# text, so the cinematic variant renders from this manifest whatever moods it
# picks. Where each cue plays is the producer's (mood_plan): the theme under
# the TITLE, the first word 1.2 s before its end; beds under the spoken body by
# mood, ducked to the mood's floor; transitions in the clear before a scene;
# the rupture entry on the last word of the moment, or 1,200 ms after a clip's
# trailing silence, never under it; the outro at the close, with the house
# promo riding its held bars, so it is at most 13.75 s and silent at its end.
