# The documentary score for "The Haitian Revolution", as note data on sampled
# real instruments. Rendered by pipeline/history/score.py; the samples live in
# ~/.cache/void-score-samples (never in the repository) and are pinned by sha256.
#
# The music claims nothing about the event. Nothing here imitates an anthem, a
# hymn, a march, a drum, a bell, a fanfare, a dance of the period or a music of
# the region: the palette is an oboe, a tenor trombone and a viola section
# plucked, each presented as what it is, and none of the six earlier composed
# scores uses any of them. This is a story of enslaved people who won, of a
# constitution, an indemnity and a debt, so the score is given dignity rather
# than triumph or lament: the oboe plays one plain line and never ornaments,
# never leaps except inside the cell itself and never vibrates; the trombone
# holds one note at a time, soft, and breathes where a player would, so nothing
# in it is a call; the plucked violas keep a count under procedure, dry, one
# note to a beat. Grief and testimony carry silence: testimony and rupture have
# no bed at all (mood.py), and the grief bed is the trombone alone for twenty-
# eight of its thirty-four seconds.
#
# The theme is built from the house cell (tonic, fifth, tonic, third: the shape
# of the On Air motif), in B flat, in the major mode with the seventh left
# unraised (A flat, never A), at 56 beats a minute in two-beat bars: eight
# bars, sixteen beats of 1.071 s, then a hold. B flat, D and F, the three notes
# of the cell, are each a recording of that note, unshifted. Bars 1 to 4 state
# the cell on B flat and step down home. Bars 5 to 8 rise by step from the
# third, D, E flat, F, to G held, then fall, E flat, D, C, and land on B flat:
# the line comes home under the title. The ground does not: on the landing the
# trombone leaves B flat for A flat, the unraised seventh, and holds it under
# the home note, so the voice is settled and the floor it stands on is not. The
# outro takes the same fall and puts the trombone back on B flat under it, once,
# at the close. The grief bed states the fall and stops on C, the step before
# home, and leaves it there.
#
# Cues are keyed to the producer's moods and segment kinds, never to a line of
# text, so the cinematic variant renders from this manifest whatever moods it
# picks. Where each cue plays is the producer's (mood_plan): the theme under
# the TITLE, the first word inside its release; beds under the spoken body by
# mood, ducked to the mood's floor; transitions in the clear before a scene;
# the rupture entry on the last word of the moment, or 1,200 ms after a clip's
# trailing silence, never under it; the outro at the close, with the house
# promo riding its held bars, so it is at most 13.75 s and silent at its end.
slug: haitian-revolution
title: The Haitian Revolution
version: 1
key: Bb
mode: major, with the seventh left unraised; the line comes home under the title, the bass does not until the outro
tempo_bpm: 56
house_cell: [0, 7, 0, 4]
textures: []

