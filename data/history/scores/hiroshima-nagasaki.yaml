# The documentary score for "Hiroshima and Nagasaki", as note data on sampled
# real instruments. Rendered by pipeline/history/score.py; the samples live in
# ~/.cache/void-score-samples (never in the repository) and are pinned by sha256.
#
# The music claims nothing about the event. Nothing here imitates a music of
# Japan or an instrument of Japan (no koto, no shakuhachi, no drum colour), no
# line in it is pentatonic (the cell is answered by the second, the fourth and
# the sixth of the scale every time it is stated), nothing in it pulses, and
# nothing in it swells to a blow: the moment itself is dry (mood.py), and the
# music that follows it is one low key of a piano, struck once, softly. The
# palette is three instruments none of the nine earlier composed scores uses:
# a grand piano, close-miked at its second velocity layer (the Apollo and Srebrenica
# scores hold an upright, a different instrument and a different sound), and
# two baroque recorders, a bass and a tenor, European duct flutes recorded on
# steady breath with no vibrato and no bend, presented as what they are. The
# piano is the only thing that moves: single keys, each released before the
# next so the damper falls and no chord gathers, with two exceptions that are
# left to ring. The recorders never move; they hold a bare fifth, tonic and
# fifth, under the piano, and in dread the tenor once holds the sixth instead.
# Grief and testimony carry silence: testimony and rupture have no bed at all,
# and the grief bed is the bass recorder breathing alone, with gaps of about
# two seconds between its breaths, the tenor stating three notes once.
#
# The theme is built from the house cell (tonic, fifth, tonic, third: the
# shape of the On Air motif), in F sharp, in the minor mode with the sixth and
# seventh left unraised, at 44 beats a minute: one beat is 1.364 s. The piano
# states the cell on F sharp (beats 0 to 4) and steps home through the fourth
# and the second (beats 6 to 8). The recorders enter under the second phrase,
# the bass on F sharp, the tenor on C sharp. Beats 9 and 10 rest. Beats 11 to
# 14 climb by step, A, B, C sharp, to D, the sixth, and STOP there, left to
# ring over the fifth the recorders hold: a minor sixth over the tonic, a
# minor ninth over the fifth, the one step of the scale that leans hardest on
# the note above it and is not given it. The recorders release; then, alone,
# the piano's low F sharp, once, and the title is spoken into its decay. The
# outro takes the fall, D, C sharp, B, A, onto F sharp, once, and the low F
# sharp under it. The grief bed's tenor states the last three notes of that
# fall, A, G sharp, F sharp, and stops.
#
# Cues are keyed to the producer's moods and segment kinds, never to a line of
# text, so the cinematic variant renders from this manifest whatever moods it
# picks. Where each cue plays is the producer's (mood_plan): the theme under
# the TITLE, the first word 1.2 s before its end; beds under the spoken body by
# mood, ducked to the mood's floor; transitions in the clear before a scene;
# the rupture entry on the last word of the moment, or 1,200 ms after a clip's
# trailing silence, never under it; the outro at the close, with the house
# promo riding its held bars, so it is at most 13.75 s and silent at its end.
slug: hiroshima-nagasaki
title: Hiroshima and Nagasaki
version: 1
key: F#
mode: minor, with the sixth and seventh left unraised; the theme stops on the sixth and only the outro completes the fall
tempo_bpm: 44
house_cell: [0, 7, 0, 3]
textures: []

