# The documentary score for "The Partition of India", as note data on sampled
# real instruments. Rendered by pipeline/history/score.py; the samples live in
# ~/.cache/void-score-samples (never in the repository) and are pinned by sha256.
#
# The music claims nothing about the event. The narration never names a
# musical tradition, a period or a recording for it, and nothing here does
# either: the bowed
# melody is a solo violin and is presented as one; the drone is a real tanpura
# pluck; the held tones are a real harmonium. The theme is built from the house
# cell (tonic, fifth, tonic, third: the shape of the On Air motif), in G, in a
# minor mode with the third, sixth and seventh flattened, at 50 beats a minute
# in two-beat bars: eight bars, sixteen beats of 1.2 s.
#
# Where each cue plays is the producer's (mood_plan): the theme at the top of
# the programme in the clear, the first word inside its release; beds under the
# spoken body by mood, ducked; transitions in the clear before a scene; the
# rupture entry 1,200 ms after the Nehru clip's last word, never under it; the
# outro at the close, with the house promo riding its held bars from 1 s after
# the last word, so it is at most 13.75 s and silent at its end.
slug: partition-of-india
title: The Partition of India
version: 1
key: G
mode: minor, with the third, sixth and seventh flattened
tempo_bpm: 50
house_cell: [0, 7, 0, 3]
textures: []

