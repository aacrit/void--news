# The documentary score for "The Rwandan Genocide", as note data on one sampled
# real instrument. Rendered by pipeline/history/score.py; the samples live in
# ~/.cache/void-score-samples (never in the repository) and are pinned by sha256.
#
# The music claims nothing about the event. Nothing in it is a music of Rwanda
# or of anywhere in Africa: no drum of any kind, no plucked string, no inanga,
# no pentatonic turn, no ostinato, no pulse. Nothing in it is a music of the
# church (no bell, no chime, no organ, no choir), because the churches are in
# the script. No brass, nothing that swells to a blow, nothing that rises in
# alarm. The moment itself is dry (mood.py), and what follows it is one stroke
# of a bow drawn out of silence and let go. Testimony is dry, and the silence
# around a survivor's words is the loudest thing in the episode; this score is
# built to leave it alone.
#
# The palette is ONE instrument, which no earlier score uses, presented as
# what it is: a bowed psaltery, a small triangular zither of steel strings
# played with a short bow, one string a note. It is heard two ways. A LONG
# STROKE of the bow: the note rises for a second and a half to two seconds
# and dies over the next three or four, a glassy, bright, near-sine tone with
# the grain of the bow in it. A SHORT STROKE: the bow touches and leaves, and
# the string rings for two to four seconds. Every note here is one recorded
# stroke played once and cut at its length. No stroke is looped; no note is
# held longer than the recording holds it. The instrument lives in one
# register, B4 to D sharp 6, and the score stays there. The eleven earlier
# scores each have a low voice; this one deliberately has none. Under the
# narration it is a thread, not a floor, and the floor is silence.
#
# The theme is built from the house cell (tonic, fifth, tonic, third: the shape
# of the On Air motif), in G sharp minor, the one key none of the eleven uses,
# at 46 beats a minute: one beat is 1.304 s. The cell is said twice. First in
# short strokes, dry, one a beat (beats 1 to 4), each left to ring. A beat and
# a half of only the ring. Then in long strokes, slowly, from beat 7, the same
# four notes, each one bow, with the low B (the third, an octave down) drawn
# under them at beats 5.5 and 14. Then, alone, one short stroke on G sharp at
# beat 18, and the title is spoken into its ring. The outro says the cell once
# more in short strokes over a long G sharp and a long B, and ends in silence.
# Dread is long strokes overlapping so one is always sounding, with two short
# strokes off the seam; procedure is short strokes alone and dry, one every
# two beats, the cell on G sharp, then on D sharp, then on G sharp closing on
# the second; reckoning is four long strokes with silence between them, under
# the deepest duck; grief is long strokes alone, faint, the one fall from the
# high third to the tonic, and then the low B.
#
# Cues are keyed to the producer's moods and segment kinds, never to a line of
# text, so the cinematic variant renders from this manifest whatever moods it
# picks. Where each cue plays is the producer's (mood_plan): the theme under
# the TITLE, the first word 1.2 s before its end; beds under the spoken body by
# mood, ducked to the mood's floor; transitions in the clear before a scene;
# the rupture entry on the last word of the moment, or 1,200 ms after a clip's
# trailing silence, never under it; the outro at the close, with the house
# promo riding its held bars, so it is at most 13.75 s and silent at its end.
slug: rwandan-genocide
title: The Rwandan Genocide
version: 1
key: G#
mode: minor, natural; the sixth is never sounded, the seventh (F sharp) is left unraised and heard once, in the procedure bed, and the second (A sharp) closes the procedure bed's third statement
tempo_bpm: 46
house_cell: [0, 7, 0, 3]
textures: []

