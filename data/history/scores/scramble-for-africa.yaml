# The documentary score for "The Scramble for Africa", as note data on sampled
# real instruments. Rendered by pipeline/history/score.py; the samples live in
# ~/.cache/void-score-samples (never in the repository) and are pinned by sha256.
#
# The music claims nothing about the event. Nothing here imitates a regional or
# folk music, a drum, a named instrument of the continent, a march, a fanfare,
# a bugle, a bell or a telegraph: the palette is a clarinet, a violin section
# and a cello section plucked, each presented as what it is. None of the four
# earlier composed scores uses any of them. This is a story about a rule
# written in a room by people who never saw the land it was applied to, about
# the thirty years of taking that followed, and about the people who fought it;
# so the score is procedure and restraint. The theme is built from the house
# cell (tonic, fifth, tonic, third: the shape of the On Air motif), in B, in
# the minor mode with the sixth left unraised and the seventh never sounded, at
# 54 beats a minute in two-beat bars: ten bars, twenty beats of 1.111 s. Bars 1
# to 4 state the cell on B and step down home. Bars 5 to 7 state the SAME cell
# a fourth higher, on E, with the plucked bass moving under it: the rule,
# applied again, somewhere else. From its third (G) the line then walks down by
# step, F#, E, D, C#, and stops on B, low, where it began: five bars of
# arriving home. The clarinet never ornaments and never leaps except inside the
# cell itself; the violins hold one open fifth and nothing else; the plucked
# cellos keep a count under procedure, one note to a beat, dry. Testimony and
# rupture carry no bed at all (mood.py): a person's own words and the moment
# itself are in silence.
#
# Cues are keyed to the producer's moods and segment kinds, never to a line of
# text, so the cinematic variant renders from this manifest whatever moods it
# picks. Where each cue plays is the producer's (mood_plan): the theme under
# the TITLE, the first word inside its release; beds under the spoken body by
# mood, ducked to the mood's floor; transitions in the clear before a scene;
# the rupture entry on the last word of the moment, or 1,200 ms after a clip's
# trailing silence, never under it; the outro at the close, with the house
# promo riding its held bars, so it is at most 13.75 s and silent at its end.
slug: scramble-for-africa
title: The Scramble for Africa
version: 1
key: B
mode: minor, with the sixth left unraised; the seventh is never sounded
tempo_bpm: 54
house_cell: [0, 7, 0, 3]
textures: []

