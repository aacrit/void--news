# The documentary score for "The 1918 Influenza Pandemic", as note data on
# sampled real instruments. Rendered by pipeline/history/score.py; the samples
# live in ~/.cache/void-score-samples (never in the repository) and are pinned
# by sha256.
#
# The music claims nothing about the event. Nothing here imitates a period
# tune, a march, a hymn, a bugle, a bell, a siren, a telegraph or a child's
# rhyme: the palette is a flute played without vibrato, a horn, and a marimba,
# each presented as what it is. None of the five earlier composed scores uses
# any of them. This is a story of hospitals, censorship, schoolchildren and
# numbers too large to hold, so the score is plain and quiet: the flute never
# ornaments and never vibrates, the horn holds one note at a time and never
# plays a line (so nothing in it is a call), and the marimba keeps a count,
# dry, one note to a beat, under procedure. Grief and testimony carry silence:
# testimony and rupture have no bed at all (mood.py), and the grief bed is the
# horn alone for thirty of its forty-two seconds. The theme is built from the
# house cell (tonic, fifth, tonic, third: the shape of the On Air motif), in A,
# in the minor mode with the sixth and seventh left unraised, at 45 beats a
# minute in two-beat bars: eight bars, sixteen beats of 1.333 s, then a hold.
# A, C and E, the three notes of the cell, are each a recording of that note,
# unshifted. Bars 1 to 4 state the cell on A and step down home. Bars 5 to 8
# rise by step, B, C, D, to E held, then fall by step, D, C, and stop on B,
# the step above home, and hold it over the horn's A: the theme never comes
# home. The outro takes the last step, B to A, once, at the close. The counts
# in this story were revised upward for a century and the one apology came
# eighty-four years late, and the line is built the same way: a figure that
# is counted, rises, falls back, and is not settled until the end.
#
# Cues are keyed to the producer's moods and segment kinds, never to a line of
# text, so the cinematic variant renders from this manifest whatever moods it
# picks. Where each cue plays is the producer's (mood_plan): the theme under
# the TITLE, the first word inside its release; beds under the spoken body by
# mood, ducked to the mood's floor; transitions in the clear before a scene;
# the rupture entry on the last word of the moment, or 1,200 ms after a clip's
# trailing silence, never under it; the outro at the close, with the house
# promo riding its held bars, so it is at most 13.75 s and silent at its end.
slug: spanish-flu-1918
title: The 1918 Influenza Pandemic
version: 1
key: A
mode: minor, with the sixth and seventh left unraised; the theme ends on the second and only the outro resolves it
tempo_bpm: 45
house_cell: [0, 7, 0, 3]
textures: []

