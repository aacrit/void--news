# The documentary score for "The Srebrenica Genocide and the Bosnian War", as
# note data on sampled real instruments. Rendered by pipeline/history/score.py;
# the samples live in ~/.cache/void-score-samples (never in the repository) and
# are pinned by sha256.
#
# The music claims nothing about the event. Nothing here imitates a regional,
# religious or folk music, a lament tradition, a bell, a radio or a march: the
# palette is a cello section, a solo violin and an upright piano, each presented
# as what it is. The theme is built from the house cell (tonic, fifth, tonic,
# third: the shape of the On Air motif), in E, in the minor mode with the sixth
# and seventh left unraised, at 40 beats a minute in two-beat bars: eight bars,
# sixteen beats of exactly 1.5 s, the slowest of the three composed scores. The
# line's one reach is to the sixth (C) and it falls a semitone to B; it never
# leaps, never ornaments, and the grief bed states it once and then leaves the
# cello alone for the rest of the loop. Testimony and rupture carry no bed at
# all (mood.py): a survivor's words and the moment itself are in silence.
#
# Cues are keyed to the producer's moods and segment kinds, never to a line of
# text, so the cinematic variant renders from this manifest whatever moods it
# picks. Where each cue plays is the producer's (mood_plan): the theme under
# the TITLE, the first word inside its release; beds under the spoken body by
# mood, ducked to the mood's floor; transitions in the clear before a scene;
# the rupture entry 1,200 ms after a clip's last word, never under it; the
# outro at the close, with the house promo riding its held bars, so it is at
# most 13.75 s and silent at its end.
slug: srebrenica-genocide
title: The Srebrenica Genocide and the Bosnian War
version: 1
key: E
mode: minor, with the sixth and seventh left unraised
tempo_bpm: 40
house_cell: [0, 7, 0, 3]
textures: []

