      - {file: "vcsl/Idiophones/Struck Idiophones/Vibraphone/Hard Mallets/Vibes_hard_A4_v2_rr1_Main.wav", note: A5, sha256: 9fa4d639ba513db9d02ae1d18c1258dc8ce391f37752a8fd096a99d6f8b7bb47, url: "https://raw.githubusercontent.com/sgossner/VCSL/master/Idiophones/Struck%20Idiophones/Vibraphone/Hard%20Mallets/Vibes_hard_A4_v2_rr1_Main.wav"}

# Note rows are [instrument, note, start in beats, length in beats or null, velocity].
# One beat is 1.667 s. A note with null is the whole recorded strike; one with a
# length is cut there and released (0.6 s for soft mallets, 0.15 s for hard).
cues:
  # Statement 1, under the TITLE. Soft mallets say the cell on D5, one note
  # every two beats from beat 1, each left to ring; beats 7 to 9.5 carry only
  # the ring. The B natural at beat 9.5, with the low A struck under it a beat
  # later. The tonic alone at beat 12.5, and the low D under it at beat 13.5
  # (22.5 s); the title's first word lands at 24.8 s, inside its ring.
  theme:
    claims: []
    length_s: 26.0
    peak_dbfs: -13.0
    room_wet: 1.0
    fade_out_ms: 1500
    notes:
      - [soft, D5, 1, null, 0.50]
      - [soft, A5, 3, null, 0.38]
      - [soft, D5, 5, null, 0.46]
      - [soft, F5, 7, null, 0.40]
      - [soft, B4, 9.5, null, 0.36]
      - [soft, A3, 10.5, null, 0.40]
      - [soft, D5, 12.5, null, 0.44]
      - [soft, D4, 13.5, null, 0.36]

  # Statement 2, at the close: the low A, then the cell once more over its
  # ring, one strike every 1.4 beats, ending on the third, which is cut at
  # 2.4 beats and gone by 12.9 s; the cue is faded to silence inside 13.0 s
  # so the promo can ride it.
  outro:
    claims: []
    length_s: 13.0
    peak_dbfs: -13.0
    room_wet: 1.0
    fade_out_ms: 3000
    tail_silence: true
    notes:
      - [soft, A3, 0.3, null, 0.34]
      - [soft, D5, 0.8, null, 0.46]
      - [soft, A5, 2.2, null, 0.36]
      - [soft, D5, 3.6, null, 0.42]
      - [soft, F5, 5.0, 2.4, 0.38]

  # On the last word of the moment, or after a recording's trailing silence:
  # one low A, struck once with the soft mallet at the quietest the score
  # strikes anything, and left to die inside the 6 s mood_plan opens. Not the
  # tonic: nothing resolves here. No swell, no second note.
  rupture_entry:
    claims: []
    length_s: 6.0
    peak_dbfs: -18.0
    room_wet: 1.2
    fade_out_ms: 2000
    notes:
      - [soft, A3, 0, null, 0.32]

  # The change of voice (the decree, the minute, the timetable, the account
  # read by the document voice): one hard strike on D5, cut.
  sting:to_document:
    claims: []
    length_s: 0.9
    peak_dbfs: -22.0
    room_wet: 0.4
    fade_out_ms: 150
    notes:
      - [hard, D5, 0, 0.35, 0.45]

  # The music returning after a recording, once its trailing silence is over.
  # Defined for the producer's grammar; it fires only if the cinematic variant
  # admits a clip.
  sting:from_clip:
    claims: []
    length_s: 2.4
    peak_dbfs: -20.0
    room_wet: 1.0
    fade_out_ms: 800
    notes:
      - [soft, D5, 0, null, 0.40]
      - [soft, A5, 0.3, null, 0.30]

  # Dread (the laws, the lists, the trains being timetabled, the ghetto
  # closing): the low A and the low D alone, soft, struck so seldom (7 to 8 s
  # apart) that each low ring has fallen 30 dB before the next low strike;
  # the B natural once, faint, and the high third once, faint, off the seam. The first strike is at 0.67 s, not
  # 0; the last begins at 34.7 s and its tail folds under the first.
  bed:dread:
    claims: []
    length_s: 40.0
    fold: true
    rms_dbfs: -35.0
    room_wet: 0.6
    notes:
      - [soft, A3, 0.4, null, 0.30]
      - [soft, D4, 4.6, null, 0.28]
      - [soft, A3, 9.2, null, 0.30]
      - [soft, B4, 11.8, null, 0.22]
      - [soft, D4, 14.0, null, 0.28]
      - [soft, A3, 18.6, null, 0.30]
      - [soft, F5, 20.8, null, 0.18]

  # Procedure (the conference, the decrees, the quotas, the counts): hard
  # mallets alone, dry, one strike every three beats, each cut at a beat and
  # a half so nothing gathers. The cell on D5, then the cell on D5 closing on
  # the second (E5) instead of the third. The count starts on beat 1, not 0,
  # and the last strike is gone by 39.3 s, so the loop's seam falls in silence.
  bed:procedure:
    claims: []
    length_s: 40.0
    fold: true
    rms_dbfs: -32.0
    room_wet: 0.0
    notes:
      - [hard, D5, 1, 1.5, 0.46]
      - [hard, A5, 4, 1.5, 0.38]
      - [hard, D5, 7, 1.5, 0.44]
      - [hard, F5, 10, 1.5, 0.40]
      - [hard, D5, 13, 1.5, 0.46]
      - [hard, A5, 16, 1.5, 0.38]
      - [hard, D5, 19, 1.5, 0.44]
      - [hard, E5, 22, 1.5, 0.38]

  # Reckoning (the numbers, the trials, what each count leaves out): four soft
  # strikes with ten seconds between them, the tonic, the low fifth, the high
  # third, the low tonic, under the deepest duck. The first is at 0.83 s, not
  # 0, and the last is 50 dB down by 39 s, so the seam falls in the silence.
  bed:reckoning:
    claims: []
    length_s: 40.0
    fold: true
    rms_dbfs: -28.0
    room_wet: 0.3
    notes:
      - [soft, D5, 0.5, null, 0.34]
      - [soft, A3, 6.5, null, 0.32]
      - [soft, F5, 12.5, null, 0.30]
      - [soft, D4, 18.5, null, 0.30]

  # Grief (the pits, the camps, the survivors, the close): soft strikes
  # alone, faint, far apart, so the bed falls near-silent between them; the
  # one fall, from the high third to the tonic, once; the B natural once; the
  # low A three times. The first strike is at 0.5 s, not 0, and the last
  # (30.7 s) is close to 50 dB down as it folds under the first.
  bed:grief:
    claims: []
    length_s: 40.0
    fold: true
    rms_dbfs: -36.0
    room_wet: 1.0
    notes:
      - [soft, A3, 0.3, null, 0.26]
      - [soft, F5, 3.2, null, 0.22]
      - [soft, D5, 5.6, null, 0.24]
      - [soft, A3, 9.4, null, 0.26]
      - [soft, B4, 12.4, null, 0.20]
      - [soft, D4, 14.8, null, 0.24]
      - [soft, A3, 18.4, null, 0.26]

  # Into a dread scene, in the clear: the low A, then the low D a beat behind
  # it, both left to ring and faded.
  transition:dread:
    claims: []
    length_s: 3.8
    peak_dbfs: -14.0
    room_wet: 1.0
    fade_out_ms: 1200
    notes:
      - [soft, A3, 0, null, 0.34]
      - [soft, D4, 0.6, null, 0.30]

  # Into a procedure scene: two hard strikes, dry, the cell's opening, cut.
  transition:procedure:
    claims: []
    length_s: 4.0
    peak_dbfs: -14.0
    room_wet: 0.0
    fade_out_ms: 800
    notes:
      - [hard, D5, 0, 1.2, 0.46]
      - [hard, A5, 1, 1.2, 0.38]

  # Into a grief scene: the fall, the high third onto the tonic, soft, the
  # low A faint under both.
  transition:grief:
    claims: []
    length_s: 4.8
    peak_dbfs: -14.0
    room_wet: 1.0
    fade_out_ms: 1000
    notes:
      - [soft, F5, 0, null, 0.26]
      - [soft, A3, 0.2, null, 0.22]
      - [soft, D5, 1.0, null, 0.28]

  # Into the numbers and the trials: one soft D5, and one hard strike on the
  # low A under it, left to ring.
  transition:reckoning:
    claims: []
    length_s: 4.2
    peak_dbfs: -14.0
    room_wet: 0.3
    fade_out_ms: 900
    notes:
      - [soft, D5, 0, null, 0.34]
      - [hard, A3, 0.8, null, 0.30]
