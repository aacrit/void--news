      - {file: "vcsl/Idiophones/Struck Idiophones/Vibraphone/Hard Mallets/Vibes_hard_B3_v2_rr1_Main.wav", note: B4, sha256: 8ae8f9a67ff3c5942bd796987ef96fbaaafadf4edfe5dc8734b8a1ab4e0ff7b4, url: "https://raw.githubusercontent.com/sgossner/VCSL/master/Idiophones/Struck%20Idiophones/Vibraphone/Hard%20Mallets/Vibes_hard_B3_v2_rr1_Main.wav"}
