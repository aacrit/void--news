# The documentary score for "The Holocaust", as note data on one sampled real
# instrument. Rendered by pipeline/history/score.py; the samples live in
# ~/.cache/void-score-samples (never in the repository) and are pinned by sha256.
#
# The music claims nothing about the event. Nothing in it is a music of the
# people it was done to or of the people who did it: no clarinet, no solo
# violin, no cantorial line, no mode with a flattened second, no horn, no
# brass, no choir, no organ, no drum, no pulse, no swell to a blow. The moment
# itself is dry (mood.py), and what follows it is one low note struck once and
# left alone. Testimony is dry, and the silence around a survivor's words is
# the loudest thing in the episode. This score has fewer notes than any of the
# twelve before it, and the gaps are the point: a note is struck, it dies, and
# nothing fills the time until the next.
#
# The palette is ONE instrument, which no earlier score strikes: a vibraphone
# (the Armenian score bows one, which is a different sound; this one is played
# with mallets, as a vibraphone is). The motor is off, so nothing wavers: a
# measured 0.5 dB or less of modulation on every bar used. It is heard two
# ways. SOFT mallets, the softest layer the library holds: a dull onset and a
# long cold ring, 8 to 10 s on the low bars, 6 to 8 s on the high. HARD
# mallets, the softer of the two layers recorded: a clearer onset, used dry
# and cut short for the ledger of procedure. Every note here is one recorded
# strike played once and cut at its length or left to ring. No strike is
# looped; no note is held longer than the recording holds it.
#
# The theme is built from the house cell (tonic, fifth, tonic, third: the
# shape of the On Air motif) on D, with the third minor and the sixth raised,
# so the only note outside the cell is a B natural that does not resolve.
# All twelve minor keys are taken by the twelve earlier scores, so the pitch
# class is reused from the Apollo score, with the third lowered (Apollo is
# D major on violin, upright piano, cello and harp at 60), at 36 beats a
# minute, the slowest of the thirteen: one beat is 1.667 s. The cell is said
# once under the title, one note every two beats, each left to ring (beats
# 1 to 7). Two beats of only the ring. Then the B natural (beat 9.5) with the
# low A drawn under it, and the tonic alone (beat 12.5) with the low D under
# it, into whose ring the title is spoken. The outro says the cell once more
# over a low A and ends on the third, unresolved, into silence. Dread is the
# low A and low D alone, struck so seldom that each has died before the next;
# procedure is hard mallets, dry, the cell on D twice, one strike every three
# beats, cut so nothing gathers, the second statement closing on the second;
# reckoning is four strikes with ten seconds of silence between them, under
# the deepest duck; grief is the soft strikes faint and far apart, the one
# fall from the high third to the tonic, the B natural once, and the low A.
#
# Cues are keyed to the producer's moods and segment kinds, never to a line of
# text, so the cinematic variant renders from this manifest whatever moods it
# picks. Where each cue plays is the producer's (mood_plan): the theme under
# the TITLE, the first word 1.2 s before its end; beds under the spoken body by
# mood, ducked to the mood's floor; transitions in the clear before a scene;
# the rupture entry on the last word of the moment, or 1,200 ms after a clip's
# trailing silence, never under it; the outro at the close, with the house
# promo riding its held bars, so it is at most 13.75 s and silent at its end.
slug: the-holocaust
title: The Holocaust
version: 1
key: D
mode: minor, with the sixth raised (B natural, heard once in the theme and once in each of the dread and grief beds, never resolved) and the seventh never sounded; the second (E) is heard once, closing the procedure bed's second statement
tempo_bpm: 36
house_cell: [0, 7, 0, 3]
textures: []

instruments:
  # The renderer's `kind: pluck` is its word for a recording played once from
  # its onset and never looped: a note with no length is the whole strike, a
  # note with a length is cut there and released. That is what a mallet
  # strike is, so both articulations use it.
  soft:
    library: Versilian Community Sample Library (VCSL, Versilian Studios), Vibraphone, the "Soft Mallets" set, softest layer (v1), the "Main" microphone, motor off. The files are named an octave below what they sound (the file "A2" measures 220.0 Hz, A3, by the strongest spectral peak over 0.5 to 2.5 s, within 1 cent; "C3" measures 261.6 Hz, C4, within 1 cent; "B3" measures 493.7 Hz, B4, within 1 cent; "D4" measures 587.3 Hz, D5, within 1 cent; "F4" measures 698.5 Hz, F5, within 1 cent; "A4" measures 880.0 Hz, A5, within 1 cent); `note` is the sounding pitch. A3, B4, D5, F5 and A5 are recordings of those notes, unshifted. The one low tonic, D4, is the recorded C4 two semitones up (the library's bars run in thirds, F A C E G B D, and holds no D4); nothing else is shifted. The lowest bar the library holds (F3) falls 18 dB in its first half second and beats 10 dB; it is not used. Each strike rings to silence on its own; A3 is 30 dB down at 6.5 s and 50 dB down at 9.5 s; C4 and B4 30 dB at 5 s and 50 dB at 7.5 to 8 s; D5 30 dB at 5 s and 50 dB at 8 s; F5 30 dB at 4 s and 50 dB at 6 s; A5 30 dB at 3.5 s and 50 dB at 6 s. The modulation of each ring between 2.5 and 9 Hz measures 0.5 dB peak to peak or less, so the motor was off. No strike is looped and no note outlasts its recording
    role_as_presented: a vibraphone, soft mallets, motor off
    licence_as_stated: CC0 1.0 Universal (the repository's LICENSE file; the Readme calls it public domain, no royalties, no credit, no special terms)
    licence_url: https://creativecommons.org/publicdomain/zero/1.0/
    licence_source: https://github.com/sgossner/VCSL/blob/master/LICENSE
    rights_basis: cc0-as-stated
    credit_line: Versilian Studios, Versilian Community Sample Library
    kind: pluck
    attack_s: 0.0
    release_s: 0.6
    gain_db: 0.0
    samples:
      - {file: "vcsl/Idiophones/Struck Idiophones/Vibraphone/Soft Mallets/Vibes_soft_A2_v1_rr1_Main.wav", note: A3, sha256: b6e23a94322107d0ab884d7c38e51be538eb45f613c6a24e980c2261151bed75, url: "https://raw.githubusercontent.com/sgossner/VCSL/master/Idiophones/Struck%20Idiophones/Vibraphone/Soft%20Mallets/Vibes_soft_A2_v1_rr1_Main.wav"}
      - {file: "vcsl/Idiophones/Struck Idiophones/Vibraphone/Soft Mallets/Vibes_soft_C3_v1_rr2_Main.wav", note: C4, sha256: 1dda9a4c3205c365345d66dcb68c8e09c0dca76a310b8fe8108e43c7e8c1cd0a, url: "https://raw.githubusercontent.com/sgossner/VCSL/master/Idiophones/Struck%20Idiophones/Vibraphone/Soft%20Mallets/Vibes_soft_C3_v1_rr2_Main.wav"}
      - {file: "vcsl/Idiophones/Struck Idiophones/Vibraphone/Soft Mallets/Vibes_soft_B3_v1_rr1_Main.wav", note: B4, sha256: 7edfbd70f93781d2cbb17c2fc8befe474de9987c6353db2358af4e13a0269345, url: "https://raw.githubusercontent.com/sgossner/VCSL/master/Idiophones/Struck%20Idiophones/Vibraphone/Soft%20Mallets/Vibes_soft_B3_v1_rr1_Main.wav"}
      - {file: "vcsl/Idiophones/Struck Idiophones/Vibraphone/Soft Mallets/Vibes_soft_D4_v1_rr1_Main.wav", note: D5, sha256: daedf613863d4de0a383d66b2db6ab9ffd8dc492d16ff7d735cf3b3107046a26, url: "https://raw.githubusercontent.com/sgossner/VCSL/master/Idiophones/Struck%20Idiophones/Vibraphone/Soft%20Mallets/Vibes_soft_D4_v1_rr1_Main.wav"}
      - {file: "vcsl/Idiophones/Struck Idiophones/Vibraphone/Soft Mallets/Vibes_soft_F4_v1_rr1_Main.wav", note: F5, sha256: 95b7d6eeb71d77cce607c0c52b0a6dfd23d0eeedc2eb393fb9a6c5a5768f4aa5, url: "https://raw.githubusercontent.com/sgossner/VCSL/master/Idiophones/Struck%20Idiophones/Vibraphone/Soft%20Mallets/Vibes_soft_F4_v1_rr1_Main.wav"}
      - {file: "vcsl/Idiophones/Struck Idiophones/Vibraphone/Soft Mallets/Vibes_soft_A4_v1_rr1_Main.wav", note: A5, sha256: 48e942290a982768d7a0038e28a76a99cb666673518b29ebdc55de5e1491025f, url: "https://raw.githubusercontent.com/sgossner/VCSL/master/Idiophones/Struck%20Idiophones/Vibraphone/Soft%20Mallets/Vibes_soft_A4_v1_rr1_Main.wav"}

  hard:
    library: Versilian Community Sample Library (VCSL, Versilian Studios), Vibraphone, the "Hard Mallets" set, the softer of its two layers (v2), the "Main" microphone, motor off. The files are named an octave below what they sound (the file "A2" measures 219.9 Hz, A3, by the strongest spectral peak over 0.5 to 2.5 s, within 1 cent; "B3" measures 493.9 Hz, B4, within 1 cent; "D4" measures 587.3 Hz, D5, within 1 cent; "F4" measures 698.5 Hz, F5, within 1 cent; "A4" measures 880.0 Hz, A5, within 1 cent); `note` is the sounding pitch. A3, B4, D5, F5 and A5 are recordings of those notes, unshifted; the one E5, which closes the procedure bed, is the recorded F5 one semitone down. Nothing else is shifted. The A3 strike falls 19 dB in its first half second and then rings, 30 dB down at 2.5 s and 50 dB at 6 s; B4 is 30 dB down at 6.5 s, D5 at 6 s, F5 at 4 s and A5 at 5 s, and all are 50 dB down inside 9 s. The modulation of each ring between 2.5 and 9 Hz measures 0.3 dB peak to peak or less, so the motor was off. A note given no length rings out; a note given a length is cut there and released over 0.15 s
    role_as_presented: a vibraphone, hard mallets, motor off
