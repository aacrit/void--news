# House promos. Two sentences each: a pitch, then the address.
#
# Read data/promos/README.md before editing. Every promo is validated by
# tests/test_house_promos.py: exactly two sentences, no digits, only number
# words tied to a constant in the code, nothing borrowed from radio, nothing
# from the kill list, the address in the second sentence, five to nine
# seconds at the house voice, never playing inside the section it advertises.
#
# `seconds` is an estimate at the house rate; `python3
# pipeline/briefing/house_promos.py fill-seconds` rewrites it. The rendered
# WAVs in rendered/ carry the sha of the text they were made from; changing a
# text here retires its render until the next render job.
#
# promotes: onair | weekly | history | site
# plays_in: any of onair, weekly, history (never the section promoted)

promos:

  # ---- On Air --------------------------------------------------------------

  - id: onair-01-ranked
    promotes: onair
    plays_in: [weekly, history]
    text: "Four stories, ranked by who is covering them, not by what you clicked. On Air, daily, at news.voidvision.org."
    seconds: 8.7
    angle: ranking
    claims: [onair_four_stories, onair_ranking, onair_daily]
    names_url: true

  - id: onair-02-firewall
    promotes: onair
    plays_in: [weekly, history]
    text: "One opinion a day, read by a voice that reads nothing else. On Air, daily, at news.voidvision.org."
    seconds: 8.3
    angle: opinion firewall
    claims: [onair_opinion_firewall, onair_daily]
    names_url: true

  - id: onair-03-room-tone
    promotes: onair
    plays_in: [weekly, history]
    text: "Nothing plays under the news but room tone. On Air, the daily programme from Void News, at news.voidvision.org."
    seconds: 8.7
    angle: no music under the news
    claims: [onair_room_tone, onair_daily]
    names_url: true

  - id: onair-04-front-page
    promotes: onair
    plays_in: [weekly, history]
    text: "A day's front page, read aloud in under fifteen minutes. On Air, from Void News, at news.voidvision.org."
    seconds: 8.3
    angle: length
    claims: [onair_under_fifteen, onair_daily]
    names_url: true

  - id: onair-05-cold-open
    promotes: onair
    plays_in: [weekly, history]
    text: "It opens on the first story, not a greeting, and never thanks anyone. On Air, at news.voidvision.org."
    seconds: 8.3
    angle: cold open
    claims: [onair_cold_open, onair_no_thanks]
    names_url: true

  - id: onair-06-twenty-four
    promotes: onair
    plays_in: [weekly, history]
    text: "Twenty stories on the page, four on the air, the same order for everyone. On Air, at news.voidvision.org."
    seconds: 8.7
    angle: same order
    claims: [feed_size, onair_four_stories, same_order]
    names_url: true

