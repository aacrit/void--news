# House promos. Two sentences each: a pitch, then the address.
#
# Read data/promos/README.md before editing. Every promo is validated by
# tests/test_house_promos.py: exactly two sentences, no digits, only number
# words tied to a constant in the code, nothing borrowed from radio, nothing
# from the kill list, the address in the second sentence, five to ten
# seconds at the house voice, never playing inside the section it advertises.
#
# `seconds` is an estimate at the house rate; `python3
# pipeline/briefing/house_promos.py fill-seconds` rewrites it. The rendered
# WAVs in rendered/ carry the sha of the text they were made from; changing a
# text here retires its render until the next render job.
#
# promotes: onair | weekly | history | site
# plays_in: any of onair, weekly, history (never the section promoted)

promos:

  # ---- On Air --------------------------------------------------------------

  - id: onair-01-ranked
    promotes: onair
    plays_in: [weekly, history]
    text: "Four stories, ranked by who is covering them, not by clicks. Visit news.voidvision.org to check out On Air."
    seconds: 9.5
    angle: ranking
    claims: [onair_four_stories, onair_ranking, onair_daily]
    names_url: true

  - id: onair-02-firewall
    promotes: onair
    plays_in: [weekly, history]
    text: "One opinion a day, read by a voice that reads nothing else. Visit news.voidvision.org to check out On Air."
