<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="Void News">
  <!-- Void News Apple touch icon 180 — walnut tile + brass Sigil-O. Must be
       opaque (no transparency). iOS applies its own corner mask, so full-bleed
       square. Explicit colors only. -->
  <rect width="180" height="180" fill="#1C1A17"/>
  <g transform="translate(28,28) scale(1.24)" fill="none" stroke="#D4A574" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="50" cy="50" r="41" stroke-width="8"/>
    <line x1="8" y1="50" x2="92" y2="50" stroke-width="6"/>
    <line x1="9" y1="43" x2="8" y2="57" stroke-width="5"/>
    <line x1="91" y1="43" x2="92" y2="57" stroke-width="5"/>
  </g>
</svg>
