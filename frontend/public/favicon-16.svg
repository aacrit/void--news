<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="Void News">
  <!-- Void News 16px favicon — walnut rounded tile + brass Sigil-O.
       Heavier strokes than the larger tiles so the ring + beam hold on the
       pixel grid. Explicit colors only. -->
  <rect width="16" height="16" rx="3" fill="#1C1A17"/>
  <g transform="translate(1.04,1.04) scale(0.1391)" fill="none" stroke="#D4A574" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="50" cy="50" r="40" stroke-width="10"/>
    <line x1="10" y1="50" x2="90" y2="50" stroke-width="8"/>
    <line x1="11" y1="44" x2="10" y2="56" stroke-width="6"/>
    <line x1="89" y1="44" x2="90" y2="56" stroke-width="6"/>
  </g>
</svg>
