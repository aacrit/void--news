<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Void News">
  <!-- Void News app icon 512 — walnut tile + brass footed Sigil (ring + level
       beam + ticks + scale post + base). Explicit colors only (no currentColor,
       no <style>/@media) so manifest decoders accept it. Full-bleed for
       maskable use; mark within the central ~60% safe zone. -->
