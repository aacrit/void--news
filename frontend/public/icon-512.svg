<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Void News">
  <!-- Void News app icon 512 — walnut tile + brass Sigil-O. Explicit colors
       only (no currentColor, no <style>/@media) so manifest decoders accept it.
       Full-bleed for maskable use; mark within the central 80% safe zone. -->
  <rect width="512" height="512" fill="#1C1A17"/>
  <g transform="translate(85.33,85.33) scale(3.4133)" fill="none" stroke="#D4A574" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="50" cy="50" r="41" stroke-width="8"/>
    <line x1="8" y1="50" x2="92" y2="50" stroke-width="6"/>
    <line x1="9" y1="43" x2="8" y2="57" stroke-width="5"/>
    <line x1="91" y1="43" x2="92" y2="57" stroke-width="5"/>
  </g>
</svg>
