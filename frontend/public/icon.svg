<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Void News">
  <!-- Void News app icon (generic, referenced by layout.tsx icon.svg) —
       CREAM PAPER rounded tile + brass footed Sigil (ring + level beam + ticks +
       scale post + base). Opaque tile so iOS/Android maskable have a solid safe
       zone. Explicit colors only (no currentColor / no <style> / no @media) so
       manifest + favicon decoders accept it. -->
  <rect width="32" height="32" rx="6" fill="#F0EBDD"/>
  <g transform="translate(3.56,3.56) scale(0.2489)" fill="none" stroke="#946B15" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="50" cy="40" r="30" stroke-width="8"/>
    <line x1="12" y1="40" x2="88" y2="40" stroke-width="6"/>
    <line x1="13" y1="33" x2="12" y2="47" stroke-width="5"/>
    <line x1="87" y1="33" x2="88" y2="47" stroke-width="5"/>
    <line x1="50" y1="70" x2="50" y2="86" stroke-width="6"/>
    <path d="M36 93 C44 88 56 88 64 93" stroke-width="6"/>
  </g>
</svg>
