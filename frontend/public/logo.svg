<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Void News">
  <!-- Void News brand mark (footed Sigil alone) — TRANSPARENT background, brass
       ring + level beam + ticks + scale post + base. Theme-aware: light-brass
       #946B15 on light grounds, dark-brass #D4A574 on dark grounds, so the mark
       reads on either. -->
  <style>
    .sig { stroke: #946B15; }
    @media (prefers-color-scheme: dark) { .sig { stroke: #D4A574; } }
  </style>
  <g class="sig" transform="translate(14.44,14.44) scale(0.7111)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="50" cy="40" r="30" stroke-width="8"/>
    <line x1="12" y1="40" x2="88" y2="40" stroke-width="6"/>
    <line x1="13" y1="33" x2="12" y2="47" stroke-width="5"/>
    <line x1="87" y1="33" x2="88" y2="47" stroke-width="5"/>
    <line x1="50" y1="70" x2="50" y2="86" stroke-width="6"/>
    <path d="M36 93 C44 88 56 88 64 93" stroke-width="6"/>
  </g>
</svg>
