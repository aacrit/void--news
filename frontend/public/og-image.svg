<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!--
    VOID NEWS OpenGraph Image (1200x630)
    Dark walnut background. Brass footed Sigil (balance-scale lens) hero +
    "VOID NEWS" lockup (Sigil-O in place of the O), bias spectrum below.
  -->

  <!-- Background — dark walnut with subtle warm tint -->
  <rect width="1200" height="630" fill="#1C1A17"/>

  <!-- Subtle paper texture grain overlay -->
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" stitchTiles="stitch"/>
  </filter>
  <rect width="1200" height="630" filter="url(#grain)" opacity="0.06"/>

  <!-- Top rule — newspaper masthead tradition -->
  <line x1="120" y1="80" x2="1080" y2="80" stroke="#4A4540" stroke-width="1"/>
  <line x1="120" y1="84" x2="1080" y2="84" stroke="#4A4540" stroke-width="3"/>

  <!-- Hero: footed Sigil (standalone square geometry — ring cy40 r30 + beam + ticks + foot) -->
  <g transform="translate(525,110) scale(1.5)" stroke="#D4A574" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="50" cy="40" r="30"/>
    <line x1="12" y1="40" x2="88" y2="40"/>
    <line x1="13" y1="33" x2="12" y2="47" stroke-width="5"/>
    <line x1="87" y1="33" x2="88" y2="47" stroke-width="5"/>
    <line x1="50" y1="70" x2="50" y2="86"/>
    <path d="M36 93 C44 88 56 88 64 93"/>
  </g>

  <!-- Wordmark: "V[Sigil-O]ID  NEWS" — caps in serif (cream), Sigil-O in brass -->
  <!-- baseline Y = 330; serif caps -->
  <text x="387" y="330" fill="#EDE8E0"
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-size="72" font-weight="700" letter-spacing="0.02em">V</text>
  <!-- Sigil-O (wordmark geometry: full-box ring cy50 r41 + descender foot) -->
  <g transform="translate(437,275.7) scale(0.583)" fill="none" stroke="#D4A574" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="50" cy="50" r="41" stroke-width="8"/>
    <line x1="8" y1="50" x2="92" y2="50" stroke-width="6"/>
    <line x1="9" y1="43" x2="8" y2="57" stroke-width="5"/>
    <line x1="91" y1="43" x2="92" y2="57" stroke-width="5"/>
    <line x1="50" y1="91" x2="50" y2="112" stroke-width="6"/>
    <path d="M35 118 C43 113 57 113 65 118" stroke-width="6"/>
  </g>
  <text x="491" y="330" fill="#EDE8E0"
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-size="72" font-weight="700" letter-spacing="0.02em">ID</text>
  <text x="600" y="330" fill="#EDE8E0"
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-size="72" font-weight="700" letter-spacing="0.02em">NEWS</text>

  <!-- Bias spectrum bar — the signature visualization -->
  <g transform="translate(300, 390)">
    <!-- 5-dot bias spectrum -->
    <circle cx="60" cy="20" r="10" fill="#3B82F6"/>
    <circle cx="180" cy="20" r="10" fill="#60A5FA"/>
    <circle cx="300" cy="20" r="10" fill="#9CA3AF"/>
    <circle cx="420" cy="20" r="10" fill="#F97316"/>
    <circle cx="540" cy="20" r="10" fill="#EF4444"/>

    <!-- Connecting line -->
    <line x1="70" y1="20" x2="170" y2="20" stroke="#3A3530" stroke-width="2"/>
    <line x1="190" y1="20" x2="290" y2="20" stroke="#3A3530" stroke-width="2"/>
    <line x1="310" y1="20" x2="410" y2="20" stroke="#3A3530" stroke-width="2"/>
    <line x1="430" y1="20" x2="530" y2="20" stroke="#3A3530" stroke-width="2"/>

    <!-- Labels -->
    <text x="60" y="52" text-anchor="middle" fill="#5A5550"
          font-family="'IBM Plex Mono', Menlo, monospace" font-size="11">LEFT</text>
    <text x="300" y="52" text-anchor="middle" fill="#5A5550"
          font-family="'IBM Plex Mono', Menlo, monospace" font-size="11">CENTER</text>
    <text x="540" y="52" text-anchor="middle" fill="#5A5550"
          font-family="'IBM Plex Mono', Menlo, monospace" font-size="11">RIGHT</text>
  </g>

  <!-- Tagline -->
  <text x="600" y="510" text-anchor="middle" fill="#B8B0A5"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="22" font-weight="400" letter-spacing="0.04em">
    See through the void.
  </text>

  <!-- Bottom rule -->
  <line x1="120" y1="550" x2="1080" y2="550" stroke="#4A4540" stroke-width="1"/>

  <!-- Footer stats -->
  <text x="600" y="580" text-anchor="middle" fill="#5A5550"
        font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" letter-spacing="0.06em">
    1,016 SOURCES  ·  6-AXIS BIAS ANALYSIS  ·  FREE &amp; OPEN
  </text>
</svg>
