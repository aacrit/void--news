expectation:
  type: should_split
  member_ids: [in-sc-1, us-sc-1]
  min_clusters: 2
rationale: |
  Live over-merge (2026-08-05 top-50, card #48): an "Supreme Court Stays Arrest
  of Banerjee Aide" cluster (n=14) had bridged the INDIAN Supreme Court story to
  US SCOTUS coverage purely on the shared generic phrase "Supreme Court", and the
  shipped summary described the Indian case while most members were US.

  The two stories share ONLY the stems {supreme, court, rule}. Every one of those
  is a generic institutional word that appears across many unrelated court
  stories on any real news day (the six distractor clusters here reproduce that
  high document-frequency). None is a specific, distinguishing entity.

  This fixture is DATA-DRIVEN and requires no hand-listed stop-word:
    * PAIR-ONLY (delete the six distractors and cluster just the four SCOTUS
      articles) collapses the Indian and US stories into ONE cluster — the
      generic title bridge merges them absent any corpus context.
    * FULL CORPUS (as written) splits them: with eight "Supreme Court Rules on X"
      stories present, {supreme, court, rule} are high-df / low-IDF, so the
      Phase-3 discriminative-stem gate (PHASE3_STEM_DF_*) refuses to let them be
      the sole merge driver, and Phase 2 finds no shared specific entity. Each
      same-story pair (Indian, US) still merges on its own concrete entities
      (Banerjee/Enforcement Directorate; Louisiana/Voting Rights Act).

  The same mechanism automatically rejects "military", a bare country name, or
  any FUTURE generic bridge word ("summit", "election", "festival") without ever
  enumerating it, because a generic term is defined by its high df that day.
