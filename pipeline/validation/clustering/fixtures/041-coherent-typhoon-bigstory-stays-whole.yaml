rationale: |
  Guard for the CEO-directed over-merge fixes (2026-08-07). The new
  discriminative-anchor merge gates (Phase 2 / Phase 3) and the size-independent
  small-bag cohesion force-split (Layer 2) must NEVER fragment a genuine,
  well-covered single event.

  Eight outlets cover ONE typhoon: shared discriminative entities (Rai, Cebu,
  Bohol, Visayas, Marcos) run through every article, and the headlines overlap on
  the storm name. entity_convergence is high, so the small-bag gross-incoherence
  split is not triggered; the discriminative gates keep the story merged because
  the shared anchors are rare (the storm name is not a generic word that day).

  Expected: one merged cluster (two acceptable if a wire desk splits off a
  sub-angle). Any result of 3+ clusters means a coherence gate over-fired and is
  a regression — the mirror image of the 040 over-merge reject.
