rationale: |
  Live over-merge (2026-08-10), verified SEPARATE from the Branch-B Phase-2/3
  df-gate work. Two genuinely distinct Supreme Court matters (a Pennsylvania
  mail-in ballot emergency plea and a Louisiana redistricting-map ruling) merge
  because their headlines share the generic institutional frame "Supreme Court
  Weighs Emergency Application ...", which crosses the Phase-3 title-Jaccard
  threshold. Their BODIES name entirely different actors (Pennsylvania / ballots
  / Republicans vs Louisiana / gerrymander / Voting Rights Act).

  This bag defeats every prior split trigger:
    * topic_coherence reports 1.00 (BLIND to the defect -- do NOT use it as the
      success measure), so the coherent-override would exempt the pile.
    * entity_convergence (any-of-top-3) pins to ~1.0 because each sub-event
      contributes a top-3 entity, so every article matches at least one.
    * dominant_publisher_share is low (0.17, six outlets), so the single-source
      feed-dump trigger never fires.

  O6 RULE B keys on the two honest signals: a HIGH title-Jaccard (0.64 here;
  measured, no genuine good-merge reference reaches the 0.45 floor) with a LOW
  entity_dominant_share (0.50 -- the single most-common entity spans only its
  own half; every genuine good-merge reference is >= 0.60). _force_split_cluster
  then re-clusters the distinct bodies at the stricter gate and recovers the two
  real stories (Pennsylvania ballots vs Louisiana map). Its collapse-to-1 guard
  is the backstop that keeps a real single event whole.

  Success measure: hand-labeled split (ballot article and map article land in
  different clusters), NOT topic_coherence.
